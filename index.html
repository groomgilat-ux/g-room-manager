                                <Input label="6-8 שחקנים" type="number" value={settings.pricing?.basePrice6to8} onChange={e => handlePricing('basePrice6to8', e.target.value)} />
                                <Input label="9-10 שחקנים" type="number" value={settings.pricing?.basePrice9to10} onChange={e => handlePricing('basePrice9to10', e.target.value)} />
                            </div>
                            <h4 className="font-bold text-sm text-indigo-400 mt-4">אחוזי הנחה</h4>
                            <div className="grid grid-cols-2 gap-2">
                                <Input label="ילדים (%)" type="number" value={settings.pricing?.discountKids} onChange={e => handlePricing('discountKids', e.target.value)} />
                                <Input label="זכאים (%)" type="number" value={settings.pricing?.discountEligible} onChange={e => handlePricing('discountEligible', e.target.value)} />
                            </div>
                        </div>
                    </Card>
                    <div className="space-y-6">
                        <Card title="כללי">
                            <div className="space-y-4">
                                <Input label="שם העסק" value={settings.businessName} onChange={e => update('businessName', e.target.value)} />
                                <Input label="קוד כניסה למנהל" value={settings.adminCode} onChange={e => update('adminCode', e.target.value)} />
                                <Input label="רשימת חדרים (מופרד בפסיק)" value={settings.roomsList} onChange={e => update('roomsList', e.target.value)} />
                            </div>
                        </Card>
                        <Card title="עיצוב">
                            <div className="space-y-4">
                                <div className="space-y-1"><label className="text-sm opacity-70">צבע רקע (ראשי)</label><input type="color" value={settings.primaryColor} onChange={e => update('primaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div>
                                <div className="space-y-1"><label className="text-sm opacity-70">צבע טקסט (משני)</label><input type="color" value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div>
                                <div className="space-y-1"><label className="text-sm opacity-70">לוגו (URL)</label><input className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white" value={settings.logo || ''} onChange={e => update('logo', e.target.value)} /></div>
                            </div>
                        </Card>
                    </div>
                    <Card title="תבנית אימייל לשכר">
                        <div className="space-y-4">
                            <Input label="נושא" value={settings.emailTemplate.subject} onChange={e => handleTemplate('subject', e.target.value)} />
                            <div className="space-y-1">
                                <label className="text-sm opacity-70">תוכן (משתנים: {`{name}, {month}, {year}`})</label>
                                <textarea className="w-full bg-gray-800 border border-gray-700 rounded p-2 h-32 text-white" value={settings.emailTemplate.body} onChange={e => handleTemplate('body', e.target.value)} />
                            </div>
                            <Input label="מייל העסק" value={settings.senderEmail} onChange={e => update('senderEmail', e.target.value)} />
                        </div>
                    </Card>
                    <Card title="שעות פעילות">
                        {days.map(d => {
                            const h = settings.openingHours[d] || {start:'00:00', end:'00:00'};
                            return (
                                <div key={d} className="flex justify-between items-center my-2 text-sm text-dynamic">
                                    <span className="w-16 font-bold">{hebrewDays[d]}</span>
                                    <div className="flex gap-2">
                                        <input type="time" value={h.start} onChange={e => update('openingHours', {...settings.openingHours, [d]: {...h, start: e.target.value}})} className="bg-gray-800 rounded p-1"/>
                                        <span>-</span>
                                        <input type="time" value={h.end} onChange={e => update('openingHours', {...settings.openingHours, [d]: {...h, end: e.target.value}})} className="bg-gray-800 rounded p-1"/>
                                    </div>
                                </div>
                            )
                        })}
                    </Card>
                </div>
            );
        };

        // --- Employee Views ---
        const EmployeeDashboard = ({ employee, shifts, constraints, settings, tasks, groups }) => {
            const [tab, setTab] = useState('report');
            const myPendingTasks = tasks ? tasks.filter(t => t.assigneeId === employee.id && t.status === 'pending') : [];

            return (
                <div className="space-y-6">
                    <div className="flex card-bg p-1 rounded-lg w-fit overflow-x-auto max-w-full">
                        {[{id:'report', l:'דיווח קבוצה'}, {id:'history', l:'היסטוריית דיווחים'}, {id:'constraints', l:'אילוצים'}, {id:'tasks', l:'משימות', c:myPendingTasks.length}, {id:'profile', l:'פרופיל'}].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded text-dynamic ${tab===t.id?'bg-indigo-600 text-white':''}`}>
                                {t.l}
                                {t.c > 0 && <span className="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">{t.c}</span>}
                            </button>
                        ))}
                    </div>
                    {tab==='report' && <GroupReportForm employeeId={employee.id} settings={settings} onSave={() => setTab('history')}/>}
                    {tab==='history' && <EmployeeHistory employee={employee} groups={groups} shifts={shifts}/>}
                    {tab==='constraints' && <EmployeeConstraints employee={employee} constraints={constraints}/>}
                    {tab==='tasks' && <EmployeeTasks employee={employee} tasks={tasks}/>}
                    {tab==='profile' && <EmployeeProfile employee={employee} shifts={shifts}/>}
                </div>
            );
        };
        
        const EmployeeHistory = ({ employee, groups, shifts }) => {
            const month = new Date().toISOString().slice(0, 7);
            const myGroups = groups.filter(g => g.employeeId === employee.id && g.date.startsWith(month)).sort((a,b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));
            const myShifts = shifts.filter(s => s.employeeId === employee.id && s.date.startsWith(month) && !s.isAutoGroup).sort((a,b) => b.date.localeCompare(a.date));

            return (
                <div className="space-y-6">
                    <Card title={`קבוצות שדיווחתי (${month})`}>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm whitespace-nowrap">
                                <thead className="opacity-70 border-b border-gray-700"><tr><th>תאריך ושעה</th><th>חדר</th><th>לקוח</th><th>שחקנים</th><th>לתשלום</th><th>נמחק?</th></tr></thead>
                                <tbody className="divide-y divide-gray-800 text-dynamic opacity-90">
                                    {myGroups.length === 0 && <tr><td colSpan="6" className="text-center py-4">לא דיווחת על קבוצות החודש</td></tr>}
                                    {myGroups.map(g => (
                                        <tr key={g.id}>
                                            <td className="py-2">{formatDateIL(g.date)} {g.time}</td>
                                            <td>{g.room}</td>
                                            <td>{g.customerName}</td>
                                            <td>{g.totalPlayers}</td>
                                            <td className="text-green-400">₪{g.finalPriceToPay}</td>
                                            <td><button onClick={() => confirm("למחוק דיווח?") && deleteDoc(getDocRef('groups', g.id))} className="text-red-400"><Trash2 size={14}/></button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                    {myShifts.length > 0 && (
                        <Card title="דיווחים ידניים מהמערכת הישנה">
                            <div className="overflow-x-auto text-sm opacity-70">
                                <table className="w-full text-right">
                                    <thead><tr><th>תאריך</th><th>שעה</th><th>חדר</th><th>משחקים</th></tr></thead>
                                    <tbody>{myShifts.map(s => <tr key={s.id}><td>{formatDateIL(s.date)}</td><td>{s.startTime}</td><td>{s.room}</td><td>{s.gamesCount}</td></tr>)}</tbody>
                                </table>
                            </div>
                        </Card>
                    )}
                </div>
            )
        }

        const EmployeeTasks = ({ employee, tasks }) => {
            const myTasks = tasks.filter(t => t.assigneeId === employee.id && t.status === 'pending');
            const handleComplete = async (id) => {
                await updateDoc(getDocRef('tasks', id), { status: 'completed', completedAt: new Date().toISOString() });
                alert('כל הכבוד! המשימה הושלמה');
            };
            return (
                <Card title="המשימות שלי">
                    {myTasks.length === 0 && <div className="text-center py-8 opacity-60">אין משימות פתוחות 🎉</div>}
                    <div className="space-y-4">
                        {myTasks.map(t => (
                            <div key={t.id} className="border border-gray-700 rounded-lg p-4 flex justify-between items-center bg-gray-800/30">
                                <div>
                                    <h3 className="font-bold text-lg mb-1">{t.description}</h3>
                                    <div className="text-sm opacity-70 text-red-300">לביצוע עד: {formatDateIL(t.deadline)}</div>
                                </div>
                                <Button onClick={() => handleComplete(t.id)} variant="success">ביצעתי</Button>
                            </div>
                        ))}
                    </div>
                </Card>
            );
        };

        const EmployeeConstraints = ({ employee, constraints }) => {
            const [mode, setMode] = useState('single');
            const [date, setDate] = useState('');
            const [start, setStart] = useState('');
            const [end, setEnd] = useState('');
            const [sDate, setSDate] = useState('');
            const [eDate, setEDate] = useState('');
            const [note, setNote] = useState('');
            const [editId, setEditId] = useState(null);

            const submit = async (e) => {
                e.preventDefault();
                const data = { employeeId: employee.id, type: mode, note, status: 'pending' };
                if (mode === 'single') { data.date = date; data.startTime = start; data.endTime = end; }
                else { data.startDate = sDate; data.endDate = eDate; }
                
                if (editId) {
                    await updateDoc(getDocRef('constraints', editId), data);
                    setEditId(null);
                } else {
                    await addDoc(getCollectionRef('constraints'), data);
                }
                alert('נשמר'); setNote(''); setDate(''); setStart(''); setEnd('');
            };

            const del = async (id) => { if(confirm("למחוק אילוץ?")) await deleteDoc(getDocRef('constraints', id)); };
            const edit = (c) => {
                setEditId(c.id); setMode(c.type); setNote(c.note || '');
                if(c.type==='single'){ setDate(c.date); setStart(c.startTime); setEnd(c.endTime); }
                else { setSDate(c.startDate); setEDate(c.endDate); }
            };

            const myCons = constraints.filter(c => c.employeeId === employee.id).sort((a,b) => (a.date || a.startDate).localeCompare(b.date || b.startDate));

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title={editId ? "עריכת אילוץ" : "אילוץ חדש"}>
                        <div className="flex gap-2 mb-4"><button onClick={()=>setMode('single')} className={`flex-1 p-1 rounded ${mode==='single'?'bg-indigo-600 text-white':'text-dynamic card-bg'}`}>יום בודד</button><button onClick={()=>setMode('range')} className={`flex-1 p-1 rounded ${mode==='range'?'bg-indigo-600 text-white':'text-dynamic card-bg'}`}>חופשה</button></div>
                        <form onSubmit={submit} className="space-y-4">
                            {mode==='single' ? (
                                <>
                                    <Input label="תאריך" type="date" value={date} onChange={e=>setDate(e.target.value)} required/>
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <Input label="שעת התחלה" type="time" step="900" value={start} onChange={e=>setStart(e.target.value)} required/>
                                        </div>
                                        <div className="flex-1">
                                            <Input label="שעת סיום" type="time" step="900" value={end} onChange={e=>setEnd(e.target.value)} required/>
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <><Input label="מ" type="date" value={sDate} onChange={e=>setSDate(e.target.value)} required/><Input label="עד" type="date" value={eDate} onChange={e=>setEDate(e.target.value)} required/></>
                            )}
                            <Input label="מהות האילוץ" value={note} onChange={e=>setNote(e.target.value)} />
                            <div className="flex gap-2">
                                {editId && <Button type="button" variant="secondary" onClick={()=>{setEditId(null); setNote('');}} className="flex-1">ביטול</Button>}
                                <Button type="submit" className="flex-1">{editId ? 'עדכן' : 'שלח'}</Button>
                            </div>
                        </form>
                    </Card>
                    <Card title="האילוצים שלי">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="opacity-70 border-b border-gray-700"><tr><th>התחלה</th><th>סיום</th><th>שעות</th><th>מהות</th><th>סטטוס</th><th>פעולות</th></tr></thead>
                                <tbody className="divide-y divide-gray-800 text-dynamic opacity-90">
                                    {myCons.map(c => (
                                        <tr key={c.id}>
                                            <td className="py-2">{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td>
                                            <td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td>
                                            <td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td>
                                            <td>{c.note}</td>
                                            <td><StatusBadge status={c.status || 'pending'} /></td>
                                            <td className="flex gap-2 py-2">
                                                {c.status !== 'approved' && <button onClick={()=>edit(c)} className="text-indigo-400"><Edit2 size={14}/></button>}
                                                <button onClick={()=>del(c.id)} className="text-red-400"><Trash2 size={14}/></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const EmployeeProfile = ({ employee, shifts }) => {
            const [open, setOpen] = useState(false);
            const [sending, setSending] = useState(false);
            const month = new Date().toISOString().slice(0, 7);
            const myShifts = shifts.filter(s => s.employeeId === employee.id && s.date.startsWith(month));
            
            // Calculate wage based on frozen wage at time of shift, or fallback to current if missing
            const wage = myShifts.reduce((acc, curr) => acc + (curr.gamesCount * (curr.wageAtTime || employee.wagePerGame)), 0);

            const request = async (e) => {
                e.preventDefault();
                setSending(true);
                const fd = new FormData(e.target);
                try {
                    await timeoutPromise(addDoc(getCollectionRef('requests'), {
                        employeeId: employee.id, status: 'pending', date: new Date().toISOString(),
                        newData: { phone: fd.get('phone'), email: fd.get('email'), address: fd.get('address'), birthday: fd.get('birthday') }
                    }), 3000);
                    alert('נשלח בהצלחה'); 
                    setOpen(false);
                } catch(e) {
                    if (e.message === 'Timeout') { alert('נשלח (איטי)'); setOpen(false); }
                    else alert(e.message);
                } finally { setSending(false); }
            };

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card>
                        <div className="text-center">
                            <h2 className="text-2xl font-bold text-dynamic">{employee.name}</h2>
                            <p className="text-indigo-400">{employee.skills?.join(' • ')}</p>
                        </div>
                        <div className="mt-4 space-y-2 text-sm text-dynamic opacity-80">
                            <div>טלפון: {employee.phone}</div>
                            <div>מייל: {employee.email}</div>
                            <div>יום הולדת: {formatDateIL(employee.birthday)}</div>
                        </div>
                        <Button variant="outline" className="w-full mt-4" onClick={()=>setOpen(true)}>עדכון פרטים</Button>
                    </Card>
                    <Card title={`שכר משוער (${month})`}>
                        <div className="text-center py-8">
                            <div className="text-4xl font-bold text-green-400">₪{wage}</div>
                            <div className="text-gray-400 text-sm">{myShifts.length} משחקים / משמרות</div>
                        </div>
                    </Card>
                    {open && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700">
                                <h3 className="text-xl font-bold mb-4">עדכון פרטים</h3>
                                <form onSubmit={request} className="space-y-4">
                                    <Input label="טלפון" name="phone" defaultValue={employee.phone} required />
                                    <Input label="מייל" name="email" defaultValue={employee.email} required />
                                    <Input label="כתובת" name="address" defaultValue={employee.address} required />
                                    <Input label="יום הולדת" name="birthday" type="date" defaultValue={employee.birthday} required />
                                    <div className="flex gap-2"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" className="flex-1" disabled={sending}>{sending ? 'שולח...' : 'שלח בקשה'}</Button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<GRoomApp />);
    </script>
</body>
</html>
