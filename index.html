<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Room Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for Modules -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>

    <style>
        :root {
            --app-bg: #030712;
            --app-text: #ffffff;
            --app-card-bg: rgba(255, 255, 255, 0.05);
            --app-border: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--app-bg); color: var(--app-text); font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Dynamic Classes */
        .card-bg { background-color: var(--app-card-bg); border: 1px solid var(--app-border); }
        .text-dynamic { color: var(--app-text) !important; }
        .border-dynamic { border-color: var(--app-border) !important; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Input overrides */
        input[type="date"], input[type="time"], select { color-scheme: dark; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Users, Calendar, DollarSign, Settings, LogOut, Plus, Save, Clock, 
            FileText, Mail, CheckCircle, XCircle, AlertTriangle, Lock, Menu, 
            X, User, LayoutDashboard, Send, CalendarRange, Download, UploadCloud, 
            File, ChevronLeft, ChevronRight, Activity, MapPin, Database, Loader, 
            Trash2, Bell, Check, X as XIcon, Cake, Wifi, WifiOff, Edit2, CheckSquare
        } from 'lucide-react';

        import { initializeApp } from 'firebase/app';
        import { 
            getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged 
        } from 'firebase/auth';
        import { 
            getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, 
            onSnapshot, query, orderBy 
        } from 'firebase/firestore';

        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBvayS247KEOVqZloFrNWV3svg4DSiNG08",
            authDomain: "g-room-escape-room-management.firebaseapp.com",
            projectId: "g-room-escape-room-management",
            storageBucket: "g-room-escape-room-management.firebasestorage.app",
            messagingSenderId: "361117379721",
            appId: "1:361117379721:web:3019eaeb30f4fe188caa58",
            measurementId: "G-6TSPGPBF4H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, 'groom');

        const getCollectionRef = (name) => collection(db, name);
        const getDocRef = (name, id) => doc(db, name, id);

        const INITIAL_SETTINGS_FALLBACK = {
            businessName: 'G-Room Escape',
            senderEmail: 'manager@g-room.co.il',
            adminCode: 'admin123',
            logo: null,
            primaryColor: '#030712', 
            secondaryColor: '#ffffff', 
            roomsList: 'סודו של הודיני', 
            emailTemplate: {
                subject: 'G-Room: תלוש שכר לחודש {month}/{year}',
                body: 'היי {name},\n\nמצורף תלוש השכר שלך עבור חודש {month}/{year}.\n\nבברכה,\nהנהלת G-Room'
            },
            openingHours: {
                Sunday: { start: '10:00', end: '23:00' },
                Monday: { start: '10:00', end: '23:00' },
                Tuesday: { start: '10:00', end: '23:00' },
                Wednesday: { start: '10:00', end: '23:00' },
                Thursday: { start: '10:00', end: '01:00' },
                Friday: { start: '09:00', end: '15:00' },
                Saturday: { start: '18:00', end: '01:00' },
            },
            pricing: {
                p2: 140, p3: 125, p4: 110, p5: 100, p6to8: 90, p9to10: 80
            },
            discounts: {
                kids: 15, special: 10
            }
        };

        // --- Tor4You Integration via Cloud Function ---
        const YOUR_CLOUD_FUNCTION_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net/getTor4YouAppts";

        const fetchTor4YouAppointments = async (dateString) => {
             try {
                const response = await fetch(`${YOUR_CLOUD_FUNCTION_URL}?date=${dateString}`);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                return data.customers || [];
            } catch (error) {
                console.error("Failed to fetch appointments via Firebase Function:", error);
                return []; // Fallback to manual entry gracefully
            }
        };

        // --- Utilities ---
        const formatDateIL = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' });
        };
        
        const formatDateTimeIL = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute:'2-digit' });
        };

        const addTime = (timeStr, minutesToAdd) => {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, minutes + minutesToAdd);
            return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
        };

        const exportToXLS = (salaryReport, filename) => {
            let tableRows = '';
            salaryReport.forEach(emp => {
                if (emp.empShifts.length > 0) {
                    tableRows += `<tr><td colspan="7" style="background-color:#e0e7ff;font-weight:bold;text-align:center;">${emp.name}</td></tr>
                    <tr style="background-color:#f3f4f6;font-weight:bold;"><td>תאריך</td><td>התחלה</td><td>סיום (משוער)</td><td>חדר</td><td>משחקים</td><td>תעריף משמרת</td><td>סה"כ</td></tr>`;
                    emp.empShifts.forEach(s => {
                        const endTime = addTime(s.startTime, s.gamesCount * 90); 
                        const activeWage = s.wagePerGameAtTime || emp.wagePerGame;
                        const shiftWage = s.gamesCount * activeWage;
                        tableRows += `<tr><td>${formatDateIL(s.date)}</td><td>${s.startTime}</td><td>${endTime}</td><td>${s.room}</td><td>${s.gamesCount}</td><td>₪${activeWage}</td><td>₪${shiftWage}</td></tr>`;
                    });
                    tableRows += `<tr><td colspan="6" style="font-weight:bold;">סה"כ לתשלום:</td><td style="font-weight:bold;background-color:#dcfce7;">₪${emp.totalWage}</td></tr><tr><td colspan="7"></td></tr>`;
                }
            });
            let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><table>${tableRows}</table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename || `Salary_Report.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const exportGroupsToXLS = (groups, employees, filename) => {
            let tableRows = `<tr style="background-color:#a5f3fc;font-weight:bold;border:2px solid #000;">
                <td style="border:1px solid #000;padding:8px;">#</td>
                <td style="border:1px solid #000;padding:8px;">תאריך</td>
                <td style="border:1px solid #000;padding:8px;">מפעיל/ה</td>
                <td style="border:1px solid #000;padding:8px;">שעה</td>
                <td style="border:1px solid #000;padding:8px;">שם החדר</td>
                <td style="border:1px solid #000;padding:8px;">שם הלקוח</td>
                <td style="border:1px solid #000;padding:8px;">כמות השחקנים</td>
                <td style="border:1px solid #000;padding:8px;">סוג השחקנים<br/><span style="font-size:10px;font-weight:normal;">(משפחה,בני זוג,חברים,צוות עבודה)</span></td>
                <td style="border:1px solid #000;padding:8px;">כיצד הגיעו אלינו?<br/><span style="font-size:10px;font-weight:normal;">(גוגל,פייסבוק, שלט, מפה לאוזן)</span></td>
                <td style="border:1px solid #000;padding:8px;">סכום לתשלום (לפני הנחה)</td>
                <td style="border:1px solid #000;padding:8px;">אחוז הנחה</td>
                <td style="border:1px solid #000;padding:8px;">סוג ההנחה</td>
                <td style="border:1px solid #000;padding:8px;">סך תשלום<br/>(אחרי הנחה)</td>
                <td style="border:1px solid #000;padding:8px;">מזומן</td>
                <td style="border:1px solid #000;padding:8px;">אשראי</td>
                <td style="border:1px solid #000;padding:8px;">ביט</td>
                <td style="border:1px solid #000;padding:8px;">שובר מגה לאן + קוד עסקה</td>
            </tr>`;
            
            groups.forEach((g, idx) => {
                let empName = '-';
                if (g.employeeId === 'admin') empName = 'מנהל';
                else {
                    const emp = employees.find(e => e.id === g.employeeId);
                    if (emp) empName = emp.name;
                }

                const fullPrice = g.basePrice * g.totalPlayers;
                const hasDiscount = g.discountAmount > 0;
                let discountTypeStr = [];
                if(g.kidsCount > 0) discountTypeStr.push(`${g.kidsCount} ילדים`);
                if(g.specialCount > 0) discountTypeStr.push(`${g.specialCount} זכאים`);
                if(g.hasVoucher) discountTypeStr.push(`שובר`);
                if(g.isWeekend) discountTypeStr.push(`תוספת סופ"ש`);

                const discountType = discountTypeStr.join(', ') || '-';
                const discountPercent = hasDiscount && fullPrice > 0 ? Math.round((g.discountAmount / fullPrice) * 100) + '%' : '-';
                
                let voucherCell = '-';
                if (g.hasVoucher) {
                    voucherCell = `שובר (${g.voucherCode || 'ללא קוד'}) על ${g.voucherPlayers} שחקנים`;
                    if (g.payments.transfer > 0) {
                        voucherCell += ` | העברה (סופ"ש): ₪${g.payments.transfer}`;
                    }
                } else if (g.payments.transfer > 0) {
                     voucherCell = `העברה: ₪${g.payments.transfer}`;
                }

                tableRows += `<tr>
                    <td style="border:1px solid #ccc;padding:5px;">${idx + 1}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${formatDateIL(g.date)}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${empName}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${g.time}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${g.room}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${g.customerName}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${g.totalPlayers}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${g.groupType}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${g.referral}</td>
                    <td style="border:1px solid #ccc;padding:5px;">₪${fullPrice}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${discountPercent}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${discountType}</td>
                    <td style="border:1px solid #ccc;padding:5px;font-weight:bold;">₪${g.finalPrice}</td>
                    <td style="border:1px solid #ccc;padding:5px;">₪${g.payments.cash}</td>
                    <td style="border:1px solid #ccc;padding:5px;">₪${g.payments.credit}</td>
                    <td style="border:1px solid #ccc;padding:5px;">₪${g.payments.bit}</td>
                    <td style="border:1px solid #ccc;padding:5px;">${voucherCell}</td>
                </tr>`;
            });
            
            let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;text-align:center;}th,td{border:1px solid #ccc;}</style></head><body dir="rtl"><table>${tableRows}</table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename || `Groups_Report.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const replacePlaceholders = (template, data) => {
            if (!template) return '';
            let result = template;
            Object.keys(data).forEach(key => result = result.replace(new RegExp(`{${key}}`, 'g'), data[key]));
            return result;
        };

        const timeoutPromise = (promise, ms = 5000) => Promise.race([promise, new Promise((_, r) => setTimeout(() => r(new Error("Timeout")), ms))]);

        // --- UI Components ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled, type="button", ...props }) => {
            const v = {
                primary: "bg-indigo-600 hover:bg-indigo-700 text-white",
                secondary: "bg-gray-700 hover:bg-gray-600 text-gray-100",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                success: "bg-green-600 hover:bg-green-700 text-white",
                outline: "border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20"
            };
            return <button type={type} onClick={onClick} className={`px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 shadow-md transition-all disabled:opacity-50 ${v[variant]} ${className}`} disabled={disabled} {...props}>{children}</button>;
        };

        const Card = ({ title, children, className = '' }) => (
            <div className={`card-bg rounded-xl p-6 shadow-xl ${className}`}>
                {title && <h3 className="text-xl font-bold text-dynamic mb-4 border-b border-gray-700 pb-2">{title}</h3>}
                <div className="text-dynamic">{children}</div>
            </div>
        );

        const Input = ({ label, type = "text", value, onChange, className = "", ...props }) => (
            <div className={`flex flex-col gap-1 ${className}`}>
                {label && <label className="text-sm opacity-70 font-medium text-dynamic">{label}</label>}
                <input type={type} value={value} onChange={onChange} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none" {...props} />
            </div>
        );

        const StatusBadge = ({ status }) => {
            if (status === 'approved') return <span className="text-green-400 flex items-center gap-1 text-xs"><CheckCircle size={14}/> אושר</span>;
            if (status === 'rejected') return <span className="text-red-400 flex items-center gap-1 text-xs"><XCircle size={14}/> נדחה</span>;
            return <span className="text-yellow-400 flex items-center gap-1 text-xs"><Clock size={14}/> ממתין</span>;
        };

        // --- Main App Component ---
        function GRoomApp() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [data, setData] = useState({ employees: [], shifts: [], constraints: [], requests: [], tasks: [], groups: [] });
            const [settings, setSettings] = useState(INITIAL_SETTINGS_FALLBACK);
            const [loading, setLoading] = useState(true);
            const [login, setLogin] = useState({ code: '', empId: '' });
            const [dbConn, setDbConn] = useState(false);

            useEffect(() => {
                const init = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                init();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const unsub = [
                    onSnapshot(getCollectionRef('employees'), s => { setData(p => ({...p, employees: s.docs.map(d => ({id: d.id, ...d.data()}))})); setDbConn(true); }, e => setDbConn(false)),
                    onSnapshot(getCollectionRef('shifts'), s => setData(p => ({...p, shifts: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('constraints'), s => setData(p => ({...p, constraints: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('requests'), s => setData(p => ({...p, requests: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('tasks'), s => setData(p => ({...p, tasks: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('groups'), s => setData(p => ({...p, groups: s.docs.map(d => ({id: d.id, ...d.data()}))}))), 
                    onSnapshot(getCollectionRef('app_settings'), s => {
                        if (!s.empty) {
                            const d = s.docs.find(doc => doc.id === 'global') || s.docs[0];
                            if (d) setSettings(prev => ({...prev, ...d.data()}));
                        }
                        setLoading(false);
                    })
                ];
                return () => unsub.forEach(u => u());
            }, [user]);

            useEffect(() => {
                const r = document.documentElement.style;
                r.setProperty('--app-bg', settings.primaryColor || '#030712');
                r.setProperty('--app-text', settings.secondaryColor || '#ffffff');
                const isLight = settings.primaryColor === '#ffffff' || settings.primaryColor === '#f3f4f6';
                r.setProperty('--app-card-bg', isLight ? '#e5e7eb' : 'rgba(255, 255, 255, 0.05)');
                r.setProperty('--app-border', isLight ? '#d1d5db' : 'rgba(255, 255, 255, 0.1)');
            }, [settings]);

            const doLogin = () => {
                if ((login.empId === 'admin' && login.code === settings.adminCode) || (login.empId === 'admin' && data.employees.length === 0 && login.code === 'admin123')) {
                    setCurrentUser({ role: 'admin', name: 'מנהל המערכת', id: 'admin' });
                } else {
                    const emp = data.employees.find(e => e.id === login.empId);
                    if (emp && emp.code === login.code) setCurrentUser({ role: 'employee', data: emp });
                    else alert("פרטי התחברות שגויים");
                }
            };

            if (loading) return <div className="min-h-screen bg-gray-950 flex items-center justify-center text-indigo-500"><Loader className="animate-spin w-10 h-10" /></div>;

            if (!currentUser) return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full card-bg p-8 rounded-2xl text-center relative">
                        <div className={`absolute top-4 right-4 w-3 h-3 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
                        <div className="mb-8">
                            {settings.logo ? <img src={settings.logo} className="h-24 mx-auto mb-4 object-contain"/> : <div className="h-24 w-24 bg-indigo-900/50 rounded-full mx-auto flex items-center justify-center mb-4"><Lock size={40} className="icon-dynamic"/></div>}
                            <h1 className="text-3xl font-bold text-dynamic">{settings.businessName}</h1>
                        </div>
                        <div className="space-y-4">
                            <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3" value={login.empId} onChange={e => setLogin({...login, empId: e.target.value})}>
                                <option value="">-- בחר משתמש --</option>
                                <option value="admin">🔒 מנהל מערכת</option>
                                {data.employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                            </select>
                            <input type="password" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-center tracking-widest" value={login.code} onChange={e => setLogin({...login, code: e.target.value})} onKeyDown={e => e.key === 'Enter' && doLogin()} placeholder="****" />
                            <Button onClick={doLogin} className="w-full py-3 text-lg">כניסה</Button>
                            {!dbConn && <p className="text-red-400 text-xs">שגיאת חיבור לענן. בדוק הרשאות.</p>}
                        </div>
                        <div className="mt-6 text-[10px] opacity-40 text-dynamic">גרסה 4.2 (Firebase Cloud Function Support)</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen font-sans flex flex-col">
                    <header className="card-bg border-b border-dynamic sticky top-0 z-50 h-16 flex items-center justify-between px-6">
                        <div className="flex items-center gap-3">
                            {settings.logo && <img src={settings.logo} className="h-8 w-8 rounded object-cover"/>}
                            <span className="font-bold text-xl text-dynamic">{settings.businessName}</span>
                            <span className="text-xs bg-gray-800 text-white px-2 py-1 rounded-full border border-gray-700 flex items-center gap-2">
                                {currentUser.role === 'admin' ? 'מנהל' : `שלום, ${currentUser.data.name}`}
                                <div className={`w-2 h-2 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500'}`}></div>
                            </span>
                        </div>
                        <Button variant="ghost" onClick={() => {setCurrentUser(null); setLogin({code:'', empId:''});}} className="text-red-400"><LogOut size={18} /> יציאה</Button>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        {currentUser.role === 'admin' ? 
                            <AdminDashboard data={data} settings={settings} /> : 
                            <EmployeeDashboard employee={currentUser.data} data={data} settings={settings} />
                        }
                    </main>
                    <footer className="p-4 text-center text-xs opacity-30 text-dynamic">G-Room System v4.2</footer>
                </div>
            );
        }

        // --- Admin ---
        const AdminDashboard = ({ data, settings }) => {
            const [tab, setTab] = useState('employees');
            const pendingReq = data.requests.filter(r => r.status === 'pending');
            const pendingCons = data.constraints.filter(c => c.status === 'pending');
            const pendingShifts = data.shifts.filter(s => s.status === 'pending' || (s.status === undefined && s.approved === false));
            
            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap gap-2 border-b border-dynamic pb-2">
                        {[
                            {id:'employees', l:'עובדים', i:Users}, 
                            {id:'shifts', l:'שכר עובדים', i:FileText}, 
                            {id:'income', l:'הכנסות וקבוצות', i:DollarSign}, 
                            {id:'constraints', l:'זמינות', i:Calendar}, 
                            {id:'tasks', l:'משימות', i:CheckSquare}, 
                            {id:'settings', l:'הגדרות', i:Settings}
                        ].map(m => 
                            <button key={m.id} onClick={()=>setTab(m.id)} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg transition-colors ${tab===m.id ? 'bg-indigo-600/10 text-indigo-400 border-b-2 border-indigo-500' : 'opacity-70 hover:opacity-100 text-dynamic'}`}><m.i size={18} className="icon-dynamic"/> {m.l} 
                            {m.id === 'constraints' && pendingCons.length > 0 && <span className="bg-yellow-500 text-black text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingCons.length}</span>}
                            {m.id === 'shifts' && pendingShifts.length > 0 && <span className="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingShifts.length}</span>}
                            </button>
                        )}
                        {pendingReq.length > 0 && <button onClick={()=>setTab('requests')} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg ml-auto transition-colors ${tab==='requests'?'bg-indigo-600/10 border-b-2 border-indigo-500':'text-yellow-400'}`}><Bell size={18} className="animate-bounce"/><span className="font-bold">{pendingReq.length}</span></button>}
                    </div>
                    <div className="fade-in">
                        {tab==='employees' && <AdminEmployees employees={data.employees}/>}
                        {tab==='shifts' && <AdminReports employees={data.employees} shifts={data.shifts} settings={settings}/>}
                        {tab==='income' && <AdminIncome groups={data.groups} employees={data.employees} settings={settings} shifts={data.shifts}/>}
                        {tab==='constraints' && <AdminConstraints employees={data.employees} constraints={data.constraints} settings={settings}/>}
                        {tab==='tasks' && <AdminTasks employees={data.employees} tasks={data.tasks}/>}
                        {tab==='settings' && <AdminSettings settings={settings}/>}
                        {tab==='requests' && <AdminRequests requests={pendingReq} employees={data.employees}/>}
                    </div>
                </div>
            );
        };

        const AdminEmployees = ({ employees }) => {
            const [open, setOpen] = useState(false);
            const [edit, setEdit] = useState(null);
            const [saving, setSaving] = useState(false);

            const save = async (e) => {
                e.preventDefault(); setSaving(true);
                const fd = new FormData(e.target);
                const d = {
                    name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), code: fd.get('code'),
                    address: fd.get('address'), birthday: fd.get('birthday'), wagePerGame: Number(fd.get('wagePerGame')),
                    form101: fd.get('form101') === 'on', skills: fd.get('skills').split(',').map(s=>s.trim())
                };
                try {
                    const timeout = new Promise((_, r) => setTimeout(() => r(new Error("Timeout")), 5000));
                    if(edit) await Promise.race([updateDoc(getDocRef('employees', edit.id), d), timeout]);
                    else await Promise.race([addDoc(getCollectionRef('employees'), d), timeout]);
                    setOpen(false);
                } catch(e) { if(e.message === 'Timeout') { alert('נשלח'); setOpen(false); } else alert(e.message); } finally { setSaving(false); }
            };

            const del = async (id) => { if(confirm("למחוק?")) await deleteDoc(getDocRef('employees', id)); };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between"><h2 className="text-2xl font-bold text-dynamic">ניהול עובדים</h2><Button onClick={()=>{setEdit(null); setOpen(true);}}><Plus size={18}/> הוסף עובד</Button></div>
                    <div className="grid md:grid-cols-3 gap-4">
                        {employees.map(e => (
                            <Card key={e.id} className="relative group hover:border-indigo-500">
                                <div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 flex gap-2">
                                    <button onClick={()=>{setEdit(e); setOpen(true);}} className="bg-gray-900 p-1 rounded text-indigo-400">ערוך</button>
                                    <button onClick={()=>del(e.id)} className="bg-gray-900 p-1 rounded text-red-400"><Trash2 size={16}/></button>
                                </div>
                                <h3 className="font-bold text-lg">{e.name}</h3>
                                <p className="text-sm opacity-70">{e.phone}</p>
                                <div className="mt-2 text-sm opacity-60">
                                    <div>קוד: {e.code}</div>
                                    <div>תעריף: ₪{e.wagePerGame}</div>
                                    <div>יום הולדת: {formatDateIL(e.birthday) || '-'}</div>
                                    <div className="text-xs mt-1">{e.skills.join(', ')}</div>
                                </div>
                            </Card>
                        ))}
                    </div>
                    {open && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-900 p-6 rounded-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">{edit ? 'עריכה' : 'חדש'}</h3>
                                <form onSubmit={save} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <Input label="שם" name="name" required defaultValue={edit?.name}/>
                                        <Input label="טלפון" name="phone" required defaultValue={edit?.phone}/>
                                        <Input label="מייל" name="email" type="email" required defaultValue={edit?.email}/>
                                        <Input label="קוד" name="code" required defaultValue={edit?.code}/>
                                        <Input label="כתובת" name="address" className="col-span-2" defaultValue={edit?.address}/>
                                        <Input label="יום הולדת" name="birthday" type="date" defaultValue={edit?.birthday}/>
                                        <Input label="שכר למשחק" name="wagePerGame" type="number" required defaultValue={edit?.wagePerGame}/>
                                        <Input label="הסמכות (מופרד בפסיק)" name="skills" className="col-span-2" defaultValue={edit?.skills?.join(', ')}/>
                                    </div>
                                    <div className="flex gap-2"><input type="checkbox" name="form101" defaultChecked={edit?.form101}/> <label>טופס 101</label></div>
                                    <div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'שמור בענן'}</Button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminReports = ({ employees, shifts, settings }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
            
            const monthlyShifts = shifts.filter(s => s.date.startsWith(month) && s.status === 'approved').sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
            const pendingShifts = shifts.filter(s => s.status === 'pending' || (s.status === undefined && s.approved === false)).sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));

            const report = employees.map(emp => {
                const empShifts = monthlyShifts.filter(s => s.employeeId === emp.id);
                const totalWage = empShifts.reduce((acc, s) => {
                    const wageToUse = s.wagePerGameAtTime ? s.wagePerGameAtTime : emp.wagePerGame;
                    return acc + (Number(s.gamesCount) * wageToUse);
                }, 0);
                return { ...emp, totalWage, empShifts };
            });
            const totalPay = report.reduce((acc, r) => acc + r.totalWage, 0);

            const handleShiftStatus = async (id, newStatus) => {
                await updateDoc(getDocRef('shifts', id), { status: newStatus, approved: newStatus === 'approved' });
            };

            const doExport = () => {
                exportToXLS(report, `Salary_Report_${month}.xls`);
            };

            const sendMail = (emp) => {
                const subj = replacePlaceholders(settings.emailTemplate.subject, { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] });
                const body = replacePlaceholders(settings.emailTemplate.body, { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] });
                const link = settings.senderEmail.includes('gmail') 
                    ? `https://mail.google.com/mail/?view=cm&fs=1&to=${emp.email}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`
                    : `mailto:${emp.email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
                window.open(link, '_blank');
            };

            return (
                <div className="space-y-6">
                    {pendingShifts.length > 0 && (
                        <Card title="משמרות ממתינות לאישור">
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-sm">
                                    <thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>תאריך התחלה</th><th>תאריך סיום</th><th>טווח שעות</th><th>חדר</th><th>משחקים</th><th>פעולות</th></tr></thead>
                                    <tbody className="divide-y divide-gray-800">
                                        {pendingShifts.map(s => {
                                            const e = employees.find(emp => emp.id === s.employeeId);
                                            const endTime = addTime(s.startTime, s.gamesCount * 90);
                                            return (
                                                <tr key={s.id} className="hover:bg-gray-800/30">
                                                    <td className="py-2 font-bold">{e?.name}</td>
                                                    <td>{formatDateIL(s.date)}</td>
                                                    <td>{formatDateIL(s.date)}</td> 
                                                    <td>{s.startTime} - {endTime}</td>
                                                    <td>{s.room}</td>
                                                    <td>{s.gamesCount}</td>
                                                    <td className="flex gap-2 py-2">
                                                        <Button size="sm" variant="success" onClick={()=>handleShiftStatus(s.id, 'approved')}><Check size={14}/></Button>
                                                        <Button size="sm" variant="danger" onClick={()=>handleShiftStatus(s.id, 'rejected')}><XIcon size={14}/></Button>
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    )}

                    <div className="flex justify-between items-center card-bg p-4 rounded-xl">
                        <div><h2 className="text-xl font-bold text-dynamic">דוחות שכר ({month})</h2><p className="text-dynamic opacity-80">סה"כ לתשלום: <span className="text-green-400 font-bold">₪{totalPay.toLocaleString()}</span></p></div>
                        <div className="flex gap-2">
                            <input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/>
                            <Button onClick={doExport} variant="success"><Download size={16}/> אקסל</Button>
                        </div>
                    </div>
                    <div className="space-y-4">
                        {report.map(r => (
                            <div key={r.id} className="card-bg rounded-xl overflow-hidden">
                                <div className="p-4 flex justify-between items-center">
                                    <div className="flex items-center gap-3"><div className="h-10 w-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-white">{r.name[0]}</div><span className="text-lg font-bold text-dynamic">{r.name}</span></div>
                                    <div className="text-green-400 font-bold text-xl">₪{r.totalWage}</div>
                                    <Button size="sm" variant="outline" onClick={() => sendMail(r)}><Mail size={16}/></Button>
                                </div>
                                {r.empShifts.length > 0 && (
                                    <div className="bg-black/20 p-2 text-sm border-t border-gray-800">
                                        <div className="grid grid-cols-6 text-gray-500 mb-2 px-2 text-xs font-bold"><div>תאריך</div><div>שעה</div><div>חדר</div><div>משחקים</div><div>תעריף</div><div>מחק</div></div>
                                        {r.empShifts.map(s => {
                                            const activeWage = s.wagePerGameAtTime || r.wagePerGame;
                                            return (
                                            <div key={s.id} className="grid grid-cols-6 py-2 px-2 border-b border-gray-800 items-center hover:bg-white/5 text-dynamic opacity-80">
                                                <div>{formatDateIL(s.date)}</div><div>{s.startTime}</div><div>{s.room}</div><div>{s.gamesCount}</div>
                                                <div className="text-indigo-300">₪{activeWage}</div>
                                                <button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-500"><Trash2 size={14}/></button>
                                            </div>
                                        )})}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminIncome = ({ groups, employees, settings, shifts }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
            const [manualGroupModal, setManualGroupModal] = useState(false);
            const monthlyGroups = groups.filter(g => g.date.startsWith(month)).sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
            
            // Summaries
            let sumCash=0, sumCredit=0, sumBit=0, sumTransfer=0, sumTotal=0;
            let sumVouchersWorth = 0;

            monthlyGroups.forEach(g => {
                const val = Number(g.finalPrice) || 0;
                sumTotal += val;
                sumCash += Number(g.payments?.cash) || 0;
                sumCredit += Number(g.payments?.credit) || 0;
                sumBit += Number(g.payments?.bit) || 0;
                sumTransfer += Number(g.payments?.transfer) || 0;
                sumVouchersWorth += Number(g.voucherWorth) || 0;
            });

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center card-bg p-4 rounded-xl">
                        <div><h2 className="text-xl font-bold text-dynamic">דוח קבוצות והכנסות ({month})</h2></div>
                        <div className="flex gap-2">
                            <input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/>
                            <Button onClick={() => exportGroupsToXLS(monthlyGroups, employees, `Groups_Report_${month}.xls`)} variant="success"><Download size={16}/> אקסל</Button>
                            <Button onClick={() => setManualGroupModal(true)} variant="secondary"><Plus size={16}/> דיווח מנהל</Button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
                        <Card className="text-center p-4 border-b-4 border-b-green-500"><div className="text-sm opacity-70">סה"כ הכנסות ישירות</div><div className="text-xl font-bold text-green-400">₪{sumTotal}</div></Card>
                        <Card className="text-center p-4 border-b-4 border-b-indigo-500"><div className="text-sm opacity-70">צפי החזר שוברים</div><div className="text-xl font-bold text-indigo-400">₪{sumVouchersWorth}</div></Card>
                        <Card className="text-center p-4"><div className="text-sm opacity-70">מזומן</div><div className="text-xl font-bold">₪{sumCash}</div></Card>
                        <Card className="text-center p-4"><div className="text-sm opacity-70">אשראי</div><div className="text-xl font-bold">₪{sumCredit}</div></Card>
                        <Card className="text-center p-4"><div className="text-sm opacity-70">ביט</div><div className="text-xl font-bold">₪{sumBit}</div></Card>
                        <Card className="text-center p-4"><div className="text-sm opacity-70">העברה בנקאית</div><div className="text-xl font-bold">₪{sumTransfer}</div></Card>
                    </div>

                    <Card title="פירוט קבוצות">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm whitespace-nowrap">
                                <thead className="text-gray-400 border-b border-gray-700">
                                    <tr><th>תאריך</th><th>שעה</th><th>חדר</th><th>לקוח</th><th>עובד</th><th>שחקנים</th><th>סה"כ שולם</th><th>אמצעי תשלום עיקרי</th><th>מחק</th></tr>
                                </thead>
                                <tbody className="divide-y divide-gray-800 text-dynamic opacity-90">
                                    {monthlyGroups.map(g => {
                                        let empName = '-';
                                        if (g.employeeId === 'admin') empName = 'מנהל';
                                        else {
                                            const emp = employees.find(e => e.id === g.employeeId);
                                            if (emp) empName = emp.name;
                                        }

                                        let pt = [];
                                        if(g.payments.cash > 0) pt.push('מזומן');
                                        if(g.payments.credit > 0) pt.push('אשראי');
                                        if(g.payments.bit > 0) pt.push('ביט');
                                        if(g.payments.transfer > 0) pt.push('העברה');
                                        if(g.hasVoucher) pt.push('שובר');

                                        return (
                                            <tr key={g.id} className="hover:bg-white/5">
                                                <td className="py-2">{formatDateIL(g.date)}</td>
                                                <td>{g.time}</td>
                                                <td>{g.room}</td>
                                                <td className="font-bold">{g.customerName}</td>
                                                <td>{empName}</td>
                                                <td>{g.totalPlayers}</td>
                                                <td className="font-bold text-green-400">₪{g.finalPrice}</td>
                                                <td className="text-xs text-indigo-300">{pt.join(' + ')}</td>
                                                <td><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('groups', g.id))} className="text-red-500"><Trash2 size={14}/></button></td>
                                            </tr>
                                        )
                                    })}
                                    {monthlyGroups.length === 0 && <tr><td colSpan="9" className="text-center py-4 opacity-50">אין נתונים לחודש זה</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                    
                    {manualGroupModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-900 p-6 rounded-xl w-full max-w-4xl border border-gray-700 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">דיווח קבוצה (מנהל)</h3>
                                    <button onClick={()=>setManualGroupModal(false)}><XIcon size={24}/></button>
                                </div>
                                <EmployeeGroups employee={{id:'admin', name:'מנהל', skills:[], wagePerGame:0}} settings={settings} onComplete={()=>setManualGroupModal(false)} isAdmin={true} employeesList={employees}/>
                            </div>
                        </div>
                    )}
                </div>
            )
        };

        const AdminConstraints = ({ employees, constraints, settings }) => {
            const [offset, setOffset] = useState(0);
            const days = useMemo(() => Array.from({length:7}, (_,i) => {
                const d = new Date(); d.setDate(d.getDate() + (offset*7) + i); return d;
            }), [offset]);
            const hours = Array.from({length:17}, (_,i) => i+8);

            const getStatus = (d, h) => {
                const dStr = d.toISOString().slice(0,10);
                const dayName = d.toLocaleDateString('en-US', {weekday:'long'});
                const biz = settings.openingHours[dayName];
                if (!biz) return -1;
                const open = parseInt(biz.start.split(':')[0]);
                const close = parseInt(biz.end.split(':')[0]);
                const effClose = close < open ? close+24 : close;
                const check = h < open && h+24 < effClose ? h+24 : h;
                if (check < open || check >= effClose) return -1;

                let count = 0;
                employees.forEach(emp => {
                    const busy = constraints.some(c => {
                        if (c.employeeId !== emp.id || c.status === 'rejected') return false; 
                        if (c.type === 'range') return dStr >= c.startDate && dStr <= c.endDate;
                        const cs = parseInt(c.startTime.split(':')[0]);
                        const ce = parseInt(c.endTime.split(':')[0]);
                        return c.date === dStr && h >= cs && h < ce;
                    });
                    if (!busy) count++;
                });
                return count;
            };
            
            const handleStatus = async (id, status) => {
                await updateDoc(getDocRef('constraints', id), { status });
            };

            const dayTitle = (d) => d.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'numeric'});

            const sortedConstraints = useMemo(() => {
                return [...constraints].sort((a, b) => {
                    const empA = employees.find(e => e.id === a.employeeId)?.name || '';
                    const empB = employees.find(e => e.id === b.employeeId)?.name || '';
                    if (empA !== empB) return empA.localeCompare(empB);
                    const dateA = a.type === 'range' ? a.startDate : a.date;
                    const dateB = b.type === 'range' ? b.startDate : b.date;
                    return dateA.localeCompare(dateB);
                });
            }, [constraints, employees]);

            return (
                <div className="space-y-6">
                    <Card title="רשימת אילוצים">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>תאריך התחלה</th><th>תאריך סיום</th><th>טווח שעות</th><th>סיבה</th><th>סטטוס</th><th>פעולות</th></tr></thead>
                                <tbody className="text-dynamic opacity-90">
                                    {sortedConstraints.map(c => {
                                        const emp = employees.find(e => e.id === c.employeeId);
                                        return <tr key={c.id} className="border-b border-gray-800 hover:bg-white/5">
                                            <td className="py-2 font-bold">{emp?.name}</td>
                                            <td>{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td>
                                            <td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td>
                                            <td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td>
                                            <td>{c.note}</td>
                                            <td><StatusBadge status={c.status || 'pending'}/></td>
                                            <td className="flex gap-2 py-1">
                                                {c.status === 'pending' && (
                                                    <>
                                                     <Button size="sm" variant="success" onClick={()=>handleStatus(c.id, 'approved')}><Check size={14}/></Button>
                                                     <Button size="sm" variant="danger" onClick={()=>handleStatus(c.id, 'rejected')}><XIcon size={14}/></Button>
                                                    </>
                                                )}
                                                <button onClick={()=>deleteDoc(getDocRef('constraints', c.id))} className="text-red-500 mr-2"><Trash2 size={14}/></button>
                                            </td>
                                        </tr>
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    <Card title="מפת זמינות">
                        <div className="flex justify-between mb-4">
                            <Button onClick={()=>setOffset(p=>p-1)}><ChevronRight size={16}/></Button>
                            <span>{formatDateIL(days[0].toISOString())} - {formatDateIL(days[6].toISOString())}</span>
                            <Button onClick={()=>setOffset(p=>p+1)}><ChevronLeft size={16}/></Button>
                        </div>
                        <div className="overflow-x-auto">
                            <div className="min-w-[800px]">
                                <div className="grid grid-cols-8 gap-1 mb-1 text-center font-bold text-dynamic">
                                    <div className="bg-gray-800 p-2 rounded">שעה</div>
                                    {days.map((d,i) => <div key={i} className="bg-gray-800 p-2 text-sm rounded">{dayTitle(d)}</div>)}
                                </div>
                                {hours.map(h => (
                                    <div key={h} className="grid grid-cols-8 gap-1 mb-1 text-center text-xs">
                                        <div className="bg-gray-800 p-2 rounded text-dynamic">{h.toString().padStart(2,'0')}:00</div>
                                        {days.map((d,i) => {
                                            const stat = getStatus(d, h);
                                            let bg = 'bg-green-900/60';
                                            if (stat === -1) bg = 'bg-gray-800/20 opacity-30';
                                            else if (stat === 0) bg = 'bg-red-900/60';
                                            else if (stat === 1) bg = 'bg-yellow-900/60';
                                            return <div key={i} className={`p-2 rounded ${bg} text-white font-bold`}>{stat > -1 ? stat : ''}</div>
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const AdminTasks = ({ employees, tasks }) => {
            const [desc, setDesc] = useState('');
            const [deadline, setDeadline] = useState('');
            const [empId, setEmpId] = useState('');

            const addTask = async (e) => {
                e.preventDefault();
                await addDoc(getCollectionRef('tasks'), { description: desc, deadline, assigneeId: empId, status: 'pending', createdAt: new Date().toISOString() });
                alert('משימה נוספה'); setDesc(''); setDeadline(''); setEmpId('');
            };

            const delTask = async (id) => { if(confirm("למחוק?")) await deleteDoc(getDocRef('tasks', id)); };

            const pending = tasks.filter(t => t.status === 'pending');
            const completed = tasks.filter(t => t.status === 'completed')
                                   .sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt))
                                   .slice(0, 3); // Shows only last 3

            return (
                <div className="space-y-6">
                    <Card title="הוספת משימה חדשה">
                        <form onSubmit={addTask} className="space-y-4">
                            <Input label="תיאור המשימה" value={desc} onChange={e=>setDesc(e.target.value)} required />
                            <div className="grid grid-cols-2 gap-4">
                                <Input label="דדליין" type="date" value={deadline} onChange={e=>setDeadline(e.target.value)} required />
                                <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2" required value={empId} onChange={e=>setEmpId(e.target.value)}>
                                    <option value="">בחר עובד אחראי</option>
                                    {employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                                </select>
                            </div>
                            <Button type="submit">הוסף משימה</Button>
                        </form>
                    </Card>
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card title="ממתין לביצוע">
                            {pending.length === 0 && <p className="text-gray-500">אין משימות פתוחות</p>}
                            {pending.map(t => {
                                const emp = employees.find(e => e.id === t.assigneeId);
                                return (
                                    <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold">{t.description}</div>
                                            <div className="text-sm opacity-70">אחראי: {emp?.name} | יעד: {formatDateIL(t.deadline)}</div>
                                        </div>
                                        <button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button>
                                    </div>
                                )
                            })}
                        </Card>
                        <Card title="היסטוריית ביצוע (3 אחרונות)">
                            {completed.length === 0 && <p className="text-gray-500">אין משימות שהושלמו</p>}
                            {completed.map(t => {
                                const emp = employees.find(e => e.id === t.assigneeId);
                                return (
                                    <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-green-400 line-through">{t.description}</div>
                                            <div className="text-sm opacity-70">בוצע ע"י: {emp?.name} ב-{formatDateIL(t.completedAt)}</div>
                                        </div>
                                        <button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button>
                                    </div>
                                )
                            })}
                        </Card>
                    </div>
                </div>
            );
        };

        const AdminRequests = ({ requests, employees }) => {
            const handle = async (req, status) => {
                try {
                    if(status === 'approved') await timeoutPromise(updateDoc(getDocRef('employees', req.employeeId), req.newData), 3000);
                    await timeoutPromise(updateDoc(getDocRef('requests', req.id), { status }), 3000);
                } catch(e) { if(e.message!=='Timeout') alert(e.message); }
            };
            return (
                <div className="space-y-4">
                    <h2 className="text-xl font-bold text-dynamic">בקשות עדכון</h2>
                    {requests.length === 0 && <p className="text-gray-500">אין בקשות חדשות</p>}
                    {requests.map(r => {
                        const emp = employees.find(e => e.id === r.employeeId);
                        return (
                            <Card key={r.id} className="border-r-4 border-yellow-500 flex justify-between items-start">
                                <div>
                                    <h3 className="font-bold text-lg mb-1">{emp?.name}</h3>
                                    <div className="text-sm opacity-70 space-y-1">
                                        <p>טלפון: {r.newData.phone}</p><p>מייל: {r.newData.email}</p><p>כתובת: {r.newData.address}</p><p>יום הולדת: {formatDateIL(r.newData.birthday)}</p>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <Button variant="success" onClick={()=>handle(r, 'approved')}><Check size={16}/></Button>
                                    <Button variant="danger" onClick={()=>handle(r, 'rejected')}><XIcon size={16}/></Button>
                                </div>
                            </Card>
                        )
                    })}
                </div>
            );
        };

        const AdminSettings = ({ settings }) => {
            const update = async (k, v) => await setDoc(getDocRef('app_settings', 'global'), { ...settings, [k]: v }, { merge: true });
            const handleTemplate = async (k, v) => await update('emailTemplate', { ...settings.emailTemplate, [k]: v });
            const handlePricing = async (k, v) => await update('pricing', { ...settings.pricing, [k]: Number(v) });
            const handleDiscount = async (k, v) => await update('discounts', { ...settings.discounts, [k]: Number(v) });
            
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const hebrewDays = { Sunday: 'ראשון', Monday: 'שני', Tuesday: 'שלישי', Wednesday: 'רביעי', Thursday: 'חמישי', Friday: 'שישי', Saturday: 'שבת' };

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="כללי">
                        <div className="space-y-4">
                            <Input label="שם העסק" value={settings.businessName} onChange={e => update('businessName', e.target.value)} />
                            <Input label="רשימת חדרים (מופרד בפסיק)" value={settings.roomsList || 'סודו של הודיני'} onChange={e => update('roomsList', e.target.value)} placeholder="סודו של הודיני, החדר האפל" />
                            <Input label="קוד כניסה למנהל" value={settings.adminCode} onChange={e => update('adminCode', e.target.value)} />
                            <Input label="כתובת מייל לשליחה" value={settings.senderEmail} onChange={e => update('senderEmail', e.target.value)} />
                        </div>
                    </Card>
                    <Card title="עיצוב">
                        <div className="space-y-4">
                            <div className="space-y-1"><label className="text-sm opacity-70">צבע רקע (ראשי)</label><input type="color" value={settings.primaryColor} onChange={e => update('primaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div>
                            <div className="space-y-1"><label className="text-sm opacity-70">צבע טקסט (משני)</label><input type="color" value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div>
                            <div className="space-y-1"><label className="text-sm opacity-70">לוגו (URL)</label><input className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white" value={settings.logo || ''} onChange={e => update('logo', e.target.value)} /></div>
                        </div>
                    </Card>
                    <Card title="מחירון לקבוצות (מחיר בסיס לאדם)">
                        <div className="grid grid-cols-2 gap-4">
                            <Input label="2 שחקנים" type="number" value={settings.pricing?.p2 || ''} onChange={e => handlePricing('p2', e.target.value)} />
                            <Input label="3 שחקנים" type="number" value={settings.pricing?.p3 || ''} onChange={e => handlePricing('p3', e.target.value)} />
                            <Input label="4 שחקנים" type="number" value={settings.pricing?.p4 || ''} onChange={e => handlePricing('p4', e.target.value)} />
                            <Input label="5 שחקנים" type="number" value={settings.pricing?.p5 || ''} onChange={e => handlePricing('p5', e.target.value)} />
                            <Input label="6-8 שחקנים" type="number" value={settings.pricing?.p6to8 || ''} onChange={e => handlePricing('p6to8', e.target.value)} />
                            <Input label="9-10 שחקנים" type="number" value={settings.pricing?.p9to10 || ''} onChange={e => handlePricing('p9to10', e.target.value)} />
                        </div>
                    </Card>
                    <Card title="הנחות (%)">
                        <div className="space-y-4">
                             <Input label="ילדים (עד גיל 12)" type="number" value={settings.discounts?.kids || ''} onChange={e => handleDiscount('kids', e.target.value)} />
                             <Input label="סטודנט/חייל/נכה" type="number" value={settings.discounts?.special || ''} onChange={e => handleDiscount('special', e.target.value)} />
                        </div>
                    </Card>
                    <div className="col-span-full grid md:grid-cols-2 gap-6">
                        <Card title="תבנית אימייל">
                            <div className="space-y-4">
                                <Input label="נושא" value={settings.emailTemplate.subject} onChange={e => handleTemplate('subject', e.target.value)} />
                                <div className="space-y-1">
                                    <label className="text-sm opacity-70">תוכן (משתנים: {`{name}, {month}, {year}`})</label>
                                    <textarea className="w-full bg-gray-800 border border-gray-700 rounded p-2 h-32 text-white" value={settings.emailTemplate.body} onChange={e => handleTemplate('body', e.target.value)} />
                                </div>
                            </div>
                        </Card>
                        <Card title="שעות פעילות">
                            {days.map(d => {
                                const h = settings.openingHours[d] || {start:'00:00', end:'00:00'};
                                return (
                                    <div key={d} className="flex justify-between items-center my-2 text-sm text-dynamic">
                                        <span className="w-16 font-bold">{hebrewDays[d]}</span>
                                        <div className="flex gap-2">
                                            <input type="time" value={h.start} onChange={e => update('openingHours', {...settings.openingHours, [d]: {...h, start: e.target.value}})} className="bg-gray-800 rounded p-1"/>
                                            <span>-</span>
                                            <input type="time" value={h.end} onChange={e => update('openingHours', {...settings.openingHours, [d]: {...h, end: e.target.value}})} className="bg-gray-800 rounded p-1"/>
                                        </div>
                                    </div>
                                )
                            })}
                        </Card>
                    </div>
                </div>
            );
        };

        // --- Employee Views ---
        const EmployeeDashboard = ({ employee, data, settings }) => {
            const [tab, setTab] = useState('group');
            const myPendingTasks = data.tasks ? data.tasks.filter(t => t.assigneeId === employee.id && t.status === 'pending') : [];

            return (
                <div className="space-y-6">
                    <div className="flex card-bg p-1 rounded-lg w-fit overflow-x-auto max-w-full">
                        {[
                            {id:'group', l:'דיווח קבוצה'},
                            {id:'report', l:'דיווח משמרת ידני'}, 
                            {id:'constraints', l:'אילוצים'}, 
                            {id:'tasks', l:'משימות', c:myPendingTasks.length}, 
                            {id:'profile', l:'פרופיל'}
                        ].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center whitespace-nowrap gap-2 px-6 py-2 rounded text-dynamic ${tab===t.id?'bg-indigo-600 text-white':''}`}>
                                {t.l}
                                {t.c > 0 && <span className="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">{t.c}</span>}
                            </button>
                        ))}
                    </div>
                    {tab==='group' && <EmployeeGroups employee={employee} settings={settings} />}
                    {tab==='report' && <EmployeeReport employee={employee} shifts={data.shifts} settings={settings}/>}
                    {tab==='constraints' && <EmployeeConstraints employee={employee} constraints={data.constraints}/>}
                    {tab==='tasks' && <EmployeeTasks employee={employee} tasks={data.tasks}/>}
                    {tab==='profile' && <EmployeeProfile employee={employee} shifts={data.shifts}/>}
                </div>
            );
        };

        const EmployeeGroups = ({ employee, settings, onComplete, isAdmin = false, employeesList = [] }) => {
            const roomsArray = settings.roomsList ? settings.roomsList.split(',').map(s=>s.trim()) : ['סודו של הודיני'];

            const [g, setG] = useState({
                employeeId: employee.id, 
                date: new Date().toISOString().slice(0, 10), time: '', room: roomsArray[0],
                customerName: '', totalPlayers: 2, kidsCount: 0, specialCount: 0,
                groupType: 'משפחה', referral: 'גוגל', hasVoucher: false, voucherPlayers: 0, voucherCode: '',
                isWeekend: false, payments: { cash: 0, credit: 0, bit: 0, transfer: 0 }
            });

            const [tor4youCustomers, setTor4youCustomers] = useState([]);
            const [isLoadingCustomers, setIsLoadingCustomers] = useState(false);
            const [isManualCustomer, setIsManualCustomer] = useState(true);

            useEffect(() => {
                const loadCustomers = async () => {
                    setIsLoadingCustomers(true);
                    setTor4youCustomers([]); 
                    
                    const customers = await fetchTor4YouAppointments(g.date);
                    
                    if (customers.length > 0) {
                        setTor4youCustomers(customers);
                        if(!g.customerName || !customers.includes(g.customerName)) {
                             setG(prev => ({...prev, customerName: customers[0]}));
                        }
                        setIsManualCustomer(false);
                    } else {
                        setIsManualCustomer(true);
                        if (tor4youCustomers.includes(g.customerName)) {
                            setG(prev => ({...prev, customerName: ''}));
                        }
                    }
                    setIsLoadingCustomers(false);
                };

                loadCustomers();
            }, [g.date]);

            const handleCustomerChange = (e) => {
                const val = e.target.value;
                if (val === 'MANUAL') {
                    setIsManualCustomer(true);
                    setG({...g, customerName: ''});
                } else {
                    setIsManualCustomer(false);
                    setG({...g, customerName: val});
                }
            };

            useEffect(() => {
                if (g.hasVoucher) {
                    setG(prev => ({...prev, kidsCount: 0, specialCount: 0}));
                }
            }, [g.hasVoucher]);

            const calc = useMemo(() => {
                const p = Number(g.totalPlayers) || 0;
                const kids = Number(g.kidsCount) || 0;
                const special = Number(g.specialCount) || 0;
                
                let base = settings.pricing?.p2 || 140;
                if(p === 3) base = settings.pricing?.p3 || 125;
                if(p === 4) base = settings.pricing?.p4 || 110;
                if(p === 5) base = settings.pricing?.p5 || 100;
                if(p >= 6 && p <= 8) base = settings.pricing?.p6to8 || 90;
                if(p >= 9) base = settings.pricing?.p9to10 || 80;

                let kidsDisc = 0; let specialDisc = 0;
                if (!g.hasVoucher || Number(g.voucherPlayers) < p) {
                    kidsDisc = kids * base * ((settings.discounts?.kids || 15) / 100);
                    specialDisc = special * base * ((settings.discounts?.special || 10) / 100);
                }

                let finalP = (p * base) - kidsDisc - specialDisc;
                let voucherWorth = 0;

                if (g.hasVoucher && g.voucherPlayers > 0) {
                    const vP = Math.min(Number(g.voucherPlayers), p);
                    voucherWorth = Math.ceil((vP * base) * 0.78); 
                    finalP = finalP - (vP * base); 
                    if(finalP < 0) finalP = 0;
                }

                let weekendAdd = 0;
                if (g.hasVoucher && g.isWeekend) {
                    weekendAdd = Number(g.voucherPlayers) * 10;
                    finalP += weekendAdd;
                }

                const sumPaid = Number(g.payments.cash) + Number(g.payments.credit) + Number(g.payments.bit) + Number(g.payments.transfer);
                const diff = finalP - sumPaid;

                return { base, finalP: finalP > 0 ? finalP : 0, discountAmount: kidsDisc + specialDisc, voucherWorth, weekendAdd, diff, sumPaid };
            }, [g, settings]);

            const submit = async (e) => {
                e.preventDefault();
                if (calc.diff !== 0) return alert("שים לב: סך התשלומים לא תואם לתשלום הסופי הנדרש.");

                const activeEmployeeId = isAdmin ? g.employeeId : employee.id;
                const activeEmployee = isAdmin ? employeesList.find(x => x.id === activeEmployeeId) : employee;
                const wage = activeEmployee ? activeEmployee.wagePerGame : 0;

                const payload = { 
                    ...g, 
                    employeeId: activeEmployeeId, 
                    finalPrice: calc.finalP, 
                    basePrice: calc.base, 
                    discountAmount: calc.discountAmount,
                    voucherWorth: calc.voucherWorth
                };

                await addDoc(getCollectionRef('groups'), payload);
                
                await addDoc(getCollectionRef('shifts'), { 
                    employeeId: activeEmployeeId, 
                    date: g.date, 
                    startTime: g.time, 
                    gamesCount: 1, 
                    room: g.room, 
                    status: 'pending',
                    wagePerGameAtTime: wage 
                });

                alert('הקבוצה דווחה בהצלחה (ונרשמה משמרת לשכר)!');
                if(onComplete) onComplete();
                else setG({ ...g, customerName: '', hasVoucher: false, voucherPlayers: 0, voucherCode: '', payments: {cash:0, credit:0, bit:0, transfer:0}});
            };

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="דיווח קבוצה והכנסות">
                        <form onSubmit={submit} className="space-y-4">
                            {isAdmin && (
                                <div><label className="block text-sm opacity-70 mb-1">עובד מדווח</label>
                                <select className="w-full bg-gray-800 p-2 rounded text-white" value={g.employeeId} onChange={e=>setG({...g, employeeId:e.target.value})}>
                                    <option value="admin">מנהל</option>
                                    {employeesList.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                                </select></div>
                            )}

                            <div className="grid grid-cols-2 gap-4">
                                <Input label="תאריך" type="date" value={g.date} onChange={e=>setG({...g, date:e.target.value})} required />
                                <Input label="שעה" type="time" step="900" value={g.time} onChange={e=>setG({...g, time:e.target.value})} required />
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm opacity-70 mb-1">חדר</label>
                                <select className="w-full bg-gray-800 p-2 rounded text-white" value={g.room} onChange={e=>setG({...g, room:e.target.value})}>
                                    {roomsArray.map(s=><option key={s} value={s}>{s}</option>)}
                                </select></div>
                                
                                <div>
                                    <label className="block text-sm opacity-70 mb-1 flex justify-between items-center">
                                        <span>שם הלקוח</span>
                                        {isLoadingCustomers && <Loader size={12} className="animate-spin text-indigo-400" />}
                                    </label>
                                    
                                    {!isManualCustomer && tor4youCustomers.length > 0 ? (
                                        <select 
                                            className="w-full bg-gray-800 border border-indigo-500/50 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            value={g.customerName}
                                            onChange={handleCustomerChange}
                                            required
                                        >
                                            {tor4youCustomers.map((name, i) => (
                                                <option key={i} value={name}>{name}</option>
                                            ))}
                                            <option value="MANUAL" className="text-indigo-400 font-bold">+ לקוח מזדמן / הקלדה ידנית</option>
                                        </select>
                                    ) : (
                                        <div className="flex gap-2">
                                            <input
