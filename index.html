            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center"><div className="flex items-center gap-4"><MonthNav month={month} setMonth={setMonth}/><Button onClick={exportFinancialXLS} variant="success"><Download size={16}/> ייצוא דוח ERP</Button></div><Button onClick={()=>setShowForm(true)}><Plus size={16}/> רישום הוצאה</Button></div>
                    <div className="grid md:grid-cols-4 gap-4"><Card className="border-green-500/30 text-center"><div className="text-sm opacity-70">הכנסות ברוטו</div><div className="text-2xl font-bold text-green-400">₪{Math.round(totalRevenue).toLocaleString()}</div></Card><Card className="border-red-500/30 text-center"><div className="text-sm opacity-70">שכר עובדים</div><div className="text-2xl font-bold text-red-400">₪{Math.round(totalSalaries).toLocaleString()}</div></Card><Card className="border-orange-500/30 text-center"><div className="text-sm opacity-70">הוצאות תפעול</div><div className="text-2xl font-bold text-orange-400">₪{Math.round(totalExpenses).toLocaleString()}</div></Card><div className={`card-bg rounded-xl p-6 text-center border shadow-lg ${netProfit >= 0 ? 'border-green-500 bg-green-900/10' : 'border-red-500 bg-red-900/10'}`}><div className="text-sm font-bold">רווח נקי</div><div className={`text-3xl font-bold mt-1 ${netProfit >= 0 ? 'text-green-400' : 'text-red-400'}`}>₪{Math.round(netProfit).toLocaleString()}</div></div></div>
                    <MonthlySummary month={month} groups={groups} shifts={shifts} employees={employees} expenses={expenses} settings={settings} />
                    <Card title="מאזן חודשי">
                        <div className="space-y-4">
                            <div><div className="flex justify-between text-sm mb-1 text-green-300"><span>הכנסות</span> <span>{Math.round(revPct)}%</span></div><div className="w-full bg-gray-800 rounded-full h-4"><div className="bg-green-500 h-4 rounded-full transition-all" style={{width: `${revPct}%`}}></div></div></div>
                            <div>
                                <div className="flex justify-between text-sm mb-1 text-red-300"><span>הוצאות ושכר פילוח צבעוני</span> <span>{Math.round((totalSalaries+totalExpenses)/maxVal*100 || 0)}%</span></div>
                                <div className="w-full bg-gray-800 rounded-full h-4 flex overflow-hidden">
                                    <div style={{width: `${salaryPct}%`, backgroundColor: '#ef4444'}} title={`שכר עובדים: ₪${Math.round(totalSalaries)}`}></div>
                                    {Object.entries(expByCategory).map(([cat, amount], idx) => { const pct = maxVal > 0 ? (amount / maxVal) * 100 : 0; return <div key={cat} style={{width: `${pct}%`, backgroundColor: graphColors[idx % graphColors.length]}} title={`${cat}: ₪${Math.round(amount)}`} className="border-r border-gray-900/50"></div> })}
                                </div>
                                <div className="flex flex-wrap gap-x-4 gap-y-2 mt-3 text-xs opacity-90"><div className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-red-500"></div>שכר עובדים (₪{Math.round(totalSalaries)})</div>{Object.entries(expByCategory).map(([cat, amount], idx) => (<div key={cat} className="flex items-center gap-1"><div className="w-3 h-3 rounded-full" style={{backgroundColor: graphColors[idx % graphColors.length]}}></div>{cat} (₪{Math.round(amount)})</div>))}</div>
                            </div>
                        </div>
                    </Card>
                    <Card title="פירוט הוצאות (משויכות לחודש זה)"><div className="overflow-x-auto"><table className="w-full text-right text-sm whitespace-nowrap"><thead className="opacity-70 border-b border-gray-700"><tr><th>תיאור ההוצאה</th><th>קטגוריה</th><th>חשבונית</th><th>סכום כולל</th><th>תקופת חיוב</th><th>יחסי לחודש</th><th>מחק</th></tr></thead><tbody className="divide-y divide-gray-800">{activeExpenses.length === 0 && <tr><td colSpan="7" className="text-center py-4">אין הוצאות מתועדות לחודש זה</td></tr>}
                        {activeExpenses.map((ex) => { const catIndex = Object.keys(expByCategory).indexOf(ex.category); const dotColor = graphColors[catIndex % graphColors.length]; return (<tr key={ex.id} className="hover:bg-indigo-900/30 cursor-pointer" onClick={()=>setEditingExpense(ex)}><td className="py-2 font-bold">{ex.name}</td><td className="flex items-center gap-2 mt-2"><div className="w-2 h-2 rounded-full" style={{backgroundColor: dotColor}}></div>{ex.category}</td><td className="opacity-70">{ex.invoiceNumber || '-'}</td><td>₪{ex.totalAmount}</td><td className="text-xs opacity-70">{ex.fromMonth} עד {ex.toMonth}</td><td className="font-bold text-orange-400">₪{ex.monthlyAmount.toFixed(1)}</td><td><button onClick={(e) => { e.stopPropagation(); confirm("למחוק הוצאה?") && deleteDoc(getDocRef('expenses', ex.id)); }} className="text-red-400 p-1"><Trash2 size={14}/></button></td></tr>)})}
                    </tbody></table></div></Card>
                    {showForm && (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700 max-h-[90vh] overflow-y-auto"><h3 className="text-xl font-bold mb-4">רישום הוצאה</h3><form onSubmit={handleAddExpense} className="space-y-4"><Input label="תיאור ההוצאה" value={expName} onChange={e=>setExpName(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">קטגוריה</label><div className="flex gap-2 flex-wrap mb-1">{quickCats.map(c => (<button key={c} type="button" onClick={()=>setExpCategory(c)} className={`text-xs px-3 py-1 rounded-full border ${expCategory===c ? 'bg-indigo-600 border-indigo-500' : 'bg-gray-800'}`}>{c}</button>))}</div><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={expCategory} onChange={e=>setExpCategory(e.target.value)}>{dynamicCats.map(c => <option key={c} value={c}>{c}</option>)}<option value="אחר">אחר (הזן קטגוריה חדשה)...</option></select></div>{expCategory === 'אחר' && <Input label="הזן שם קטגוריה חדשה" value={customCategory} onChange={e=>setCustomCategory(e.target.value)} required />}<Input label="מספר חשבונית/קבלה" value={expInvoice} onChange={e=>setExpInvoice(e.target.value)} /><Input label="סכום כולל לתשלום (₪)" type="number" step="any" min="0" value={expAmount} onChange={e=>setExpAmount(e.target.value)} required /><div className="bg-indigo-900/20 p-3 rounded border border-indigo-500/30 text-xs">הסכום יתחלק שווה בשווה:</div><div className="grid grid-cols-2 gap-4"><Input label="מחודש" type="month" value={expFrom} onChange={e=>setExpFrom(e.target.value)} required /><Input label="עד חודש" type="month" value={expTo} onChange={e=>setExpTo(e.target.value)} required /></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setShowForm(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'הוסף הוצאה'}</Button></div></form></div></div>)}
                </div>
            );
        };

        const AdminReports = ({ employees, shifts, settings }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
            const monthlyShifts = (shifts||[]).filter(s => (s.date||'').startsWith(month) && s.status === 'approved');
            const pendingShifts = (shifts||[]).filter(s => s.status === 'pending');
            const report = (employees||[]).map(emp => { const empShifts = monthlyShifts.filter(s => s.employeeId === emp.id).sort((a,b) => `${a.date||''} ${a.startTime||''}`.localeCompare(`${b.date||''} ${b.startTime||''}`)); const totalWage = Math.round(empShifts.reduce((acc, s) => acc + (Number(s.gamesCount) * (s.wageAtTime || emp.wagePerGame || 0)), 0)); return { ...emp, totalWage, empShifts }; });
            const totalPay = report.reduce((acc, r) => acc + r.totalWage, 0);
            const getMailLink = (emp) => {
                const tpl = settings.emailTemplate || INITIAL_SETTINGS.emailTemplate;
                const vars = { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] };
                return `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(emp.email || '')}&su=${encodeURIComponent(replacePlaceholders(tpl.subject, vars))}&body=${encodeURIComponent(replacePlaceholders(tpl.body, vars))}`;
            };
            const handleShiftStatus = async (id, newStatus) => { await updateDoc(getDocRef('shifts', id), { status: newStatus, approved: newStatus === 'approved' }); };

            return (
                <div className="space-y-6">
                    {pendingShifts.length > 0 && (
                        <Card title="משמרות ממתינות לאישור" className="border-yellow-500/50"><div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>תאריך</th><th>שעה</th><th>חדר</th><th>משחקים</th><th>תעריף</th><th>פעולות</th></tr></thead><tbody className="divide-y divide-gray-800">
                                {pendingShifts.map(s => { const e = (employees||[]).find(emp => emp.id === s.employeeId); return (<tr key={s.id} className="hover:bg-gray-800/30"><td className="py-2 font-bold">{e?.name || 'לא נמצא'}</td><td>{formatDateIL(s.date)}</td><td>{s.startTime}</td><td>{s.room}</td><td>{s.gamesCount}</td><td>₪{s.wageAtTime || e?.wagePerGame || 0}</td><td className="flex gap-2 py-2"><Button size="sm" variant="success" onClick={()=>handleShiftStatus(s.id, 'approved')}><Check size={14}/></Button><Button size="sm" variant="danger" onClick={()=>handleShiftStatus(s.id, 'rejected')}><XIcon size={14}/></Button><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-400 mr-2"><Trash2 size={14}/></button></td></tr>) })}
                        </tbody></table></div></Card>
                    )}
                    <div className="flex justify-between items-center card-bg p-4 rounded-xl"><div><h2 className="text-xl font-bold text-dynamic">דוחות שכר ({month})</h2><p className="opacity-80">סה"כ לתשלום: <span className="text-green-400 font-bold">₪{totalPay.toLocaleString()}</span></p></div><div className="flex gap-2"><MonthNav month={month} setMonth={setMonth}/><Button onClick={() => exportToXLSSalary(report, `Salary_Report_${month}.xls`)} variant="success"><Download size={16}/> אקסל</Button></div></div>
                    <div className="space-y-4">
                        {report.map(r => (<div key={r.id} className="card-bg rounded-xl overflow-hidden"><div className="p-4 flex justify-between items-center"><div className="flex items-center gap-3"><div className="h-10 w-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-white">{r.name[0]}</div><span className="text-lg font-bold text-dynamic">{r.name}</span></div><div className="text-green-400 font-bold text-xl">₪{r.totalWage}</div><a href={getMailLink(r)} target="_blank" rel="noopener noreferrer" title={r.email ? r.email : 'לעובד אין מייל במערכת'} className="px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 shadow-md transition-all border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20"><Mail size={16}/> שליחת תלוש</a></div>
                            {r.empShifts.length > 0 && (<div className="bg-black/20 p-2 text-sm border-t border-gray-800"><div className="grid grid-cols-7 text-gray-500 mb-2 px-2 text-xs font-bold"><div>תאריך</div><div>שעה</div><div>חדר</div><div>משחקים</div><div>תעריף</div><div>סה"כ</div><div>מחק</div></div>
                                {r.empShifts.map(s => { return (<div key={s.id} className="grid grid-cols-7 py-2 px-2 border-b border-gray-800 items-center hover:bg-white/5 opacity-80"><div>{formatDateIL(s.date)}</div><div>{s.startTime}</div><div>{s.room}</div><div>{s.gamesCount}</div><div>₪{s.wageAtTime||r.wagePerGame||0}</div><div>₪{s.gamesCount * (s.wageAtTime||r.wagePerGame||0)}</div><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-500"><Trash2 size={14}/></button></div>) })}
                            </div>)}
                        </div>))}
                    </div>
                </div>
            );
        };

        const AdminIssues = ({ issues, employees, settings }) => {
            const pendingIssues = (issues||[]).filter(i => i.status === 'pending').sort((a,b) => new Date(a.reportedAt) - new Date(b.reportedAt));
            const doneIssues = (issues||[]).filter(i => i.status === 'done').sort((a,b) => new Date(b.reportedAt) - new Date(a.reportedAt));
            const [room, setRoom] = useState(''); const [desc, setDesc] = useState(''); const [saving, setSaving] = useState(false);
            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);
            const submitIssue = async (e) => { e.preventDefault(); setSaving(true); try { await addDoc(getCollectionRef('issues'), { room, description: desc, reportedBy: 'admin', reportedByName: 'מנהל מערכת', status: 'pending', priority: 'רגילה', reportedAt: new Date().toISOString() }); alert('התקלה דווחה.'); setDesc(''); } catch(err) { alert(err.message); } finally { setSaving(false); } };
            const handlePriority = async (id, priority) => { await updateDoc(getDocRef('issues', id), { priority }); };
            const handleResolve = async (id) => { await updateDoc(getDocRef('issues', id), { status: 'done', resolvedAt: new Date().toISOString() }); const iss = (issues || []).find(i => i.id === id); if (iss && iss.reportedBy && iss.reportedBy !== 'admin') sendPush(iss.reportedBy, 'התקלה טופלה', `${iss.room || ''}: ${iss.description || ''}`); };
            const getPriorityColor = (p) => p === 'דחופה' ? 'text-red-400 bg-red-400/10 border-red-400/30' : (p === 'רגילה' ? 'text-yellow-400 bg-yellow-400/10 border-yellow-400/30' : 'text-green-400 bg-green-400/10 border-green-400/30');

            return (
                <div className="space-y-6">
                    <Card title="דיווח על תקלה חדשה (מנהל)"><form onSubmit={submitIssue} className="flex gap-4 items-end"><div className="flex-1"><label className="text-sm opacity-70">חדר</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2" value={room} onChange={e=>setRoom(e.target.value)} required>{roomList.map(r=><option key={r} value={r}>{r}</option>)}</select></div><div className="flex-[3]"><label className="text-sm opacity-70">תיאור</label><input type="text" className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2" value={desc} onChange={e=>setDesc(e.target.value)} required placeholder="מה נשבר?"/></div><Button type="submit" disabled={saving}>{saving?'שולח...':'הוסף'}</Button></form></Card>
                    <Card title="תקלות בטיפול (פתוחות)"><div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="opacity-70 border-b border-gray-700"><tr><th>זמן</th><th>חדר</th><th>תיאור</th><th>מדווח</th><th>עדיפות</th><th>פעולות</th></tr></thead><tbody className="divide-y divide-gray-800">{pendingIssues.length===0 && <tr><td colSpan="6" className="text-center py-6 opacity-60">הכל תקין!</td></tr>}{pendingIssues.map(i => (<tr key={i.id} className="hover:bg-white/5"><td className="py-3 text-xs opacity-70">{formatDateTimeIL(i.reportedAt)}</td><td className="font-bold">{i.room}</td><td className="max-w-xs">{i.description}</td><td className="opacity-80">{i.reportedByName}</td><td><select className={`border rounded p-1 text-xs outline-none ${getPriorityColor(i.priority)}`} value={i.priority} onChange={(e)=>handlePriority(i.id, e.target.value)}><option value="נמוכה" className="bg-gray-800 text-white">נמוכה</option><option value="רגילה" className="bg-gray-800 text-white">רגילה</option><option value="דחופה" className="bg-gray-800 text-white">דחופה</option></select></td><td className="flex items-center gap-2 py-2"><Button size="sm" variant="success" onClick={()=>handleResolve(i.id)}>טופל <Check size={14}/></Button><button onClick={()=>confirm("למחוק דיווח?") && deleteDoc(getDocRef('issues', i.id))} className="text-red-400 p-2"><Trash2 size={16}/></button></td></tr>))}</tbody></table></div></Card>
                    <Card title="היסטוריית תקלות שטופלו"><div className="overflow-x-auto opacity-70"><table className="w-full text-right text-sm"><thead className="border-b border-gray-700"><tr><th>זמן דיווח</th><th>חדר</th><th>תיאור התקלה</th><th>מדווח</th><th>זמן טיפול סופי</th></tr></thead><tbody className="divide-y divide-gray-800">{doneIssues.length===0 && <tr><td colSpan="5" className="text-center py-4">אין תקלות.</td></tr>}{doneIssues.map(i => (<tr key={i.id}><td className="py-2 text-xs">{formatDateTimeIL(i.reportedAt)}</td><td>{i.room}</td><td className="line-through">{i.description}</td><td>{i.reportedByName}</td><td className="text-xs">{formatDateTimeIL(i.resolvedAt)}</td></tr>))}</tbody></table></div></Card>
                </div>
            );
        };

        const AdminEmployees = ({ employees }) => {
            const [open, setOpen] = useState(false); const [edit, setEdit] = useState(null); const [saving, setSaving] = useState(false);
            const save = async (e) => { e.preventDefault(); setSaving(true); const fd = new FormData(e.target); const d = { name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), code: fd.get('code'), address: fd.get('address'), birthday: fd.get('birthday'), wagePerGame: Number(fd.get('wagePerGame')), form101: fd.get('form101') === 'on', skills: fd.get('skills').split(',').map(s=>s.trim()), gender: fd.get('gender') || '' }; try { if(edit) await updateDoc(getDocRef('employees', edit.id), d); else await addDoc(getCollectionRef('employees'), d); setOpen(false); } catch(e) { alert(e.message); } finally { setSaving(false); } };
            return (<div className="space-y-6"><div className="flex justify-between"><h2 className="text-2xl font-bold">ניהול עובדים</h2><Button onClick={()=>{setEdit(null); setOpen(true);}}><Plus size={18}/> הוסף עובד</Button></div><div className="grid md:grid-cols-3 gap-4">{(employees||[]).map(e => (<Card key={e.id} className="relative group hover:border-indigo-500"><div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 flex gap-2"><button onClick={()=>{setEdit(e); setOpen(true);}} className="bg-gray-900 p-1 rounded text-indigo-400">ערוך</button><button onClick={()=>confirm("למחוק?") && deleteDoc(getDocRef('employees', e.id))} className="bg-gray-900 p-1 rounded text-red-400"><Trash2 size={16}/></button></div><h3 className="font-bold text-lg">{e.name}</h3><p className="text-sm opacity-70">{e.phone}</p><div className="mt-2 text-sm opacity-60"><div>קוד: {e.code}</div><div>תעריף: ₪{e.wagePerGame}</div><div>מין: {e.gender === 'male' ? 'זכר' : (e.gender === 'female' ? 'נקבה' : 'לא הוגדר')}</div></div></Card>))}</div>{open && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto"><h3 className="text-xl font-bold mb-4">{edit ? 'עריכה' : 'חדש'}</h3><form onSubmit={save} className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="שם" name="name" required defaultValue={edit?.name}/><Input label="טלפון" name="phone" required defaultValue={edit?.phone}/><Input label="מייל" name="email" type="email" required defaultValue={edit?.email}/><Input label="קוד" name="code" required defaultValue={edit?.code}/><Input label="כתובת" name="address" className="col-span-2" defaultValue={edit?.address}/><Input label="יום הולדת" name="birthday" type="date" defaultValue={edit?.birthday}/><Input label="שכר למשחק" name="wagePerGame" type="number" required defaultValue={edit?.wagePerGame}/><Input label="הסמכות (מופרד בפסיק)" name="skills" className="col-span-2" defaultValue={edit?.skills?.join(', ')}/><div className="flex flex-col gap-1"><label className="text-sm opacity-70">מין (לניסוח הודעות וואטסאפ)</label><select name="gender" defaultValue={edit?.gender || ''} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white"><option value="">-- לא הוגדר (מפעיל/ה) --</option><option value="female">נקבה</option><option value="male">זכר</option></select></div></div><div className="flex gap-2"><input type="checkbox" name="form101" defaultChecked={edit?.form101}/> <label>טופס 101</label></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'שמור בענן'}</Button></div></form></div></div>}</div>);
        };

        const AdminTasks = ({ employees, tasks }) => {
            const [desc, setDesc] = useState(''); const [deadline, setDeadline] = useState(''); const [empId, setEmpId] = useState('');
            const addTask = async (e) => { e.preventDefault(); await addDoc(getCollectionRef('tasks'), { description: desc, deadline, assigneeId: empId, status: 'pending', createdAt: new Date().toISOString() }); if (empId && empId !== 'all') sendPush(empId, 'משימה חדשה', `${desc}${deadline ? ' · עד ' + formatDateIL(deadline) : ''}`); alert('משימה נוספה'); setDesc(''); setDeadline(''); setEmpId(''); };
            const delTask = async (id) => { if(confirm("למחוק משימה?")) await deleteDoc(getDocRef('tasks', id)); };
            const pending = (tasks||[]).filter(t => t.status === 'pending'); const completed = (tasks||[]).filter(t => t.status === 'completed').sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0, 3);
            return (
                <div className="space-y-6">
                    <Card title="הוספת משימה חדשה"><form onSubmit={addTask} className="space-y-4"><Input label="תיאור המשימה" value={desc} onChange={e=>setDesc(e.target.value)} required /><div className="grid grid-cols-2 gap-4"><Input label="דדליין" type="date" value={deadline} onChange={e=>setDeadline(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">בחר עובד</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" required value={empId} onChange={e=>setEmpId(e.target.value)}><option value="">-- בחר --</option>{(employees||[]).map(e => <option key={e.id} value={e.id}>{e.name}</option>)}</select></div></div><Button type="submit">הוסף משימה</Button></form></Card>
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card title="ממתין לביצוע">{pending.length === 0 && <p className="text-gray-500">אין משימות</p>}{pending.map(t => { const emp = (employees||[]).find(e => e.id === t.assigneeId); return <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center"><div><div className="font-bold">{t.description}</div><div className="text-sm opacity-70">אחראי: {emp?.name} | יעד: {formatDateIL(t.deadline)}</div></div><button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button></div> })}</Card>
                        <Card title="היסטוריה (3 אחרונות)">{completed.length === 0 && <p className="text-gray-500">אין משימות</p>}{completed.map(t => { const emp = (employees||[]).find(e => e.id === t.assigneeId); return <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center"><div><div className="font-bold text-green-400 line-through">{t.description}</div><div className="text-sm opacity-70">בוצע ע"י: {emp?.name}</div></div><button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button></div> })}</Card>
                    </div>
                </div>
            );
        };

        const AdminRequests = ({ requests, employees }) => {
            const handle = async (req, status) => { try { if(status === 'approved') await updateDoc(getDocRef('employees', req.employeeId), req.newData); await updateDoc(getDocRef('requests', req.id), { status }); } catch(e) { alert(e.message); } };
            return (<div className="space-y-4"><h2 className="text-xl font-bold text-dynamic">בקשות עדכון</h2>{(!requests||requests.length===0) && <p className="text-gray-500">אין בקשות חדשות</p>}{(requests||[]).map(r => { const emp = (employees||[]).find(e => e.id === r.employeeId); return <Card key={r.id} className="border-r-4 border-yellow-500 flex justify-between items-start"><div><h3 className="font-bold text-lg mb-1">{emp?.name}</h3><div className="text-sm opacity-70 space-y-1"><p>טלפון: {r.newData.phone}</p><p>מייל: {r.newData.email}</p><p>כתובת: {r.newData.address}</p><p>יום הולדת: {formatDateIL(r.newData.birthday)}</p></div></div><div className="flex gap-2"><Button variant="success" onClick={()=>handle(r, 'approved')}><Check size={16}/></Button><Button variant="danger" onClick={()=>handle(r, 'rejected')}><XIcon size={16}/></Button></div></Card> })}</div>);
        };

        const AdminSettings = ({ settings }) => {
            const update = async (k, v) => await setDoc(getDocRef('app_settings', 'global'), { ...settings, [k]: v }, { merge: true });
            const [backing, setBacking] = useState(false);
            const backupNow = async () => { setBacking(true); try { const r = await fetch(`${API_URL}/backupNow`, { method: 'POST' }); const d = await r.json().catch(() => ({})); alert(d.success ? 'הגיבוי נשמר: ' + d.name : 'הגיבוי נכשל: ' + (d.error || ('שגיאה ' + r.status + ' (האם פונקציות השרת עודכנו?)'))); } catch (e) { alert('שגיאת תקשורת: ' + e.message); } finally { setBacking(false); } };
            const handleTemplate = async (k, v) => await update('emailTemplate', { ...settings.emailTemplate, [k]: v });
            const handlePricing = async (k, v) => await update('pricing', { ...settings.pricing, [k]: Number(v) });
            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="מחירון והנחות"><div className="space-y-4"><h4 className="font-bold text-sm text-indigo-400">בסיס למשתתף</h4><div className="grid grid-cols-2 gap-2"><Input label="2 שחקנים" type="number" value={settings.pricing?.basePrice2} onChange={e => handlePricing('basePrice2', e.target.value)} /><Input label="3 שחקנים" type="number" value={settings.pricing?.basePrice3} onChange={e => handlePricing('basePrice3', e.target.value)} /><Input label="4 שחקנים" type="number" value={settings.pricing?.basePrice4} onChange={e => handlePricing('basePrice4', e.target.value)} /><Input label="5 שחקנים" type="number" value={settings.pricing?.basePrice5} onChange={e => handlePricing('basePrice5', e.target.value)} /><Input label="6-8 שחקנים" type="number" value={settings.pricing?.basePrice6to8} onChange={e => handlePricing('basePrice6to8', e.target.value)} /><Input label="9-10 שחקנים" type="number" value={settings.pricing?.basePrice9to10} onChange={e => handlePricing('basePrice9to10', e.target.value)} /></div><h4 className="font-bold text-sm text-indigo-400 mt-4">אחוזי הנחה</h4><div className="grid grid-cols-2 gap-2"><Input label="ילדים (%)" type="number" value={settings.pricing?.discountKids} onChange={e => handlePricing('discountKids', e.target.value)} /><Input label="זכאים (%)" type="number" value={settings.pricing?.discountEligible} onChange={e => handlePricing('discountEligible', e.target.value)} /></div></div></Card>
                    <div className="space-y-6"><Card title="כללי"><div className="space-y-4"><Input label="שם העסק" value={settings.businessName} onChange={e => update('businessName', e.target.value)} /><Input label="קוד כניסה למנהל" value={settings.adminCode} onChange={e => update('adminCode', e.target.value)} /><Input label="רשימת חדרים (מופרד בפסיק)" value={settings.roomsList} onChange={e => update('roomsList', e.target.value)} /></div></Card><Card title="עיצוב"><div className="space-y-4"><div className="space-y-1"><label className="text-sm opacity-70">צבע רקע (ראשי)</label><input type="color" value={settings.primaryColor} onChange={e => update('primaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div><div className="space-y-1"><label className="text-sm opacity-70">צבע טקסט (משני)</label><input type="color" value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div><div className="space-y-1"><label className="text-sm opacity-70">לוגו (URL)</label><input className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white" value={settings.logo || ''} onChange={e => update('logo', e.target.value)} /></div></div></Card></div>
                    <Card title="תבנית אימייל לשכר"><div className="space-y-4"><Input label="נושא" value={settings.emailTemplate?.subject||''} onChange={e => handleTemplate('subject', e.target.value)} /><div className="space-y-1"><label className="text-sm opacity-70">תוכן (משתנים: {`{name}, {month}, {year}`})</label><textarea className="w-full bg-gray-800 border border-gray-700 rounded p-2 h-32 text-white" value={settings.emailTemplate?.body||''} onChange={e => handleTemplate('body', e.target.value)} /></div><Input label="מייל העסק" value={settings.senderEmail||''} onChange={e => update('senderEmail', e.target.value)} /></div></Card>
                    <Card title="שעות פעילות (קובעות אילו מועדים אפשר לפתוח)"><div className="space-y-2">{DAY_NAMES_EN.map((dn, i) => { const oh = settings.openingHours || INITIAL_SETTINGS.openingHours; const h = oh[dn] || { start: '', end: '' }; return (<div key={dn} className="flex items-center gap-3"><span className="w-14 text-sm">{DAY_NAMES_HE[i]}</span><input type="time" value={h.start || ''} onChange={e => update('openingHours', { ...oh, [dn]: { ...h, start: e.target.value } })} className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-white"/><span>-</span><input type="time" value={h.end || ''} onChange={e => update('openingHours', { ...oh, [dn]: { ...h, end: e.target.value } })} className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-white"/></div>); })}<p className="text-xs opacity-60">סיום אחרי חצות (למשל 01:00) נתמך. השאר ריק ליום סגור.</p></div></Card>
                    <Card title="גיבוי נתונים"><div className="space-y-3"><p className="text-sm opacity-80">המערכת מגבה את כל הנתונים אוטומטית ב-1 לכל חודש בשעה 03:00 לאחסון הענן של הפרויקט. אפשר גם לגבות עכשיו.</p><Button onClick={backupNow} disabled={backing} variant="outline">{backing ? <Loader className="animate-spin w-4 h-4"/> : <Download size={16}/>} גבה עכשיו</Button></div></Card>
                </div>
            );
        };

        const AdminDashboard = ({ data, settings }) => {
            const [tab, setTab] = useState(() => takePendingTab() || 'groups');
            useEffect(() => { const h = () => { const t = takePendingTab(); if (t) setTab(t); }; window.addEventListener('groom-open-tab', h); return () => window.removeEventListener('groom-open-tab', h); }, []);
            const pendingReq = (data.requests || []).filter(r => r.status === 'pending');
            const pendingCons = (data.constraints || []).filter(c => c.status === 'pending');
            const pendingShifts = (data.shifts || []).filter(s => s.status === 'pending');
            const pendingIssues = (data.issues || []).filter(i => i.status === 'pending');
            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap gap-2 border-b border-dynamic pb-2">
                        {[{id:'groups', l:'הכנסות', i:Coins}, {id:'expenses', l:'דוח פיננסי', i:LineChart}, {id:'employees', l:'עובדים', i:Users}, {id:'shifts', l:'דוחות שכר', i:FileText}, {id:'constraints', l:'זמינות', i:Calendar}, {id:'issues', l:'תקלות', i:Wrench}, {id:'tasks', l:'משימות', i:CheckSquare}, {id:'settings', l:'הגדרות', i:Settings}].map(m => 
                            <button key={m.id} onClick={()=>setTab(m.id)} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg transition-colors ${tab===m.id ? 'bg-indigo-600/10 text-indigo-400 border-b-2 border-indigo-500' : 'opacity-70 hover:opacity-100'}`}>
                                <m.i size={18} /> {m.l} 
                                {m.id === 'constraints' && pendingCons.length > 0 && <span className="bg-yellow-500 text-black text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingCons.length}</span>}
                                {m.id === 'shifts' && pendingShifts.length > 0 && <span className="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingShifts.length}</span>}
                                {m.id === 'issues' && pendingIssues.length > 0 && <span className="bg-orange-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingIssues.length}</span>}
                            </button>
                        )}
                        {pendingReq.length > 0 && <button onClick={()=>setTab('requests')} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg ml-auto transition-colors ${tab==='requests'?'bg-indigo-600/10 border-b-2 border-indigo-500':'text-yellow-400'}`}><Bell size={18} className="animate-bounce"/><span className="font-bold">{pendingReq.length}</span></button>}
                    </div>
                    <div className="fade-in">
                        {tab==='groups' && <AdminGroups groups={data.groups||[]} employees={data.employees||[]} settings={settings} shifts={data.shifts||[]} />}
                        {tab==='expenses' && <AdminExpenses expenses={data.expenses||[]} groups={data.groups||[]} shifts={data.shifts||[]} employees={data.employees||[]} settings={settings} />}
                        {tab==='employees' && <AdminEmployees employees={data.employees||[]}/>}
                        {tab==='shifts' && <AdminReports employees={data.employees||[]} shifts={data.shifts||[]} settings={settings}/>}
                        {tab==='constraints' && <AdminConstraints employees={data.employees||[]} constraints={data.constraints||[]} settings={settings} assignments={data.assignments||[]}/>}
                        {tab==='issues' && <AdminIssues issues={data.issues||[]} employees={data.employees||[]} settings={settings}/>}
                        {tab==='tasks' && <AdminTasks employees={data.employees||[]} tasks={data.tasks||[]}/>}
                        {tab==='settings' && <AdminSettings settings={settings}/>}
                        {tab==='requests' && <AdminRequests requests={pendingReq} employees={data.employees||[]}/>}
                    </div>
                </div>
            );
        };

        const useIsMobile = () => {
            const q = '(max-width: 640px)';
            const [m, setM] = useState(() => { try { return window.matchMedia(q).matches; } catch (e) { return false; } });
            useEffect(() => { let mq; try { mq = window.matchMedia(q); } catch (e) { return; } const h = () => setM(mq.matches); if (mq.addEventListener) mq.addEventListener('change', h); else mq.addListener(h); return () => { if (mq.removeEventListener) mq.removeEventListener('change', h); else mq.removeListener(h); }; }, []);
            return m;
        };
        const NotifyBar = ({ user }) => {
            const [state, setState] = useState(() => pushSupported() ? Notification.permission : 'unsupported');
            const [busy, setBusy] = useState(false); const [msg, setMsg] = useState('');
            useEffect(() => { if (state === 'granted') registerPush(user).catch(e => console.warn('push', e)); }, [user.id]);
            const enable = async () => {
                setBusy(true);
                try { const pm = await Notification.requestPermission(); setState(pm); if (pm === 'granted') { await registerPush(user); setMsg('ההתראות הופעלו במכשיר הזה'); } else setMsg('ההרשאה נדחתה. אפשר לשנות אותה בהגדרות הטלפון.'); }
                catch (e) { setMsg('שגיאה בהפעלת התראות: ' + e.message); } finally { setBusy(false); }
            };
            const isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent); const standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            if (state === 'unsupported') return (isIos && !standalone) ? <div className="bg-indigo-900/40 border border-indigo-500/30 text-sm rounded-lg p-3 mb-4">כדי לקבל התראות באייפון: פתח את האתר ב-Safari, לחץ על כפתור השיתוף ובחר "הוסף למסך הבית", ואז פתח את האפליקציה מהמסך הבית.</div> : null;
            if (state === 'granted' && !msg) return null;
            if (state === 'denied') return <div className="bg-yellow-900/30 border border-yellow-600/40 text-sm rounded-lg p-3 mb-4">ההתראות חסומות במכשיר הזה. אפשר להפעיל אותן בהגדרות הטלפון או הדפדפן.</div>;
            return (<div className="bg-indigo-900/40 border border-indigo-500/30 rounded-lg p-3 mb-4 flex items-center justify-between gap-3 flex-wrap">
                <span className="text-sm">{msg || 'רוצה לקבל התראות על תורים, משימות ותקלות?'}</span>
                {state !== 'granted' && <Button onClick={enable} disabled={busy}>{busy ? 'מפעיל...' : 'הפעל התראות'}</Button>}
            </div>);
        };

        const MSeg = ({ items, value, onChange }) => (<div className="m-seg">{items.map(([k, l, c]) => <button key={k} type="button" onClick={() => onChange(k)} className={value === k ? 'on' : ''}>{l}{c > 0 && <span className="m-badge">{c}</span>}</button>)}</div>);

        const MobileHome = ({ data, settings, go }) => {
            const [appts, setAppts] = useState(null);
            useEffect(() => {
                let alive = true;
                (async () => {
                    try {
                        const now = new Date(); const tmr = addDays(now, 1); const ws = [getWeekStart(now)]; if (ymd(getWeekStart(tmr)) !== ymd(ws[0])) ws.push(getWeekStart(tmr));
                        const maps = await Promise.all(ws.map(w => fetchWeekSlotsMap(w))); const all = {}; maps.forEach(m => Object.assign(all, m)); if (alive) setAppts(all);
                    } catch (e) { if (alive) setAppts({}); }
                })();
                return () => { alive = false; };
            }, []);
            const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes(); const today = ymd(now); const tomorrow = ymd(addDays(now, 1));
            const booked = (d) => ((appts || {})[d] || []).filter(s => s.isBooked);
            const hasAssign = (d, t) => (data.assignments || []).some(a => a.id === `${d}_${t.replace(':', '')}`);
            const todayList = booked(today);
            const upcoming = [...todayList.filter(s => toMin(s.time) + 60 >= nowMin).map(s => ({ ...s, d: today, lab: 'היום' })), ...booked(tomorrow).map(s => ({ ...s, d: tomorrow, lab: 'מחר' }))];
            const unassigned = upcoming.filter(s => !(s.lab === 'היום' && toMin(s.time) < nowMin) && !hasAssign(s.d, s.time));
            const next = upcoming[0];
            const stats = useMemo(() => monthStats(thisMonth(), data.groups, data.shifts, data.employees, data.expenses), [data.groups, data.shifts, data.employees, data.expenses]);
            const issues = (data.issues || []).filter(i => i.status === 'pending').sort((a, b) => (a.priority === 'דחופה' ? 0 : 1) - (b.priority === 'דחופה' ? 0 : 1));
            const pendingReq = (data.requests || []).filter(r => r.status === 'pending'); const pendingShifts = (data.shifts || []).filter(s => s.status === 'pending');
            const resolve = async (i) => { try { await updateDoc(getDocRef('issues', i.id), { status: 'done', resolvedAt: new Date().toISOString() }); if (i.reportedBy && i.reportedBy !== 'admin') sendPush(i.reportedBy, 'התקלה טופלה', `${i.room || ''}: ${i.description || ''}`); } catch (e) { alert(e.message); } };
            const empName = (id) => id === 'admin' ? 'מנהל' : ((data.employees || []).find(e => e.id === id) || {}).name || '';
            const attention = [];
            if (unassigned.length) attention.push([`${unassigned.length} תורים ללא מפעיל`, 'שייך', () => go('calendar')]);
            if (pendingShifts.length) attention.push([`${pendingShifts.length} משמרות לאישור`, 'אשר', () => go('finance', 'pay')]);
            if (pendingReq.length) attention.push([`${pendingReq.length} בקשות ממתינות`, 'פתח', () => go('staff', 'requests')]);
            return (<div className="space-y-4">
                <div><div className="m-h1">שלום, דור</div><div className="m-sub">{now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
                <div className="grid grid-cols-2 gap-3">
                    <div className="m-card m-stat"><span className="m-sub">תורים היום</span><b>{appts ? todayList.length : '...'}</b></div>
                    <div className="m-card m-stat"><span className="m-sub">הכנסות החודש</span><b>₪{Math.round(stats.revenue).toLocaleString()}</b></div>
                </div>
                {issues.length > 0 && (<div className="m-card m-alert"><div style={{ fontWeight: 'bold', fontSize: 19 }}>תקלות פתוחות ({issues.length})</div>
                    {issues.map(i => (<div key={i.id} className="m-row"><span>{i.description}<div className="m-sub">{i.room} · {i.reportedByName || ''}{i.priority === 'דחופה' ? ' · דחופה' : ''}</div></span><button type="button" className="m-btn" onClick={() => resolve(i)}>טופל</button></div>))}</div>)}
                <div className="m-card"><div style={{ fontWeight: 'bold', fontSize: 19 }}>דורש טיפול</div>
                    {attention.length === 0 && <div className="m-sub" style={{ paddingTop: 10 }}>הכל מסודר. אין משהו שמחכה לך.</div>}
                    {attention.map(([t, b, f]) => (<div key={t} className="m-row"><span>{t}</span><button type="button" className="m-btn" onClick={f}>{b}</button></div>))}</div>
                {next && (<div className="m-card"><div className="m-sub">התור הבא</div><div style={{ fontSize: 24, fontWeight: 'bold', margin: '4px 0' }}>{next.lab} {next.time}</div><div>{next.customerName || 'לקוח'}{next.participants ? ` · ${next.participants} שחקנים` : ''}</div><div className="m-sub">{hasAssign(next.d, next.time) ? 'מפעיל: ' + empName(((data.assignments || []).find(a => a.id === `${next.d}_${next.time.replace(':', '')}`) || {}).employeeId) : 'טרם שויך מפעיל'}</div></div>)}
                <button type="button" className="m-wide" onClick={() => go('issues')}>כל התקלות ודיווח תקלה</button>
            </div>);
        };

        const MobileAdmin = ({ data, settings, onLogout }) => {
            const [tab, setTab] = useState(() => (takePendingTab() ? 'calendar' : 'home'));
            const [fin, setFin] = useState('income'); const [staff, setStaff] = useState('team');
            useEffect(() => { const h = () => { if (takePendingTab()) setTab('calendar'); }; window.addEventListener('groom-open-tab', h); return () => window.removeEventListener('groom-open-tab', h); }, []);
            const go = (t, sub) => { setTab(t); if (t === 'finance' && sub) setFin(sub); if (t === 'staff' && sub) setStaff(sub); window.scrollTo(0, 0); };
            const pendingReq = (data.requests || []).filter(r => r.status === 'pending'); const pendingShifts = (data.shifts || []).filter(s => s.status === 'pending'); const pendingIssues = (data.issues || []).filter(i => i.status === 'pending');
            const nav = [['home', 'בית', Home, pendingIssues.length], ['calendar', 'יומן', Calendar, 0], ['finance', 'כספים', Coins, pendingShifts.length], ['staff', 'עובדים', Users, pendingReq.length], ['more', 'עוד', Menu, 0]];
            const titles = { home: '', calendar: 'יומן', finance: 'כספים', staff: 'עובדים', issues: 'תקלות', more: 'עוד' };
            return (<div>
                {titles[tab] && <div className="m-h1" style={{ marginBottom: 14 }}>{titles[tab]}</div>}
                {tab === 'home' && <MobileHome data={data} settings={settings} go={go} />}
                {tab === 'calendar' && <AdminConstraints employees={data.employees || []} constraints={data.constraints || []} settings={settings} assignments={data.assignments || []} />}
                {tab === 'finance' && (<div><MSeg items={[['income', 'הכנסות'], ['report', 'דוח והוצאות'], ['pay', 'שכר', pendingShifts.length]]} value={fin} onChange={setFin} />
                    {fin === 'income' && <AdminGroups groups={data.groups || []} employees={data.employees || []} settings={settings} shifts={data.shifts || []} />}
                    {fin === 'report' && <AdminExpenses expenses={data.expenses || []} groups={data.groups || []} shifts={data.shifts || []} employees={data.employees || []} settings={settings} />}
                    {fin === 'pay' && <AdminReports employees={data.employees || []} shifts={data.shifts || []} settings={settings} />}</div>)}
                {tab === 'staff' && (<div><MSeg items={[['team', 'צוות'], ['tasks', 'משימות'], ['requests', 'בקשות', pendingReq.length]]} value={staff} onChange={setStaff} />
                    {staff === 'team' && (<div className="space-y-3"><div className="grid grid-cols-2 gap-3"><button type="button" className="m-wide" onClick={() => go('calendar')}>זמינות עובדים</button><button type="button" className="m-wide" onClick={() => go('finance', 'pay')}>שכר עובדים</button></div><AdminEmployees employees={data.employees || []} /></div>)}
                    {staff === 'tasks' && <AdminTasks employees={data.employees || []} tasks={data.tasks || []} />}
                    {staff === 'requests' && <AdminRequests requests={pendingReq} employees={data.employees || []} />}</div>)}
                {tab === 'issues' && (<div className="space-y-3"><button type="button" className="m-wide" onClick={() => go('home')}>חזרה לבית</button><AdminIssues issues={data.issues || []} employees={data.employees || []} settings={settings} /></div>)}
                {tab === 'more' && (<div className="space-y-4"><AdminSettings settings={settings} /><button type="button" className="m-wide" style={{ background: 'rgba(239,68,68,0.4)' }} onClick={onLogout}>יציאה</button></div>)}
                <div className="m-nav">{nav.map(([k, l, I, c]) => (<button key={k} type="button" className={tab === k || (k === 'home' && tab === 'issues') ? 'on' : ''} onClick={() => go(k)}><I size={24} />{l}{c > 0 && <span className="m-badge">{c}</span>}</button>))}</div>
            </div>);
        };

        function GRoomApp() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [data, setData] = useState({ employees: [], shifts: [], constraints: [], requests: [], tasks: [], groups: [], expenses: [], issues: [], assignments: [] });
            const [settings, setSettings] = useState(INITIAL_SETTINGS);
            const [loading, setLoading] = useState(true);
            const [login, setLogin] = useState({ code: '', empId: '' });
            const [dbConn, setDbConn] = useState(false);
            const isMobile = useIsMobile();
            useEffect(() => { document.documentElement.classList.toggle('mglass', isMobile); }, [isMobile]);

            useEffect(() => {
                const init = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                init();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const unsub = [
                    onSnapshot(getCollectionRef('employees'), s => { setData(p => ({...p, employees: s.docs.map(d => ({id: d.id, ...d.data()}))})); setDbConn(true); }, e => setDbConn(false)),
                    onSnapshot(getCollectionRef('shifts'), s => setData(p => ({...p, shifts: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('constraints'), s => setData(p => ({...p, constraints: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('requests'), s => setData(p => ({...p, requests: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('tasks'), s => setData(p => ({...p, tasks: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('groups'), s => setData(p => ({...p, groups: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('expenses'), s => setData(p => ({...p, expenses: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('issues'), s => setData(p => ({...p, issues: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('assignments'), s => setData(p => ({...p, assignments: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('app_settings'), s => {
                        if (!s.empty) { const d = s.docs.find(doc => doc.id === 'global') || s.docs[0]; if (d) setSettings(prev => ({...prev, ...d.data()})); }
                        setLoading(false);
                    })
                ];
                return () => unsub.forEach(u => u());
            }, [user]);

            useEffect(() => {
                const r = document.documentElement.style;
                r.setProperty('--app-bg', settings.primaryColor || '#030712');
                r.setProperty('--app-text', settings.secondaryColor || '#ffffff');
                const isLight = settings.primaryColor === '#ffffff' || settings.primaryColor === '#f3f4f6';
                r.setProperty('--app-card-bg', isLight ? '#e5e7eb' : 'rgba(255, 255, 255, 0.05)');
                r.setProperty('--app-border', isLight ? '#d1d5db' : 'rgba(255, 255, 255, 0.1)');
            }, [settings]);

            const doLogin = () => {
                if ((login.empId === 'admin' && login.code === settings.adminCode) || (login.empId === 'admin' && (data.employees||[]).length === 0 && login.code === 'admin123')) {
                    setCurrentUser({ role: 'admin', name: 'מנהל המערכת', id: 'admin' });
                } else {
                    const emp = (data.employees||[]).find(e => e.id === login.empId);
                    if (emp && emp.code === login.code) setCurrentUser({ role: 'employee', data: emp, id: emp.id, name: emp.name });
                    else alert("פרטי התחברות שגויים");
                }
            };

            if (loading) return <div className="min-h-screen bg-gray-950 flex items-center justify-center text-indigo-500"><Loader className="animate-spin w-10 h-10" /></div>;

            if (!currentUser) return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full card-bg p-8 rounded-2xl text-center relative shadow-2xl">
                        <div className={`absolute top-4 right-4 w-3 h-3 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
                        <div className="mb-8">
                            {settings.logo ? <img src={settings.logo} className="h-24 mx-auto mb-4 object-contain"/> : <div className="h-24 w-24 bg-indigo-900/50 rounded-full mx-auto flex items-center justify-center mb-4"><Lock size={40} className="text-indigo-400"/></div>}
                            <h1 className="text-3xl font-bold text-dynamic">{settings.businessName}</h1>
                            <p className="opacity-60 text-sm mt-2">מערכת ניהול ERP</p>
                        </div>
                        <div className="space-y-4">
                            <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500" value={login.empId} onChange={e => setLogin({...login, empId: e.target.value})}>
                                <option value="">-- בחר משתמש --</option>
                                <option value="admin">🔒 מנהל מערכת</option>
                                {(data.employees || []).map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                            </select>
                            <input type="password" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-center tracking-widest outline-none focus:ring-2 focus:ring-indigo-500" value={login.code} onChange={e => setLogin({...login, code: e.target.value})} onKeyDown={e => e.key === 'Enter' && doLogin()} placeholder="****" />
                            <Button onClick={doLogin} className="w-full py-3 text-lg font-bold">כניסה</Button>
                        </div>
                        <div className="mt-6 text-[10px] opacity-40 text-dynamic">גרסה 8.4 - עיגול מחירים, וואטסאפ והזמנה חכמה</div>
                    </div>
                </div>
            );

            if (isMobile && currentUser.role === 'admin') return (
                <div className="min-h-screen font-sans">
                    <main className="px-3 py-4 w-full"><NotifyBar user={currentUser} /><MobileAdmin data={data} settings={settings} onLogout={() => { detachPush(); setCurrentUser(null); setLogin({ code: '', empId: '' }); }} /></main>
                </div>
            );

            return (
                <div className="min-h-screen font-sans flex flex-col">
                    <header className="card-bg border-b border-dynamic sticky top-0 z-50 h-16 flex items-center justify-between px-6 shadow-sm">
                        <div className="flex items-center gap-3">
                            {settings.logo && <img src={settings.logo} className="h-8 w-8 rounded object-cover"/>}
                            <span className="font-bold text-xl text-dynamic hidden sm:block">{settings.businessName}</span>
                            <span className="text-xs bg-indigo-900/50 text-indigo-200 px-3 py-1 rounded-full border border-indigo-500/30 flex items-center gap-2">
                                {currentUser.role === 'admin' ? 'מנהל מערכת' : `שלום, ${currentUser.name}`}
                                <div className={`w-2 h-2 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500'}`}></div>
                            </span>
                        </div>
                        <Button variant="ghost" onClick={() => {detachPush(); setCurrentUser(null); setLogin({code:'', empId:''});}} className="text-red-400 hover:bg-red-900/20"><LogOut size={18} /> <span className="hidden sm:inline">יציאה</span></Button>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        <NotifyBar user={currentUser} />
                        {currentUser.role === 'admin' ? <AdminDashboard data={data} settings={settings} /> : <EmployeeDashboard employee={currentUser} data={data} settings={settings} />}
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<GRoomApp />);
    </script>
</body>
</html>
