                                                type="text" 
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none" 
                                                value={g.customerName} 
                                                onChange={e=>setG({...g, customerName:e.target.value})} 
                                                required 
                                                placeholder="הקלד שם לקוח..."
                                            />
                                            {tor4youCustomers.length > 0 && (
                                                <Button type="button" variant="outline" size="sm" onClick={() => setIsManualCustomer(false)} title="חזור לרשימת יומן" className="px-2">
                                                    <CalendarRange size={16} />
                                                </Button>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-4 border-t border-gray-700 pt-4">
                                <Input label='סה"כ שחקנים' type="number" min="2" value={g.totalPlayers} onChange={e=>setG({...g, totalPlayers:e.target.value})} required />
                                <Input label="ילדים (<12)" type="number" min="0" value={g.kidsCount} onChange={e=>setG({...g, kidsCount:e.target.value})} disabled={g.hasVoucher}/>
                                <Input label="סטודנט/חייל/נכה" type="number" min="0" value={g.specialCount} onChange={e=>setG({...g, specialCount:e.target.value})} disabled={g.hasVoucher}/>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm opacity-70 mb-1">הרכב קבוצה</label>
                                <select className="w-full bg-gray-800 p-2 rounded text-white" value={g.groupType} onChange={e=>setG({...g, groupType:e.target.value})}>
                                    <option>משפחה</option><option>חברים</option><option>צוות עבודה</option><option>בני זוג</option><option>גיבוש קבוצה</option>
                                </select></div>
                                <div><label className="block text-sm opacity-70 mb-1">איך הגיעו אלינו?</label>
                                <select className="w-full bg-gray-800 p-2 rounded text-white" value={g.referral} onChange={e=>setG({...g, referral:e.target.value})}>
                                    <option>גוגל</option><option>פייסבוק</option><option>EAZY</option><option>מפה לאוזן</option><option>אינסטגרם</option><option>טיקטוק</option><option>שלט</option>
                                </select></div>
                            </div>

                            <div className="border-t border-indigo-900/50 pt-4 mt-4 space-y-4">
                                <div className="flex gap-2 items-center bg-gray-800 p-3 rounded cursor-pointer" onClick={()=>setG({...g, hasVoucher: !g.hasVoucher})}>
                                    <input type="checkbox" checked={g.hasVoucher} readOnly className="w-5 h-5 accent-indigo-600"/>
                                    <label className="font-bold cursor-pointer">תשלום באמצעות שובר מגה לאן?</label>
                                </div>

                                {g.hasVoucher && (
                                    <div className="space-y-4 bg-indigo-900/20 p-4 rounded border border-indigo-800/50">
                                        <div className="grid grid-cols-2 gap-4">
                                            <Input label="מספר שחקנים בשובר" type="number" min="1" value={g.voucherPlayers} onChange={e=>setG({...g, voucherPlayers:e.target.value})} />
                                            <Input label="קוד שובר (5-6 ספרות)" value={g.voucherCode} onChange={e=>setG({...g, voucherCode:e.target.value})} />
                                        </div>
                                        <div className="flex gap-2 items-center">
                                            <input type="checkbox" checked={g.isWeekend} onChange={e=>setG({...g, isWeekend: e.target.checked})} className="w-4 h-4"/>
                                            <label className="text-sm">האם מומש בסופ"ש / ערב חג? (תוספת 10₪ לשחקן שובר)</label>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="border-t border-gray-700 pt-4 space-y-4">
                                <h4 className="font-bold opacity-80 mb-2">אמצעי תשלום לפירעון קופה (₪{calc.finalP})</h4>
                                <div className="grid grid-cols-2 gap-4">
                                    <Input label="מזומן" type="number" value={g.payments.cash} onChange={e=>setG({...g, payments: {...g.payments, cash: e.target.value}})} />
                                    <Input label="אשראי" type="number" value={g.payments.credit} onChange={e=>setG({...g, payments: {...g.payments, credit: e.target.value}})} />
                                    <Input label="ביט" type="number" value={g.payments.bit} onChange={e=>setG({...g, payments: {...g.payments, bit: e.target.value}})} />
                                    <Input label="העברה בנקאית" type="number" value={g.payments.transfer} onChange={e=>setG({...g, payments: {...g.payments, transfer: e.target.value}})} />
                                </div>
                                {calc.diff !== 0 && (
                                    <div className={`p-2 text-center rounded text-sm font-bold ${calc.diff > 0 ? 'bg-red-900/50 text-red-400' : 'bg-yellow-900/50 text-yellow-400'}`}>
                                        {calc.diff > 0 ? `חסר ₪${calc.diff} להשלמת התשלום` : `הוזן ₪${Math.abs(calc.diff)} יותר מדי`}
                                    </div>
                                )}
                            </div>

                            <Button type="submit" className="w-full text-lg mt-4" disabled={calc.diff !== 0}><Save size={18}/> {isAdmin ? 'שמור למערכת' : 'שמור דיווח'}</Button>
                        </form>
                    </Card>

                    <Card title="מחשבון קופה חכם">
                        <div className="flex flex-col items-center py-6 space-y-6">
                            <div className="w-full space-y-2 text-sm">
                                <div className="flex justify-between border-b border-gray-800 pb-2">
                                    <span>מחיר בסיס ({g.totalPlayers} שחקנים)</span><span>₪{calc.base} לאדם</span>
                                </div>
                                <div className="flex justify-between border-b border-gray-800 pb-2 font-bold">
                                    <span>סה"כ תיאורטי מחירון</span><span>₪{calc.base * g.totalPlayers}</span>
                                </div>
                                {calc.discountAmount > 0 && (
                                    <div className="flex justify-between border-b border-gray-800 pb-2 text-yellow-400">
                                        <span>הנחות (ילדים/זכאים)</span><span>- ₪{calc.discountAmount}</span>
                                    </div>
                                )}
                                {g.hasVoucher && g.voucherPlayers > 0 && (
                                    <div className="flex justify-between border-b border-gray-800 pb-2 text-indigo-400">
                                        <span>שובר מגה לאן ({g.voucherPlayers} אנשים)</span><span>- ₪{calc.base * Math.min(g.voucherPlayers, g.totalPlayers)}</span>
                                    </div>
                                )}
                                {g.isWeekend && g.hasVoucher && (
                                    <div className="flex justify-between border-b border-gray-800 pb-2 text-red-400">
                                        <span>תוספת סופ"ש שובר</span><span>+ ₪{calc.weekendAdd}</span>
                                    </div>
                                )}
                            </div>
                            
                            <div className="text-center w-full bg-gray-800 p-6 rounded-xl border border-gray-700">
                                <div className="text-sm opacity-70 mb-1">לגבייה מהלקוח עכשיו</div>
                                <div className="text-5xl font-bold text-green-400">₪{calc.finalP}</div>
                            </div>

                            <div className="flex justify-between w-full text-xs opacity-50 px-2">
                                <span>* צפי החזר שובר (מעוגל כלפי מעלה): ₪{calc.voucherWorth}</span>
                                {calc.sumPaid > 0 && <span>(הוזן עד כה: ₪{calc.sumPaid})</span>}
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const EmployeeTasks = ({ employee, tasks }) => {
            const myTasks = tasks.filter(t => t.assigneeId === employee.id && t.status === 'pending');
            
            const handleComplete = async (id) => {
                await updateDoc(getDocRef('tasks', id), { status: 'completed', completedAt: new Date().toISOString() });
                alert('כל הכבוד! המשימה הושלמה');
            };

            return (
                <Card title="המשימות שלי">
                    {myTasks.length === 0 && <div className="text-center py-8 opacity-60">אין משימות פתוחות 🎉</div>}
                    <div className="space-y-4">
                        {myTasks.map(t => (
                            <div key={t.id} className="border border-gray-700 rounded-lg p-4 flex justify-between items-center bg-gray-800/30">
                                <div>
                                    <h3 className="font-bold text-lg mb-1">{t.description}</h3>
                                    <div className="text-sm opacity-70 text-red-300">לביצוע עד: {formatDateIL(t.deadline)}</div>
                                </div>
                                <Button onClick={() => handleComplete(t.id)} variant="success">ביצעתי</Button>
                            </div>
                        ))}
                    </div>
                </Card>
            );
        };

        const EmployeeReport = ({ employee, shifts, settings }) => {
            const roomsArray = settings.roomsList ? settings.roomsList.split(',').map(s=>s.trim()) : ['סודו של הודיני'];
            const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
            const [start, setStart] = useState('');
            const [games, setGames] = useState(1);
            const [room, setRoom] = useState(roomsArray[0]);
            
            const submit = async (e) => {
                e.preventDefault();
                const today = new Date();
                const selDate = new Date(date);
                if (selDate.getMonth() < today.getMonth() && today.getDate() > 3) return alert("לא ניתן לדווח על חודש שעבר אחרי ה-3 לחודש");
                await addDoc(getCollectionRef('shifts'), { employeeId: employee.id, date, startTime: start, gamesCount: Number(games), room, status: 'pending', wagePerGameAtTime: employee.wagePerGame }); 
                alert('המשמרת נשלחה לאישור המנהל'); setStart(''); setGames(1);
            };
            
            const del = async (id) => { if(confirm("למחוק משמרת זו?")) await deleteDoc(getDocRef('shifts', id)); };
            const myShifts = shifts.filter(s => s.employeeId === employee.id).sort((a,b) => b.date.localeCompare(a.date));

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="דיווח משמרת ידני (ללא קבוצה)">
                        <div className="mb-4 text-xs text-yellow-400 bg-yellow-900/30 p-2 rounded">
                            שים לב: מומלץ להשתמש במסך "דיווח קבוצה" שמדווח גם למנהל וגם לשכר. דיווח זה נועד רק לתורנויות או מקרים חריגים.
                        </div>
                        <form onSubmit={submit} className="space-y-4">
                            <Input label="תאריך" type="date" value={date} onChange={e=>setDate(e.target.value)} required />
                            <Input label="שעה" type="time" value={start} onChange={e=>setStart(e.target.value)} required />
                            <label className="block text-sm opacity-70 text-dynamic">חדר</label>
                            <select className="w-full bg-gray-800 p-2 rounded text-white" value={room} onChange={e=>setRoom(e.target.value)}>
                                {roomsArray.map(s=><option key={s} value={s}>{s}</option>)}
                                <option value="אחר">אחר (תחזוקה וכדומה)</option>
                            </select>
                            <Input label="שווה ערך למשחקים (לשכר)" type="number" value={games} onChange={e=>setGames(e.target.value)} required />
                            <Button type="submit" className="w-full">שלח לאישור</Button>
                        </form>
                    </Card>
                    <Card title="היסטוריה (כל הדיווחים לשכר)">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="opacity-70 border-b border-gray-700"><tr><th>תאריך</th><th>טווח שעות</th><th>חדר</th><th>כמות קבוצות</th><th>סטטוס</th><th>מחק</th></tr></thead>
                                <tbody className="divide-y divide-gray-800 text-dynamic opacity-90">
                                    {myShifts.map(s => {
                                        const endTime = addTime(s.startTime, s.gamesCount * 90);
                                        return (
                                        <tr key={s.id}>
                                            <td className="py-2">{formatDateIL(s.date)}</td>
                                            <td>{s.startTime} - {endTime}</td>
                                            <td>{s.room}</td>
                                            <td>{s.gamesCount}</td>
                                            <td><StatusBadge status={s.status || (s.approved ? 'approved' : 'pending')} /></td>
                                            <td><button onClick={() => del(s.id)} className="text-red-400"><Trash2 size={14}/></button></td>
                                        </tr>
                                    )})}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const EmployeeConstraints = ({ employee, constraints }) => {
            const [mode, setMode] = useState('single');
            const [date, setDate] = useState('');
            const [start, setStart] = useState('');
            const [end, setEnd] = useState('');
            const [sDate, setSDate] = useState('');
            const [eDate, setEDate] = useState('');
            const [note, setNote] = useState('');
            const [editId, setEditId] = useState(null);

            const submit = async (e) => {
                e.preventDefault();
                const data = { employeeId: employee.id, type: mode, note, status: 'pending' };
                if (mode === 'single') { data.date = date; data.startTime = start; data.endTime = end; }
                else { data.startDate = sDate; data.endDate = eDate; }
                
                if (editId) {
                    await updateDoc(getDocRef('constraints', editId), data);
                    setEditId(null);
                } else {
                    await addDoc(getCollectionRef('constraints'), data);
                }
                alert('נשמר'); setNote(''); setDate(''); setStart(''); setEnd('');
            };

            const del = async (id) => { if(confirm("למחוק אילוץ?")) await deleteDoc(getDocRef('constraints', id)); };
            const edit = (c) => {
                setEditId(c.id); setMode(c.type); setNote(c.note || '');
                if(c.type==='single'){ setDate(c.date); setStart(c.startTime); setEnd(c.endTime); }
                else { setSDate(c.startDate); setEDate(c.endDate); }
            };

            const myCons = constraints.filter(c => c.employeeId === employee.id).sort((a,b) => (a.date || a.startDate).localeCompare(b.date || b.startDate));

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title={editId ? "עריכת אילוץ" : "אילוץ חדש"}>
                        <div className="flex gap-2 mb-4"><button onClick={()=>setMode('single')} className={`flex-1 p-1 rounded ${mode==='single'?'bg-indigo-600 text-white':'text-dynamic card-bg'}`}>יום בודד</button><button onClick={()=>setMode('range')} className={`flex-1 p-1 rounded ${mode==='range'?'bg-indigo-600 text-white':'text-dynamic card-bg'}`}>חופשה</button></div>
                        <form onSubmit={submit} className="space-y-4">
                            {mode==='single' ? (
                                <>
                                    <Input label="תאריך" type="date" value={date} onChange={e=>setDate(e.target.value)} required/>
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <Input label="שעת התחלה" type="time" step="900" value={start} onChange={e=>setStart(e.target.value)} required/>
                                        </div>
                                        <div className="flex-1">
                                            <Input label="שעת סיום" type="time" step="900" value={end} onChange={e=>setEnd(e.target.value)} required/>
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <><Input label="מ" type="date" value={sDate} onChange={e=>setSDate(e.target.value)} required/><Input label="עד" type="date" value={eDate} onChange={e=>setEDate(e.target.value)} required/></>
                            )}
                            <Input label="מהות האילוץ" value={note} onChange={e=>setNote(e.target.value)} />
                            <div className="flex gap-2">
                                {editId && <Button type="button" variant="secondary" onClick={()=>{setEditId(null); setNote('');}} className="flex-1">ביטול</Button>}
                                <Button type="submit" className="flex-1">{editId ? 'עדכן' : 'שלח'}</Button>
                            </div>
                        </form>
                    </Card>
                    <Card title="האילוצים שלי">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="opacity-70 border-b border-gray-700"><tr><th>תאריך התחלה</th><th>תאריך סיום</th><th>שעות</th><th>מהות</th><th>סטטוס</th><th>פעולות</th></tr></thead>
                                <tbody className="divide-y divide-gray-800 text-dynamic opacity-90">
                                    {myCons.map(c => (
                                        <tr key={c.id}>
                                            <td className="py-2">{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td>
                                            <td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td>
                                            <td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td>
                                            <td>{c.note}</td>
                                            <td><StatusBadge status={c.status || 'pending'} /></td>
                                            <td className="flex gap-2 py-2">
                                                {c.status !== 'approved' && <button onClick={()=>edit(c)} className="text-indigo-400"><Edit2 size={14}/></button>}
                                                <button onClick={()=>del(c.id)} className="text-red-400"><Trash2 size={14}/></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const EmployeeProfile = ({ employee, shifts }) => {
            const [open, setOpen] = useState(false);
            const [sending, setSending] = useState(false);
            const month = new Date().toISOString().slice(0, 7);
            const myShifts = shifts.filter(s => s.employeeId === employee.id && s.date.startsWith(month));
            const wage = myShifts.reduce((acc, curr) => acc + (curr.gamesCount * employee.wagePerGame), 0);

            const request = async (e) => {
                e.preventDefault();
                setSending(true);
                const fd = new FormData(e.target);
                try {
                    await timeoutPromise(addDoc(getCollectionRef('requests'), {
                        employeeId: employee.id, status: 'pending', date: new Date().toISOString(),
                        newData: { phone: fd.get('phone'), email: fd.get('email'), address: fd.get('address'), birthday: fd.get('birthday') }
                    }), 3000);
                    alert('נשלח בהצלחה'); 
                    setOpen(false);
                } catch(e) {
                    if (e.message === 'Timeout') { alert('נשלח (איטי)'); setOpen(false); }
                    else alert(e.message);
                } finally { setSending(false); }
            };

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card>
                        <div className="text-center">
                            <h2 className="text-2xl font-bold text-dynamic">{employee.name}</h2>
                            <p className="text-indigo-400">{employee.skills.join(' • ')}</p>
                        </div>
                        <div className="mt-4 space-y-2 text-sm text-dynamic opacity-80">
                            <div>טלפון: {employee.phone}</div>
                            <div>מייל: {employee.email}</div>
                            <div>יום הולדת: {formatDateIL(employee.birthday)}</div>
                        </div>
                        <Button variant="outline" className="w-full mt-4" onClick={()=>setOpen(true)}>עדכון פרטים</Button>
                    </Card>
                    <Card title={`שכר משוער (${month})`}>
                        <div className="text-center py-8">
                            <div className="text-4xl font-bold text-green-400">₪{wage}</div>
                            <div className="text-gray-400 text-sm">{myShifts.length} משמרות</div>
                        </div>
                    </Card>
                    {open && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-900 p-6 rounded-xl w-full max-w-md">
                                <h3 className="text-xl font-bold mb-4">עדכון פרטים</h3>
                                <form onSubmit={request} className="space-y-4">
                                    <Input label="טלפון" name="phone" defaultValue={employee.phone} required />
                                    <Input label="מייל" name="email" defaultValue={employee.email} required />
                                    <Input label="כתובת" name="address" defaultValue={employee.address} required />
                                    <Input label="יום הולדת" name="birthday" type="date" defaultValue={employee.birthday} required />
                                    <div className="flex gap-2"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" className="flex-1" disabled={sending}>{sending ? 'שולח...' : 'שלח בקשה'}</Button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<GRoomApp />);
    </script>
</body>
</html>
```
