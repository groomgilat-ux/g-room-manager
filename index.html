            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);
            const submitIssue = async (e) => { e.preventDefault(); setSaving(true); try { await addDoc(getCollectionRef('issues'), { room, description: desc, reportedBy: 'admin', reportedByName: 'מנהל מערכת', status: 'pending', priority: 'רגילה', reportedAt: new Date().toISOString() }); alert('התקלה דווחה.'); setDesc(''); } catch(err) { alert(err.message); } finally { setSaving(false); } };
            const handlePriority = async (id, priority) => { await updateDoc(getDocRef('issues', id), { priority }); };
            const handleResolve = async (id) => { await updateDoc(getDocRef('issues', id), { status: 'done', resolvedAt: new Date().toISOString() }); };
            const getPriorityColor = (p) => p === 'דחופה' ? 'text-red-400 bg-red-400/10 border-red-400/30' : (p === 'רגילה' ? 'text-yellow-400 bg-yellow-400/10 border-yellow-400/30' : 'text-green-400 bg-green-400/10 border-green-400/30');

            return (
                <div className="space-y-6">
                    <Card title="דיווח על תקלה חדשה (מנהל)"><form onSubmit={submitIssue} className="flex gap-4 items-end"><div className="flex-1"><label className="text-sm opacity-70">חדר</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2" value={room} onChange={e=>setRoom(e.target.value)} required>{roomList.map(r=><option key={r} value={r}>{r}</option>)}</select></div><div className="flex-[3]"><label className="text-sm opacity-70">תיאור</label><input type="text" className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2" value={desc} onChange={e=>setDesc(e.target.value)} required placeholder="מה נשבר?"/></div><Button type="submit" disabled={saving}>{saving?'שולח...':'הוסף'}</Button></form></Card>
                    <Card title="תקלות בטיפול (פתוחות)"><div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="opacity-70 border-b border-gray-700"><tr><th>זמן</th><th>חדר</th><th>תיאור</th><th>מדווח</th><th>עדיפות</th><th>פעולות</th></tr></thead><tbody className="divide-y divide-gray-800">{pendingIssues.length===0 && <tr><td colSpan="6" className="text-center py-6 opacity-60">הכל תקין!</td></tr>}{pendingIssues.map(i => (<tr key={i.id} className="hover:bg-white/5"><td className="py-3 text-xs opacity-70">{formatDateTimeIL(i.reportedAt)}</td><td className="font-bold">{i.room}</td><td className="max-w-xs">{i.description}</td><td className="opacity-80">{i.reportedByName}</td><td><select className={`border rounded p-1 text-xs outline-none ${getPriorityColor(i.priority)}`} value={i.priority} onChange={(e)=>handlePriority(i.id, e.target.value)}><option value="נמוכה" className="bg-gray-800 text-white">נמוכה</option><option value="רגילה" className="bg-gray-800 text-white">רגילה</option><option value="דחופה" className="bg-gray-800 text-white">דחופה</option></select></td><td className="flex items-center gap-2 py-2"><Button size="sm" variant="success" onClick={()=>handleResolve(i.id)}>טופל <Check size={14}/></Button><button onClick={()=>confirm("למחוק דיווח?") && deleteDoc(getDocRef('issues', i.id))} className="text-red-400 p-2"><Trash2 size={16}/></button></td></tr>))}</tbody></table></div></Card>
                    <Card title="היסטוריית תקלות שטופלו"><div className="overflow-x-auto opacity-70"><table className="w-full text-right text-sm"><thead className="border-b border-gray-700"><tr><th>זמן דיווח</th><th>חדר</th><th>תיאור התקלה</th><th>מדווח</th><th>זמן טיפול סופי</th></tr></thead><tbody className="divide-y divide-gray-800">{doneIssues.length===0 && <tr><td colSpan="5" className="text-center py-4">אין תקלות.</td></tr>}{doneIssues.map(i => (<tr key={i.id}><td className="py-2 text-xs">{formatDateTimeIL(i.reportedAt)}</td><td>{i.room}</td><td className="line-through">{i.description}</td><td>{i.reportedByName}</td><td className="text-xs">{formatDateTimeIL(i.resolvedAt)}</td></tr>))}</tbody></table></div></Card>
                </div>
            );
        };

        const AdminEmployees = ({ employees }) => {
            const [open, setOpen] = useState(false); const [edit, setEdit] = useState(null); const [saving, setSaving] = useState(false);
            const save = async (e) => { e.preventDefault(); setSaving(true); const fd = new FormData(e.target); const d = { name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), code: fd.get('code'), address: fd.get('address'), birthday: fd.get('birthday'), wagePerGame: Number(fd.get('wagePerGame')), form101: fd.get('form101') === 'on', skills: fd.get('skills').split(',').map(s=>s.trim()) }; try { if(edit) await updateDoc(getDocRef('employees', edit.id), d); else await addDoc(getCollectionRef('employees'), d); setOpen(false); } catch(e) { alert(e.message); } finally { setSaving(false); } };
            return (<div className="space-y-6"><div className="flex justify-between"><h2 className="text-2xl font-bold">ניהול עובדים</h2><Button onClick={()=>{setEdit(null); setOpen(true);}}><Plus size={18}/> הוסף עובד</Button></div><div className="grid md:grid-cols-3 gap-4">{(employees||[]).map(e => (<Card key={e.id} className="relative group hover:border-indigo-500"><div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 flex gap-2"><button onClick={()=>{setEdit(e); setOpen(true);}} className="bg-gray-900 p-1 rounded text-indigo-400">ערוך</button><button onClick={()=>confirm("למחוק?") && deleteDoc(getDocRef('employees', e.id))} className="bg-gray-900 p-1 rounded text-red-400"><Trash2 size={16}/></button></div><h3 className="font-bold text-lg">{e.name}</h3><p className="text-sm opacity-70">{e.phone}</p><div className="mt-2 text-sm opacity-60"><div>קוד: {e.code}</div><div>תעריף: ₪{e.wagePerGame}</div></div></Card>))}</div>{open && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto"><h3 className="text-xl font-bold mb-4">{edit ? 'עריכה' : 'חדש'}</h3><form onSubmit={save} className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="שם" name="name" required defaultValue={edit?.name}/><Input label="טלפון" name="phone" required defaultValue={edit?.phone}/><Input label="מייל" name="email" type="email" required defaultValue={edit?.email}/><Input label="קוד" name="code" required defaultValue={edit?.code}/><Input label="כתובת" name="address" className="col-span-2" defaultValue={edit?.address}/><Input label="יום הולדת" name="birthday" type="date" defaultValue={edit?.birthday}/><Input label="שכר למשחק" name="wagePerGame" type="number" required defaultValue={edit?.wagePerGame}/><Input label="הסמכות (מופרד בפסיק)" name="skills" className="col-span-2" defaultValue={edit?.skills?.join(', ')}/></div><div className="flex gap-2"><input type="checkbox" name="form101" defaultChecked={edit?.form101}/> <label>טופס 101</label></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'שמור בענן'}</Button></div></form></div></div>}</div>);
        };

        const AdminTasks = ({ employees, tasks }) => {
            const [desc, setDesc] = useState(''); const [deadline, setDeadline] = useState(''); const [empId, setEmpId] = useState('');
            const addTask = async (e) => { e.preventDefault(); await addDoc(getCollectionRef('tasks'), { description: desc, deadline, assigneeId: empId, status: 'pending', createdAt: new Date().toISOString() }); alert('משימה נוספה'); setDesc(''); setDeadline(''); setEmpId(''); };
            const delTask = async (id) => { if(confirm("למחוק משימה?")) await deleteDoc(getDocRef('tasks', id)); };
            const pending = (tasks||[]).filter(t => t.status === 'pending'); const completed = (tasks||[]).filter(t => t.status === 'completed').sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0, 3);
            return (
                <div className="space-y-6">
                    <Card title="הוספת משימה חדשה"><form onSubmit={addTask} className="space-y-4"><Input label="תיאור המשימה" value={desc} onChange={e=>setDesc(e.target.value)} required /><div className="grid grid-cols-2 gap-4"><Input label="דדליין" type="date" value={deadline} onChange={e=>setDeadline(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">בחר עובד</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" required value={empId} onChange={e=>setEmpId(e.target.value)}><option value="">-- בחר --</option>{(employees||[]).map(e => <option key={e.id} value={e.id}>{e.name}</option>)}</select></div></div><Button type="submit">הוסף משימה</Button></form></Card>
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card title="ממתין לביצוע">{pending.length === 0 && <p className="text-gray-500">אין משימות</p>}{pending.map(t => { const emp = (employees||[]).find(e => e.id === t.assigneeId); return <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center"><div><div className="font-bold">{t.description}</div><div className="text-sm opacity-70">אחראי: {emp?.name} | יעד: {formatDateIL(t.deadline)}</div></div><button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button></div> })}</Card>
                        <Card title="היסטוריה (3 אחרונות)">{completed.length === 0 && <p className="text-gray-500">אין משימות</p>}{completed.map(t => { const emp = (employees||[]).find(e => e.id === t.assigneeId); return <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center"><div><div className="font-bold text-green-400 line-through">{t.description}</div><div className="text-sm opacity-70">בוצע ע"י: {emp?.name}</div></div><button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button></div> })}</Card>
                    </div>
                </div>
            );
        };

        const AdminRequests = ({ requests, employees }) => {
            const handle = async (req, status) => { try { if(status === 'approved') await updateDoc(getDocRef('employees', req.employeeId), req.newData); await updateDoc(getDocRef('requests', req.id), { status }); } catch(e) { alert(e.message); } };
            return (<div className="space-y-4"><h2 className="text-xl font-bold text-dynamic">בקשות עדכון</h2>{(!requests||requests.length===0) && <p className="text-gray-500">אין בקשות חדשות</p>}{(requests||[]).map(r => { const emp = (employees||[]).find(e => e.id === r.employeeId); return <Card key={r.id} className="border-r-4 border-yellow-500 flex justify-between items-start"><div><h3 className="font-bold text-lg mb-1">{emp?.name}</h3><div className="text-sm opacity-70 space-y-1"><p>טלפון: {r.newData.phone}</p><p>מייל: {r.newData.email}</p><p>כתובת: {r.newData.address}</p><p>יום הולדת: {formatDateIL(r.newData.birthday)}</p></div></div><div className="flex gap-2"><Button variant="success" onClick={()=>handle(r, 'approved')}><Check size={16}/></Button><Button variant="danger" onClick={()=>handle(r, 'rejected')}><XIcon size={16}/></Button></div></Card> })}</div>);
        };

        const AdminSettings = ({ settings }) => {
            const update = async (k, v) => await setDoc(getDocRef('app_settings', 'global'), { ...settings, [k]: v }, { merge: true });
            const handleTemplate = async (k, v) => await update('emailTemplate', { ...settings.emailTemplate, [k]: v });
            const handlePricing = async (k, v) => await update('pricing', { ...settings.pricing, [k]: Number(v) });
            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="מחירון והנחות"><div className="space-y-4"><h4 className="font-bold text-sm text-indigo-400">בסיס למשתתף</h4><div className="grid grid-cols-2 gap-2"><Input label="2 שחקנים" type="number" value={settings.pricing?.basePrice2} onChange={e => handlePricing('basePrice2', e.target.value)} /><Input label="3 שחקנים" type="number" value={settings.pricing?.basePrice3} onChange={e => handlePricing('basePrice3', e.target.value)} /><Input label="4 שחקנים" type="number" value={settings.pricing?.basePrice4} onChange={e => handlePricing('basePrice4', e.target.value)} /><Input label="5 שחקנים" type="number" value={settings.pricing?.basePrice5} onChange={e => handlePricing('basePrice5', e.target.value)} /><Input label="6-8 שחקנים" type="number" value={settings.pricing?.basePrice6to8} onChange={e => handlePricing('basePrice6to8', e.target.value)} /><Input label="9-10 שחקנים" type="number" value={settings.pricing?.basePrice9to10} onChange={e => handlePricing('basePrice9to10', e.target.value)} /></div><h4 className="font-bold text-sm text-indigo-400 mt-4">אחוזי הנחה</h4><div className="grid grid-cols-2 gap-2"><Input label="ילדים (%)" type="number" value={settings.pricing?.discountKids} onChange={e => handlePricing('discountKids', e.target.value)} /><Input label="זכאים (%)" type="number" value={settings.pricing?.discountEligible} onChange={e => handlePricing('discountEligible', e.target.value)} /></div></div></Card>
                    <div className="space-y-6"><Card title="כללי"><div className="space-y-4"><Input label="שם העסק" value={settings.businessName} onChange={e => update('businessName', e.target.value)} /><Input label="קוד כניסה למנהל" value={settings.adminCode} onChange={e => update('adminCode', e.target.value)} /><Input label="רשימת חדרים (מופרד בפסיק)" value={settings.roomsList} onChange={e => update('roomsList', e.target.value)} /></div></Card><Card title="עיצוב"><div className="space-y-4"><div className="space-y-1"><label className="text-sm opacity-70">צבע רקע (ראשי)</label><input type="color" value={settings.primaryColor} onChange={e => update('primaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div><div className="space-y-1"><label className="text-sm opacity-70">צבע טקסט (משני)</label><input type="color" value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div><div className="space-y-1"><label className="text-sm opacity-70">לוגו (URL)</label><input className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white" value={settings.logo || ''} onChange={e => update('logo', e.target.value)} /></div></div></Card></div>
                    <Card title="תבנית אימייל לשכר"><div className="space-y-4"><Input label="נושא" value={settings.emailTemplate?.subject||''} onChange={e => handleTemplate('subject', e.target.value)} /><div className="space-y-1"><label className="text-sm opacity-70">תוכן (משתנים: {`{name}, {month}, {year}`})</label><textarea className="w-full bg-gray-800 border border-gray-700 rounded p-2 h-32 text-white" value={settings.emailTemplate?.body||''} onChange={e => handleTemplate('body', e.target.value)} /></div><Input label="מייל העסק" value={settings.senderEmail||''} onChange={e => update('senderEmail', e.target.value)} /></div></Card>
                </div>
            );
        };

        const AdminDashboard = ({ data, settings }) => {
            const [tab, setTab] = useState('groups');
            const pendingReq = (data.requests || []).filter(r => r.status === 'pending');
            const pendingCons = (data.constraints || []).filter(c => c.status === 'pending');
            const pendingShifts = (data.shifts || []).filter(s => s.status === 'pending');
            const pendingIssues = (data.issues || []).filter(i => i.status === 'pending');
            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap gap-2 border-b border-dynamic pb-2">
                        {[{id:'groups', l:'הכנסות', i:Coins}, {id:'expenses', l:'דוח פיננסי', i:LineChart}, {id:'employees', l:'עובדים', i:Users}, {id:'shifts', l:'דוחות שכר', i:FileText}, {id:'constraints', l:'זמינות', i:Calendar}, {id:'issues', l:'תקלות', i:Wrench}, {id:'tasks', l:'משימות', i:CheckSquare}, {id:'settings', l:'הגדרות', i:Settings}].map(m => 
                            <button key={m.id} onClick={()=>setTab(m.id)} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg transition-colors ${tab===m.id ? 'bg-indigo-600/10 text-indigo-400 border-b-2 border-indigo-500' : 'opacity-70 hover:opacity-100'}`}>
                                <m.i size={18} /> {m.l} 
                                {m.id === 'constraints' && pendingCons.length > 0 && <span className="bg-yellow-500 text-black text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingCons.length}</span>}
                                {m.id === 'shifts' && pendingShifts.length > 0 && <span className="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingShifts.length}</span>}
                                {m.id === 'issues' && pendingIssues.length > 0 && <span className="bg-orange-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingIssues.length}</span>}
                            </button>
                        )}
                        {pendingReq.length > 0 && <button onClick={()=>setTab('requests')} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg ml-auto transition-colors ${tab==='requests'?'bg-indigo-600/10 border-b-2 border-indigo-500':'text-yellow-400'}`}><Bell size={18} className="animate-bounce"/><span className="font-bold">{pendingReq.length}</span></button>}
                    </div>
                    <div className="fade-in">
                        {tab==='groups' && <AdminGroups groups={data.groups||[]} employees={data.employees||[]} settings={settings} shifts={data.shifts||[]} />}
                        {tab==='expenses' && <AdminExpenses expenses={data.expenses||[]} groups={data.groups||[]} shifts={data.shifts||[]} employees={data.employees||[]} />}
                        {tab==='employees' && <AdminEmployees employees={data.employees||[]}/>}
                        {tab==='shifts' && <AdminReports employees={data.employees||[]} shifts={data.shifts||[]} settings={settings}/>}
                        {tab==='constraints' && <AdminConstraints employees={data.employees||[]} constraints={data.constraints||[]} settings={settings} assignments={data.assignments||[]}/>}
                        {tab==='issues' && <AdminIssues issues={data.issues||[]} employees={data.employees||[]} settings={settings}/>}
                        {tab==='tasks' && <AdminTasks employees={data.employees||[]} tasks={data.tasks||[]}/>}
                        {tab==='settings' && <AdminSettings settings={settings}/>}
                        {tab==='requests' && <AdminRequests requests={pendingReq} employees={data.employees||[]}/>}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<GRoomApp />);
    </script>
</body>
</html>
