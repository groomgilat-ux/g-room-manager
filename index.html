<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Room Manager ERP</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for Modules -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>

    <style>
        :root {
            --app-bg: #030712;
            --app-text: #ffffff;
            --app-card-bg: rgba(255, 255, 255, 0.05);
            --app-border: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--app-bg); color: var(--app-text); font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        .card-bg { background-color: var(--app-card-bg); border: 1px solid var(--app-border); }
        .text-dynamic { color: var(--app-text) !important; }
        .border-dynamic { border-color: var(--app-border) !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input[type="date"], input[type="month"], input[type="time"], select { color-scheme: dark; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            User, Users, Calendar, DollarSign, Settings, LogOut, Plus, Clock, 
            FileText, Mail, CheckCircle, XCircle, Lock, AlertTriangle, Activity,
            X as XIcon, Edit2, CheckSquare, Coins, LineChart, Receipt, Download, Trash2, Check, ChevronRight, ChevronLeft, Loader, Bell, Wrench, History, MessageCircle
        } from 'lucide-react';

        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from 'firebase/firestore';

        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBvayS247KEOVqZloFrNWV3svg4DSiNG08",
            authDomain: "g-room-escape-room-management.firebaseapp.com",
            projectId: "g-room-escape-room-management",
            storageBucket: "g-room-escape-room-management.firebasestorage.app",
            messagingSenderId: "361117379721",
            appId: "1:361117379721:web:3019eaeb30f4fe188caa58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, 'groom');
        
        // --- Endpoints ---
        const TOR4YOU_FUNCTION_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net/getTor4YouAppts";
        const TOR4YOU_DELETE_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net/deleteTor4YouSlots";
        const TOR4YOU_WEEK_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net/getTor4YouWeekSlots";
        const TOR4YOU_ADD_APPT_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net/addTor4YouAppointment";

        const getCollectionRef = (name) => collection(db, name);
        const getDocRef = (name, id) => doc(db, name, id);

        const INITIAL_SETTINGS_FALLBACK = {
            businessName: 'G-Room Escape',
            senderEmail: 'manager@g-room.co.il',
            adminCode: 'admin123',
            logo: null,
            primaryColor: '#030712', 
            secondaryColor: '#ffffff',
            roomsList: 'סודו של הודיני',
            pricing: { basePrice2: 140, basePrice3: 125, basePrice4: 110, basePrice5: 100, basePrice6to8: 90, basePrice9to10: 80, discountKids: 15, discountEligible: 10 },
            emailTemplate: { subject: 'G-Room: תלוש שכר {month}/{year}', body: 'היי {name},\nמצורף תלוש.\nבברכה,\nהנהלת G-Room' }
        };

        // --- Utilities ---
        const formatDateIL = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return isNaN(d) ? '' : d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' });
        };
        const formatDateTimeIL = (isoStr) => {
            if(!isoStr) return '';
            const d = new Date(isoStr);
            return isNaN(d) ? '' : d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
        };
        
        const addTime = (timeStr, minutesToAdd) => {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, minutes + minutesToAdd);
            return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
        };

        const generateTimeOptions = () => {
            const options = [];
            for (let i = 0; i < 24; i++) {
                for (let j = 0; j < 60; j += 15) { options.push(`${i.toString().padStart(2, '0')}:${j.toString().padStart(2, '0')}`); }
            }
            return options;
        };

        const getBasePrice = (playersStr, pricing) => {
            const p = Number(playersStr) || 0;
            if (p <= 2) return Number(pricing?.basePrice2) || 140;
            if (p === 3) return Number(pricing?.basePrice3) || 125;
            if (p === 4) return Number(pricing?.basePrice4) || 110;
            if (p === 5) return Number(pricing?.basePrice5) || 100;
            if (p >= 6 && p <= 8) return Number(pricing?.basePrice6to8) || 90;
            if (p >= 9) return Number(pricing?.basePrice9to10) || 80;
            return 0;
        };

        const getMonthsDifference = (startMonthStr, endMonthStr) => {
            if(!startMonthStr || !endMonthStr) return 1;
            const d1 = new Date(startMonthStr + '-01');
            const d2 = new Date(endMonthStr + '-01');
            let months = (d2.getFullYear() - d1.getFullYear()) * 12;
            months -= d1.getMonth();
            months += d2.getMonth();
            return months <= 0 ? 1 : months + 1;
        };

        const isMonthInRange = (targetMonth, startMonth, endMonth) => {
            return targetMonth >= startMonth && targetMonth <= endMonth;
        };

        const exportToXLS = (htmlTable, filename) => {
            let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><table>${htmlTable}</table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const exportToXLSSalary = (salaryReport, filename) => {
            let tableRows = '';
            salaryReport.forEach(emp => {
                if (emp.empShifts && emp.empShifts.length > 0) {
                    tableRows += `<tr><td colspan="7" style="background-color:#e0e7ff;font-weight:bold;text-align:center;">${emp.name}</td></tr>
                    <tr style="background-color:#f3f4f6;font-weight:bold;"><td>תאריך</td><td>התחלה</td><td>סיום (משוער)</td><td>חדר</td><td>משחקים</td><td>תעריף משומר</td><td>סה"כ</td></tr>`;
                    emp.empShifts.forEach(s => {
                        const endTime = addTime(s.startTime, s.gamesCount * 90); 
                        const shiftWage = s.gamesCount * (s.wageAtTime || emp.wagePerGame || 0);
                        tableRows += `<tr><td>${formatDateIL(s.date)}</td><td>${s.startTime}</td><td>${endTime}</td><td>${s.room}</td><td>${s.gamesCount}</td><td>₪${s.wageAtTime || emp.wagePerGame || 0}</td><td>₪${shiftWage}</td></tr>`;
                    });
                    tableRows += `<tr><td colspan="6" style="font-weight:bold;">סה"כ לתשלום:</td><td style="font-weight:bold;background-color:#dcfce7;">₪${emp.totalWage}</td></tr><tr><td colspan="7"></td></tr>`;
                }
            });
            exportToXLS(tableRows, filename);
        };

        const exportToXLSGroups = (groups, employees, shifts, filename) => {
            let tableRows = `<tr style="background-color:#bae6fd;font-weight:bold;">
                <td>#</td><td>תאריך</td><td>שעה</td><td>שם החדר</td><td>שם הלקוח</td><td>כמות השחקנים</td>
                <td>סוג השחקנים<br>(משפחה, בני זוג, חברים, צוות עבודה)</td><td>כיצד הגיעו אלינו?<br>(גוגל, פייסבוק, שלט, מפה לאוזן)</td>
                <td>סכום לתשלום<br>(לפני הנחה)</td><td>סוג ההנחה</td><td>אחוז הנחה</td><td>סך תשלום בקופה<br>(אחרי הנחה)</td>
                <td>מזומן</td><td>אשראי</td><td>ביט</td><td>העברה בנקאית</td><td>שובר מגה לאן (קוד)</td><td>מפעיל/ה</td>
            </tr>`;
            
            let sumCash = 0, sumCredit = 0, sumBit = 0, sumTransfer = 0, sumMega = 0, sumGross = 0;

            groups.forEach((g, index) => {
                const empName = g.employeeId === 'admin' ? 'מנהל מערכת' : ((employees||[]).find(e => e.id === g.employeeId)?.name || 'לא ידוע');
                let discountType = '';
                if(g.hasMegaLaan) discountType = 'מגה לאן';
                else if (g.kids > 0 && g.eligible > 0) discountType = 'ילדים + זכאים';
                else if (g.kids > 0) discountType = 'ילדים';
                else if (g.eligible > 0) discountType = 'זכאים';
                
                let discountPercent = '';
                if(g.hasMegaLaan) discountPercent = '22%';
                else if (g.totalDiscountAmount > 0) {
                    discountPercent = Math.round((g.totalDiscountAmount / g.totalOriginalPrice) * 100) + '%';
                }

                const megaLaanInfo = g.hasMegaLaan ? `שובר על ${g.megaLaanPlayers} שחקנים (${g.megaLaanCode})` : '';

                sumCash += Number(g.payments?.cash) || 0;
                sumCredit += Number(g.payments?.credit) || 0;
                sumBit += Number(g.payments?.bit) || 0;
                sumTransfer += Number(g.payments?.transfer) || 0;
                sumMega += Number(g.expectedMegaLaanRevenue) || 0;
                sumGross += Number(g.finalPriceToPay) + (Number(g.expectedMegaLaanRevenue) || 0);

                tableRows += `<tr>
                    <td>${index + 1}</td>
                    <td>${formatDateIL(g.date)}</td>
                    <td>${g.time}</td>
                    <td>${g.room}</td>
                    <td>${g.customerName}</td>
                    <td>${g.totalPlayers}</td>
                    <td>${g.groupType}</td>
                    <td>${g.source}</td>
                    <td>₪${g.totalOriginalPrice}</td>
                    <td>${discountType}</td>
                    <td>${discountPercent}</td>
                    <td>₪${g.finalPriceToPay}</td>
                    <td>₪${g.payments?.cash || 0}</td>
                    <td>₪${g.payments?.credit || 0}</td>
                    <td>₪${g.payments?.bit || 0}</td>
                    <td>₪${g.payments?.transfer || 0}</td>
                    <td>${megaLaanInfo}</td>
                    <td>${empName}</td>
                </tr>`;
            });

            let totalSalaries = 0;
            const monthPrefix = groups.length > 0 ? (groups[0].date||'').substring(0, 7) : new Date().toISOString().substring(0,7);
            const monthlyShifts = shifts.filter(s => (s.date||'').startsWith(monthPrefix) && s.status !== 'rejected');
            
            monthlyShifts.forEach(s => {
                const emp = (employees||[]).find(e => e.id === s.employeeId);
                const w = s.wageAtTime || emp?.wagePerGame || 0;
                totalSalaries += (Number(s.gamesCount) * w);
            });

            const netIncome = sumGross - totalSalaries;

            tableRows += `<tr><td colspan="18" style="background-color:#e2e8f0; height:15px;"></td></tr>`;
            tableRows += `<tr style="font-weight:bold; background-color:#fef08a;"><td colspan="12">סיכום הכנסות - אמצעי תשלום</td><td>מזומן: ₪${sumCash}</td><td>אשראי: ₪${sumCredit}</td><td>ביט: ₪${sumBit}</td><td>העברה: ₪${sumTransfer}</td><td>מגה לאן: ₪${sumMega}</td><td></td></tr>`;
            tableRows += `<tr style="font-weight:bold; background-color:#bbf7d0;"><td colspan="17">סה"כ הכנסות ברוטו (כולל שווי מגה לאן)</td><td style="text-align:left; font-size:14px;">₪${sumGross}</td></tr>`;
            tableRows += `<tr style="font-weight:bold; background-color:#fecaca;"><td colspan="17">סה"כ הוצאות שכר עובדים (משוער לחודש זה)</td><td style="text-align:left; font-size:14px;">₪${totalSalaries}</td></tr>`;
            tableRows += `<tr style="font-weight:bold; background-color:#86efac; font-size:15px;"><td colspan="17">רווח נקי (הכנסות פחות שכר עובדים)</td><td style="text-align:left; font-size:15px;">₪${netIncome}</td></tr>`;

            exportToXLS(tableRows, filename);
        };

        const timeoutPromise = (promise, ms = 5000) => Promise.race([
            promise, 
            new Promise((_, r) => setTimeout(() => r(new Error("Timeout")), ms))
        ]);

        // --- UI Components ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled, ...props }) => {
            const v = { primary: "bg-indigo-600 hover:bg-indigo-700 text-white", secondary: "bg-gray-700 hover:bg-gray-600 text-gray-100", danger: "bg-red-600 hover:bg-red-700 text-white", success: "bg-green-600 hover:bg-green-700 text-white", outline: "border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20" };
            return <button onClick={onClick} className={`px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 shadow-md transition-all disabled:opacity-50 ${v[variant]} ${className}`} disabled={disabled} {...props}>{children}</button>;
        };

        const Card = ({ title, children, className = '' }) => (
            <div className={`card-bg rounded-xl p-6 shadow-xl ${className}`}>
                {title && <h3 className="text-xl font-bold text-dynamic mb-4 border-b border-gray-700 pb-2">{title}</h3>}
                <div className="text-dynamic">{children}</div>
            </div>
        );

        const Input = ({ label, type = "text", value, onChange, className = "", ...props }) => (
            <div className={`flex flex-col gap-1 ${className}`}>
                {label && <label className="text-sm opacity-70 font-medium text-dynamic">{label}</label>}
                <input type={type} value={value} onChange={onChange} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" {...props} />
            </div>
        );

        const StatusBadge = ({ status }) => {
            if (status === 'approved') return <span className="text-green-400 flex items-center gap-1 text-xs"><CheckCircle size={14}/> אושר</span>;
            if (status === 'rejected') return <span className="text-red-400 flex items-center gap-1 text-xs"><XCircle size={14}/> נדחה</span>;
            return <span className="text-yellow-400 flex items-center gap-1 text-xs"><Clock size={14}/> ממתין</span>;
        };

        // --- Main App ---
        function GRoomApp() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [data, setData] = useState({ employees: [], shifts: [], constraints: [], requests: [], tasks: [], groups: [], expenses: [], issues: [], assignments: [] });
            const [settings, setSettings] = useState(INITIAL_SETTINGS_FALLBACK);
            const [loading, setLoading] = useState(true);
            const [login, setLogin] = useState({ code: '', empId: '' });
            const [dbConn, setDbConn] = useState(false);

            useEffect(() => {
                const init = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                init();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const unsub = [
                    onSnapshot(getCollectionRef('employees'), s => { setData(p => ({...p, employees: s.docs.map(d => ({id: d.id, ...d.data()}))})); setDbConn(true); }, e => setDbConn(false)),
                    onSnapshot(getCollectionRef('shifts'), s => setData(p => ({...p, shifts: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('constraints'), s => setData(p => ({...p, constraints: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('requests'), s => setData(p => ({...p, requests: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('tasks'), s => setData(p => ({...p, tasks: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('groups'), s => setData(p => ({...p, groups: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('expenses'), s => setData(p => ({...p, expenses: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('issues'), s => setData(p => ({...p, issues: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('assignments'), s => setData(p => ({...p, assignments: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('app_settings'), s => {
                        if (!s.empty) {
                            const d = s.docs.find(doc => doc.id === 'global') || s.docs[0];
                            if (d) setSettings(prev => ({...prev, ...d.data()}));
                        }
                        setLoading(false);
                    })
                ];
                return () => unsub.forEach(u => u());
            }, [user]);

            useEffect(() => {
                const r = document.documentElement.style;
                r.setProperty('--app-bg', settings.primaryColor || '#030712');
                r.setProperty('--app-text', settings.secondaryColor || '#ffffff');
                const isLight = settings.primaryColor === '#ffffff' || settings.primaryColor === '#f3f4f6';
                r.setProperty('--app-card-bg', isLight ? '#e5e7eb' : 'rgba(255, 255, 255, 0.05)');
                r.setProperty('--app-border', isLight ? '#d1d5db' : 'rgba(255, 255, 255, 0.1)');
            }, [settings]);

            const doLogin = () => {
                if ((login.empId === 'admin' && login.code === settings.adminCode) || (login.empId === 'admin' && (data.employees||[]).length === 0 && login.code === 'admin123')) {
                    setCurrentUser({ role: 'admin', name: 'מנהל המערכת', id: 'admin' });
                } else {
                    const emp = (data.employees||[]).find(e => e.id === login.empId);
                    if (emp && emp.code === login.code) setCurrentUser({ role: 'employee', data: emp, id: emp.id, name: emp.name });
                    else alert("פרטי התחברות שגויים");
                }
            };

            if (loading) return <div className="min-h-screen bg-gray-950 flex items-center justify-center text-indigo-500"><Loader className="animate-spin w-10 h-10" /></div>;

            if (!currentUser) return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full card-bg p-8 rounded-2xl text-center relative shadow-2xl">
                        <div className={`absolute top-4 right-4 w-3 h-3 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
                        <div className="mb-8">
                            {settings.logo ? <img src={settings.logo} className="h-24 mx-auto mb-4 object-contain"/> : <div className="h-24 w-24 bg-indigo-900/50 rounded-full mx-auto flex items-center justify-center mb-4"><Lock size={40} className="text-indigo-400"/></div>}
                            <h1 className="text-3xl font-bold text-dynamic">{settings.businessName}</h1>
                            <p className="opacity-60 text-sm mt-2">מערכת ניהול ERP</p>
                        </div>
                        <div className="space-y-4">
                            <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500" value={login.empId} onChange={e => setLogin({...login, empId: e.target.value})}>
                                <option value="">-- בחר משתמש --</option>
                                <option value="admin">🔒 מנהל מערכת</option>
                                {(data.employees || []).map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                            </select>
                            <input type="password" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-center tracking-widest outline-none focus:ring-2 focus:ring-indigo-500" value={login.code} onChange={e => setLogin({...login, code: e.target.value})} onKeyDown={e => e.key === 'Enter' && doLogin()} placeholder="****" />
                            <Button onClick={doLogin} className="w-full py-3 text-lg font-bold">כניסה</Button>
                        </div>
                        <div className="mt-6 text-[10px] opacity-40 text-dynamic">גרסה 8.4 - עיגול מחירים, וואטסאפ והזמנה חכמה</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen font-sans flex flex-col">
                    <header className="card-bg border-b border-dynamic sticky top-0 z-50 h-16 flex items-center justify-between px-6 shadow-sm">
                        <div className="flex items-center gap-3">
                            {settings.logo && <img src={settings.logo} className="h-8 w-8 rounded object-cover"/>}
                            <span className="font-bold text-xl text-dynamic hidden sm:block">{settings.businessName}</span>
                            <span className="text-xs bg-indigo-900/50 text-indigo-200 px-3 py-1 rounded-full border border-indigo-500/30 flex items-center gap-2">
                                {currentUser.role === 'admin' ? 'מנהל מערכת' : `שלום, ${currentUser.name}`}
                                <div className={`w-2 h-2 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500'}`}></div>
                            </span>
                        </div>
                        <Button variant="ghost" onClick={() => {setCurrentUser(null); setLogin({code:'', empId:''});}} className="text-red-400 hover:bg-red-900/20"><LogOut size={18} /> <span className="hidden sm:inline">יציאה</span></Button>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        {currentUser.role === 'admin' ? 
                            <AdminDashboard data={data} settings={settings} /> : 
                            <EmployeeDashboard employee={currentUser} data={data} settings={settings} />
                        }
                    </main>
                </div>
            );
        }

        // --- Modals ---
        const AddAppointmentModal = ({ slotData, onClose, onRefresh }) => {
            const [first, setFirst] = useState(''); const [last, setLast] = useState(''); const [cell, setCell] = useState(''); const [parts, setParts] = useState(2); const [saving, setSaving] = useState(false);
            const handleAdd = async (e) => {

            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-sm border border-gray-700 shadow-2xl" onClick={e=>e.stopPropagation()}><h3 className="text-xl font-bold mb-4 border-b border-gray-700 pb-2">הזמנת תור חדש</h3><div className="text-sm opacity-80 mb-4 bg-gray-800 p-2 rounded">קביעת תור ליום {formatDateIL(slotData.dateStr)} בשעה {slotData.time}</div><form onSubmit={handleAdd} className="space-y-3"><Input label="שם פרטי" value={first} onChange={e=>setFirst(e.target.value)} required /><Input label="שם משפחה" value={last} onChange={e=>setLast(e.target.value)} /><Input label="טלפון נייד" type="tel" value={cell} onChange={e=>setCell(e.target.value)} required /><Input label="כמות שחקנים" type="number" min="2" value={parts} onChange={e=>setParts(e.target.value)} required /><div className="flex gap-2 pt-2"><Button type="button" variant="secondary" onClick={onClose} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving ? 'שומר...' : 'הזמן תור'}</Button></div></form></div></div>);
        };

        const AssignModal = ({ slotData, onClose, employees, settings }) => {
            const [selectedEmp, setSelectedEmp] = useState(''); const [saving, setSaving] = useState(false);
            const roomName = (settings.roomsList || 'סודו של הודיני').split(',')[0].trim();
            const handleAssign = async () => {
                if(!selectedEmp) return alert('בחר עובד לשיוך');
                setSaving(true);
                try {
                    const assignId = `${slotData.dateStr}_${slotData.time.replace(':','')}`;
                    await setDoc(getDocRef('assignments', assignId), { date: slotData.dateStr, time: slotData.time, customerName: slotData.customerName, customerPhone: slotData.customerPhone, employeeId: selectedEmp, room: roomName });
                    alert('התור שויך בהצלחה!'); onClose();
                } catch(e) { alert(e.message); setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-sm border border-gray-700 shadow-2xl" onClick={e=>e.stopPropagation()}><h3 className="text-xl font-bold mb-4 border-b border-gray-700 pb-2">שיוך תור למפעיל</h3><div className="text-sm opacity-80 mb-4 space-y-1"><div><strong>זמן:</strong> {formatDateIL(slotData.dateStr)} בשעה {slotData.time}</div><div><strong>לקוח:</strong> {slotData.customerName}</div><div><strong>טלפון:</strong> {slotData.customerPhone || 'אין'}</div></div><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white mb-4" value={selectedEmp} onChange={e=>setSelectedEmp(e.target.value)}><option value="">-- בחר מי יפעיל --</option><option value="admin">מנהל מערכת</option>{employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select><div className="flex gap-2"><Button variant="secondary" onClick={onClose} className="flex-1">ביטול</Button><Button onClick={handleAssign} disabled={saving} className="flex-1">{saving?'שומר...':'שייך מפעיל'}</Button></div></div></div>);
        };

        const EditGroupModal = ({ group, onClose, employees }) => {
            const [pays, setPays] = useState(group.payments || {cash:0, credit:0, bit:0, transfer:0}); const [inv, setInv] = useState(group.invoiceNumber || ''); const [saving, setSaving] = useState(false);
            const empName = group.employeeId === 'admin' ? 'מנהל' : ((employees||[]).find(e => e.id === group.employeeId)?.name || 'לא ידוע');
            const totalEntered = (Number(pays.cash)||0) + (Number(pays.credit)||0) + (Number(pays.bit)||0) + (Number(pays.transfer)||0);
            const balance = group.finalPriceToPay - totalEntered;

            const handleSave = async () => {
                if (balance !== 0) return alert(`פער בתשלום! סה"כ העסקה: ₪${group.finalPriceToPay}. הוזן: ₪${totalEntered}`);
                setSaving(true);
                try { await updateDoc(getDocRef('groups', group.id), { payments: { cash: Number(pays.cash)||0, credit: Number(pays.credit)||0, bit: Number(pays.bit)||0, transfer: Number(pays.transfer)||0 }, invoiceNumber: inv }); onClose(); } catch(e) { alert(e.message); setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-xl border border-gray-700 shadow-2xl max-h-[95vh] overflow-y-auto" onClick={e=>e.stopPropagation()}><div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-3"><h3 className="text-xl font-bold">פרטי דיווח - {group.customerName}</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><XIcon size={20}/></button></div><div className="grid grid-cols-2 gap-y-3 gap-x-4 text-sm mb-4 bg-gray-800/50 p-4 rounded-lg"><div><span className="opacity-60">תאריך ושעה:</span> <strong className="float-left">{formatDateIL(group.date)} {group.time}</strong></div><div><span className="opacity-60">חדר:</span> <strong className="float-left">{group.room}</strong></div><div><span className="opacity-60">שחקנים:</span> <strong className="float-left">{group.totalPlayers}</strong></div><div><span className="opacity-60">מפעיל:</span> <strong className="float-left">{empName}</strong></div><div><span className="opacity-60">הרכב קבוצה:</span> <strong className="float-left">{group.groupType}</strong></div><div><span className="opacity-60">מקור הגעה:</span> <strong className="float-left">{group.source}</strong></div></div><div className="bg-gray-800 p-4 rounded-lg mb-6 shadow-inner"><h4 className="font-bold border-b border-gray-700 pb-2 mb-3 text-indigo-400 flex items-center gap-2"><DollarSign size={16}/> תחשיב העסקה</h4><div className="space-y-2"><div className="flex justify-between text-sm"><span>מחיר בסיס:</span> <span>₪{group.totalOriginalPrice}</span></div>{!group.hasMegaLaan && group.totalDiscountAmount > 0 && <div className="flex justify-between text-sm text-red-400"><span>הנחות:</span> <span>-₪{group.totalDiscountAmount}</span></div>}{group.hasMegaLaan && <div className="flex justify-between text-sm text-blue-400"><span>שובר מגה לאן:</span> <span>₪{group.expectedMegaLaanRevenue} (צפי)</span></div>}{group.hasMegaLaan && group.isWeekendMegaLaan && <div className="flex justify-between text-sm text-yellow-400"><span>תוספת סופ"ש:</span> <span>₪{group.megaLaanPlayers * 10}</span></div>}<div className="flex justify-between text-lg font-bold border-t border-gray-700 pt-2 mt-2"><span>סה"כ לתשלום בקופה:</span> <span className="text-green-400">₪{group.finalPriceToPay}</span></div></div></div><div className="border-t border-gray-800 pt-4"><h4 className="font-bold mb-3 flex items-center gap-2"><Edit2 size={16}/> עריכת תשלום</h4><Input label="מספר חשבונית/קבלה" value={inv} onChange={e=>setInv(e.target.value)} className="mb-4" /><div className="grid grid-cols-2 gap-3"><Input label="מזומן" type="number" step="any" value={pays.cash} onChange={e=>setPays({...pays, cash: e.target.value})} /><Input label="אשראי" type="number" step="any" value={pays.credit} onChange={e=>setPays({...pays, credit: e.target.value})} /><Input label="ביט" type="number" step="any" value={pays.bit} onChange={e=>setPays({...pays, bit: e.target.value})} /><Input label="העברה" type="number" step="any" value={pays.transfer} onChange={e=>setPays({...pays, transfer: e.target.value})} /></div>{balance !== 0 && <div className="text-red-400 text-sm font-bold text-center mt-3 bg-red-900/20 p-2 rounded">יתרת פער: ₪{balance}</div>}<Button onClick={handleSave} className="w-full mt-4" disabled={saving || balance !== 0}>{saving ? 'מעדכן...' : 'שמור שינויים'}</Button></div></div></div>);
        };

        const EditExpenseModal = ({ expense, onClose, expenses }) => {
            const [expName, setExpName] = useState(expense.name); const [expCategory, setExpCategory] = useState(expense.category); const [customCat, setCustomCat] = useState(''); const [expAmount, setExpAmount] = useState(expense.totalAmount); const [expFrom, setExpFrom] = useState(expense.fromMonth); const [expTo, setExpTo] = useState(expense.toMonth); const [expInv, setExpInvoice] = useState(expense.invoiceNumber || ''); const [saving, setSaving] = useState(false);
            const dynamicCats = [...new Set(['שכירות','חשמל','מים','ארנונה','שיווק ופרסום','תחזוקה וציוד','ביטוח','תוכנה ודיגיטל', ...expenses.map(e=>e.category)])].filter(Boolean);
            const handleSave = async (e) => {
                e.preventDefault(); if (expFrom > expTo) return alert('חודש סיום קטן מהתחלה');
                const cat = expCategory === 'אחר' ? customCat : expCategory; if (!cat) return alert('נא להזין קטגוריה');
                setSaving(true); const ratio = Number(expAmount) / getMonthsDifference(expFrom, expTo);
                try { await updateDoc(getDocRef('expenses', expense.id), { name: expName, category: cat, totalAmount: Number(expAmount), fromMonth: expFrom, toMonth: expTo, monthlyAmount: ratio, invoiceNumber: expInv }); onClose(); } catch(err) { alert(err.message); setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700 shadow-2xl" onClick={e=>e.stopPropagation()}><div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-3"><h3 className="text-xl font-bold">עריכת הוצאה</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><XIcon size={20}/></button></div><form onSubmit={handleSave} className="space-y-4"><Input label="שם ההוצאה" value={expName} onChange={e=>setExpName(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">קטגוריה</label><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={expCategory} onChange={e=>setExpCategory(e.target.value)}>{dynamicCats.map(c=><option key={c} value={c}>{c}</option>)}<option value="אחר">אחר...</option></select></div>{expCategory==='אחר' && <Input label="קטגוריה חדשה" value={customCat} onChange={e=>setCustomCat(e.target.value)} required />}<Input label="מספר חשבונית/קבלה" value={expInv} onChange={e=>setExpInvoice(e.target.value)} /><Input label="סכום כולל (₪)" type="number" step="any" min="0" value={expAmount} onChange={e=>setExpAmount(e.target.value)} required /><div className="grid grid-cols-2 gap-4"><Input label="מחודש" type="month" value={expFrom} onChange={e=>setExpFrom(e.target.value)} required /><Input label="עד חודש" type="month" value={expTo} onChange={e=>setExpTo(e.target.value)} required /></div><Button type="submit" disabled={saving} className="w-full mt-4">{saving?'מעדכן...':'שמור שינויים'}</Button></form></div></div>);
        };

        const GroupReportForm = ({ employeeId, settings, onSave, isAdmin, employees }) => {
            const [date, setDate] = useState(new Date().toISOString().slice(0, 10)); const [time, setTime] = useState('10:00'); const [room, setRoom] = useState(''); const [customerName, setCustomerName] = useState(''); const [totalPlayers, setTotalPlayers] = useState(2); const [groupType, setGroupType] = useState(''); const [source, setSource] = useState(''); const [kids, setKids] = useState(0); const [eligible, setEligible] = useState(0); const [hasMegaLaan, setHasMegaLaan] = useState(false); const [megaLaanPlayers, setMegaLaanPlayers] = useState(0); const [megaLaanCode, setMegaLaanCode] = useState(''); const [isWeekendMegaLaan, setIsWeekendMegaLaan] = useState(false); const [payments, setPayments] = useState({ cash: '', credit: '', bit: '', transfer: '' }); const [invoiceNumber, setInvoiceNumber] = useState(''); const [saving, setSaving] = useState(false); const [attemptedSubmit, setAttemptedSubmit] = useState(false); const [reportEmpId, setReportEmpId] = useState(employeeId); const [fetchedCustomers, setFetchedCustomers] = useState([]); const [isManualCustomer, setIsManualCustomer] = useState(true); const [loadingCustomers, setLoadingCustomers] = useState(false); const [tor4youError, setTor4youError] = useState(null); 
            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);
            useEffect(() => {
                const fetchAppts = async () => {
                    setLoadingCustomers(true); setTor4youError(null);
                    try {
                        const res = await fetch(`${TOR4YOU_FUNCTION_URL}?date=${date}`);
                        if(res.ok) {
                            const data = await res.json();
                            if(data.customers && data.customers.length > 0) {
                                setFetchedCustomers(data.customers); setIsManualCustomer(false); setCustomerName(data.customers[0].name); setTime(data.customers[0].time); setTotalPlayers(data.customers[0].players || 2); 
                            } else { setFetchedCustomers([]); setIsManualCustomer(true); setCustomerName(''); if (data.debugInfo) setTor4youError(JSON.stringify(data.debugInfo, null, 2)); }
                        }
                    } catch (e) { setFetchedCustomers([]); setIsManualCustomer(true); setTor4youError(e.message); } finally { setLoadingCustomers(false); }
                }; fetchAppts();
            }, [date]);
            const handleCustomerChange = (e) => { const val = e.target.value; setCustomerName(val); if (val !== 'manual_entry') { const selectedCust = fetchedCustomers.find(c => c.name === val); if (selectedCust) { if(selectedCust.time) setTime(selectedCust.time); if(selectedCust.players) setTotalPlayers(selectedCust.players); } } };
            
            const basePrice = getBasePrice(totalPlayers, settings.pricing); 
            const totalOriginalPrice = basePrice * Number(totalPlayers);
            const expectedMega = hasMegaLaan ? Math.ceil(Number(megaLaanPlayers) * basePrice * 0.78) : 0; 
            const weekendMega = (hasMegaLaan && isWeekendMegaLaan) ? Number(megaLaanPlayers) * 10 : 0;
            const discountK = settings.pricing?.discountKids || 15; 
            const discountE = settings.pricing?.discountEligible || 10;
            const totalDiscountAmount = hasMegaLaan ? 0 : (Number(kids) * basePrice * (discountK / 100) + Number(eligible) * basePrice * (discountE / 100));
            // עיגול כלפי מעלה לסכום סופי
            const finalPriceToPay = Math.ceil(hasMegaLaan ? ((Number(totalPlayers) - Number(megaLaanPlayers) > 0 ? (Number(totalPlayers) - Number(megaLaanPlayers)) * basePrice : 0) + weekendMega) : (totalOriginalPrice - totalDiscountAmount));
            const totalEnteredPayment = Object.values(payments).reduce((acc, val) => acc + (Number(val) || 0), 0); const paymentBalance = finalPriceToPay - totalEnteredPayment;

            const handleSubmit = async (e) => {
                e.preventDefault(); setAttemptedSubmit(true); 
                let actualCustName = (!isManualCustomer && customerName === 'manual_entry') ? document.getElementById('manualCustomerNameInput')?.value : customerName;
                if (!actualCustName || !groupType || !source || !date || !time) return alert('⚠️ אנא השלם את כל שדות החובה המסומנים באדום.');
                if (paymentBalance !== 0) return alert(`יש פער בתשלום! הלקוח צריך לשלם ${finalPriceToPay} אך הוזן ${totalEnteredPayment}`);
                setSaving(true);
                try {
                    await timeoutPromise(addDoc(getCollectionRef('groups'), { date, time, room, customerName: actualCustName, totalPlayers: Number(totalPlayers), groupType, source, kids: hasMegaLaan?0:Number(kids), eligible: hasMegaLaan?0:Number(eligible), hasMegaLaan, megaLaanPlayers: Number(megaLaanPlayers), megaLaanCode, isWeekendMegaLaan, totalOriginalPrice, totalDiscountAmount, finalPriceToPay, expectedMegaLaanRevenue: expectedMega, payments: { cash: Number(payments.cash)||0, credit: Number(payments.credit)||0, bit: Number(payments.bit)||0, transfer: Number(payments.transfer)||0 }, employeeId: reportEmpId, invoiceNumber: isAdmin ? invoiceNumber : '', createdAt: new Date().toISOString() }), 4000);
                    let wageAtTime = 0; if(reportEmpId !== 'admin') { const emp = (employees||[]).find(e=>e.id === reportEmpId); if(emp) wageAtTime = emp.wagePerGame || 0; }
                    // אישור אוטומטי אם מנהל
                    await timeoutPromise(addDoc(getCollectionRef('shifts'), { employeeId: reportEmpId, date, startTime: time, gamesCount: 1, room, status: isAdmin?'approved':'pending', approved: isAdmin, wageAtTime, isAutoGroup: true }), 4000);
                    alert('קבוצה ומשמרת נשמרו בהצלחה!'); onSave();
                } catch(err) { alert(err.message === 'Timeout' ? 'נשמר בענן (איטי)' : err.message); onSave(); } finally { setSaving(false); }
            };
            const getFieldClass = (val) => `w-full rounded-lg px-3 py-2 text-white outline-none transition-colors ${attemptedSubmit && !val ? 'bg-red-900/40 border border-red-500' : 'bg-gray-800 border border-gray-700 focus:ring-2 focus:ring-indigo-500'}`;
            return (
                <form onSubmit={handleSubmit} className="flex flex-col lg:flex-row gap-8">
                    <div className="flex-1 space-y-6">
                        {tor4youError && <div className="bg-red-900/50 p-4 rounded-lg border border-red-500 text-sm"><h4 className="font-bold text-red-300">מידע מ-Tor4You:</h4><pre className="text-white mt-2 whitespace-pre-wrap">{tor4youError}</pre></div>}
                        {isAdmin && (<div className="bg-gray-800 p-4 rounded-lg border border-gray-700 flex gap-4"><div className="flex-1"><label className="text-sm opacity-70">מפעיל הקבוצה</label><select className="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white mt-2" value={reportEmpId} onChange={e=>setReportEmpId(e.target.value)}><option value="admin">מנהל מערכת</option>{(employees||[]).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select></div><div className="flex-1"><label className="text-sm opacity-70">מס' חשבונית/קבלה</label><input type="text" className="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white mt-2" placeholder="אופציונלי" value={invoiceNumber} onChange={e=>setInvoiceNumber(e.target.value)} /></div></div>)}
                        <div className="grid md:grid-cols-2 gap-4"><Input label="תאריך" type="date" value={date} onChange={e=>setDate(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">שעה</label><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2" value={time} onChange={e=>setTime(e.target.value)} required>{generateTimeOptions().map(o=><option key={o} value={o}>{o}</option>)}</select></div><div className="flex flex-col gap-1"><label className="text-sm opacity-70">חדר</label><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2" value={room} onChange={e=>setRoom(e.target.value)} required>{roomList.map(r=><option key={r} value={r}>{r}</option>)}</select></div><div className="flex flex-col gap-1"><label className={`text-sm ${attemptedSubmit&&!customerName?'text-red-400 font-bold':'opacity-70'}`}>שם לקוח {loadingCustomers && <Loader className="animate-spin w-3 h-3 text-indigo-400 inline"/>}</label>{!isManualCustomer && fetchedCustomers.length>0 ? (<div className="space-y-2"><select className={getFieldClass(customerName)} value={customerName} onChange={handleCustomerChange}><option value="" disabled>-- בחירת לקוח --</option>{fetchedCustomers.map(c=><option key={c.name} value={c.name}>{c.name} ({c.time})</option>)}<option value="manual_entry">-- לקוח מזדמן / הזנה ידנית --</option></select>{customerName==='manual_entry' && <input id="manualCustomerNameInput" type="text" placeholder="הקלד שם לקוח" className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 mt-1"/>}</div>) : <input type="text" value={customerName} onChange={e=>setCustomerName(e.target.value)} className={getFieldClass(customerName)} placeholder="הזן שם לקוח" />}</div></div>
                        <div className="grid md:grid-cols-3 gap-4 border-t border-gray-800 pt-4"><Input label="כמות שחקנים כוללת" type="number" min="2" value={totalPlayers} onChange={e=>setTotalPlayers(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">הרכב קבוצה</label><select className={getFieldClass(groupType)} value={groupType} onChange={e=>setGroupType(e.target.value)}><option value="" disabled>-- יש למלא --</option>{['משפחה','חברים','צוות עבודה','בני זוג','גיבוש קבוצה'].map(o=><option key={o} value={o}>{o}</option>)}</select></div><div className="flex flex-col gap-1"><label className="text-sm opacity-70">מקור הגעה</label><select className={getFieldClass(source)} value={source} onChange={e=>setSource(e.target.value)}><option value="" disabled>-- יש למלא --</option>{['גוגל','פייסבוק','EAZY','מפה לאוזן','אינסטגרם','טיקטוק'].map(o=><option key={o} value={o}>{o}</option>)}</select></div></div>
                        {!hasMegaLaan && <div className="grid md:grid-cols-2 gap-4 border-t border-gray-800 pt-4"><Input label="ילדים (עד גיל 12)" type="number" min="0" value={kids} onChange={e=>setKids(e.target.value)} /><Input label="סטודנט/חייל/נכה" type="number" min="0" value={eligible} onChange={e=>setEligible(e.target.value)} /></div>}
                        <div className="bg-blue-900/20 p-4 rounded-lg border border-blue-800/50 mt-6"><label className="flex items-center gap-2 cursor-pointer font-bold text-blue-300"><input type="checkbox" checked={hasMegaLaan} onChange={e=>{setHasMegaLaan(e.target.checked); if(e.target.checked){setKids(0);setEligible(0);}}} className="w-5 h-5"/>התקבל שובר מגה לאן</label>{hasMegaLaan && (<div className="mt-4 grid md:grid-cols-3 gap-4"><Input label="על כמה שחקנים השובר?" type="number" min="1" max={totalPlayers} value={megaLaanPlayers} onChange={e=>setMegaLaanPlayers(e.target.value)} required/><Input label="קוד שובר" value={megaLaanCode} onChange={e=>setMegaLaanCode(e.target.value)} required/><label className="flex items-center gap-2 mt-6 text-sm"><input type="checkbox" checked={isWeekendMegaLaan} onChange={e=>setIsWeekendMegaLaan(e.target.checked)}/>תוספת סופ"ש (10₪)</label></div>)}</div>
                        <div className="bg-gray-800 p-5 rounded-lg border border-gray-700 mt-6"><h4 className="font-bold mb-4 text-indigo-300">אמצעי תשלום</h4><div className="grid grid-cols-2 md:grid-cols-4 gap-3"><Input label="מזומן" type="number" step="any" value={payments.cash} onChange={e=>setPayments({...payments, cash:e.target.value})} /><Input label="אשראי" type="number" step="any" value={payments.credit} onChange={e=>setPayments({...payments, credit:e.target.value})} /><Input label="ביט" type="number" step="any" value={payments.bit} onChange={e=>setPayments({...payments, bit:e.target.value})} /><Input label="העברה" type="number" step="any" value={payments.transfer} onChange={e=>setPayments({...payments, transfer:e.target.value})} /></div></div>
                    </div>
                    <div className="w-full lg:w-96"><div className="bg-gray-900 p-6 rounded-xl border border-gray-700 shadow-2xl flex flex-col gap-4 sticky top-24"><h3 className="font-bold text-xl border-b border-gray-700 pb-3 mb-2">סיכום חישוב</h3><div className="flex justify-between text-sm opacity-90"><span>מחיר בסיס:</span> <span className="font-bold">₪{totalOriginalPrice}</span></div>{!hasMegaLaan && totalDiscountAmount>0 && <div className="flex justify-between text-sm text-red-400"><span>הנחות:</span> <span>-₪{totalDiscountAmount}</span></div>}{hasMegaLaan && <div className="flex justify-between text-sm text-blue-400"><span>מגה לאן צפוי:</span> <span>₪{expectedMega}</span></div>}{hasMegaLaan && isWeekendMegaLaan && <div className="flex justify-between text-sm text-yellow-400"><span>תוספת סופ"ש:</span> <span>₪{weekendMega}</span></div>}<div className="flex justify-between text-2xl font-bold bg-gray-800 p-4 rounded-lg border border-gray-700 mt-4 shadow-inner"><span>סה"כ לתשלום:</span> <span className="text-green-400">₪{finalPriceToPay}</span></div>{paymentBalance!==0 && <div className="mt-2 text-sm font-bold text-center p-2 rounded bg-red-900/30 border border-red-800 text-red-400">יתרת תשלום להזנה: ₪{paymentBalance}</div>}{paymentBalance===0 && finalPriceToPay>0 && <div className="mt-2 text-sm font-bold text-center p-2 rounded bg-green-900/30 border border-green-800 text-green-400"><CheckCircle size={16} className="inline"/> התשלום הוזן במלואו</div>}<Button type="submit" className="w-full py-4 mt-6 text-lg font-bold" disabled={saving || paymentBalance!==0}>{saving?'שומר...':'שמור דיווח'}</Button></div></div>
                </form>
            );
        };

        // --- Employee Panels ---
        const EmployeeUpcoming = ({ employee, assignments, settings }) => {
            const todayStr = new Date().toISOString().slice(0, 10);
            const myAssignments = assignments.filter(a => a.employeeId === employee.id && (a.date||'') >= todayStr).sort((a,b) => `${a.date||''} ${a.time||''}`.localeCompare(`${b.date||''} ${b.time||''}`));
            const roomName = (settings?.roomsList || 'סודו של הודיני').split(',')[0].trim();
            const handleWA = (phone) => {
                if(!phone) return alert('אין טלפון ללקוח זה');
                let cleanPhone = phone.replace(/\D/g, ''); if (cleanPhone.startsWith('0')) cleanPhone = '972' + cleanPhone.substring(1);
                const empName = employee.role === 'admin' ? 'מהצוות של חדרי בריחה G-Room' : employee.name;

                window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
            };
            return (<Card title="המשמרות הקרובות שלי">{myAssignments.length === 0 && <div className="text-center py-8 opacity-60">אין משמרות בעתיד הקרוב.</div>}<div className="grid md:grid-cols-2 gap-4">{myAssignments.map(a => (<div key={a.id} className="bg-gray-800/50 p-4 rounded-lg border border-gray-700 flex justify-between items-center"><div><div className="font-bold text-lg text-indigo-300">{formatDateIL(a.date)} | {a.time}</div><div className="text-sm">לקוח: {a.customerName} ({a.customerPhone || 'ללא טלפון'})</div><div className="text-xs opacity-70">חדר: {a.room}</div></div><Button variant="success" onClick={()=>handleWA(a.customerPhone)} className="rounded-full w-12 h-12 p-0"><MessageCircle size={24}/></Button></div>))}</div></Card>);

        const EmployeeHistory = ({ employee, groups, shifts }) => {

            const myGroups = groups.filter(g => g.employeeId === employee.id && (g.date||'').startsWith(month)).sort((a,b) => `${a.date||''} ${a.time||''}`.localeCompare(`${b.date||''} ${b.time||''}`));
            return (<Card><div className="overflow-x-auto"><table className="w-full text-right text-sm whitespace-nowrap"><thead className="opacity-70 border-b border-gray-700"><tr><th>תאריך ושעה</th><th>חדר</th><th>לקוח</th><th>שחקנים</th><th>לתשלום</th><th>נמחק?</th></tr></thead><tbody className="divide-y divide-gray-800 opacity-90">{myGroups.length === 0 && <tr><td colSpan="6" className="text-center py-4">לא דיווחת קבוצות החודש</td></tr>}{myGroups.map(g => (<tr key={g.id}><td className="py-2">{formatDateIL(g.date)} {g.time}</td><td>{g.room}</td><td>{g.customerName}</td><td>{g.totalPlayers}</td><td className="text-green-400">₪{g.finalPriceToPay}</td><td><button onClick={() => confirm("למחוק דיווח?") && deleteDoc(getDocRef('groups', g.id))} className="text-red-400"><Trash2 size={14}/></button></td></tr>))}</tbody></table></div></Card>);
        }

        const EmployeeIssues = ({ employee, issues, settings }) => {
            const [room, setRoom] = useState(''); const [desc, setDesc] = useState(''); const [saving, setSaving] = useState(false);
            const pendingIssues = issues.filter(i => i.status === 'pending').sort((a,b) => new Date(b.reportedAt) - new Date(a.reportedAt));
            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);
            const submitIssue = async (e) => { e.preventDefault(); setSaving(true); try { await addDoc(getCollectionRef('issues'), { room, description: desc, reportedBy: employee.id, reportedByName: employee.name, status: 'pending', priority: 'רגילה', reportedAt: new Date().toISOString() }); alert('התקלה דווחה!'); setDesc(''); } catch(err) { alert(err.message); } finally { setSaving(false); } };
            return (<div className="grid md:grid-cols-2 gap-6"><Card title="דיווח על תקלה בחדר"><form onSubmit={submitIssue} className="space-y-4"><div className="flex flex-col gap-1"><label className="text-sm opacity-70">חדר</label><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={room} onChange={e=>setRoom(e.target.value)} required>{roomList.map(r => <option key={r} value={r}>{r}</option>)}</select></div><div className="flex flex-col gap-1"><label className="text-sm opacity-70">תיאור (מה נשבר?)</label><textarea className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white h-32 resize-none" value={desc} onChange={e=>setDesc(e.target.value)} required></textarea></div><Button type="submit" variant="danger" disabled={saving} className="w-full">{saving ? 'שולח...' : 'שלח דיווח למנהל'}</Button></form></Card><Card title="תקלות פתוחות"><div className="space-y-3">{pendingIssues.length === 0 && <div className="text-center py-8 opacity-60">הכל תקין! 🎉</div>}{pendingIssues.map(i => (<div key={i.id} className="bg-gray-800/50 p-4 rounded-lg border border-gray-700"><div className="flex justify-between items-start mb-2"><h4 className="font-bold text-lg text-indigo-300">{i.room}</h4><span className="text-xs opacity-60">{formatDateTimeIL(i.reportedAt)} ע"י {i.reportedByName}</span></div><p className="text-sm text-gray-300 whitespace-pre-wrap">{i.description}</p></div>))}</div></Card></div>);
        };

        const EmployeeTasks = ({ employee, tasks }) => {
            const myTasks = tasks.filter(t => t.assigneeId === employee.id && t.status === 'pending');
            const handleComplete = async (id) => { await updateDoc(getDocRef('tasks', id), { status: 'completed', completedAt: new Date().toISOString() }); alert('כל הכבוד!'); };
            return (<Card title="המשימות שלי">{myTasks.length === 0 && <div className="text-center py-8 opacity-60">אין משימות 🎉</div>}<div className="space-y-4">{myTasks.map(t => (<div key={t.id} className="border border-gray-700 rounded-lg p-4 flex justify-between items-center bg-gray-800/30"><div><h3 className="font-bold text-lg mb-1">{t.description}</h3><div className="text-sm opacity-70 text-red-300">עד: {formatDateIL(t.deadline)}</div></div><Button onClick={() => handleComplete(t.id)} variant="success">ביצעתי</Button></div>))}</div></Card>);
        };

        const EmployeeConstraints = ({ employee, constraints }) => {
            const [mode, setMode] = useState('single'); const [date, setDate] = useState(''); const [start, setStart] = useState(''); const [end, setEnd] = useState(''); const [sDate, setSDate] = useState(''); const [eDate, setEDate] = useState(''); const [note, setNote] = useState(''); const [editId, setEditId] = useState(null);
            const submit = async (e) => { e.preventDefault(); const data = { employeeId: employee.id, type: mode, note, status: 'pending' }; if (mode === 'single') { data.date = date; data.startTime = start; data.endTime = end; } else { data.startDate = sDate; data.endDate = eDate; } if (editId) { await updateDoc(getDocRef('constraints', editId), data); setEditId(null); } else { await addDoc(getCollectionRef('constraints'), data); } alert('נשמר'); setNote(''); setDate(''); setStart(''); setEnd(''); };
            const del = async (id) => { if(confirm("למחוק אילוץ?")) await deleteDoc(getDocRef('constraints', id)); };
            const edit = (c) => { setEditId(c.id); setMode(c.type); setNote(c.note || ''); if(c.type==='single'){ setDate(c.date); setStart(c.startTime); setEnd(c.endTime); } else { setSDate(c.startDate); setEDate(c.endDate); } };
            const myCons = constraints.filter(c => c.employeeId === employee.id).sort((a,b) => ((a.date || a.startDate)||'').localeCompare((b.date || b.startDate)||''));
            return (<div className="grid md:grid-cols-2 gap-6"><Card title={editId ? "עריכת אילוץ" : "אילוץ חדש"}><div className="flex gap-2 mb-4"><button onClick={()=>setMode('single')} className={`flex-1 p-1 rounded ${mode==='single'?'bg-indigo-600 text-white':'text-dynamic card-bg'}`}>יום בודד</button><button onClick={()=>setMode('range')} className={`flex-1 p-1 rounded ${mode==='range'?'bg-indigo-600 text-white':'text-dynamic card-bg'}`}>חופשה</button></div><form onSubmit={submit} className="space-y-4">{mode==='single' ? (<><Input label="תאריך" type="date" value={date} onChange={e=>setDate(e.target.value)} required/><div className="flex gap-4"><div className="flex-1"><Input label="שעת התחלה" type="time" step="900" value={start} onChange={e=>setStart(e.target.value)} required/></div><div className="flex-1"><Input label="שעת סיום" type="time" step="900" value={end} onChange={e=>setEnd(e.target.value)} required/></div></div></>) : (<><Input label="מ" type="date" value={sDate} onChange={e=>setSDate(e.target.value)} required/><Input label="עד" type="date" value={eDate} onChange={e=>setEDate(e.target.value)} required/></>)}<Input label="מהות האילוץ" value={note} onChange={e=>setNote(e.target.value)} /><div className="flex gap-2">{editId && <Button type="button" variant="secondary" onClick={()=>{setEditId(null); setNote('');}} className="flex-1">ביטול</Button>}<Button type="submit" className="flex-1">{editId ? 'עדכן' : 'שלח'}</Button></div></form></Card><Card title="האילוצים שלי"><div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="opacity-70 border-b border-gray-700"><tr><th>התחלה</th><th>סיום</th><th>שעות</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody className="divide-y divide-gray-800 opacity-90">{myCons.map(c => (<tr key={c.id}><td className="py-2">{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td><td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td><td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td><td><StatusBadge status={c.status || 'pending'} /></td><td className="flex gap-2 py-2">{c.status !== 'approved' && <button onClick={()=>edit(c)} className="text-indigo-400"><Edit2 size={14}/></button>}<button onClick={()=>del(c.id)} className="text-red-400"><Trash2 size={14}/></button></td></tr>))}</tbody></table></div></Card></div>);
        };

        const EmployeeProfile = ({ employee, shifts }) => {
            const [open, setOpen] = useState(false); const [sending, setSending] = useState(false); const month = new Date().toISOString().slice(0, 7);
            const myShifts = shifts.filter(s => s.employeeId === employee.id && (s.date||'').startsWith(month));
            const wage = myShifts.reduce((acc, curr) => acc + (curr.gamesCount * (curr.wageAtTime || employee.wagePerGame || 0)), 0);
            const request = async (e) => { e.preventDefault(); setSending(true); const fd = new FormData(e.target); try { await addDoc(getCollectionRef('requests'), { employeeId: employee.id, status: 'pending', date: new Date().toISOString(), newData: { phone: fd.get('phone'), email: fd.get('email'), address: fd.get('address'), birthday: fd.get('birthday') } }); alert('נשלח'); setOpen(false); } catch(e) { alert(e.message); } finally { setSending(false); } };
            return (<div className="grid md:grid-cols-2 gap-6"><Card><div className="text-center"><h2 className="text-2xl font-bold">{employee.name}</h2><p className="text-indigo-400">{employee.skills?.join(' • ')}</p></div><div className="mt-4 space-y-2 text-sm opacity-80"><div>טלפון: {employee.phone}</div><div>מייל: {employee.email}</div><div>יום הולדת: {formatDateIL(employee.birthday)}</div></div><Button variant="outline" className="w-full mt-4" onClick={()=>setOpen(true)}>עדכון פרטים</Button></Card><Card title={`שכר משוער (${month})`}><div className="text-center py-8"><div className="text-4xl font-bold text-green-400">₪{wage}</div><div className="text-gray-400 text-sm">{myShifts.length} משחקים</div></div></Card>{open && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700"><h3 className="text-xl font-bold mb-4">עדכון פרטים</h3><form onSubmit={request} className="space-y-4"><Input label="טלפון" name="phone" defaultValue={employee.phone} required /><Input label="מייל" name="email" defaultValue={employee.email} required /><Input label="כתובת" name="address" defaultValue={employee.address} required /><Input label="יום הולדת" name="birthday" type="date" defaultValue={employee.birthday} required /><div className="flex gap-2"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" className="flex-1" disabled={sending}>{sending ? 'שולח...' : 'שלח בקשה'}</Button></div></form></div></div>}</div>);
        };

        const EmployeeDashboard = ({ employee, data, settings }) => {
            const [tab, setTab] = useState('upcoming');
            const myPendingTasks = (data.tasks||[]).filter(t => t.assigneeId === employee.id && t.status === 'pending');
            const issuesCount = (data.issues||[]).filter(i => i.status === 'pending').length; 
            return (
                <div className="space-y-6">
                    <div className="flex card-bg p-1 rounded-lg w-fit overflow-x-auto max-w-full">
                        {[{id:'upcoming', l:'תורים עתידיים'}, {id:'report', l:'דיווח והיסטוריה'}, {id:'constraints', l:'אילוצים'}, {id:'issues', l:'תקלות', c:issuesCount, color:'bg-orange-500'}, {id:'tasks', l:'משימות', c:myPendingTasks.length, color:'bg-red-500'}, {id:'profile', l:'פרופיל'}].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded text-dynamic ${tab===t.id?'bg-indigo-600 text-white':''}`}>{t.l}{t.c > 0 && <span className={`${t.color} text-white text-xs px-1.5 py-0.5 rounded-full font-bold`}>{t.c}</span>}</button>
                        ))}
                    </div>
                    {tab==='upcoming' && <EmployeeUpcoming employee={employee} assignments={data.assignments||[]} settings={settings}/>}
                    {tab==='report' && <div className="space-y-8"><GroupReportForm employeeId={employee.id} employees={data.employees} settings={settings} onSave={()=>{}}/><div className="border-t border-gray-800 pt-8 mt-8"><h2 className="text-2xl font-bold mb-6">היסטוריית הדיווחים שלי</h2><EmployeeHistory employee={employee} groups={data.groups||[]} shifts={data.shifts||[]}/></div></div>}
                    {tab==='constraints' && <EmployeeConstraints employee={employee} constraints={data.constraints||[]}/>}
                    {tab==='issues' && <EmployeeIssues employee={employee} issues={data.issues||[]} settings={settings}/>}
                    {tab==='tasks' && <EmployeeTasks employee={employee} tasks={data.tasks||[]}/>}
                    {tab==='profile' && <EmployeeProfile employee={employee} shifts={data.shifts||[]}/>}
                </div>
            );
        };

        // --- Admin Panels ---
        const AdminConstraints = ({ employees, constraints, settings, assignments }) => {
            const [offset, setOffset] = useState(0); const [isBlocking, setIsBlocking] = useState(false); const [tor4youSlotsMap, setTor4youSlotsMap] = useState({}); const [loadingSlots, setLoadingSlots] = useState(false); const [assignSlot, setAssignSlot] = useState(null); const [addApptSlot, setAddApptSlot] = useState(null); 
            const todayStr = new Date().toISOString().slice(0, 10); const currentMonthStr = todayStr.slice(0, 7);
            
            const activeCons = useMemo(() => constraints.filter(c => (c.type==='range'?c.endDate:c.date||'') >= todayStr || c.status === 'pending').sort((a,b)=>((a.type==='range'?a.startDate:a.date)||'').localeCompare((b.type==='range'?b.startDate:b.date)||'')), [constraints]);
            const historyCons = useMemo(() => constraints.filter(c => (c.type==='range'?c.endDate:c.date||'') < todayStr && c.status !== 'pending' && (c.type==='range'?c.endDate:c.date||'').startsWith(currentMonthStr)).sort((a,b)=>((b.type==='range'?b.startDate:b.date)||'').localeCompare((a.type==='range'?a.startDate:a.date)||'')), [constraints]);
            const days = useMemo(() => Array.from({length:7}, (_,i) => { const d = new Date(); d.setDate(d.getDate() + (offset*7) + i); return d; }), [offset]);
            
            const dynamicHours = useMemo(() => { const times = new Set(); Object.values(tor4youSlotsMap).forEach(arr => arr.forEach(s => times.add(s.time))); if (times.size === 0) return ["10:00", "11:30", "13:00", "14:30", "16:00", "17:30", "19:00", "20:30", "22:00"]; return Array.from(times).sort(); }, [tor4youSlotsMap]);
            
            const fetchWeekSlots = async () => {
                setLoadingSlots(true);
                const fromDateStr = days[0].toISOString().slice(0,10).replace(/-/g, ''); const toDateStr = days[6].toISOString().slice(0,10).replace(/-/g, '');
                try { const res = await fetch(`${TOR4YOU_WEEK_URL}?fromDate=${fromDateStr}&toDate=${toDateStr}`); if(res.ok) { const data = await res.json(); if(data.slotsMap) setTor4youSlotsMap(data.slotsMap); } } catch(e) {} finally { setLoadingSlots(false); }
            };
            useEffect(() => { fetchWeekSlots(); }, [offset]);

            const getSlotInfo = (d, hStr, customConstraints = constraints) => {
                const dStr = d.toISOString().slice(0,10); const daySlots = tor4youSlotsMap[dStr] || []; const slot = daySlots.find(s => s.time === hStr);
                if (!slot) return { status: -1 }; 
                const [curH, curM] = hStr.split(':').map(Number); const slotStartMin = curH * 60 + curM; const slotEndMin = slotStartMin + 90; 
                let count = 0;
                employees.forEach(emp => {
                    const busy = customConstraints.some(c => {
                        if (c.employeeId !== emp.id || c.status === 'rejected') return false; 
                        if (c.type === 'range') return dStr >= c.startDate && dStr <= c.endDate;
                        const [sH, sM] = (c.startTime || '00:00').split(':').map(Number); const [eH, eM] = (c.endTime || '00:00').split(':').map(Number);
                        return c.date === dStr && (Math.max(slotStartMin, (sH * 60 + sM)) < Math.min(slotEndMin, (eH * 60 + eM)));
                    });
                    if (!busy) count++;
                });
                const assignId = `${dStr}_${hStr.replace(':','')}`;
                return { status: count, isBooked: slot.isBooked, customerName: slot.customerName, customerPhone: slot.customerPhone, dateStr: dStr, time: hStr, id: slot.id, vfib: slot.vfib, assignment: assignments.find(a => a.id === assignId) };
            };
            
            const handleStatus = async (id, status) => { 
                await updateDoc(getDocRef('constraints', id), { status }); 
                if (status === 'approved') {
                    const updatedConstraints = constraints.map(x => x.id === id ? { ...x, status: 'approved' } : x);
                    const toDelete = []; const warnings = [];
                    days.forEach(d => {
                        const dStr = d.toISOString().slice(0,10); const daySlots = tor4youSlotsMap[dStr] || [];
                        daySlots.forEach(slot => {
                            const info = getSlotInfo(d, slot.time, updatedConstraints);
                            if (info.status === 0) {
                                if (info.isBooked) warnings.push(`${formatDateIL(dStr)} בשעה ${slot.time} (${info.customerName})`);
                                else toDelete.push({ slotid: slot.id, vfib: slot.vfib });
                            }
                        });
                    });
                    if (warnings.length === 0 && toDelete.length === 0) return;
                    let message = `זיהוי אוטומטי בעקבות אישור האילוץ:\n\n`;
