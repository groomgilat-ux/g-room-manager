    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { User, Users, Calendar, DollarSign, Settings, LogOut, Plus, Clock, FileText, Mail, CheckCircle, XCircle, Lock, AlertTriangle, X as XIcon, Edit2, CheckSquare, Coins, LineChart, Receipt, Download, Trash2, Check, ChevronRight, ChevronLeft, Loader, Bell, Wrench, History, MessageCircle, Home, Menu } from 'lucide-react';

        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from 'firebase/firestore';

        const firebaseConfig = { apiKey: "AIzaSyBvayS247KEOVqZloFrNWV3svg4DSiNG08", authDomain: "g-room-escape-room-management.firebaseapp.com", projectId: "g-room-escape-room-management", storageBucket: "g-room-escape-room-management.firebasestorage.app", messagingSenderId: "361117379721", appId: "1:361117379721:web:3019eaeb30f4fe188caa58" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app, 'groom');
        
        const API_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net";
        const TOR4YOU_ADD_APPT_URL = `${API_URL}/addTor4YouAppointment`;
        const TOR4YOU_DELETE_URL = `${API_URL}/deleteTor4YouSlots`;
        const TOR4YOU_WEEK_URL = `${API_URL}/getTor4YouWeekSlots`;
        const TOR4YOU_FUNCTION_URL = `${API_URL}/getTor4YouAppts`;

        const getCollectionRef = (n) => collection(db, n); const getDocRef = (n, id) => doc(db, n, id);

        // --- התראות Push ---
        const VAPID_KEY = "BKAw3HzqeYuTiP36Fq2RS_NK4ByHjLvFjxSi9NKc-6HRuzLI0bLOakpbpmjbAE23txSwyqnEWcKNv-mlnMG76o4";
        const PUSH_SEND_URL = `${API_URL}/sendPush`;
        const sendPush = (target, title, body, tab) => { try { fetch(PUSH_SEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target, title, body, tab }) }).catch(() => {}); } catch (e) {} };
        const pushSupported = () => typeof window !== 'undefined' && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
        const registerPush = async (user) => {
            const { getMessaging, getToken, onMessage } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js');
            const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            await navigator.serviceWorker.ready;
            const messaging = getMessaging(app);
            const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
            if (!token) throw new Error('לא התקבל מפתח התראות מהמכשיר');
            await setDoc(getDocRef('push_tokens', token), { token, employeeId: user.id, role: user.role, updatedAt: new Date().toISOString() });
            try { localStorage.setItem('groom_push_token', token); } catch (e) {}
            if (!window.__pushFg) { window.__pushFg = true; onMessage(messaging, (pl) => { const n = pl.data || pl.notification || {}; reg.showNotification(n.title || 'G-Room', { body: n.body || '', icon: '/icon-192.png', data: { tab: n.tab || '' } }); }); }
            return token;
        };
        const TAB_MAP = { availability: 'constraints', calendar: 'constraints' };
        try { const q = new URLSearchParams(location.search).get('tab'); if (q) window.__pendingTab = q; } catch (e) {}
        try { if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.openTab) { window.__pendingTab = e.data.openTab; window.dispatchEvent(new Event('groom-open-tab')); } }); } catch (e) {}
        const takePendingTab = () => { const t = window.__pendingTab; window.__pendingTab = null; return t ? (TAB_MAP[t] || t) : null; };
        const detachPush = async () => { try { const t = localStorage.getItem('groom_push_token'); if (t) await updateDoc(getDocRef('push_tokens', t), { employeeId: '', role: '' }); } catch (e) {} };
        
        const INITIAL_SETTINGS = { 
            businessName: 'G-Room Escape', adminCode: 'admin123', primaryColor: '#030712', secondaryColor: '#ffffff', roomsList: 'סודו של הודיני', 
            pricing: { basePrice2: 140, basePrice3: 125, basePrice4: 110, basePrice5: 100, basePrice6to8: 90, basePrice9to10: 80, discountKids: 15, discountEligible: 10 }, 
            emailTemplate: { subject: 'G-Room: תלוש שכר {month}/{year}', body: 'היי {name},\nמצורף תלוש.\nבברכה,\nהנהלת G-Room' },
            openingHours: { Sunday: { start: '10:00', end: '23:00' }, Monday: { start: '10:00', end: '23:00' }, Tuesday: { start: '10:00', end: '23:00' }, Wednesday: { start: '10:00', end: '23:00' }, Thursday: { start: '10:00', end: '01:00' }, Friday: { start: '09:00', end: '15:00' }, Saturday: { start: '18:00', end: '01:00' } }
        };

        const formatDateIL = (ds) => { const d = new Date(ds); return isNaN(d)?'':d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'2-digit'}); };
        const formatDateTimeIL = (is) => { const d = new Date(is); return isNaN(d)?'':d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); };
        const addTime = (ts, m) => { if(!ts) return ''; const [hh, mm] = ts.split(':').map(Number); const d = new Date(); d.setHours(hh, mm+m); return d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit',hour12:false}); };
        const getBasePrice = (pStr, pr) => { const p = Number(pStr)||0; if(p<=2) return Number(pr?.basePrice2)||140; if(p===3) return Number(pr?.basePrice3)||125; if(p===4) return Number(pr?.basePrice4)||110; if(p===5) return Number(pr?.basePrice5)||100; if(p>=6 && p<=8) return Number(pr?.basePrice6to8)||90; return Number(pr?.basePrice9to10)||80; };
        const getMonthsDifference = (s, e) => { if(!s||!e) return 1; const d1=new Date(s+'-01'), d2=new Date(e+'-01'); let m=(d2.getFullYear()-d1.getFullYear())*12; m-=d1.getMonth(); m+=d2.getMonth(); return m<=0?1:m+1; };
        const isMonthInRange = (tm, sm, em) => tm>=sm && tm<=em;
        const generateTimeOptions = () => { const options = []; for(let i=0; i<24; i++) { for(let j=0; j<60; j+=15) { options.push(`${i.toString().padStart(2,'0')}:${j.toString().padStart(2,'0')}`); } } return options; };
        const exportToXLS = (html, fn) => { const blob=new Blob([`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><table>${html}</table></body></html>`], {type:'application/vnd.ms-excel'}); const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download=fn; document.body.appendChild(link); link.click(); };
        const replacePlaceholders = (template, data) => { if (!template) return ''; let r = template; Object.keys(data).forEach(k => { r = r.split('{' + k + '}').join(data[k]); }); return r; };
        const thisMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
        const shiftMonth = (m, delta) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + delta, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
        const normalizePhone = (phone) => { let p = String(phone || '').replace(/\D/g, ''); if (p.startsWith('9720')) p = '972' + p.slice(4); else if (p.startsWith('0')) p = '972' + p.slice(1); return p; };
        const buildWAUrl = (phone, empName, room, time, gender) => {
            const role = gender === 'male' ? 'המפעיל' : (gender === 'female' ? 'המפעילה' : 'המפעיל/ה');
            const avail = gender === 'male' ? 'זמין' : (gender === 'female' ? 'זמינה' : 'זמין/ה');
            return `https://wa.me/${normalizePhone(phone)}?text=${encodeURIComponent(`שלום אני ${empName}, ${role} שלך בחדר בריחה ${room}, לתור שהוזמן לשעה ${time}. אם אתם לא מוצאים את המקום או צריכים עזרה אני ${avail} בשמחה :)`)}`;
        };
        const timeoutPromise = (p, ms=5000) => Promise.race([p, new Promise((_, r)=>setTimeout(()=>r(new Error("Timeout")), ms))]);

        // ====== Calendar / availability engine ======
        const TOR4YOU_ADD_SLOTS_URL = `${API_URL}/addTor4YouSlots`;
        const TOR4YOU_DELETE_APPT_URL = `${API_URL}/deleteTor4YouAppointment`;
        const TOR4YOU_UPDATE_APPT_URL = `${API_URL}/updateTor4YouAppointment`;
        const DAY_NAMES_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const DAY_NAMES_HE = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        const SLOT_MIN = 60;   // אורך התור
        const DOUBLE_MIN = 150; // תור כפול: שני סבבים ברצף עם מרווח של חצי שעה
        const PRE_MIN = 15;    // העובד מגיע 15 דק' לפני
        const POST_MIN = 15;   // וסוגר את החדר 15 דק' אחרי
        const STEP_MIN = 90;   // מרווח בין תורים (שעה + חצי שעה)
        const GRID_ANCHOR = { 0: '12:00', 1: '12:00', 2: '12:00', 3: '12:00', 4: '12:00', 5: '10:00', 6: '20:00' }; // רשת הזמנים הקבועה לפי יום בשבוע
        const pad2 = (n) => String(n).padStart(2, '0');
        const toMin = (t) => { const [h, m] = String(t || '00:00').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
        const minToTime = (m) => `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`;
        const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const ymdCompact = (d) => ymd(d).replace(/-/g, '');
        const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
        const getWeekStart = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }; // תמיד יום ראשון
        const sortKey = (t) => { const m = toMin(t); return m < 360 ? m + 1440 : m; }; // שעות אחרי חצות בסוף
        const getOpeningRange = (d, openingHours) => { const b = openingHours && openingHours[DAY_NAMES_EN[d.getDay()]]; if (!b || !b.start || !b.end) return null; const o = toMin(b.start); let c = toMin(b.end); if (c <= o) c = 1440; return { open: o, close: Math.min(c, 1440) }; };
        // מועדים אפשריים ליום: הרשת הקבועה, מורחבת בקפיצות של 90 דקות, בתוך שעות הפעילות
        const candidateTimes = (d, openingHours) => {
            const r = getOpeningRange(d, openingHours); if (!r) return [];
            let t = toMin(GRID_ANCHOR[d.getDay()]);
            while (t - STEP_MIN >= r.open) t -= STEP_MIN;
            while (t < r.open) t += STEP_MIN;
            const out = []; for (; t < r.close; t += STEP_MIN) out.push(minToTime(t));
            return out;
        };
        const getAvailRanges = (constraints, empId, dStr) => {
            const rs = (constraints || []).filter(c => c.type === 'available' && c.employeeId === empId && c.date === dStr).map(c => ({ s: toMin(c.startTime), e: toMin(c.endTime) })).filter(r => r.e > r.s).sort((a, b) => a.s - b.s);
            const merged = []; rs.forEach(r => { const last = merged[merged.length - 1]; if (last && r.s <= last.e) last.e = Math.max(last.e, r.e); else merged.push({ ...r }); });
            return merged;
        };
        // תור ב-T דורש עובד פנוי מ-T-15 ועד T+60+15
        const durOf = (slot) => { const to = slot && (slot.slotTo || slot.to); if (!to || !slot.time) return SLOT_MIN; const d = toMin(to) - toMin(slot.time); return (d > 0 && d <= 600) ? d : SLOT_MIN; };
        const coveringEmployees = (constraints, employees, dStr, time, dur) => {
            const s = toMin(time) - PRE_MIN; const e = toMin(time) + (dur || SLOT_MIN) + POST_MIN;
            return (employees || []).filter(emp => getAvailRanges(constraints, emp.id, dStr).some(r => r.s <= s && r.e >= e));
        };
        const fetchWeekSlotsMap = async (weekStart) => {
            const res = await fetch(`${TOR4YOU_WEEK_URL}?fromDate=${ymdCompact(weekStart)}&toDate=${ymdCompact(addDays(weekStart, 6))}`);
            if (!res.ok) throw new Error('שגיאה בטעינת היומן מ-Tor4You');
            const data = await res.json(); return data.slotsMap || {};
        };
        // מה צריך לפתוח, מה לסגור, ועל אילו תורים שכבר הוזמנו אין עובד. לעולם לא נוגע בתורים שהוזמנו.
        const computeSyncPlan = ({ weekStart, slotsMap, constraints, employees, settings }) => {
            const now = new Date(); const todayStr = ymd(now); const nowMin = now.getHours() * 60 + now.getMinutes();
            const toAdd = [], toRemove = [], warnings = [];
            for (let i = 0; i < 7; i++) {
                const d = addDays(weekStart, i); const dStr = ymd(d); if (dStr < todayStr) continue;
                const existing = slotsMap[dStr] || []; const have = new Set(existing.map(s => s.time));
                candidateTimes(d, settings.openingHours).forEach(t => {
                    if (have.has(t)) return; if (dStr === todayStr && toMin(t) <= nowMin) return;
                    if (existing.some(s => toMin(s.time) < toMin(t) + SLOT_MIN && toMin(s.time) + durOf(s) > toMin(t))) return; // חופף למועד קיים (למשל תור כפול)
                    if (coveringEmployees(constraints, employees, dStr, t).length > 0) toAdd.push({ date: dStr, time: t });
                });
                existing.forEach(s => {
                    if (coveringEmployees(constraints, employees, dStr, s.time, durOf(s)).length > 0) return;
                    if (s.isBooked || s.customerName || Number(s.participants) > 0) { warnings.push({ date: dStr, time: s.time, customerName: s.customerName }); return; }
                    if (!s.id || !s.vfib) return; if (dStr === todayStr && toMin(s.time) <= nowMin) return;
                    toRemove.push({ slotid: s.id, vfib: s.vfib, date: dStr, time: s.time });
                });
            }
            return { toAdd, toRemove, warnings };
        };
        const executeSyncPlan = async (plan) => {
            let added = 0, removed = 0; const errors = [];
            if (plan.toAdd.length) {

            const myPendingTasks = (data.tasks||[]).filter(t => t.assigneeId === employee.id && t.status === 'pending');
            const issuesCount = (data.issues||[]).filter(i => i.status === 'pending').length; 
            const myAssignments = (data.assignments||[]).filter(a => a.employeeId === employee.id && (a.date||'') >= new Date().toISOString().slice(0, 10));
            return (
                <div className="space-y-6">
                    <div className="flex card-bg p-1 rounded-lg w-fit overflow-x-auto max-w-full emp-tabs">
                        {[{id:'upcoming', l:'תורים עתידיים', s:'תורים', c:myAssignments.length, color:'bg-blue-500'}, {id:'report', l:'דיווח והיסטוריה', s:'דיווח'}, {id:'constraints', l:'זמינות', s:'זמינות'}, {id:'issues', l:'תקלות', s:'תקלות', c:issuesCount, color:'bg-orange-500'}, {id:'tasks', l:'משימות', s:'משימות', c:myPendingTasks.length, color:'bg-red-500'}, {id:'profile', l:'פרופיל', s:'פרופיל'}].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded text-dynamic ${tab===t.id?'bg-indigo-600 text-white':''}`}>{mob ? t.s : t.l}{t.c > 0 && <span className={`${t.color} text-white text-xs px-1.5 py-0.5 rounded-full font-bold`}>{t.c}</span>}</button>
                        ))}
                    </div>
                    {tab==='upcoming' && <EmployeeUpcoming employee={employee} assignments={data.assignments||[]} settings={settings}/>}
                    {tab==='report' && <div className="space-y-8"><GroupReportForm employeeId={employee.id} employees={data.employees} settings={settings} onSave={()=>{}}/><div className="border-t border-gray-800 pt-8 mt-8"><h2 className="text-2xl font-bold mb-6">היסטוריית הדיווחים שלי</h2><EmployeeHistory employee={employee} groups={data.groups||[]} shifts={data.shifts||[]}/></div></div>}
                    {tab==='constraints' && <EmployeeConstraints employee={employee} constraints={data.constraints||[]} employees={data.employees||[]} settings={settings}/>}
                    {tab==='issues' && <EmployeeIssues employee={employee} issues={data.issues||[]} settings={settings}/>}
                    {tab==='tasks' && <EmployeeTasks employee={employee} tasks={data.tasks||[]}/>}
                    {tab==='profile' && <EmployeeProfile employee={employee} shifts={data.shifts||[]}/>}
                </div>
            );
        };

        // --- Admin Dashboards ---
        const AdminConstraints = ({ employees, constraints, settings, assignments }) => {
            const [offset, setOffset] = useState(0); const [slotsMap, setSlotsMap] = useState({}); const [loading, setLoading] = useState(false); const [syncing, setSyncing] = useState(false);
            const [reminding, setReminding] = useState(false);
            const doRemind = async () => {
                if (!confirm('לשלוח לכל העובדים התראה לדווח זמינות לשבוע הקרוב?')) return;
                setReminding(true);
                try {
                    const r = await fetch(PUSH_SEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: 'employees', title: 'תזכורת: דיווח זמינות', body: 'נא לעדכן זמינות לשבוע הקרוב', tab: 'availability' }) });
                    const d = await r.json().catch(() => ({}));
                    if (!d.success) alert('שליחת התזכורת נכשלה: ' + (d.error || ('שגיאה ' + r.status + ' (האם פונקציות השרת עודכנו?)')));
                    else alert(d.sent ? `התזכורת נשלחה ל-${d.sent} מכשירים.` : 'אין מכשירים רשומים להתראות. עובדים צריכים ללחוץ "הפעל התראות" באפליקציה.');
                } catch (e) { alert('שגיאת תקשורת: ' + e.message); } finally { setReminding(false); }
            };
            const [assignSlot, setAssignSlot] = useState(null); const [addApptSlot, setAddApptSlot] = useState(null); const [showNew, setShowNew] = useState(false); const [syncMsg, setSyncMsg] = useState('');
            const [zoom, setZoom] = useState(1);
            const ZOOMS = [0.5, 1, 1.5, 2, 2.5]; const zIdx = Math.max(0, ZOOMS.indexOf(zoom));
            const ROW_H = Math.round(28 * Math.max(1, zoom * 1.2)); const fs = Math.min(21, Math.round(11 * Math.max(1, zoom * 1.25))); const todayStr = ymd(new Date());
            const days = useMemo(() => { const ws = getWeekStart(new Date()); return Array.from({ length: 7 }, (_, i) => addDays(ws, offset * 7 + i)); }, [offset]);
            const fetchWeekSlots = async () => { setLoading(true); try { setSlotsMap(await fetchWeekSlotsMap(days[0])); } catch (e) {} finally { setLoading(false); } };
            useEffect(() => { fetchWeekSlots(); }, [offset]);
            const availCons = useMemo(() => (constraints || []).filter(c => c.type === 'available'), [constraints]);
            const empName = (id) => id === 'admin' ? 'מנהל' : ((employees || []).find(e => e.id === id) || {}).name || '';

            const dayModels = useMemo(() => {
                const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
                return days.map(d => {
                    const dStr = ymd(d); const existing = slotsMap[dStr] || [];
                    const items = existing.map(s => {
                        const dur = durOf(s); const cov = coveringEmployees(availCons, employees, dStr, s.time, dur);
                        const assignment = (assignments || []).find(a => a.id === `${dStr}_${s.time.replace(':', '')}`);
                        return { ...s, kind: s.isBooked ? 'booked' : (cov.length ? 'open' : 'uncovered'), dateStr: dStr, cov, assignment, dur };
                    });
                    const have = new Set(existing.map(s => s.time));
                    if (dStr >= todayStr) candidateTimes(d, settings.openingHours).forEach(t => {
                        if (have.has(t) || (dStr === todayStr && toMin(t) <= nowMin)) return;
                        if (existing.some(s => toMin(s.time) < toMin(t) + SLOT_MIN && toMin(s.time) + durOf(s) > toMin(t))) return;
                        const cov = coveringEmployees(availCons, employees, dStr, t); if (cov.length) items.push({ kind: 'planned', time: t, dateStr: dStr, cov, dur: SLOT_MIN });
                    });
                    return { d, dStr, items, range: getOpeningRange(d, settings.openingHours) };
                });
            }, [days, slotsMap, availCons, employees, assignments, settings.openingHours]);

            const allStarts = dayModels.flatMap(m => m.items.map(i => sortKey(i.time)));
            const allEnds = dayModels.flatMap(m => m.items.map(i => sortKey(i.time) + (i.dur || SLOT_MIN)));
            const gridStart = allStarts.length ? Math.max(0, Math.floor((Math.min(...allStarts) - 30) / 30) * 30) : 600;
            const gridEnd = allStarts.length ? Math.ceil((Math.max(...allEnds) + 30) / 30) * 30 : 1380;
            const rows = Math.max(1, Math.round((gridEnd - gridStart) / 30)); const gridH = rows * ROW_H;
            const yOf = (min) => ((min - gridStart) / 30) * ROW_H;
            const warnings = dayModels.flatMap(m => m.items.filter(i => i.kind === 'booked' && i.dateStr >= todayStr && i.cov.length === 0 && !i.assignment));
            const now = new Date(); const nowY = yOf(now.getHours() * 60 + now.getMinutes());

            const doSync = async () => {
                setSyncing(true); setSyncMsg('');
                try {
                    const map = await fetchWeekSlotsMap(days[0]); setSlotsMap(map);
                    const plan = computeSyncPlan({ weekStart: days[0], slotsMap: map, constraints: availCons, employees, settings });
                    if (!plan.toAdd.length && !plan.toRemove.length) { setSyncMsg('✅ היומן כבר מסונכרן עם הזמינות של העובדים.' + (plan.warnings.length ? ` ⚠️ ${plan.warnings.length} תורים שהוזמנו ללא עובד זמין.` : '')); return; }
                    const text = `סנכרון יומן Tor4You לפי זמינות העובדים:\n\n• ייפתחו ${plan.toAdd.length} תורים חדשים ללקוחות\n• ייסגרו ${plan.toRemove.length} תורים פנויים שאין להם עובד\n• תורים שכבר הוזמנו לא ייגעו ולא יימחקו לעולם${plan.warnings.length ? `\n\n⚠️ ${plan.warnings.length} תורים שהוזמנו ואין להם עובד זמין (רק התראה)` : ''}\n\nלהמשיך?`;
                    if (!confirm(text)) return;
                    const r = await runSyncQueued(() => executeSyncPlan(plan)); setSyncMsg('✅ ' + describeSync(r) + (r.errors.length ? '\n' + r.errors.join('\n') : ''));
                    await fetchWeekSlots();
                } catch (e) { setSyncMsg('❌ ' + e.message); } finally { setSyncing(false); }
            };
            const delRange = async (c) => { if (!confirm('למחוק את הזמינות הזו? היומן ב-Tor4You יתעדכן אוטומטית.')) return; try { await deleteDoc(getDocRef('constraints', c.id)); setSyncing(true); setSyncMsg('מעדכן את Tor4You...'); const rest = (constraints || []).filter(x => x.id !== c.id); const wk = getWeekStart(new Date(c.date + 'T12:00:00')); const r = await syncCalendarWeek({ weekStart: wk, constraints: rest, employees, settings }); setSyncMsg('✅ הזמינות נמחקה. ' + describeSync(r)); await fetchWeekSlots(); } catch (e) { setSyncMsg('❌ ' + e.message); } finally { setSyncing(false); } };

            const blockClass = { booked: 'bg-indigo-900/80 ring-1 ring-indigo-400 cursor-pointer hover:bg-indigo-800', open: 'bg-green-800/70 ring-1 ring-green-500 cursor-pointer hover:bg-green-700/80', uncovered: 'bg-red-900/70 ring-1 ring-red-500 cursor-pointer hover:bg-red-800/80', planned: 'border border-dashed border-green-400/70 bg-green-900/10' };
            const hourLabels = Array.from({ length: rows }, (_, i) => gridStart + i * 30);

            return (
                <div className="space-y-6 relative">
                    <Card title="יומן זמינות והזמנות (נבנה לפי הזמינות שהעובדים מסמנים)">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-3 gap-3">
                            <div className="flex items-center gap-3">
                                <Button onClick={() => setOffset(p => p - 1)}><ChevronRight size={16}/></Button>
                                <span className="flex items-center gap-2 font-bold text-lg">{formatDateIL(ymd(days[0]))} - {formatDateIL(ymd(days[6]))} {loading && <Loader className="w-4 h-4 animate-spin text-indigo-400"/>}</span>
                                <Button onClick={() => setOffset(p => p + 1)}><ChevronLeft size={16}/></Button>
                                {offset !== 0 && <Button variant="secondary" onClick={() => setOffset(0)}>השבוע</Button>}
                            </div>
                            <div className="flex gap-2 flex-wrap justify-center">
                                <Button onClick={() => setShowNew(true)}><Plus size={16}/> הוסף מועד חדש</Button>
                                <Button onClick={doSync} disabled={syncing} variant="outline" className="bg-yellow-500/10 border-yellow-500 text-yellow-500 hover:bg-yellow-500/20">{syncing ? <Loader className="animate-spin w-4 h-4"/> : <AlertTriangle size={18}/>} סנכרון יומן עם זמינות העובדים</Button>
                                <Button onClick={doRemind} disabled={reminding} variant="outline" className="bg-indigo-500/10 border-indigo-500 text-indigo-300 hover:bg-indigo-500/20">{reminding ? <Loader className="animate-spin w-4 h-4"/> : <Bell size={18}/>} שלח תזכורת זמינות לעובדים</Button>
                            </div>
                        </div>
                        {syncMsg && <div className="mb-3 text-sm bg-gray-800/70 border border-gray-700 rounded p-2 whitespace-pre-line">{syncMsg}</div>}
                        {warnings.length > 0 && <div className="mb-3 text-sm bg-red-900/30 border border-red-500/60 rounded p-3"><div className="font-bold text-red-300 mb-1">🚨 תורים שהוזמנו ואין עליהם עובד זמין ({warnings.length})</div>{warnings.map(w => <div key={w.dateStr + w.time}>{formatDateIL(w.dateStr)} בשעה {w.time} - {w.customerName || 'לקוח'} {w.customerPhone ? `(${w.customerPhone})` : ''}</div>)}</div>}
                        <div className="flex gap-3 text-xs mb-2 flex-wrap opacity-90"><span><span className="inline-block w-3 h-3 rounded bg-green-800 ring-1 ring-green-500 align-middle"></span> פנוי להזמנה</span><span><span className="inline-block w-3 h-3 rounded bg-indigo-900 ring-1 ring-indigo-400 align-middle"></span> הוזמן</span><span><span className="inline-block w-3 h-3 rounded bg-red-900 ring-1 ring-red-500 align-middle"></span> פתוח אך ללא עובד</span><span><span className="inline-block w-3 h-3 rounded border border-dashed border-green-400 align-middle"></span> ייפתח בסנכרון</span></div>
                        <div className="zoomctl"><button type="button" onClick={() => setZoom(ZOOMS[Math.max(0, zIdx - 1)])} className="bg-gray-800 border border-gray-700 rounded-lg text-white" aria-label="הקטן">−</button><span className="text-sm opacity-80">זום {Math.round(zoom * 100)}%</span><button type="button" onClick={() => setZoom(ZOOMS[Math.min(ZOOMS.length - 1, zIdx + 1)])} className="bg-gray-800 border border-gray-700 rounded-lg text-white" aria-label="הגדל">+</button><button type="button" onClick={() => setZoom(0.5)} className="bg-gray-800 border border-gray-700 rounded-lg text-white text-sm px-3">כל השבוע</button></div>
                        <div className="overflow-x-auto"><div style={{ minWidth: Math.round(860 * zoom) + 'px' }}>
                            <div className="flex gap-1 mb-1 text-center font-bold text-dynamic" style={{ fontSize: fs }}>
                                <div className="w-14 shrink-0" style={{ width: zoom > 1 ? 18 + fs * 3 : undefined }}></div>
                                {dayModels.map(m => <div key={m.dStr} className={`flex-1 p-2 rounded ${m.dStr === todayStr ? 'bg-indigo-700' : 'bg-gray-800'}`} style={{ fontSize: Math.max(12, fs - 1) }}>יום {DAY_NAMES_HE[m.d.getDay()]} {m.d.getDate()}/{m.d.getMonth() + 1}</div>)}
                            </div>
                            <div className="flex gap-1">
                                <div className="w-14 shrink-0 relative text-center" style={{ height: gridH, fontSize: fs, width: zoom > 1 ? 18 + fs * 3 : undefined }}>{hourLabels.map((mn, i) => <div key={mn} className={`absolute left-0 right-0 ${mn % 60 === 0 ? 'font-bold' : 'opacity-50'}`} style={{ top: i * ROW_H, height: ROW_H, lineHeight: ROW_H + 'px' }}>{minToTime(mn)}</div>)}</div>
                                {dayModels.map(m => (
                                    <div key={m.dStr} className="flex-1 relative rounded overflow-hidden bg-stone-700/40" style={{ height: gridH, backgroundImage: `repeating-linear-gradient(to bottom, transparent 0, transparent ${ROW_H - 1}px, rgba(255,255,255,0.07) ${ROW_H - 1}px, rgba(255,255,255,0.07) ${ROW_H}px)` }}>
                                        {m.range && <div className="absolute left-0 right-0 bg-gray-900/70" style={{ top: Math.max(0, yOf(m.range.open)), height: Math.max(0, Math.min(gridH, yOf(m.range.close)) - Math.max(0, yOf(m.range.open))), backgroundImage: `repeating-linear-gradient(to bottom, transparent 0, transparent ${ROW_H - 1}px, rgba(255,255,255,0.07) ${ROW_H - 1}px, rgba(255,255,255,0.07) ${ROW_H}px)` }}></div>}
                                        {!m.range && <div className="absolute inset-x-0 top-2 text-center text-xs opacity-40">סגור</div>}
                                        {m.dStr === todayStr && nowY >= 0 && nowY <= gridH && <div className="absolute left-0 right-0 border-t-2 border-red-500 z-20" style={{ top: nowY }}></div>}
                                        {m.items.map(i => {
                                            const top = yOf(sortKey(i.time)) + 1; const iDur = i.dur || SLOT_MIN; const h = (iDur / 30) * ROW_H - 2;
                                            const handler = i.kind === 'booked' ? () => setAssignSlot(i) : (i.kind === 'planned' ? null : () => setAddApptSlot(i));
                                            const operator = i.assignment ? empName(i.assignment.employeeId) : null;
                                            return (<div key={i.dateStr + i.time} onClick={handler || undefined} title={i.kind === 'planned' ? `יפתח בסנכרון · זמינים: ${i.cov.map(e => e.name).join(', ')}` : (i.cov && i.cov.length ? `זמינים: ${i.cov.map(e => e.name).join(', ')}` : '')} className={`absolute left-0.5 right-0.5 rounded px-1 text-white leading-tight overflow-hidden z-10 transition-colors ${blockClass[i.kind]}`} style={{ top, height: h, fontSize: fs }}>
                                                <div className="font-bold">{i.time}-{minToTime(toMin(i.time) + iDur)}{iDur >= DOUBLE_MIN ? ' · כפול' : ''}</div>
                                                {i.kind === 'booked' && <><div className="truncate">{i.customerName || 'לקוח'}{i.participants ? ` · ${i.participants}` : ''}</div><div className={`truncate ${operator ? 'text-green-300' : 'text-red-300'}`}>{operator || 'טרם שויך'}{i.cov.length === 0 && !operator ? ' ⚠️' : ''}</div></>}
                                                {i.kind === 'open' && <div className="truncate">פנויים: {i.cov.length} · הזמן +</div>}
                                                {i.kind === 'uncovered' && <div className="truncate">אין עובד</div>}
                                                {i.kind === 'planned' && <div className="truncate opacity-80">ייפתח</div>}
                                            </div>);
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div></div>
                    </Card>
                    <Card title="זמינות העובדים בשבוע שמוצג">
                        <div className="overflow-x-auto"><table className="w-full text-right text-sm min-w-[700px]"><thead className="text-gray-400 border-b border-gray-700"><tr><th className="py-2">עובד</th>{days.map(d => <th key={ymd(d)}>{DAY_NAMES_HE[d.getDay()]} {d.getDate()}/{d.getMonth() + 1}</th>)}</tr></thead><tbody>
                            {(employees || []).map(emp => (<tr key={emp.id} className="border-b border-gray-800 align-top"><td className="py-2 font-bold">{emp.name}</td>{days.map(d => { const dStr = ymd(d); const list = availCons.filter(c => c.employeeId === emp.id && c.date === dStr).sort((a, b) => toMin(a.startTime) - toMin(b.startTime)); return <td key={dStr} className="py-2">{list.length === 0 ? <span className="opacity-30">-</span> : list.map(c => <div key={c.id} className="text-xs whitespace-nowrap">{c.startTime}-{c.endTime} <button onClick={() => delRange(c)} className="text-red-400 mr-1"><Trash2 size={11}/></button></div>)}</td>; })}</tr>))}
                            {(employees || []).length === 0 && <tr><td colSpan="8" className="text-center py-4 opacity-60">אין עובדים</td></tr>}
                        </tbody></table></div>
                    </Card>
                    {assignSlot && <AssignModal slotData={assignSlot} onClose={() => setAssignSlot(null)} employees={employees} settings={settings} onRefresh={fetchWeekSlots} constraints={availCons} />}
                    {addApptSlot && <AddAppointmentModal slotData={addApptSlot} onClose={() => setAddApptSlot(null)} onRefresh={fetchWeekSlots} employees={employees} settings={settings} constraints={availCons} slotsMap={slotsMap} />}
                    {showNew && <AddAppointmentModal isNew slotData={{ dateStr: todayStr, time: '12:00' }} onClose={() => setShowNew(false)} onRefresh={fetchWeekSlots} employees={employees} settings={settings} constraints={availCons} slotsMap={slotsMap} />}
                </div>
            );
        };

        const AdminGroups = ({ groups, employees, settings, shifts }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7)); const [showManual, setShowManual] = useState(false); const [viewingGroup, setViewingGroup] = useState(null); const [filters, setFilters] = useState({ emp: '', room: '', type: '' }); 
            const monthGroups = (groups||[]).filter(g => (g.date||'').startsWith(month));
            const totalCash = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.cash) || 0), 0); const totalCredit = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.credit) || 0), 0); const totalBit = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.bit) || 0), 0); const totalTransfer = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.transfer) || 0), 0); const totalMega = monthGroups.reduce((acc, g) => acc + (Number(g.expectedMegaLaanRevenue) || 0), 0);
            const totalRevenue = totalCash + totalCredit + totalBit + totalTransfer + totalMega; 
            const filteredGroups = monthGroups.filter(g => (!filters.emp || g.employeeId === filters.emp) && (!filters.room || g.room === filters.room) && (!filters.type || g.groupType === filters.type)).sort((a,b) => new Date((b.date||'')+'T'+(b.time||'')) - new Date((a.date||'')+'T'+(a.time||'')));

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center"><div className="flex items-center gap-4"><MonthNav month={month} setMonth={setMonth}/><Button onClick={() => exportToXLSGroups(filteredGroups, employees, shifts, `Groups_${month}.xls`)} variant="success"><Download size={16}/> ייצוא הנתונים</Button></div><Button onClick={()=>setShowManual(true)}><Plus size={16}/> דיווח ידני</Button></div>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4"><Card className="text-center"><div className="opacity-70 text-sm">💵 מזומן</div><div className="text-xl font-bold">₪{totalCash}</div></Card><Card className="text-center"><div className="opacity-70 text-sm">💳 אשראי</div><div className="text-xl font-bold">₪{totalCredit}</div></Card><Card className="text-center"><div className="opacity-70 text-sm">📱 ביט והעברה</div><div className="text-xl font-bold">₪{totalBit+totalTransfer}</div></Card><Card className="text-center border-blue-500/30"><div className="text-blue-300 text-sm font-bold">🎟️ צפי שוברים</div><div className="text-xl font-bold text-blue-400">₪{totalMega}</div></Card><div className="card-bg rounded-xl p-4 text-center border-green-500 bg-green-900/20 shadow-[0_0_15px_rgba(74,222,128,0.2)]"><div className="text-green-300 text-xs font-bold tracking-wide">סך הכל הכנסות החודש</div><div className="text-2xl font-bold text-green-400 mt-1">₪{totalRevenue.toLocaleString()}</div></div></div>

        const loadXLSX = () => new Promise((resolve, reject) => {

            sc.onload = () => resolve(window.XLSX); sc.onerror = () => reject(new Error('לא ניתן לטעון את רכיב האקסל')); document.head.appendChild(sc);
        });
        const groupRevenue = (g) => (Number(g.payments?.cash)||0) + (Number(g.payments?.credit)||0) + (Number(g.payments?.bit)||0) + (Number(g.payments?.transfer)||0) + (Number(g.expectedMegaLaanRevenue)||0);
        const monthStats = (month, groups, shifts, employees, expenses) => {
            const mg = (groups||[]).filter(g => (g.date||'').startsWith(month));

        };
        const MonthlySummary = ({ month, groups, shifts, employees, expenses, settings }) => {

            const prev = useMemo(() => monthStats(shiftMonth(month, -1), groups, shifts, employees, expenses), [month, groups, shifts, employees, expenses]);
            const [email, setEmail] = useState(settings.reportEmail || ''); const [busy, setBusy] = useState(false);
            const fmt = (n) => Math.round(n).toLocaleString();
            const delta = (a, b) => b ? ((a - b) / Math.abs(b) * 100) : null;
            const Dl = ({ a, b, invert }) => { const d = delta(a, b); if (d === null) return <span className="opacity-40">-</span>; const good = invert ? d <= 0 : d >= 0; return <span className={good ? 'text-green-400' : 'text-red-400'}>{d >= 0 ? '+' : ''}{d.toFixed(0)}%</span>; };
            const rows = [['הכנסות', cur.revenue, prev.revenue, false, '₪'], ['מספר קבוצות', cur.count, prev.count, false, ''], ['ממוצע שחקנים לקבוצה', cur.avgPlayers, prev.avgPlayers, false, '', 1], ['שכר עובדים', cur.salaries, prev.salaries, true, '₪'], ['הוצאות', cur.expensesTotal, prev.expensesTotal, true, '₪'], ['רווח', cur.profit, prev.profit, false, '₪']];
            const allTimes = useMemo(() => { const set = new Set(); for (let i = 0; i < 7; i++) candidateTimes(new Date(2026, 0, 4 + i), settings.openingHours).forEach(t => set.add(t)); Object.keys(cur.byTime).forEach(t => set.add(t)); return [...set].sort((a, b) => sortKey(a) - sortKey(b)); }, [cur, settings.openingHours]);
            const counts = allTimes.map(t => ({ t, n: cur.byTime[t] || 0 })); const maxN = Math.max(1, ...counts.map(c => c.n));
            const busiest = [...counts].sort((a, b) => b.n - a.n).filter(c => c.n > 0).slice(0, 3); const emptiest = [...counts].sort((a, b) => a.n - b.n).slice(0, 3);
            const summaryText = () => `סיכום חודשי ${month} - ${settings.businessName || 'G-Room'}\n\nהכנסות: ₪${fmt(cur.revenue)}\nשכר עובדים: ₪${fmt(cur.salaries)}\nהוצאות: ₪${fmt(cur.expensesTotal)}\nרווח: ₪${fmt(cur.profit)}\n\nקבוצות: ${cur.count} (חודש קודם: ${prev.count})\nממוצע שחקנים לקבוצה: ${cur.avgPlayers.toFixed(1)}\nהנחות: ילדים ${cur.kids}, סטודנט/חייל/נכה ${cur.elig}, סה"כ הנחה ${cur.discPct.toFixed(1)}% (₪${fmt(cur.discAmt)})\nשעות עמוסות: ${busiest.map(b => `${b.t} (${b.n})`).join(', ') || '-'}\nשעות חלשות: ${emptiest.map(b => `${b.t} (${b.n})`).join(', ')}`;
            const saveEmail = async () => { try { await setDoc(getDocRef('app_settings', 'global'), { ...settings, reportEmail: email.trim() }, { merge: true }); } catch (e) {} };
            const sendMail = () => { saveEmail(); window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email.trim())}&su=${encodeURIComponent('סיכום חודשי ' + month)}&body=${encodeURIComponent(summaryText())}`, '_blank'); };
            const exportXlsx = async () => {
                setBusy(true);
                try {
                    const X = await loadXLSX(); const wb = X.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
                    const empName = (id) => id === 'admin' ? 'מנהל' : ((employees||[]).find(e => e.id === id) || {}).name || '';
                    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['סעיף', 'סכום'], ['הכנסות', Math.round(cur.revenue)], ['שכר עובדים', Math.round(cur.salaries)], ['הוצאות', Math.round(cur.expensesTotal)], ['רווח', Math.round(cur.profit)], [], ['קבוצות', cur.count], ['ממוצע שחקנים', +cur.avgPlayers.toFixed(2)], ['ילדים (שחקנים)', cur.kids], ['סטודנט/חייל/נכה (שחקנים)', cur.elig], ['מחיר מקורי', Math.round(cur.orig)], ['מחיר סופי', Math.round(cur.fin)], ['אחוז הנחה כולל', +cur.discPct.toFixed(1)]]), 'סיכום');
                    const g = [...cur.groups].sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
                    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(g.map(x => ({ 'תאריך': x.date, 'שעה': x.time, 'לקוח': x.customerName, 'שחקנים': Number(x.totalPlayers)||0, 'סוג': x.groupType || '', 'מקור': x.source || '', 'מפעיל': empName(x.employeeId), 'מחיר מקורי': Number(x.totalOriginalPrice)||0, 'מחיר סופי': Number(x.finalPriceToPay)||0, 'מזומן': Number(x.payments?.cash)||0, 'אשראי': Number(x.payments?.credit)||0, 'ביט': Number(x.payments?.bit)||0, 'העברה': Number(x.payments?.transfer)||0 }))), 'הכנסות');
                    const ex = (expenses||[]).filter(e => isMonthInRange(month, e.fromMonth, e.toMonth));
                    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(ex.map(e => ({ 'תיאור': e.name, 'קטגוריה': e.category, 'חשבונית': e.invoiceNumber || '', 'סכום כולל': e.totalAmount, 'מחודש': e.fromMonth, 'עד חודש': e.toMonth, 'חלק החודש': +(e.monthlyAmount||0).toFixed(2) }))), 'הוצאות');
                    const sh = (shifts||[]).filter(s => (s.date||'').startsWith(month) && s.status !== 'rejected').sort((a, b) => `${a.date}`.localeCompare(`${b.date}`));

                    X.writeFile(wb, `G-Room_${month}.xlsx`);
                } catch (e) { alert('הייצוא נכשל: ' + e.message); } finally { setBusy(false); }
            };
            return (<Card title="סיכום חודשי והשוואה לחודש קודם" className="border-indigo-500/30"><div className="space-y-4">
                <div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="opacity-70 border-b border-gray-700"><tr><th className="py-1">מדד</th><th>{month}</th><th>{shiftMonth(month, -1)}</th><th>שינוי</th></tr></thead><tbody className="divide-y divide-gray-800">
                    {rows.map(r => (<tr key={r[0]}><td className="py-2">{r[0]}</td><td className="font-bold">{r[4]}{r[5] ? r[1].toFixed(1) : fmt(r[1])}</td><td className="opacity-70">{r[4]}{r[5] ? r[2].toFixed(1) : fmt(r[2])}</td><td><Dl a={r[1]} b={r[2]} invert={r[3]} /></td></tr>))}
                </tbody></table></div>
                <div className="text-xs bg-gray-900/60 border border-gray-700 rounded p-3 space-y-1"><div className="font-bold text-indigo-300">הנחות החודש</div><div>ילדים: {cur.kids} שחקנים · סטודנט/חייל/נכה: {cur.elig} שחקנים</div><div>הנחה כוללת: <b>{cur.discPct.toFixed(1)}%</b> (₪{fmt(cur.discAmt)} ממחיר מקורי ₪{fmt(cur.orig)})</div></div>
                <div><div className="text-sm font-bold mb-2">עומס לפי שעת תור</div><div className="space-y-1">{counts.map(c => (<div key={c.t} className="flex items-center gap-2 text-xs"><span className="w-12 opacity-70">{c.t}</span><div className="flex-1 bg-gray-800 rounded h-3 overflow-hidden"><div className={c.n === 0 ? '' : 'bg-indigo-500 h-3'} style={{ width: `${c.n / maxN * 100}%` }}></div></div><span className="w-6 text-left">{c.n}</span></div>))}</div>

        const AdminExpenses = ({ expenses, groups, shifts, employees, settings }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7)); const [showForm, setShowForm] = useState(false); const [editingExpense, setEditingExpense] = useState(null);
            const [expName, setExpName] = useState(''); const [expCategory, setExpCategory] = useState('שכירות'); const [customCategory, setCustomCategory] = useState(''); const [expAmount, setExpAmount] = useState(''); const [expFrom, setExpFrom] = useState(month); const [expTo, setExpTo] = useState(month); const [expInvoice, setExpInvoice] = useState(''); const [saving, setSaving] = useState(false);
            const defaultCats = ['שכירות','חשמל','מים','ארנונה','שיווק ופרסום','תחזוקה וציוד','ביטוח','תוכנה ודיגיטל']; const dynamicCats = [...new Set([...defaultCats, ...(expenses||[]).map(e => e.category)])].filter(Boolean);
            const quickCats = useMemo(() => { const counts = (expenses||[]).reduce((acc, ex) => { acc[ex.category] = (acc[ex.category]||0) + 1; return acc; }, {}); const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]); return top.length > 0 ? top : ['שכירות', 'חשמל', 'שיווק ופרסום', 'תחזוקה וציוד']; }, [expenses]);

            const handleAddExpense = async (e) => { e.preventDefault(); if (expFrom > expTo) return alert('חודש סיום לפני התחלה'); const cat = expCategory === 'אחר' ? customCategory : expCategory; if (!cat) return alert('נא להזין קטגוריה'); setSaving(true); const ratio = Number(expAmount) / getMonthsDifference(expFrom, expTo); try { await addDoc(getCollectionRef('expenses'), { name: expName, category: cat, totalAmount: Number(expAmount), fromMonth: expFrom, toMonth: expTo, monthlyAmount: ratio, invoiceNumber: expInvoice, createdAt: new Date().toISOString() }); setShowForm(false); setExpName(''); setExpAmount(''); setCustomCategory(''); setExpInvoice(''); } catch(err) { alert(err.message); } finally { setSaving(false); } };

            const monthGroups = (groups||[]).filter(g => (g.date||'').startsWith(month)); const totalRevenue = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.cash)||0) + (Number(g.payments?.credit)||0) + (Number(g.payments?.bit)||0) + (Number(g.payments?.transfer)||0) + (Number(g.expectedMegaLaanRevenue)||0), 0);
            let totalSalaries = 0; const monthlyShifts = (shifts||[]).filter(s => (s.date||'').startsWith(month) && s.status !== 'rejected'); monthlyShifts.forEach(s => { const emp = (employees||[]).find(e => e.id === s.employeeId); totalSalaries += (Number(s.gamesCount) * (s.wageAtTime || emp?.wagePerGame || 0)); });
            const activeExpenses = (expenses||[]).filter(ex => isMonthInRange(month, ex.fromMonth, ex.toMonth)); const totalExpenses = activeExpenses.reduce((acc, ex) => acc + ex.monthlyAmount, 0); const netProfit = totalRevenue - totalSalaries - totalExpenses;
            const expByCategory = activeExpenses.reduce((acc, ex) => { acc[ex.category] = (acc[ex.category] || 0) + ex.monthlyAmount; return acc; }, {});
            const maxVal = Math.max(totalRevenue, totalSalaries + totalExpenses); const revPct = maxVal > 0 ? (totalRevenue / maxVal) * 100 : 0; const salaryPct = maxVal > 0 ? (totalSalaries / maxVal) * 100 : 0; const graphColors = ['#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#14b8a6', '#6366f1'];

            const exportFinancialXLS = () => {
                let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><h2>דוח פיננסי ERP - ${month}</h2><table><tr style="background-color:#bbf7d0;font-weight:bold;"><td>סעיף</td><td>סכום</td></tr><tr><td>סה"כ הכנסות ברוטו</td><td>₪${totalRevenue.toFixed(2)}</td></tr><tr><td>הוצאות שכר עובדים</td><td>-₪${totalSalaries.toFixed(2)}</td></tr><tr><td>הוצאות תפעול שוטפות</td><td>-₪${totalExpenses.toFixed(2)}</td></tr><tr style="background-color:#86efac;font-weight:bold;font-size:16px;"><td>רווח נקי לחודש זה</td><td>₪${netProfit.toFixed(2)}</td></tr><tr><td colspan="2" style="height:20px;"></td></tr><tr style="background-color:#e2e8f0;font-weight:bold;"><td>פירוט הוצאות החודש</td><td>קטגוריה</td><td>חשבונית</td><td>סכום יחסי לחודש</td><td>תקופה מלאה</td></tr>`;
