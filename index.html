                                        <tr key={s.id} className="hover:bg-gray-800/30">
                                            <td className="py-2 font-bold">{e?.name || 'לא נמצא'}</td><td>{formatDateIL(s.date)}</td><td>{s.startTime}</td><td>{s.room}</td><td>{s.gamesCount}</td><td>₪{wage}</td>
                                            <td className="flex gap-2 py-2"><Button size="sm" variant="success" onClick={()=>handleShiftStatus(s.id, 'approved')}><Check size={14}/></Button><Button size="sm" variant="danger" onClick={()=>handleShiftStatus(s.id, 'rejected')}><XIcon size={14}/></Button><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-400 mr-2"><Trash2 size={14}/></button></td>
                                        </tr>
                                    )
                                })}
                            </tbody></table></div>
                        </Card>
                    )}
                    <div className="flex justify-between items-center card-bg p-4 rounded-xl">
                        <div><h2 className="text-xl font-bold text-dynamic">דוחות שכר ({month})</h2><p className="opacity-80">סה"כ לתשלום: <span className="text-green-400 font-bold">₪{totalPay.toLocaleString()}</span></p></div>
                        <div className="flex gap-2"><input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/><Button onClick={() => exportToXLSSalary(report, `Salary_Report_${month}.xls`)} variant="success"><Download size={16}/> אקסל</Button></div>
                    </div>
                    <div className="space-y-4">
                        {report.map(r => (
                            <div key={r.id} className="card-bg rounded-xl overflow-hidden">
                                <div className="p-4 flex justify-between items-center">
                                    <div className="flex items-center gap-3"><div className="h-10 w-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-white">{r.name[0]}</div><span className="text-lg font-bold text-dynamic">{r.name}</span></div>
                                    <div className="text-green-400 font-bold text-xl">₪{r.totalWage}</div>
                                    <a href={getMailLink(r)} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 shadow-md transition-all border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20"><Mail size={16}/> שליחת תלוש</a>
                                </div>
                                {r.empShifts.length > 0 && (
                                    <div className="bg-black/20 p-2 text-sm border-t border-gray-800"><div className="grid grid-cols-7 text-gray-500 mb-2 px-2 text-xs font-bold"><div>תאריך</div><div>שעה</div><div>חדר</div><div>משחקים</div><div>תעריף</div><div>סה"כ</div><div>מחק</div></div>
                                        {r.empShifts.map(s => {
                                            const w = s.wageAtTime || r.wagePerGame || 0;
                                            return (
                                            <div key={s.id} className="grid grid-cols-7 py-2 px-2 border-b border-gray-800 items-center hover:bg-white/5 text-dynamic opacity-80">
                                                <div>{formatDateIL(s.date)}</div><div>{s.startTime}</div><div>{s.room}</div><div>{s.gamesCount}</div><div>₪{w}</div><div>₪{s.gamesCount * w}</div>
                                                <button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-500"><Trash2 size={14}/></button>
                                            </div>
                                        )})}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminIssues = ({ issues, employees, settings }) => {
            const pendingIssues = issues.filter(i => i.status === 'pending').sort((a,b) => new Date(a.reportedAt) - new Date(b.reportedAt));
            const doneIssues = issues.filter(i => i.status === 'done').sort((a,b) => new Date(b.reportedAt) - new Date(a.reportedAt));

            const [room, setRoom] = useState('');
            const [desc, setDesc] = useState('');
            const [saving, setSaving] = useState(false);
            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);

            const submitIssue = async (e) => {
                e.preventDefault(); setSaving(true);
                try {
                    await addDoc(getCollectionRef('issues'), {
                        room, description: desc, reportedBy: 'admin', reportedByName: 'מנהל מערכת',
                        status: 'pending', priority: 'רגילה', reportedAt: new Date().toISOString()
                    });
                    alert('התקלה דווחה ונוספה לרשימה.'); setDesc('');
                } catch(err) { alert(err.message); } finally { setSaving(false); }
            };

            const handlePriority = async (id, priority) => { await updateDoc(getDocRef('issues', id), { priority }); };
            const handleResolve = async (id) => { await updateDoc(getDocRef('issues', id), { status: 'done', resolvedAt: new Date().toISOString() }); };

            const getPriorityColor = (p) => {
                if(p === 'דחופה') return 'text-red-400 bg-red-400/10 border-red-400/30';
                if(p === 'רגילה') return 'text-yellow-400 bg-yellow-400/10 border-yellow-400/30';
                return 'text-green-400 bg-green-400/10 border-green-400/30';
            };

            return (
                <div className="space-y-6">
                    <Card title="דיווח על תקלה חדשה (מנהל)">
                        <form onSubmit={submitIssue} className="flex gap-4 items-end">
                            <div className="flex-1"><label className="text-sm opacity-70">חדר</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={room} onChange={e=>setRoom(e.target.value)} required>{roomList.map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                            <div className="flex-[3]"><label className="text-sm opacity-70">תיאור התקלה</label><input type="text" className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={desc} onChange={e=>setDesc(e.target.value)} required placeholder="מה נשבר / לא עובד?"/></div>
                            <Button type="submit" variant="primary" disabled={saving}>{saving ? 'שולח...' : 'הוסף תקלה'}</Button>
                        </form>
                    </Card>

                    <Card title="תקלות בטיפול (פתוחות)">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="opacity-70 border-b border-gray-700"><tr><th>זמן דיווח</th><th>חדר</th><th>תיאור התקלה</th><th>מדווח</th><th>עדיפות לטיפול</th><th>פעולות</th></tr></thead>
                                <tbody className="divide-y divide-gray-800">
                                    {pendingIssues.length === 0 && <tr><td colSpan="6" className="text-center py-6 opacity-60">החדרים במצב מושלם! אין תקלות פתוחות.</td></tr>}
                                    {pendingIssues.map(i => (
                                        <tr key={i.id} className="hover:bg-white/5">
                                            <td className="py-3 text-xs opacity-70">{formatDateTimeIL(i.reportedAt)}</td>
                                            <td className="font-bold">{i.room}</td>
                                            <td className="max-w-xs whitespace-normal">{i.description}</td>
                                            <td className="opacity-80">{i.reportedByName}</td>
                                            <td>
                                                <select className={`border rounded p-1 text-xs outline-none focus:ring-1 ${getPriorityColor(i.priority)}`} value={i.priority} onChange={(e)=>handlePriority(i.id, e.target.value)}>
                                                    <option value="נמוכה" className="bg-gray-800 text-white">נמוכה</option><option value="רגילה" className="bg-gray-800 text-white">רגילה</option><option value="דחופה" className="bg-gray-800 text-white">דחופה</option>
                                                </select>
                                            </td>
                                            <td className="flex items-center gap-2 py-2">
                                                <Button size="sm" variant="success" onClick={()=>handleResolve(i.id)}>טופל <Check size={14}/></Button>
                                                <button onClick={()=>confirm("למחוק דיווח?") && deleteDoc(getDocRef('issues', i.id))} className="text-red-400 p-2"><Trash2 size={16}/></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    <Card title="היסטוריית תקלות שטופלו">
                        <div className="overflow-x-auto opacity-70">
                            <table className="w-full text-right text-sm">
                                <thead className="border-b border-gray-700"><tr><th>זמן דיווח</th><th>חדר</th><th>תיאור התקלה</th><th>מדווח</th><th>זמן טיפול סופי</th></tr></thead>
                                <tbody className="divide-y divide-gray-800">
                                    {doneIssues.length === 0 && <tr><td colSpan="5" className="text-center py-4">אין תקלות שטופלו עדיין.</td></tr>}
                                    {doneIssues.map(i => (
                                        <tr key={i.id}>
                                            <td className="py-2 text-xs">{formatDateTimeIL(i.reportedAt)}</td>
                                            <td>{i.room}</td><td className="line-through">{i.description}</td><td>{i.reportedByName}</td>
                                            <td className="text-xs">{formatDateTimeIL(i.resolvedAt)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const AdminEmployees = ({ employees }) => {
            const [open, setOpen] = useState(false);
            const [edit, setEdit] = useState(null);
            const [saving, setSaving] = useState(false);
            const save = async (e) => { e.preventDefault(); setSaving(true); const fd = new FormData(e.target); const d = { name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), code: fd.get('code'), address: fd.get('address'), birthday: fd.get('birthday'), wagePerGame: Number(fd.get('wagePerGame')), form101: fd.get('form101') === 'on', skills: fd.get('skills').split(',').map(s=>s.trim()) }; try { if(edit) await updateDoc(getDocRef('employees', edit.id), d); else await addDoc(getCollectionRef('employees'), d); setOpen(false); } catch(e) { alert(e.message); } finally { setSaving(false); } };
            return (
                <div className="space-y-6">
                    <div className="flex justify-between"><h2 className="text-2xl font-bold text-dynamic">ניהול עובדים</h2><Button onClick={()=>{setEdit(null); setOpen(true);}}><Plus size={18}/> הוסף עובד</Button></div>
                    <div className="grid md:grid-cols-3 gap-4">
                        {employees.map(e => (
                            <Card key={e.id} className="relative group hover:border-indigo-500">
                                <div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 flex gap-2"><button onClick={()=>{setEdit(e); setOpen(true);}} className="bg-gray-900 p-1 rounded text-indigo-400">ערוך</button><button onClick={()=>confirm("למחוק?") && deleteDoc(getDocRef('employees', e.id))} className="bg-gray-900 p-1 rounded text-red-400"><Trash2 size={16}/></button></div>
                                <h3 className="font-bold text-lg">{e.name}</h3><p className="text-sm opacity-70">{e.phone}</p><div className="mt-2 text-sm opacity-60"><div>קוד: {e.code}</div><div>תעריף: ₪{e.wagePerGame}</div></div>
                            </Card>
                        ))}
                    </div>
                    {open && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto"><h3 className="text-xl font-bold mb-4">{edit ? 'עריכה' : 'חדש'}</h3><form onSubmit={save} className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="שם" name="name" required defaultValue={edit?.name}/><Input label="טלפון" name="phone" required defaultValue={edit?.phone}/><Input label="מייל" name="email" type="email" required defaultValue={edit?.email}/><Input label="קוד" name="code" required defaultValue={edit?.code}/><Input label="כתובת" name="address" className="col-span-2" defaultValue={edit?.address}/><Input label="יום הולדת" name="birthday" type="date" defaultValue={edit?.birthday}/><Input label="שכר למשחק" name="wagePerGame" type="number" required defaultValue={edit?.wagePerGame}/><Input label="הסמכות (מופרד בפסיק)" name="skills" className="col-span-2" defaultValue={edit?.skills?.join(', ')}/></div><div className="flex gap-2"><input type="checkbox" name="form101" defaultChecked={edit?.form101}/> <label>טופס 101</label></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'שמור בענן'}</Button></div></form></div></div>}
                </div>
            );
        };
