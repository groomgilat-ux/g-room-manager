<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Room Manager ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>
    <style>
        :root { --app-bg: #030712; --app-text: #ffffff; --app-card-bg: rgba(255, 255, 255, 0.05); --app-border: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--app-bg); color: var(--app-text); font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        .card-bg { background-color: var(--app-card-bg); border: 1px solid var(--app-border); }
        .text-dynamic { color: var(--app-text) !important; }
        .border-dynamic { border-color: var(--app-border) !important; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input[type="date"], input[type="month"], input[type="time"], select { color-scheme: dark; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { User, Users, Calendar, DollarSign, Settings, LogOut, Plus, Clock, FileText, Mail, CheckCircle, XCircle, Lock, AlertTriangle, X as XIcon, Edit2, CheckSquare, Coins, LineChart, Receipt, Download, Trash2, Check, ChevronRight, ChevronLeft, Loader, Bell, Wrench, History, MessageCircle } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from 'firebase/firestore';

        const firebaseConfig = { apiKey: "AIzaSyBvayS247KEOVqZloFrNWV3svg4DSiNG08", authDomain: "g-room-escape-room-management.firebaseapp.com", projectId: "g-room-escape-room-management", storageBucket: "g-room-escape-room-management.firebasestorage.app", messagingSenderId: "361117379721", appId: "1:361117379721:web:3019eaeb30f4fe188caa58" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app, 'groom');
        
        const API_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net";
        const TOR4YOU_ADD_APPT_URL = `${API_URL}/addTor4YouAppointment`;
        const TOR4YOU_DELETE_URL = `${API_URL}/deleteTor4YouSlots`;
        const TOR4YOU_WEEK_URL = `${API_URL}/getTor4YouWeekSlots`;
        const TOR4YOU_FUNCTION_URL = `${API_URL}/getTor4YouAppts`;

        const getCollectionRef = (n) => collection(db, n); const getDocRef = (n, id) => doc(db, n, id);
        
        const INITIAL_SETTINGS = { 
            businessName: 'G-Room Escape', adminCode: 'admin123', primaryColor: '#030712', secondaryColor: '#ffffff', roomsList: 'סודו של הודיני', 
            pricing: { basePrice2: 140, basePrice3: 125, basePrice4: 110, basePrice5: 100, basePrice6to8: 90, basePrice9to10: 80, discountKids: 15, discountEligible: 10 }, 
            emailTemplate: { subject: 'G-Room: תלוש שכר {month}/{year}', body: 'היי {name},\nמצורף תלוש.\nבברכה,\nהנהלת G-Room' },
            openingHours: { Sunday: { start: '10:00', end: '23:00' }, Monday: { start: '10:00', end: '23:00' }, Tuesday: { start: '10:00', end: '23:00' }, Wednesday: { start: '10:00', end: '23:00' }, Thursday: { start: '10:00', end: '01:00' }, Friday: { start: '09:00', end: '15:00' }, Saturday: { start: '18:00', end: '01:00' } }
        };

        const formatDateIL = (ds) => { const d = new Date(ds); return isNaN(d)?'':d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'2-digit'}); };
        const formatDateTimeIL = (is) => { const d = new Date(is); return isNaN(d)?'':d.toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); };
        const addTime = (ts, m) => { if(!ts) return ''; const [hh, mm] = ts.split(':').map(Number); const d = new Date(); d.setHours(hh, mm+m); return d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit',hour12:false}); };
        const getBasePrice = (pStr, pr) => { const p = Number(pStr)||0; if(p<=2) return Number(pr?.basePrice2)||140; if(p===3) return Number(pr?.basePrice3)||125; if(p===4) return Number(pr?.basePrice4)||110; if(p===5) return Number(pr?.basePrice5)||100; if(p>=6 && p<=8) return Number(pr?.basePrice6to8)||90; return Number(pr?.basePrice9to10)||80; };
        const getMonthsDifference = (s, e) => { if(!s||!e) return 1; const d1=new Date(s+'-01'), d2=new Date(e+'-01'); let m=(d2.getFullYear()-d1.getFullYear())*12; m-=d1.getMonth(); m+=d2.getMonth(); return m<=0?1:m+1; };
        const isMonthInRange = (tm, sm, em) => tm>=sm && tm<=em;
        const generateTimeOptions = () => { const options = []; for(let i=0; i<24; i++) { for(let j=0; j<60; j+=15) { options.push(`${i.toString().padStart(2,'0')}:${j.toString().padStart(2,'0')}`); } } return options; };
        const exportToXLS = (html, fn) => { const blob=new Blob([`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><table>${html}</table></body></html>`], {type:'application/vnd.ms-excel'}); const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download=fn; document.body.appendChild(link); link.click(); };
        const timeoutPromise = (p, ms=5000) => Promise.race([p, new Promise((_, r)=>setTimeout(()=>r(new Error("Timeout")), ms))]);

        const Button = ({ children, onClick, variant='primary', className='', disabled, ...props }) => { const v = { primary: "bg-indigo-600 hover:bg-indigo-700 text-white", secondary: "bg-gray-700 hover:bg-gray-600 text-white", danger: "bg-red-600 hover:bg-red-700 text-white", success: "bg-green-600 hover:bg-green-700 text-white", outline: "border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20" }; return <button onClick={onClick} className={`px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 transition-all disabled:opacity-50 ${v[variant]} ${className}`} disabled={disabled} {...props}>{children}</button>; };
        const Card = ({ title, children, className='' }) => (<div className={`card-bg rounded-xl p-6 shadow-xl ${className}`}>{title && <h3 className="text-xl font-bold text-dynamic mb-4 border-b border-gray-700 pb-2">{title}</h3>}<div className="text-dynamic">{children}</div></div>);
        const Input = ({ label, type="text", value, onChange, className="", ...props }) => (<div className={`flex flex-col gap-1 ${className}`}>{label && <label className="text-sm opacity-70 font-medium text-dynamic">{label}</label>}<input type={type} value={value} onChange={onChange} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" {...props} /></div>);
        const StatusBadge = ({ status }) => { if(status==='approved') return <span className="text-green-400 flex items-center gap-1 text-xs"><CheckCircle size={14}/> אושר</span>; if(status==='rejected') return <span className="text-red-400 flex items-center gap-1 text-xs"><XCircle size={14}/> נדחה</span>; return <span className="text-yellow-400 flex items-center gap-1 text-xs"><Clock size={14}/> ממתין</span>; };

        // --- Modals ---
        const AddAppointmentModal = ({ slotData, onClose, onRefresh, employees }) => {
            const [first, setFirst] = useState(''); const [last, setLast] = useState(''); const [cell, setCell] = useState(''); const [email, setEmail] = useState(''); const [parts, setParts] = useState(2); const [saving, setSaving] = useState(false); const [selectedEmp, setSelectedEmp] = useState('');
            const handleAdd = async (e) => {
                e.preventDefault(); setSaving(true);
                try {
                    const res = await fetch(TOR4YOU_ADD_APPT_URL, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ slotid: slotData.id, vfib: slotData.vfib, staff: slotData.staff, service: slotData.service, first, last, cell, email, participants: parts }) 
                    });
                    const data = await res.json();
                    if(data.success) { 
                        if(selectedEmp) {
                            const assignId = `${slotData.dateStr}_${slotData.time.replace(':','')}`;
                            await setDoc(getDocRef('assignments', assignId), { date: slotData.dateStr, time: slotData.time, customerName: `${first} ${last}`.trim(), customerPhone: cell, employeeId: selectedEmp, room: 'סודו של הודיני' });
                        }
                        alert('התור הוזמן בהצלחה ונרשם ב-Tor4You!'); onRefresh(); onClose(); 
                    } 
                    else alert(`שגיאה מהשרת: ${data.error}`);
                } catch (err) { alert('שגיאת תקשורת: ' + err.message); } finally { setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700 shadow-2xl" onClick={e=>e.stopPropagation()}><h3 className="text-xl font-bold mb-4 border-b border-gray-700 pb-2">הזמנת תור חדש</h3><div className="text-sm opacity-80 mb-4 bg-gray-800 p-2 rounded">קביעת תור ליום {formatDateIL(slotData.dateStr)} בשעה {slotData.time}</div><form onSubmit={handleAdd} className="space-y-3"><div className="grid grid-cols-2 gap-4"><Input label="שם פרטי" value={first} onChange={e=>setFirst(e.target.value)} required /><Input label="שם משפחה" value={last} onChange={e=>setLast(e.target.value)} /></div><Input label="טלפון נייד" type="tel" value={cell} onChange={e=>setCell(e.target.value)} required /><Input label="אימייל (אופציונלי)" type="email" value={email} onChange={e=>setEmail(e.target.value)} /><Input label="כמות שחקנים" type="number" min="2" value={parts} onChange={e=>setParts(e.target.value)} required /><div className="flex flex-col gap-1 border-t border-gray-700 pt-3 mt-3"><label className="text-sm opacity-70">שיוך מפעיל (אופציונלי)</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white" value={selectedEmp} onChange={e=>setSelectedEmp(e.target.value)}><option value="">-- בחר מי יפעיל --</option><option value="admin">מנהל מערכת</option>{(employees||[]).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={onClose} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving ? 'שומר...' : 'הזמן תור'}</Button></div></form></div></div>);
        };

        const AssignModal = ({ slotData, onClose, employees, settings }) => {
            const [selectedEmp, setSelectedEmp] = useState(''); const [saving, setSaving] = useState(false);
            const roomName = (settings.roomsList || 'סודו של הודיני').split(',')[0].trim();
            const handleAssign = async () => {
                if(!selectedEmp) return alert('בחר עובד לשיוך'); setSaving(true);
                try {
                    const assignId = `${slotData.dateStr}_${slotData.time.replace(':','')}`;
                    await setDoc(getDocRef('assignments', assignId), { date: slotData.dateStr, time: slotData.time, customerName: slotData.customerName, customerPhone: slotData.customerPhone, employeeId: selectedEmp, room: roomName });
                    alert('התור שויך בהצלחה!'); onClose();
                } catch(e) { alert(e.message); setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-sm border border-gray-700 shadow-2xl" onClick={e=>e.stopPropagation()}><h3 className="text-xl font-bold mb-4 border-b border-gray-700 pb-2">שיוך תור למפעיל</h3><div className="text-sm opacity-80 mb-4 space-y-1"><div><strong>זמן:</strong> {formatDateIL(slotData.dateStr)} בשעה {slotData.time}</div><div><strong>לקוח:</strong> {slotData.customerName}</div><div><strong>טלפון:</strong> {slotData.customerPhone || 'אין'}</div></div><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white mb-4" value={selectedEmp} onChange={e=>setSelectedEmp(e.target.value)}><option value="">-- בחר מי יפעיל --</option><option value="admin">מנהל מערכת</option>{(employees||[]).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select><div className="flex gap-2"><Button variant="secondary" onClick={onClose} className="flex-1">ביטול</Button><Button onClick={handleAssign} disabled={saving} className="flex-1">{saving?'שומר...':'שייך מפעיל'}</Button></div></div></div>);
        };

        const EditGroupModal = ({ group, onClose, employees }) => {
            const [pays, setPays] = useState(group.payments || {cash:0, credit:0, bit:0, transfer:0}); const [inv, setInv] = useState(group.invoiceNumber || ''); const [saving, setSaving] = useState(false);
            const empName = group.employeeId === 'admin' ? 'מנהל' : ((employees||[]).find(e => e.id === group.employeeId)?.name || 'לא ידוע');
            const totalEntered = (Number(pays.cash)||0) + (Number(pays.credit)||0) + (Number(pays.bit)||0) + (Number(pays.transfer)||0); const balance = group.finalPriceToPay - totalEntered;
            const handleSave = async () => {
                if (balance !== 0) return alert(`פער בתשלום! סה"כ העסקה: ₪${group.finalPriceToPay}. הוזן: ₪${totalEntered}`); setSaving(true);
                try { await updateDoc(getDocRef('groups', group.id), { payments: { cash: Number(pays.cash)||0, credit: Number(pays.credit)||0, bit: Number(pays.bit)||0, transfer: Number(pays.transfer)||0 }, invoiceNumber: inv }); onClose(); } catch(e) { alert(e.message); setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-xl border border-gray-700 shadow-2xl max-h-[95vh] overflow-y-auto" onClick={e=>e.stopPropagation()}><div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-3"><h3 className="text-xl font-bold">פרטי דיווח - {group.customerName}</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><XIcon size={20}/></button></div><div className="grid grid-cols-2 gap-y-3 gap-x-4 text-sm mb-4 bg-gray-800/50 p-4 rounded-lg"><div><span className="opacity-60">תאריך ושעה:</span> <strong className="float-left">{formatDateIL(group.date)} {group.time}</strong></div><div><span className="opacity-60">חדר:</span> <strong className="float-left">{group.room}</strong></div><div><span className="opacity-60">שחקנים:</span> <strong className="float-left">{group.totalPlayers}</strong></div><div><span className="opacity-60">מפעיל:</span> <strong className="float-left">{empName}</strong></div><div><span className="opacity-60">הרכב קבוצה:</span> <strong className="float-left">{group.groupType}</strong></div><div><span className="opacity-60">מקור הגעה:</span> <strong className="float-left">{group.source}</strong></div></div><div className="bg-gray-800 p-4 rounded-lg mb-6 shadow-inner"><h4 className="font-bold border-b border-gray-700 pb-2 mb-3 text-indigo-400 flex items-center gap-2"><DollarSign size={16}/> תחשיב העסקה</h4><div className="space-y-2"><div className="flex justify-between text-sm"><span>מחיר בסיס:</span> <span>₪{group.totalOriginalPrice}</span></div>{!group.hasMegaLaan && group.totalDiscountAmount > 0 && <div className="flex justify-between text-sm text-red-400"><span>הנחות:</span> <span>-₪{group.totalDiscountAmount}</span></div>}{group.hasMegaLaan && <div className="flex justify-between text-sm text-blue-400"><span>שובר מגה לאן:</span> <span>₪{group.expectedMegaLaanRevenue} (צפי)</span></div>}{group.hasMegaLaan && group.isWeekendMegaLaan && <div className="flex justify-between text-sm text-yellow-400"><span>תוספת סופ"ש:</span> <span>₪{group.megaLaanPlayers * 10}</span></div>}<div className="flex justify-between text-lg font-bold border-t border-gray-700 pt-2 mt-2"><span>סה"כ לתשלום בקופה:</span> <span className="text-green-400">₪{group.finalPriceToPay}</span></div></div></div><div className="border-t border-gray-800 pt-4"><h4 className="font-bold mb-3 flex items-center gap-2"><Edit2 size={16}/> עריכת תשלום</h4><Input label="מספר חשבונית/קבלה" value={inv} onChange={e=>setInv(e.target.value)} className="mb-4" /><div className="grid grid-cols-2 gap-3"><Input label="מזומן" type="number" step="any" value={pays.cash} onChange={e=>setPays({...pays, cash: e.target.value})} /><Input label="אשראי" type="number" step="any" value={pays.credit} onChange={e=>setPays({...pays, credit: e.target.value})} /><Input label="ביט" type="number" step="any" value={pays.bit} onChange={e=>setPays({...pays, bit: e.target.value})} /><Input label="העברה" type="number" step="any" value={pays.transfer} onChange={e=>setPays({...pays, transfer: e.target.value})} /></div>{balance !== 0 && <div className="text-red-400 text-sm font-bold text-center mt-3 bg-red-900/20 p-2 rounded">יתרת פער: ₪{balance}</div>}<Button onClick={handleSave} className="w-full mt-4" disabled={saving || balance !== 0}>{saving ? 'מעדכן...' : 'שמור שינויים'}</Button></div></div></div>);
        };

        const EditExpenseModal = ({ expense, onClose, expenses }) => {
            const [expName, setExpName] = useState(expense.name); const [expCategory, setExpCategory] = useState(expense.category); const [customCat, setCustomCat] = useState(''); const [expAmount, setExpAmount] = useState(expense.totalAmount); const [expFrom, setExpFrom] = useState(expense.fromMonth); const [expTo, setExpTo] = useState(expense.toMonth); const [expInv, setExpInvoice] = useState(expense.invoiceNumber || ''); const [saving, setSaving] = useState(false);
            const dynamicCats = [...new Set(['שכירות','חשמל','מים','ארנונה','שיווק ופרסום','תחזוקה וציוד','ביטוח','תוכנה ודיגיטל', ...(expenses||[]).map(e=>e.category)])].filter(Boolean);
            const handleSave = async (e) => {
                e.preventDefault(); if (expFrom > expTo) return alert('חודש סיום קטן מהתחלה'); const cat = expCategory === 'אחר' ? customCat : expCategory; if (!cat) return alert('נא להזין קטגוריה');
                setSaving(true); const ratio = Number(expAmount) / getMonthsDifference(expFrom, expTo);
                try { await updateDoc(getDocRef('expenses', expense.id), { name: expName, category: cat, totalAmount: Number(expAmount), fromMonth: expFrom, toMonth: expTo, monthlyAmount: ratio, invoiceNumber: expInv }); onClose(); } catch(err) { alert(err.message); setSaving(false); }
            };
            return (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700 shadow-2xl" onClick={e=>e.stopPropagation()}><div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-3"><h3 className="text-xl font-bold">עריכת הוצאה</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><XIcon size={20}/></button></div><form onSubmit={handleSave} className="space-y-4"><Input label="שם ההוצאה" value={expName} onChange={e=>setExpName(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">קטגוריה</label><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={expCategory} onChange={e=>setExpCategory(e.target.value)}>{dynamicCats.map(c=><option key={c} value={c}>{c}</option>)}<option value="אחר">אחר...</option></select></div>{expCategory==='אחר' && <Input label="קטגוריה חדשה" value={customCat} onChange={e=>setCustomCat(e.target.value)} required />}<Input label="מספר חשבונית/קבלה" value={expInv} onChange={e=>setExpInvoice(e.target.value)} /><Input label="סכום כולל (₪)" type="number" step="any" min="0" value={expAmount} onChange={e=>setExpAmount(e.target.value)} required /><div className="grid grid-cols-2 gap-4"><Input label="מחודש" type="month" value={expFrom} onChange={e=>setExpFrom(e.target.value)} required /><Input label="עד חודש" type="month" value={expTo} onChange={e=>setExpTo(e.target.value)} required /></div><Button type="submit" disabled={saving} className="w-full mt-4">{saving?'מעדכן...':'שמור שינויים'}</Button></form></div></div>);
        };
        const GroupReportForm = ({ employeeId, settings, onSave, isAdmin, employees }) => {
            const [date, setDate] = useState(new Date().toISOString().slice(0, 10)); const [time, setTime] = useState('10:00'); const [room, setRoom] = useState(''); const [customerName, setCustomerName] = useState(''); const [totalPlayers, setTotalPlayers] = useState(2); const [groupType, setGroupType] = useState(''); const [source, setSource] = useState(''); const [kids, setKids] = useState(0); const [eligible, setEligible] = useState(0); const [hasMegaLaan, setHasMegaLaan] = useState(false); const [megaLaanPlayers, setMegaLaanPlayers] = useState(0); const [megaLaanCode, setMegaLaanCode] = useState(''); const [isWeekendMegaLaan, setIsWeekendMegaLaan] = useState(false); const [payments, setPayments] = useState({ cash: '', credit: '', bit: '', transfer: '' }); const [invoiceNumber, setInvoiceNumber] = useState(''); const [saving, setSaving] = useState(false); const [attemptedSubmit, setAttemptedSubmit] = useState(false); const [reportEmpId, setReportEmpId] = useState(employeeId); const [fetchedCustomers, setFetchedCustomers] = useState([]); const [isManualCustomer, setIsManualCustomer] = useState(true); const [loadingCustomers, setLoadingCustomers] = useState(false); const [tor4youError, setTor4youError] = useState(null); 
            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);
            useEffect(() => { const fetchAppts = async () => { setLoadingCustomers(true); setTor4youError(null); try { const res = await fetch(`${TOR4YOU_FUNCTION_URL}?date=${date}`); if(res.ok) { const data = await res.json(); if(data.customers && data.customers.length > 0) { setFetchedCustomers(data.customers); setIsManualCustomer(false); setCustomerName(data.customers[0].name); setTime(data.customers[0].time); setTotalPlayers(data.customers[0].players || 2); } else { setFetchedCustomers([]); setIsManualCustomer(true); setCustomerName(''); if (data.debugInfo) setTor4youError(JSON.stringify(data.debugInfo, null, 2)); } } } catch (e) { setFetchedCustomers([]); setIsManualCustomer(true); setTor4youError(e.message); } finally { setLoadingCustomers(false); } }; fetchAppts(); }, [date]);
            const handleCustomerChange = (e) => { const val = e.target.value; setCustomerName(val); if (val !== 'manual_entry') { const selectedCust = fetchedCustomers.find(c => c.name === val); if (selectedCust) { if(selectedCust.time) setTime(selectedCust.time); if(selectedCust.players) setTotalPlayers(selectedCust.players); } } };
            
            const basePrice = getBasePrice(totalPlayers, settings.pricing); 
            const totalOriginalPrice = basePrice * Number(totalPlayers);
            const expectedMega = hasMegaLaan ? Math.ceil(Number(megaLaanPlayers) * basePrice * 0.78) : 0;

            const totalEnteredPayment = Object.values(payments).reduce((acc, val) => acc + (Number(val) || 0), 0); const paymentBalance = finalPriceToPay - totalEnteredPayment;

        const EmployeeUpcoming = ({ employee, assignments, settings }) => {

            return (<Card><div className="overflow-x-auto"><table className="w-full text-right text-sm whitespace-nowrap"><thead className="opacity-70 border-b border-gray-700"><tr><th>תאריך ושעה</th><th>חדר</th><th>לקוח</th><th>שחקנים</th><th>לתשלום</th><th>נמחק?</th></tr></thead><tbody className="divide-y divide-gray-800 opacity-90">{myGroups.length === 0 && <tr><td colSpan="6" className="text-center py-4">לא דיווחת קבוצות החודש</td></tr>}{myGroups.map(g => (<tr key={g.id}><td className="py-2">{formatDateIL(g.date)} {g.time}</td><td>{g.room}</td><td>{g.customerName}</td><td>{g.totalPlayers}</td><td className="text-green-400">₪{g.finalPriceToPay}</td><td><button onClick={() => confirm("למחוק דיווח?") && deleteDoc(getDocRef('groups', g.id))} className="text-red-400"><Trash2 size={14}/></button></td></tr>))}</tbody></table></div></Card>);
        }
        const EmployeeIssues = ({ employee, issues, settings }) => {

            const pendingIssues = (issues||[]).filter(i => i.status === 'pending').sort((a,b) => new Date(b.reportedAt) - new Date(a.reportedAt));
            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            useEffect(() => { if(roomList.length > 0 && !room) setRoom(roomList[0]); }, [roomList]);
            const submitIssue = async (e) => { e.preventDefault(); setSaving(true); try { await addDoc(getCollectionRef('issues'), { room, description: desc, reportedBy: employee.id, reportedByName: employee.name, status: 'pending', priority: 'רגילה', reportedAt: new Date().toISOString() }); alert('התקלה דווחה!'); setDesc(''); } catch(err) { alert(err.message); } finally { setSaving(false); } };
            return (<div className="grid md:grid-cols-2 gap-6"><Card title="דיווח על תקלה בחדר"><form onSubmit={submitIssue} className="space-y-4"><div className="flex flex-col gap-1"><label className="text-sm opacity-70">חדר</label><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={room} onChange={e=>setRoom(e.target.value)} required>{roomList.map(r => <option key={r} value={r}>{r}</option>)}</select></div><div className="flex flex-col gap-1"><label className="text-sm opacity-70">תיאור (מה נשבר?)</label><textarea className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white h-32 resize-none" value={desc} onChange={e=>setDesc(e.target.value)} required></textarea></div><Button type="submit" variant="danger" disabled={saving} className="w-full">{saving ? 'שולח...' : 'שלח דיווח למנהל'}</Button></form></Card><Card title="תקלות פתוחות"><div className="space-y-3">{pendingIssues.length === 0 && <div className="text-center py-8 opacity-60">הכל תקין! 🎉</div>}{pendingIssues.map(i => (<div key={i.id} className="bg-gray-800/50 p-4 rounded-lg border border-gray-700"><div className="flex justify-between items-start mb-2"><h4 className="font-bold text-lg text-indigo-300">{i.room}</h4><span className="text-xs opacity-60">{formatDateTimeIL(i.reportedAt)} ע"י {i.reportedByName}</span></div><p className="text-sm text-gray-300 whitespace-pre-wrap">{i.description}</p></div>))}</div></Card></div>);

IL(c.type==='range' ? c.endDate : c.date)}</td><td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td><td><StatusBadge status={c.status || 'pending'} /></td><td className="flex gap-2 py-2">{c.status !== 'approved' && <button onClick={()=>edit(c)} className="text-indigo-400"><Edit2 size={14}/></button>}<button onClick={()=>del(c.id)} className="text-red-400"><Trash2 size={14}/></button></td></tr>))}</tbody></table></div></Card></div>);

            const myShifts = (shifts||[]).filter(s => s.employeeId === employee.id && (s.date||'').startsWith(month));
            const wage = myShifts.reduce((acc, curr) => acc + (curr.gamesCount * (curr.wageAtTime || employee.wagePerGame || 0)), 0);
            const request = async (e) => { e.preventDefault(); setSending(true); const fd = new FormData(e.target); try { await addDoc(getCollectionRef('requests'), { employeeId: employee.id, status: 'pending', date: new Date().toISOString(), newData: { phone: fd.get('phone'), email: fd.get('email'), address: fd.get('address'), birthday: fd.get('birthday') } }); alert('נשלח'); setOpen(false); } catch(e) { alert(e.message); } finally { setSending(false); } };
            return (<div className="grid md:grid-cols-2 gap-6"><Card><div className="text-center"><h2 className="text-2xl font-bold">{employee.name}</h2><p className="text-indigo-400">{employee.skills?.join(' • ')}</p></div><div className="mt-4 space-y-2 text-sm opacity-80"><div>טלפון: {employee.phone}</div><div>מייל: {employee.email}</div><div>יום הולדת: {formatDateIL(employee.birthday)}</div></div><Button variant="outline" className="w-full mt-4" onClick={()=>setOpen(true)}>עדכון פרטים</Button></Card><Card title={`שכר משוער (${month})`}><div className="text-center py-8"><div className="text-4xl font-bold text-green-400">₪{wage}</div><div className="text-gray-400 text-sm">{myShifts.length} משחקים</div></div></Card>{open && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700"><h3 className="text-xl font-bold mb-4">עדכון פרטים</h3><form onSubmit={request} className="space-y-4"><Input label="טלפון" name="phone" defaultValue={employee.phone} required /><Input label="מייל" name="email" defaultValue={employee.email} required /><Input label="כתובת" name="address" defaultValue={employee.address} required /><Input label="יום הולדת" name="birthday" type="date" defaultValue={employee.birthday} required /><div className="flex gap-2"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" className="flex-1" disabled={sending}>{sending ? 'שולח...' : 'שלח בקשה'}</Button></div></form></div></div>}</div>);
        };
        const EmployeeDashboard = ({ employee, data, settings }) => {
            const [tab, setTab] = useState('upcoming');
            const myPendingTasks = (data.tasks||[]).filter(t => t.assigneeId === employee.id && t.status === 'pending');
            const issuesCount = (data.issues||[]).filter(i => i.status === 'pending').length; 
            const myAssignments = (data.assignments||[]).filter(a => a.employeeId === employee.id && (a.date||'') >= new Date().toISOString().slice(0, 10));
            return (
                <div className="space-y-6">
                    <div className="flex card-bg p-1 rounded-lg w-fit overflow-x-auto max-w-full">
                        {[{id:'upcoming', l:'תורים עתידיים', c:myAssignments.length, color:'bg-blue-500'}, {id:'report', l:'דיווח והיסטוריה'}, {id:'constraints', l:'אילוצים'}, {id:'issues', l:'תקלות', c:issuesCount, color:'bg-orange-500'}, {id:'tasks', l:'משימות', c:myPendingTasks.length, color:'bg-red-500'}, {id:'profile', l:'פרופיל'}].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded text-dynamic ${tab===t.id?'bg-indigo-600 text-white':''}`}>{t.l}{t.c > 0 && <span className={`${t.color} text-white text-xs px-1.5 py-0.5 rounded-full font-bold`}>{t.c}</span>}</button>
                        ))}
                    </div>
                    {tab==='upcoming' && <EmployeeUpcoming employee={employee} assignments={data.assignments||[]} settings={settings}/>}
                    {tab==='report' && <div className="space-y-8"><GroupReportForm employeeId={employee.id} employees={data.employees} settings={settings} onSave={()=>{}}/><div className="border-t border-gray-800 pt-8 mt-8"><h2 className="text-2xl font-bold mb-6">היסטוריית הדיווחים שלי</h2><EmployeeHistory employee={employee} groups={data.groups||[]} shifts={data.shifts||[]}/></div></div>}
                    {tab==='constraints' && <EmployeeConstraints employee={employee} constraints={data.constraints||[]}/>}
                    {tab==='issues' && <EmployeeIssues employee={employee} issues={data.issues||[]} settings={settings}/>}
                    {tab==='tasks' && <EmployeeTasks employee={employee} tasks={data.tasks||[]}/>}
                    {tab==='profile' && <EmployeeProfile employee={employee} shifts={data.shifts||[]}/>}
                </div>
            );
        };

        // --- Admin Dashboards ---
        const AdminConstraints = ({ employees, constraints, settings, assignments }) => {
            const [offset, setOffset] = useState(0); const [isBlocking, setIsBlocking] = useState(false); const [tor4youSlotsMap, setTor4youSlotsMap] = useState({}); const [loadingSlots, setLoadingSlots] = useState(false); const [assignSlot, setAssignSlot] = useState(null); const [addApptSlot, setAddApptSlot] = useState(null); 
            const todayStr = new Date().toISOString().slice(0, 10); const currentMonthStr = todayStr.slice(0, 7);
            
            const activeCons = useMemo(() => (constraints||[]).filter(c => (c.type==='range'?c.endDate:c.date||'') >= todayStr || c.status === 'pending').sort((a,b)=>((a.type==='range'?a.startDate:a.date)||'').localeCompare((b.type==='range'?b.startDate:b.date)||'')), [constraints]);
            const historyCons = useMemo(() => (constraints||[]).filter(c => (c.type==='range'?c.endDate:c.date||'') < todayStr && c.status !== 'pending' && (c.type==='range'?c.endDate:c.date||'').startsWith(currentMonthStr)).sort((a,b)=>((b.type==='range'?b.startDate:b.date)||'').localeCompare((a.type==='range'?a.startDate:a.date)||'')), [constraints]);
            const days = useMemo(() => Array.from({length:7}, (_,i) => { const d = new Date(); d.setDate(d.getDate() + (offset*7) + i); return d; }), [offset]);
            
            // תצוגת חצאי שעות רציפה ביומן!
            const dynamicHours = useMemo(() => {
                const times = new Set();
                Object.values(tor4youSlotsMap).forEach(arr => arr.forEach(s => {
                    times.add(s.time);
                    times.add(addTime(s.time, 30)); // מוסיף גם את החצי שעה הבאה לתצוגה חלקה
                }));
                if (times.size === 0) return ["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00"];
                return Array.from(times).sort();
            }, [tor4youSlotsMap]);
            
            const fetchWeekSlots = async () => {
                setLoadingSlots(true);
                const fromDateStr = days[0].toISOString().slice(0,10).replace(/-/g, ''); const toDateStr = days[6].toISOString().slice(0,10).replace(/-/g, '');
                try { const res = await fetch(`${TOR4YOU_WEEK_URL}?fromDate=${fromDateStr}&toDate=${toDateStr}`); if(res.ok) { const data = await res.json(); if(data.slotsMap) setTor4youSlotsMap(data.slotsMap); } } catch(e) {} finally { setLoadingSlots(false); }
            };
            useEffect(() => { fetchWeekSlots(); }, [offset]);

            const getSlotInfo = (d, hStr, customConstraints = constraints) => {
                const dStr = d.toISOString().slice(0,10); 
                const daySlots = tor4youSlotsMap[dStr] || []; 
                const slot = daySlots.find(s => s.time === hStr);
                
                // סינון שעות פעילות של העסק כדי למנוע תורי רפאים מחוץ לשעות
                const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const dayName = daysOfWeek[d.getDay()];
                const biz = (settings.openingHours||{})[dayName];
                
                const [curH, curM] = hStr.split(':').map(Number); 
                let curMin = curH * 60 + curM;

                if (biz) {
                    const [openH, openM] = biz.start.split(':').map(Number);
                    const [closeH, closeM] = biz.end.split(':').map(Number);
                    const openMin = openH * 60 + openM;
                    let closeMin = closeH * 60 + closeM;
                    if (closeMin <= openMin) closeMin += 24 * 60; 
                    if (curH < openH && closeMin > 24*60) curMin += 24 * 60; 
                    if (curMin < openMin || curMin >= closeMin) return { status: -1 }; // מחוץ לשעות הפעילות
                }

                if (!slot) return { status: -1 }; 
                
                // חישוב חפיפה של האילוץ עם התור (90 דקות משך תור)
                const slotStartMin = curMin; 
                const slotEndMin = slotStartMin + 90; 
                let count = 0;
                (employees||[]).forEach(emp => {
                    const busy = (customConstraints||[]).some(c => {
                        if (c.employeeId !== emp.id || c.status === 'rejected') return false; 
                        if (c.type === 'range') return dStr >= c.startDate && dStr <= c.endDate;
                        const [sH, sM] = (c.startTime || '00:00').split(':').map(Number); const [eH, eM] = (c.endTime || '00:00').split(':').map(Number);
                        const cStartMin = sH * 60 + sM; const cEndMin = eH * 60 + eM;
                        return c.date === dStr && (Math.max(slotStartMin, cStartMin) < Math.min(slotEndMin, cEndMin));
                    });
                    if (!busy) count++;
                });

                const assignId = `${dStr}_${hStr.replace(':','')}`;
                return { status: count, isBooked: slot.isBooked, customerName: slot.customerName, customerPhone: slot.customerPhone, dateStr: dStr, time: hStr, id: slot.id, vfib: slot.vfib, staff: slot.staff, service: slot.service, assignment: (assignments||[]).find(a => a.id === assignId) };
            };
            
            const handleStatus = async (id, status) => { 
                await updateDoc(getDocRef('constraints', id), { status }); 
                if (status === 'approved') {
                    const updatedConstraints = (constraints||[]).map(x => x.id === id ? { ...x, status: 'approved' } : x);
                    const toDelete = []; const warnings = [];
                    days.forEach(d => {
                        const dStr = d.toISOString().slice(0,10); const daySlots = tor4youSlotsMap[dStr] || [];
                        daySlots.forEach(slot => {
                            const info = getSlotInfo(d, slot.time, updatedConstraints);
                            if (info.status === 0) {
                                if (info.isBooked) warnings.push(`${formatDateIL(dStr)} בשעה ${slot.time} (${info.customerName})`);
                                else toDelete.push({ slotid: slot.id, vfib: slot.vfib });
                            }
                        });
                    });
                    if (warnings.length === 0 && toDelete.length === 0) return;
                    let message = `זיהוי אוטומטי בעקבות אישור האילוץ:\n\n`;
                    if (warnings.length > 0) message += `🚨 שימו לב: ${warnings.length} תורים כבר הוזמנו בשעות שאין להן עובד כעת!\n(לא נמחקו, חובה ליצור קשר)\n${warnings.join('\n')}\n`;
                    if (toDelete.length > 0) message += `\n🗑️ נמצאו ${toDelete.length} תורים פנויים באתר ללא מפעיל.\nהאם למחוק ולחסום אותם כעת ב-Tor4You?`; else return alert(message);
                    if (confirm(message)) {
                        setIsBlocking(true);
                        try { const res = await fetch(TOR4YOU_DELETE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slots: toDelete }) }); const data = await res.json(); if (data.success) { alert(`✅ נמחקו בהצלחה ${data.deletedCount} תורים מהאתר.`); fetchWeekSlots(); } else alert(`❌ שגיאה: ${data.error}`); } catch (e) { alert('שגיאת תקשורת: ' + e.message); } finally { setIsBlocking(false); }
                    }
                }
            };

            const handleSyncAndBlock = async () => {
                const toDelete = []; const warnings = [];
                days.forEach(d => {
                    const dStr = d.toISOString().slice(0,10); const daySlots = tor4youSlotsMap[dStr] || [];
                    daySlots.forEach(slot => {
                        const info = getSlotInfo(d, slot.time);
                        if (info.status === 0) {
                            if (info.isBooked) warnings.push(`${formatDateIL(dStr)} בשעה ${slot.time}`);
                            else toDelete.push({ slotid: slot.id, vfib: slot.vfib });
                        }
                    });
                });
                if (warnings.length === 0 && toDelete.length === 0) return alert('✅ היומן תקין לחלוטין! אין משבצות פנויות של 0 עובדים.');
                let message = `סריקת יומן:\n\n`;
                if (warnings.length > 0) message += `🚨 ${warnings.length} תורים הוזמנו ללא עובד!\n`;
                if (toDelete.length > 0) message += `\n🗑️ נמצאו ${toDelete.length} משבצות פנויות ללא מפעיל. למחוק אותן באתר?`; else return alert(message);
                if (confirm(message)) {
                    setIsBlocking(true);
                    try { const res = await fetch(TOR4YOU_DELETE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slots: toDelete }) }); const data = await res.json(); if (data.success) { alert(`✅ נמחקו בהצלחה ${data.deletedCount} תורים.`); fetchWeekSlots(); } else alert(`❌ שגיאה: ${JSON.stringify(data.errors)}`); } catch (e) { alert('שגיאה: ' + e.message); } finally { setIsBlocking(false); }
                }
            };

            const renderConstraintsTable = (consList, isEmptyMsg) => (
                <div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>התחלה</th><th>סיום</th><th>שעות</th><th>סיבה</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody className="opacity-90">{consList.length === 0 && <tr><td colSpan="7" className="text-center py-4">{isEmptyMsg}</td></tr>}
                    {consList.map(c => { const emp = (employees||[]).find(e => e.id === c.employeeId); return <tr key={c.id} className="border-b border-gray-800 hover:bg-white/5"><td className="py-2 font-bold">{emp?.name}</td><td>{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td><td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td><td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td><td>{c.note}</td><td><StatusBadge status={c.status || 'pending'}/></td><td className="flex gap-2 py-1"><Button size="sm" variant={c.status==='approved'?"secondary":"success"} onClick={()=>handleStatus(c.id, 'approved')}><Check size={14}/></Button><Button size="sm" variant={c.status==='rejected'?"secondary":"danger"} onClick={()=>handleStatus(c.id, 'rejected')}><XIcon size={14}/></Button><button onClick={()=>deleteDoc(getDocRef('constraints', c.id))} className="text-red-500 mr-2"><Trash2 size={14}/></button></td></tr> })}
                </tbody></table></div>
            );

            return (
                <div className="space-y-6 relative">
                    {isBlocking && <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center rounded-xl backdrop-blur-sm"><div className="bg-gray-900 p-6 rounded-xl border border-indigo-500 shadow-2xl flex flex-col items-center gap-4"><Loader className="animate-spin w-10 h-10 text-indigo-500" /><span className="text-lg font-bold text-white">מעדכן יומן מול Tor4You...</span></div></div>}
                    <Card title="אילוצים עתידיים וממתינים לאישור">{renderConstraintsTable(activeCons, 'אין אילוצים פעילים להצגה')}</Card>
                    <Card title="מפת זמינות ושיבוצים (מסתנכרן מ-Tor4You / משך תור: 90 דק')">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-4 gap-4"><div className="flex items-center gap-4"><Button onClick={()=>setOffset(p=>p-1)}><ChevronRight size={16}/></Button><span className="flex items-center gap-2 font-bold text-lg">{formatDateIL(days[0].toISOString())} - {formatDateIL(days[6].toISOString())} {loadingSlots && <Loader className="w-4 h-4 animate-spin text-indigo-400"/>}</span><Button onClick={()=>setOffset(p=>p+1)}><ChevronLeft size={16}/></Button></div><Button onClick={handleSyncAndBlock} variant="outline" className="bg-yellow-500/10 border-yellow-500 text-yellow-500 hover:bg-yellow-500/20"><AlertTriangle size={18}/> סריקת התנגשויות וסנכרון יומן</Button></div>
                        <div className="overflow-x-auto"><div className="min-w-[800px]"><div className="grid grid-cols-8 gap-1 mb-1 text-center font-bold text-dynamic"><div className="bg-gray-800 p-2 rounded">שעה</div>{days.map((d,i) => <div key={i} className="bg-gray-800 p-2 text-sm rounded">{d.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'numeric'})}</div>)}</div>
                            {dynamicHours.map(h => {
                                const endStr = addTime(h, 90);
                                return (
                                <div key={h} className="grid grid-cols-8 gap-1 mb-1 text-center text-xs h-20">
                                    <div className="bg-gray-800 p-1 rounded text-dynamic flex flex-col justify-center items-center h-full"><span className="font-bold text-sm">{h}</span><span className="opacity-50 text-[10px]">{h}-{endStr}</span></div>
                                    {days.map((d,i) => {
                                        const info = getSlotInfo(d, h);
                                        if (info.status === -1) return <div key={i} className="p-1 rounded bg-gray-800/10 opacity-20 h-full"></div>;
                                        if (info.isBooked) {
                                            const assignName = info.assignment ? (info.assignment.employeeId==='admin'?'מנהל':(employees||[]).find(e=>e.id===info.assignment.employeeId)?.name) : 'טרם שויך';
                                            return (<div key={i} onClick={()=>setAssignSlot(info)} className="p-1 rounded bg-indigo-900/60 ring-1 ring-indigo-500 text-white font-bold flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-800 transition-colors h-full"><span className="text-[10px] truncate w-full text-center leading-tight">{info.customerName || 'לקוח'}</span><span className="text-[9px] opacity-70 truncate w-full text-center mb-1 leading-tight">{info.customerPhone || 'תפוס'}</span><span className={`text-[9px] px-1 rounded ${info.assignment ? 'bg-green-600' : 'bg-red-500'}`}>{assignName}</span></div>);
                                        }
                                        let bg = 'bg-green-900/60'; if (info.status === 0) bg = 'bg-red-900/60 ring-1 ring-red-500'; else if (info.status === 1) bg = 'bg-yellow-900/60';
                                        return (<div key={i} onClick={()=>setAddApptSlot({ ...info, staff: info.staff, service: info.service })} className={`p-1 rounded ${bg} text-white font-bold flex flex-col items-center justify-center cursor-pointer hover:opacity-80 transition-opacity h-full`}><span className="text-lg">{info.status}</span><span className="text-[9px] opacity-70">פנויים</span><span className="text-[9px] mt-1 bg-white/20 px-1 rounded hover:bg-white/40">הזמן +</span></div>);
                                    })}
                                </div>
                            )})}
                        </div></div>
                    </Card>
                    <div className="mt-8 border-t border-gray-800 pt-8"><h3 className="text-xl font-bold flex items-center gap-2 opacity-70 mb-4"><History size={20}/> היסטוריית אילוצים (חודש נוכחי)</h3><div className="card-bg rounded-xl p-6 opacity-80">{renderConstraintsTable(historyCons, 'אין היסטוריית אילוצים לחודש הנוכחי')}</div></div>
                    {assignSlot && <AssignModal slotData={assignSlot} onClose={()=>setAssignSlot(null)} employees={employees} settings={settings} />}
                    {addApptSlot && <AddAppointmentModal slotData={addApptSlot} onClose={()=>setAddApptSlot(null)} onRefresh={fetchWeekSlots} employees={employees} />}
                </div>
            );
        };

        const AdminGroups = ({ groups, employees, settings, shifts }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7)); const [showManual, setShowManual] = useState(false); const [viewingGroup, setViewingGroup] = useState(null); const [filters, setFilters] = useState({ emp: '', room: '', type: '' }); 
            const monthGroups = (groups||[]).filter(g => (g.date||'').startsWith(month));
            const totalCash = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.cash) || 0), 0); const totalCredit = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.credit) || 0), 0); const totalBit = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.bit) || 0), 0); const totalTransfer = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.transfer) || 0), 0); const totalMega = monthGroups.reduce((acc, g) => acc + (Number(g.expectedMegaLaanRevenue) || 0), 0);
            const totalRevenue = totalCash + totalCredit + totalBit + totalTransfer + totalMega; 
            const filteredGroups = monthGroups.filter(g => (!filters.emp || g.employeeId === filters.emp) && (!filters.room || g.room === filters.room) && (!filters.type || g.groupType === filters.type)).sort((a,b) => new Date((b.date||'')+'T'+(b.time||'')) - new Date((a.date||'')+'T'+(a.time||'')));

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center"><div className="flex items-center gap-4"><input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/><Button onClick={() => exportToXLSGroups(filteredGroups, employees, shifts, `Groups_${month}.xls`)} variant="success"><Download size={16}/> ייצוא הנתונים</Button></div><Button onClick={()=>setShowManual(true)}><Plus size={16}/> דיווח ידני</Button></div>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4"><Card className="text-center"><div className="opacity-70 text-sm">💵 מזומן</div><div className="text-xl font-bold">₪{totalCash}</div></Card><Card className="text-center"><div className="opacity-70 text-sm">💳 אשראי</div><div className="text-xl font-bold">₪{totalCredit}</div></Card><Card className="text-center"><div className="opacity-70 text-sm">📱 ביט והעברה</div><div className="text-xl font-bold">₪{totalBit+totalTransfer}</div></Card><Card className="text-center border-blue-500/30"><div className="text-blue-300 text-sm font-bold">🎟️ צפי שוברים</div><div className="text-xl font-bold text-blue-400">₪{totalMega}</div></Card><div className="card-bg rounded-xl p-4 text-center border-green-500 bg-green-900/20 shadow-[0_0_15px_rgba(74,222,128,0.2)]"><div className="text-green-300 text-xs font-bold tracking-wide">סך הכל הכנסות החודש</div><div className="text-2xl font-bold text-green-400 mt-1">₪{totalRevenue.toLocaleString()}</div></div></div>
                    <Card title="פירוט דיווחי קבוצות" className="border-indigo-500/30"><div className="overflow-x-auto"><table className="w-full text-right text-sm whitespace-nowrap"><thead className="opacity-90 border-b-2 border-gray-700 bg-gray-800/50"><tr><th className="py-3 px-2 font-semibold">תאריך ושעה</th><th className="px-2"><select className="bg-transparent outline-none w-full font-semibold" value={filters.emp} onChange={e=>setFilters({...filters, emp: e.target.value})}><option value="" className="bg-gray-800">מפעיל (הכל)</option><option value="admin" className="bg-gray-800">מנהל</option>{(employees||[]).map(e => <option key={e.id} value={e.id} className="bg-gray-800">{e.name}</option>)}</select></th><th className="px-2"><select className="bg-transparent outline-none w-full font-semibold" value={filters.room} onChange={e=>setFilters({...filters, room: e.target.value})}><option value="" className="bg-gray-800">חדר (הכל)</option>{(settings.roomsList||'סודו של הודיני').split(',').map(r => <option key={r} value={r.trim()} className="bg-gray-800">{r.trim()}</option>)}</select></th><th className="px-2 font-semibold">לקוח</th><th className="px-2 font-semibold text-center">חשבונית</th><th className="px-2 font-semibold">שחקנים</th><th className="px-2 font-semibold text-green-400">סה"כ לקופה</th><th className="px-2 font-semibold">אמצעי תשלום</th><th className="px-2 font-semibold">מחיקה</th></tr></thead><tbody className="divide-y divide-gray-800 text-dynamic">{filteredGroups.length === 0 && <tr><td colSpan="9" className="text-center py-6 opacity-60">לא נמצאו דיווחים</td></tr>}{filteredGroups.map(g => { const empName = g.employeeId === 'admin' ? 'מנהל' : ((employees||[]).find(e => e.id === g.employeeId)?.name || ''); const aPays = []; if (Number(g.payments?.cash)>0) aPays.push('מזומן'); if (Number(g.payments?.credit)>0) aPays.push('אשראי'); if (Number(g.payments?.bit)>0) aPays.push('ביט'); if (Number(g.payments?.transfer)>0) aPays.push('העברה'); if (g.hasMegaLaan) aPays.push('מגה לאן'); const pDisplay = aPays.length > 1 ? 'משולב' : (aPays[0] || 'ללא'); return (<tr key={g.id} className="hover:bg-indigo-900/30 cursor-pointer" onClick={() => setViewingGroup(g)}><td className="py-3 px-2 font-medium">{formatDateIL(g.date)} {g.time}</td><td className="px-2 opacity-80">{empName}</td><td className="px-2 opacity-80">{g.room}</td><td className="px-2 font-medium text-indigo-200">{g.customerName}</td><td className="px-2 text-center opacity-70">{g.invoiceNumber || '-'}</td><td className="px-2">{g.totalPlayers}</td><td className="px-2 font-bold text-green-400">₪{g.finalPriceToPay}</td><td className="px-2 font-medium text-indigo-300">{pDisplay}</td><td className="px-2"><button onClick={(e) => { e.stopPropagation(); confirm("למחוק?") && deleteDoc(getDocRef('groups', g.id)); }} className="text-red-400 hover:bg-red-900/30 p-1 rounded"><Trash2 size={16}/></button></td></tr>)})}</tbody></table></div></Card>
                    {showManual && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-4xl border border-gray-700 max-h-[90vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold">דיווח קבוצה ידני</h3><button onClick={()=>setShowManual(false)} className="text-gray-400 hover:text-white"><XIcon size={20}/></button></div><GroupReportForm employeeId="admin" isAdmin={true} employees={employees} settings={settings} onSave={()=>setShowManual(false)}/></div></div>}
                    {viewingGroup && <EditGroupModal group={viewingGroup} employees={employees} onClose={()=>setViewingGroup(null)} />}
                </div>
            );
        };

        const AdminExpenses = ({ expenses, groups, shifts, employees }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7)); const [showForm, setShowForm] = useState(false); const [editingExpense, setEditingExpense] = useState(null);
            const [expName, setExpName] = useState(''); const [expCategory, setExpCategory] = useState('שכירות'); const [customCategory, setCustomCategory] = useState(''); const [expAmount, setExpAmount] = useState(''); const [expFrom, setExpFrom] = useState(month); const [expTo, setExpTo] = useState(month); const [expInvoice, setExpInvoice] = useState(''); const [saving, setSaving] = useState(false);
            const defaultCats = ['שכירות','חשמל','מים','ארנונה','שיווק ופרסום','תחזוקה וציוד','ביטוח','תוכנה ודיגיטל']; const dynamicCats = [...new Set([...defaultCats, ...(expenses||[]).map(e => e.category)])].filter(Boolean);
            const quickCats = useMemo(() => { const counts = (expenses||[]).reduce((acc, ex) => { acc[ex.category] = (acc[ex.category]||0) + 1; return acc; }, {}); const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]); return top.length > 0 ? top : ['שכירות', 'חשמל', 'שיווק ופרסום', 'תחזוקה וציוד']; }, [expenses]);

            const handleAddExpense = async (e) => { e.preventDefault(); if (expFrom > expTo) return alert('חודש סיום לפני התחלה'); const cat = expCategory === 'אחר' ? customCategory : expCategory; if (!cat) return alert('נא להזין קטגוריה'); setSaving(true); const ratio = Number(expAmount) / getMonthsDifference(expFrom, expTo); try { await addDoc(getCollectionRef('expenses'), { name: expName, category: cat, totalAmount: Number(expAmount), fromMonth: expFrom, toMonth: expTo, monthlyAmount: ratio, invoiceNumber: expInvoice, createdAt: new Date().toISOString() }); setShowForm(false); setExpName(''); setExpAmount(''); setCustomCategory(''); setExpInvoice(''); } catch(err) { alert(err.message); } finally { setSaving(false); } };

            const monthGroups = (groups||[]).filter(g => (g.date||'').startsWith(month)); const totalRevenue = monthGroups.reduce((acc, g) => acc + (Number(g.payments?.cash)||0) + (Number(g.payments?.credit)||0) + (Number(g.payments?.bit)||0) + (Number(g.payments?.transfer)||0) + (Number(g.expectedMegaLaanRevenue)||0), 0);
            let totalSalaries = 0; const monthlyShifts = (shifts||[]).filter(s => (s.date||'').startsWith(month) && s.status !== 'rejected'); monthlyShifts.forEach(s => { const emp = (employees||[]).find(e => e.id === s.employeeId); totalSalaries += (Number(s.gamesCount) * (s.wageAtTime || emp?.wagePerGame || 0)); });
            const activeExpenses = (expenses||[]).filter(ex => isMonthInRange(month, ex.fromMonth, ex.toMonth)); const totalExpenses = activeExpenses.reduce((acc, ex) => acc + ex.monthlyAmount, 0); const netProfit = totalRevenue - totalSalaries - totalExpenses;
            const expByCategory = activeExpenses.reduce((acc, ex) => { acc[ex.category] = (acc[ex.category] || 0) + ex.monthlyAmount; return acc; }, {});
            const maxVal = Math.max(totalRevenue, totalSalaries + totalExpenses); const revPct = maxVal > 0 ? (totalRevenue / maxVal) * 100 : 0; const salaryPct = maxVal > 0 ? (totalSalaries / maxVal) * 100 : 0; const graphColors = ['#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#14b8a6', '#6366f1'];

            const exportFinancialXLS = () => {
                let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><h2>דוח פיננסי ERP - ${month}</h2><table><tr style="background-color:#bbf7d0;font-weight:bold;"><td>סעיף</td><td>סכום</td></tr><tr><td>סה"כ הכנסות ברוטו</td><td>₪${totalRevenue.toFixed(2)}</td></tr><tr><td>הוצאות שכר עובדים</td><td>-₪${totalSalaries.toFixed(2)}</td></tr><tr><td>הוצאות תפעול שוטפות</td><td>-₪${totalExpenses.toFixed(2)}</td></tr><tr style="background-color:#86efac;font-weight:bold;font-size:16px;"><td>רווח נקי לחודש זה</td><td>₪${netProfit.toFixed(2)}</td></tr><tr><td colspan="2" style="height:20px;"></td></tr><tr style="background-color:#e2e8f0;font-weight:bold;"><td>פירוט הוצאות החודש</td><td>קטגוריה</td><td>חשבונית</td><td>סכום יחסי לחודש</td><td>תקופה מלאה</td></tr>`;
                activeExpenses.forEach(ex => { html += `<tr><td>${ex.name}</td><td>${ex.category}</td><td style="mso-number-format:'\@';">${ex.invoiceNumber || ''}</td><td>₪${ex.monthlyAmount.toFixed(2)}</td><td>${ex.fromMonth} עד ${ex.toMonth} (סה"כ ₪${ex.totalAmount})</td></tr>`; });
                exportToXLS(html+`</table></body></html>`, `Financial_Report_${month}.xls`);
            };

            return (

                    <div className="grid md:grid-cols-4 gap-4"><Card className="border-green-500/30 text-center"><div className="text-sm opacity-70">הכנסות ברוטו</div><div className="text-2xl font-bold text-green-400">₪{Math.round(totalRevenue).toLocaleString()}</div></Card><Card className="border-red-500/30 text-center"><div className="text-sm opacity-70">שכר עובדים</div><div className="text-2xl font-bold text-red-400">₪{Math.round(totalSalaries).toLocaleString()}</div></Card><Card className="border-orange-500/30 text-center"><div className="text-sm opacity-70">הוצאות תפעול</div><div className="text-2xl font-bold text-orange-400">₪{Math.round(totalExpenses).toLocaleString()}</div></Card><div className={`card-bg rounded-xl p-6 text-center border shadow-lg ${netProfit >= 0 ? 'border-green-500 bg-green-900/10' : 'border-red-500 bg-red-900/10'}`}><div className="text-sm font-bold">רווח נקי</div><div className={`text-3xl font-bold mt-1 ${netProfit >= 0 ? 'text-green-400' : 'text-red-400'}`}>₪{Math.round(netProfit).toLocaleString()}</div></div></div>
                    <Card title="מאזן חודשי">
                        <div className="space-y-4">
                            <div><div className="flex justify-between text-sm mb-1 text-green-300"><span>הכנסות</span> <span>{Math.round(revPct)}%</span></div><div className="w-full bg-gray-800 rounded-full h-4"><div className="bg-green-500 h-4 rounded-full transition-all" style={{width: `${revPct}%`}}></div></div></div>
                            <div>
                                <div className="flex justify-between text-sm mb-1 text-red-300"><span>הוצאות ושכר פילוח צבעוני</span> <span>{Math.round((totalSalaries+totalExpenses)/maxVal*100 || 0)}%</span></div>
                                <div className="w-full bg-gray-800 rounded-full h-4 flex overflow-hidden">
                                    <div style={{width: `${salaryPct}%`, backgroundColor: '#ef4444'}} title={`שכר עובדים: ₪${Math.round(totalSalaries)}`}></div>
                                    {Object.entries(expByCategory).map(([cat, amount], idx) => { const pct = maxVal > 0 ? (amount / maxVal) * 100 : 0; return <div key={cat} style={{width: `${pct}%`, backgroundColor: graphColors[idx % graphColors.length]}} title={`${cat}: ₪${Math.round(amount)}`} className="border-r border-gray-900/50"></div> })}
                                </div>
                                <div className="flex flex-wrap gap-x-4 gap-y-2 mt-3 text-xs opacity-90"><div className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-red-500"></div>שכר עובדים (₪{Math.round(totalSalaries)})</div>{Object.entries(expByCategory).map(([cat, amount], idx) => (<div key={cat} className="flex items-center gap-1"><div className="w-3 h-3 rounded-full" style={{backgroundColor: graphColors[idx % graphColors.length]}}></div>{cat} (₪{Math.round(amount)})</div>))}</div>
                            </div>

                    </Card>
                    <Card title="פירוט הוצאות (משויכות לחודש זה)"><div className="overflow-x-auto"><table className="w-full text-right text-sm whitespace-nowrap"><thead className="opacity-70 border-b border-gray-700"><tr><th>תיאור ההוצאה</th><th>קטגוריה</th><th>חשבונית</th><th>סכום כולל</th><th>תקופת חיוב</th><th>יחסי לחודש</th><th>מחק</th></tr></thead><tbody className="divide-y divide-gray-800">{activeExpenses.length === 0 && <tr><td colSpan="7" className="text-center py-4">אין הוצאות מתועדות לחודש זה</td></tr>}
                        {activeExpenses.map((ex) => { const catIndex = Object.keys(expByCategory).indexOf(ex.category); const dotColor = graphColors[catIndex % graphColors.length]; return (<tr key={ex.id} className="hover:bg-indigo-900/30 cursor-pointer" onClick={()=>setEditingExpense(ex)}><td className="py-2 font-bold">{ex.name}</td><td className="flex items-center gap-2 mt-2"><div className="w-2 h-2 rounded-full" style={{backgroundColor: dotColor}}></div>{ex.category}</td><td className="opacity-70">{ex.invoiceNumber || '-'}</td><td>₪{ex.totalAmount}</td><td className="text-xs opacity-70">{ex.fromMonth} עד {ex.toMonth}</td><td className="font-bold text-orange-400">₪{ex.monthlyAmount.toFixed(1)}</td><td><button onClick={(e) => { e.stopPropagation(); confirm("למחוק הוצאה?") && deleteDoc(getDocRef('expenses', ex.id)); }} className="text-red-400 p-1"><Trash2 size={14}/></button></td></tr>)})}
                    </tbody></table></div></Card>
                    {showForm && (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700 max-h-[90vh] overflow-y-auto"><h3 className="text-xl font-bold mb-4">רישום הוצאה</h3><form onSubmit={handleAddExpense} className="space-y-4"><Input label="תיאור ההוצאה" value={expName} onChange={e=>setExpName(e.target.value)} required /><div className="flex flex-col gap-1"><label className="text-sm opacity-70">קטגוריה</label><div className="flex gap-2 flex-wrap mb-1">{quickCats.map(c => (<button key={c} type="button" onClick={()=>setExpCategory(c)} className={`text-xs px-3 py-1 rounded-full border ${expCategory===c ? 'bg-indigo-600 border-indigo-500' : 'bg-gray-800'}`}>{c}</button>))}</div><select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={expCategory} onChange={e=>setExpCategory(e.target.value)}>{dynamicCats.map(c => <option key={c} value={c}>{c}</option>)}<option value="אחר">אחר (הזן קטגוריה חדשה)...</option></select></div>{expCategory === 'אחר' && <Input label="הזן שם קטגוריה חדשה" value={customCategory} onChange={e=>setCustomCategory(e.target.value)} required />}<Input label="מספר חשבונית/קבלה" value={expInvoice} onChange={e=>setExpInvoice(e.target.value)} /><Input label="סכום כולל לתשלום (₪)" type="number" step="any" min="0" value={expAmount} onChange={e=>setExpAmount(e.target.value)} required /><div className="bg-indigo-900/20 p-3 rounded border border-indigo-500/30 text-xs">הסכום יתחלק שווה בשווה:</div><div className="grid grid-cols-2 gap-4"><Input label="מחודש" type="month" value={expFrom} onChange={e=>setExpFrom(e.target.value)} required /><Input label="עד חודש" type="month" value={expTo} onChange={e=>setExpTo(e.target.value)} required /></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setShowForm(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'הוסף הוצאה'}</Button></div></form></div></div>)}

            const totalPay = report.reduce((acc, r) => acc + r.totalWage, 0);
            const handleShiftStatus = async (id, newStatus) => { await updateDoc(getDocRef('shifts', id), { status: newStatus, approved: newStatus === 'approved' }); };

            return (
                <div className="space-y-6">

                                {pendingShifts.map(s => { const e = (employees||[]).find(emp => emp.id === s.employeeId); return (<tr key={s.id} className="hover:bg-gray-800/30"><td className="py-2 font-bold">{e?.name || 'לא נמצא'}</td><td>{formatDateIL(s.date)}</td><td>{s.startTime}</td><td>{s.room}</td><td>{s.gamesCount}</td><td>₪{s.wageAtTime || e?.wagePerGame || 0}</td><td className="flex gap-2 py-2"><Button size="sm" variant="success" onClick={()=>handleShiftStatus(s.id, 'approved')}><Check size={14}/></Button><Button size="sm" variant="danger" onClick={()=>handleShiftStatus(s.id, 'rejected')}><XIcon size={14}/></Button><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-400 mr-2"><Trash2 size={14}/></button></td></tr>) })}
                        </tbody></table></div></Card>
                    )}
                    <div className="flex justify-between items-center card-bg p-4 rounded-xl"><div><h2 className="text-xl font-bold text-dynamic">דוחות שכר ({month})</h2><p className="opacity-80">סה"כ לתשלום: <span className="text-green-400 font-bold">₪{totalPay.toLocaleString()}</span></p></div><div className="flex gap-2"><input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/><Button onClick={() => exportToXLSSalary(report, `Salary_Report_${month}.xls`)} variant="success"><Download size={16}/> אקסל</Button></div></div>
                    <div className="space-y-4">
                        {report.map(r => (<div key={r.id} className="card-bg rounded-xl overflow-hidden"><div className="p-4 flex justify-between items-center"><div className="flex items-center gap-3"><div className="h-10 w-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-white">{r.name[0]}</div><span className="text-lg font-bold text-dynamic">{r.name}</span></div><div className="text-green-400 font-bold text-xl">₪{r.totalWage}</div></div>
                            {r.empShifts.length > 0 && (<div className="bg-black/20 p-2 text-sm border-t border-gray-800"><div className="grid grid-cols-7 text-gray-500 mb-2 px-2 text-xs font-bold"><div>תאריך</div><div>שעה</div><div>חדר</div><div>משחקים</div><div>תעריף</div><div>סה"כ</div><div>מחק</div></div>
                                {r.empShifts.map(s => { return (<div key={s.id} className="grid grid-cols-7 py-2 px-2 border-b border-gray-800 items-center hover:bg-white/5 opacity-80"><div>{formatDateIL(s.date)}</div><div>{s.startTime}</div><div>{s.room}</div><div>{s.gamesCount}</div><div>₪{s.wageAtTime||r.wagePerGame||0}</div><div>₪{s.gamesCount * (s.wageAtTime||r.wagePerGame||0)}</div><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-500"><Trash2 size={14}/></button></div>) })}
                            </div>)}
                        </div>))}
                    </div>
                </div>
            );
        };

        const AdminIssues = ({ issues, employees, settings }) => {
            const pendingIssues = (issues||[]).filter(i => i.status === 'pending').sort((a,b) => new Date(a.reportedAt) - new Date(b.reportedAt));
