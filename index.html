<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Room Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for Modules -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>

    <style>
        :root {
            --app-bg: #030712;
            --app-text: #ffffff;
            --app-card-bg: rgba(255, 255, 255, 0.05);
            --app-border: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--app-bg); color: var(--app-text); font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Dynamic Classes */
        .card-bg { background-color: var(--app-card-bg); border: 1px solid var(--app-border); }
        .text-dynamic { color: var(--app-text) !important; }
        .border-dynamic { border-color: var(--app-border) !important; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Input overrides */
        input[type="date"], input[type="time"], select { color-scheme: dark; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Users, Calendar, DollarSign, Settings, LogOut, Plus, Save, Clock, 
            FileText, Mail, CheckCircle, XCircle, AlertTriangle, Lock, Menu, 
            X, User, LayoutDashboard, Send, CalendarRange, Download, UploadCloud, 
            File, ChevronLeft, ChevronRight, Activity, MapPin, Database, Loader, 
            Trash2, Bell, Check, X as XIcon, Cake, Wifi, WifiOff, Edit2, CheckSquare, Coins
        } from 'lucide-react';

        import { initializeApp } from 'firebase/app';
        import { 
            getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged 
        } from 'firebase/auth';
        import { 
            getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, 
            onSnapshot, query, orderBy 
        } from 'firebase/firestore';

        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBvayS247KEOVqZloFrNWV3svg4DSiNG08",
            authDomain: "g-room-escape-room-management.firebaseapp.com",
            projectId: "g-room-escape-room-management",
            storageBucket: "g-room-escape-room-management.firebasestorage.app",
            messagingSenderId: "361117379721",
            appId: "1:361117379721:web:3019eaeb30f4fe188caa58",
            measurementId: "G-6TSPGPBF4H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, 'groom');
        
        // YOUR FIREBASE CLOUD FUNCTION URL
        const TOR4YOU_FUNCTION_URL = "https://us-central1-g-room-escape-room-management.cloudfunctions.net/getTor4YouAppts";

        const getCollectionRef = (name) => collection(db, name);
        const getDocRef = (name, id) => doc(db, name, id);

        const INITIAL_SETTINGS_FALLBACK = {
            businessName: 'G-Room Escape',
            senderEmail: 'manager@g-room.co.il',
            adminCode: 'admin123',
            logo: null,
            primaryColor: '#030712', 
            secondaryColor: '#ffffff',
            roomsList: 'סודו של הודיני',
            pricing: {
                basePrice2: 140,
                basePrice3: 125,
                basePrice4: 110,
                basePrice5: 100,
                basePrice6to8: 90,
                basePrice9to10: 80,
                discountKids: 15,
                discountEligible: 10
            },
            emailTemplate: {
                subject: 'G-Room: תלוש שכר לחודש {month}/{year}',
                body: 'היי {name},\n\nמצורף תלוש השכר שלך עבור חודש {month}/{year}.\n\nבברכה,\nהנהלת G-Room'
            },
            openingHours: {
                Sunday: { start: '10:00', end: '23:00' },
                Monday: { start: '10:00', end: '23:00' },
                Tuesday: { start: '10:00', end: '23:00' },
                Wednesday: { start: '10:00', end: '23:00' },
                Thursday: { start: '10:00', end: '01:00' },
                Friday: { start: '09:00', end: '15:00' },
                Saturday: { start: '18:00', end: '01:00' },
            }
        };

        // --- Utilities ---
        const formatDateIL = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' });
        };

        const addTime = (timeStr, minutesToAdd) => {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, minutes + minutesToAdd);
            return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
        };

        const generateTimeOptions = () => {
            const options = [];
            for (let i = 0; i < 24; i++) {
                for (let j = 0; j < 60; j += 15) {
                    options.push(`${i.toString().padStart(2, '0')}:${j.toString().padStart(2, '0')}`);
                }
            }
            return options;
        };

        // תוקן באג המספרים - המרה ודאית למספר
        const getBasePrice = (playersStr, pricing) => {
            const players = Number(playersStr);
            if (players <= 2) return pricing.basePrice2;
            if (players === 3) return pricing.basePrice3;
            if (players === 4) return pricing.basePrice4;
            if (players === 5) return pricing.basePrice5;
            if (players >= 6 && players <= 8) return pricing.basePrice6to8;
            if (players >= 9) return pricing.basePrice9to10;
            return 0;
        };

        const exportToXLSSalary = (salaryReport, filename) => {
            let tableRows = '';
            salaryReport.forEach(emp => {
                if (emp.empShifts.length > 0) {
                    tableRows += `<tr><td colspan="7" style="background-color:#e0e7ff;font-weight:bold;text-align:center;">${emp.name}</td></tr>
                    <tr style="background-color:#f3f4f6;font-weight:bold;"><td>תאריך</td><td>התחלה</td><td>סיום (משוער)</td><td>חדר</td><td>משחקים</td><td>תעריף משומר</td><td>סה"כ</td></tr>`;
                    emp.empShifts.forEach(s => {
                        const endTime = addTime(s.startTime, s.gamesCount * 90); 
                        const shiftWage = s.gamesCount * s.wageAtTime;
                        tableRows += `<tr><td>${formatDateIL(s.date)}</td><td>${s.startTime}</td><td>${endTime}</td><td>${s.room}</td><td>${s.gamesCount}</td><td>₪${s.wageAtTime}</td><td>₪${shiftWage}</td></tr>`;
                    });
                    tableRows += `<tr><td colspan="6" style="font-weight:bold;">סה"כ לתשלום:</td><td style="font-weight:bold;background-color:#dcfce7;">₪${emp.totalWage}</td></tr><tr><td colspan="7"></td></tr>`;
                }
            });
            let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><table>${tableRows}</table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename || `Salary_Report.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const exportToXLSGroups = (groups, employees, filename) => {
            let tableRows = `<tr style="background-color:#bae6fd;font-weight:bold;">
                <td>#</td><td>תאריך</td><td>שעה</td><td>שם החדר</td><td>שם הלקוח</td><td>כמות השחקנים</td>
                <td>סוג השחקנים<br>(משפחה, בני זוג, חברים, צוות עבודה)</td><td>כיצד הגיעו אלינו?<br>(גוגל, פייסבוק, שלט, מפה לאוזן)</td>
                <td>סכום לתשלום<br>(לפני הנחה)</td><td>סוג ההנחה</td><td>אחוז הנחה</td><td>סך תשלום<br>(אחרי הנחה)</td>
                <td>מזומן</td><td>אשראי</td><td>ביט</td><td>העברה בנקאית</td><td>שובר מגה לאן + קוד עסקה</td><td>מפעיל/ה</td>
            </tr>`;
            
            groups.forEach((g, index) => {
                const empName = g.employeeId === 'admin' ? 'מנהל מערכת' : (employees.find(e => e.id === g.employeeId)?.name || 'לא ידוע');
                let discountType = '';
                if(g.hasMegaLaan) discountType = 'מגה לאן';
                else if (g.kids > 0 && g.eligible > 0) discountType = 'ילדים + זכאים';
                else if (g.kids > 0) discountType = 'ילדים';
                else if (g.eligible > 0) discountType = 'זכאים';
                
                let discountPercent = '';
                if(g.hasMegaLaan) discountPercent = '22%';
                else if (g.totalDiscountAmount > 0) {
                    discountPercent = Math.round((g.totalDiscountAmount / g.totalOriginalPrice) * 100) + '%';
                }

                const megaLaanInfo = g.hasMegaLaan ? `שובר על ${g.megaLaanPlayers} שחקנים (${g.megaLaanCode})` : '';

                tableRows += `<tr>
                    <td>${index + 1}</td>
                    <td>${formatDateIL(g.date)}</td>
                    <td>${g.time}</td>
                    <td>${g.room}</td>
                    <td>${g.customerName}</td>
                    <td>${g.totalPlayers}</td>
                    <td>${g.groupType}</td>
                    <td>${g.source}</td>
                    <td>₪${g.totalOriginalPrice}</td>
                    <td>${discountType}</td>
                    <td>${discountPercent}</td>
                    <td>₪${g.finalPriceToPay}</td>
                    <td>₪${g.payments.cash}</td>
                    <td>₪${g.payments.credit}</td>
                    <td>₪${g.payments.bit}</td>
                    <td>₪${g.payments.transfer}</td>
                    <td>${megaLaanInfo}</td>
                    <td>${empName}</td>
                </tr>`;
            });
            let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;width:100%;font-family:Arial;}th,td{border:1px solid #ccc;padding:5px;text-align:right;}</style></head><body dir="rtl"><table>${tableRows}</table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename || `Groups_Income.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const timeoutPromise = (promise, ms = 5000) => Promise.race([promise, new Promise((_, r) => setTimeout(() => r(new Error("Timeout")), ms))]);

        // --- UI Components ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled, ...props }) => {
            const v = {
                primary: "bg-indigo-600 hover:bg-indigo-700 text-white",
                secondary: "bg-gray-700 hover:bg-gray-600 text-gray-100",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                success: "bg-green-600 hover:bg-green-700 text-white",
                outline: "border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20"
            };
            return <button onClick={onClick} className={`px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 shadow-md transition-all disabled:opacity-50 ${v[variant]} ${className}`} disabled={disabled} {...props}>{children}</button>;
        };

        const Card = ({ title, children, className = '' }) => (
            <div className={`card-bg rounded-xl p-6 shadow-xl ${className}`}>
                {title && <h3 className="text-xl font-bold text-dynamic mb-4 border-b border-gray-700 pb-2">{title}</h3>}
                <div className="text-dynamic">{children}</div>
            </div>
        );

        const Input = ({ label, type = "text", value, onChange, className = "", ...props }) => (
            <div className={`flex flex-col gap-1 ${className}`}>
                {label && <label className="text-sm opacity-70 font-medium text-dynamic">{label}</label>}
                <input type={type} value={value} onChange={onChange} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none" {...props} />
            </div>
        );

        const StatusBadge = ({ status }) => {
            if (status === 'approved') return <span className="text-green-400 flex items-center gap-1 text-xs"><CheckCircle size={14}/> אושר</span>;
            if (status === 'rejected') return <span className="text-red-400 flex items-center gap-1 text-xs"><XCircle size={14}/> נדחה</span>;
            return <span className="text-yellow-400 flex items-center gap-1 text-xs"><Clock size={14}/> ממתין</span>;
        };

        // --- Main App ---
        function GRoomApp() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [data, setData] = useState({ employees: [], shifts: [], constraints: [], requests: [], tasks: [], groups: [] });
            const [settings, setSettings] = useState(INITIAL_SETTINGS_FALLBACK);
            const [loading, setLoading] = useState(true);
            const [login, setLogin] = useState({ code: '', empId: '' });
            const [dbConn, setDbConn] = useState(false);

            useEffect(() => {
                const init = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
                init();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const unsub = [
                    onSnapshot(getCollectionRef('employees'), s => { setData(p => ({...p, employees: s.docs.map(d => ({id: d.id, ...d.data()}))})); setDbConn(true); }, e => setDbConn(false)),
                    onSnapshot(getCollectionRef('shifts'), s => setData(p => ({...p, shifts: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('constraints'), s => setData(p => ({...p, constraints: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('requests'), s => setData(p => ({...p, requests: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('tasks'), s => setData(p => ({...p, tasks: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('groups'), s => setData(p => ({...p, groups: s.docs.map(d => ({id: d.id, ...d.data()}))}))),
                    onSnapshot(getCollectionRef('app_settings'), s => {
                        if (!s.empty) {
                            const d = s.docs.find(doc => doc.id === 'global') || s.docs[0];
                            if (d) setSettings(prev => ({...prev, ...d.data()}));
                        }
                        setLoading(false);
                    })
                ];
                return () => unsub.forEach(u => u());
            }, [user]);

            useEffect(() => {
                const r = document.documentElement.style;
                r.setProperty('--app-bg', settings.primaryColor || '#030712');
                r.setProperty('--app-text', settings.secondaryColor || '#ffffff');
                const isLight = settings.primaryColor === '#ffffff' || settings.primaryColor === '#f3f4f6';
                r.setProperty('--app-card-bg', isLight ? '#e5e7eb' : 'rgba(255, 255, 255, 0.05)');
                r.setProperty('--app-border', isLight ? '#d1d5db' : 'rgba(255, 255, 255, 0.1)');
            }, [settings]);

            const doLogin = () => {
                if ((login.empId === 'admin' && login.code === settings.adminCode) || (login.empId === 'admin' && data.employees.length === 0 && login.code === 'admin123')) {
                    setCurrentUser({ role: 'admin', name: 'מנהל המערכת', id: 'admin' });
                } else {
                    const emp = data.employees.find(e => e.id === login.empId);
                    if (emp && emp.code === login.code) setCurrentUser({ role: 'employee', data: emp });
                    else alert("פרטי התחברות שגויים");
                }
            };

            if (loading) return <div className="min-h-screen bg-gray-950 flex items-center justify-center text-indigo-500"><Loader className="animate-spin w-10 h-10" /></div>;

            if (!currentUser) return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full card-bg p-8 rounded-2xl text-center relative">
                        <div className={`absolute top-4 right-4 w-3 h-3 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
                        <div className="mb-8">
                            {settings.logo ? <img src={settings.logo} className="h-24 mx-auto mb-4 object-contain"/> : <div className="h-24 w-24 bg-indigo-900/50 rounded-full mx-auto flex items-center justify-center mb-4"><Lock size={40} className="icon-dynamic"/></div>}
                            <h1 className="text-3xl font-bold text-dynamic">{settings.businessName}</h1>
                        </div>
                        <div className="space-y-4">
                            <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3" value={login.empId} onChange={e => setLogin({...login, empId: e.target.value})}>
                                <option value="">-- בחר משתמש --</option>
                                <option value="admin">🔒 מנהל מערכת</option>
                                {data.employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                            </select>
                            <input type="password" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-center tracking-widest" value={login.code} onChange={e => setLogin({...login, code: e.target.value})} onKeyDown={e => e.key === 'Enter' && doLogin()} placeholder="****" />
                            <Button onClick={doLogin} className="w-full py-3 text-lg">כניסה</Button>
                        </div>
                        <div className="mt-6 text-[10px] opacity-40 text-dynamic">גרסה 5.4 - רצף ממשקי מסודר</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen font-sans flex flex-col">
                    <header className="card-bg border-b border-dynamic sticky top-0 z-50 h-16 flex items-center justify-between px-6">
                        <div className="flex items-center gap-3">
                            {settings.logo && <img src={settings.logo} className="h-8 w-8 rounded object-cover"/>}
                            <span className="font-bold text-xl text-dynamic">{settings.businessName}</span>
                            <span className="text-xs bg-gray-800 text-white px-2 py-1 rounded-full border border-gray-700 flex items-center gap-2">
                                {currentUser.role === 'admin' ? 'מנהל' : `שלום, ${currentUser.data.name}`}
                                <div className={`w-2 h-2 rounded-full ${dbConn ? 'bg-green-500' : 'bg-red-500'}`}></div>
                            </span>
                        </div>
                        <Button variant="ghost" onClick={() => {setCurrentUser(null); setLogin({code:'', empId:''});}} className="text-red-400"><LogOut size={18} /> יציאה</Button>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        {currentUser.role === 'admin' ? 
                            <AdminDashboard data={data} settings={settings} /> : 
                            <EmployeeDashboard employee={currentUser.data} shifts={data.shifts} constraints={data.constraints} settings={settings} tasks={data.tasks} groups={data.groups}/>
                        }
                    </main>
                    <footer className="p-4 text-center text-xs opacity-30 text-dynamic">G-Room System v5.4</footer>
                </div>
            );
        }

        // --- Shared Component: Group Report Form (SPLIT LAYOUT - REORDERED) ---
        const GroupReportForm = ({ employeeId, settings, onSave, isAdmin, employees }) => {
            const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
            const [time, setTime] = useState('10:00');
            const [room, setRoom] = useState('');
            const [customerName, setCustomerName] = useState('');
            const [totalPlayers, setTotalPlayers] = useState(2);
            const [groupType, setGroupType] = useState('משפחה');
            const [source, setSource] = useState('גוגל');
            const [kids, setKids] = useState(0);
            const [eligible, setEligible] = useState(0); 
            
            const [hasMegaLaan, setHasMegaLaan] = useState(false);
            const [megaLaanPlayers, setMegaLaanPlayers] = useState(0);
            const [megaLaanCode, setMegaLaanCode] = useState('');
            const [isWeekendMegaLaan, setIsWeekendMegaLaan] = useState(false);

            const [payments, setPayments] = useState({ cash: '', credit: '', bit: '', transfer: '' });
            
            const [saving, setSaving] = useState(false);
            const [reportEmpId, setReportEmpId] = useState(employeeId);
            const [fetchedCustomers, setFetchedCustomers] = useState([]);
            const [isManualCustomer, setIsManualCustomer] = useState(true);
            const [loadingCustomers, setLoadingCustomers] = useState(false);

            const roomList = (settings.roomsList || 'סודו של הודיני').split(',').map(s=>s.trim());
            
            useEffect(() => {
                if(roomList.length > 0 && !room) setRoom(roomList[0]);
            }, [roomList]);

            useEffect(() => {
                const fetchAppts = async () => {
                    setLoadingCustomers(true);
                    try {
                        const res = await fetch(`${TOR4YOU_FUNCTION_URL}?date=${date}`);
                        if(res.ok) {
                            const data = await res.json();
                            if(data.customers && data.customers.length > 0) {
                                setFetchedCustomers(data.customers);
                                setIsManualCustomer(false);
                                setCustomerName(data.customers[0]);
                            } else {
                                setFetchedCustomers([]);
                                setIsManualCustomer(true);
                                setCustomerName('');
                            }
                        } else {
                            throw new Error("Failed");
                        }
                    } catch (e) {
                        setFetchedCustomers([]);
                        setIsManualCustomer(true);
                    } finally {
                        setLoadingCustomers(false);
                    }
                };
                fetchAppts();
            }, [date]);

            // תיקון באג תמחור - כעת totalPlayers הופך בבטחה למספר
            const basePricePerPlayer = getBasePrice(totalPlayers, settings.pricing);
            const totalOriginalPrice = basePricePerPlayer * Number(totalPlayers);
            
            let totalDiscountAmount = 0;
            let expectedMegaLaanRevenue = 0;
            let weekendMegaLaanFee = 0;

            if (hasMegaLaan) {
                const regularBaseMegaLaan = Number(megaLaanPlayers) * basePricePerPlayer;
                expectedMegaLaanRevenue = Math.ceil(regularBaseMegaLaan * 0.78);
                if (isWeekendMegaLaan) weekendMegaLaanFee = Number(megaLaanPlayers) * 10;
                totalDiscountAmount = totalOriginalPrice - expectedMegaLaanRevenue;
            } else {
                const kidsDiscount = Number(kids) * basePricePerPlayer * (settings.pricing.discountKids / 100);
                const eligibleDiscount = Number(eligible) * basePricePerPlayer * (settings.pricing.discountEligible / 100);
                totalDiscountAmount = kidsDiscount + eligibleDiscount;
            }

            let finalPriceToPay = 0;
            if (hasMegaLaan) {
                const extraPlayers = Number(totalPlayers) - Number(megaLaanPlayers);
                const extraPlayersCost = extraPlayers > 0 ? (extraPlayers * basePricePerPlayer) : 0;
                finalPriceToPay = extraPlayersCost + weekendMegaLaanFee;
            } else {
                finalPriceToPay = totalOriginalPrice - totalDiscountAmount;
            }

            const totalEnteredPayment = Object.values(payments).reduce((acc, val) => acc + (Number(val) || 0), 0);
            const paymentBalance = finalPriceToPay - totalEnteredPayment;

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (paymentBalance !== 0) {
                    alert(`יש פער בתשלום! הלקוח צריך לשלם ${finalPriceToPay} אך הוזן ${totalEnteredPayment}`);
                    return;
                }
                
                let actualCustName = customerName;
                if(!isManualCustomer && customerName === 'manual_entry') {
                    actualCustName = document.getElementById('manualCustomerNameInput')?.value;
                }
                if(!actualCustName) return alert('נא להזין שם לקוח');

                setSaving(true);
                const groupData = {
                    date, time, room, customerName: actualCustName, totalPlayers: Number(totalPlayers),
                    groupType, source, kids: hasMegaLaan ? 0 : Number(kids), eligible: hasMegaLaan ? 0 : Number(eligible),
                    hasMegaLaan, megaLaanPlayers: Number(megaLaanPlayers), megaLaanCode, isWeekendMegaLaan,
                    totalOriginalPrice, totalDiscountAmount: hasMegaLaan ? 0 : totalDiscountAmount, finalPriceToPay,
                    expectedMegaLaanRevenue,
                    payments: {
                        cash: Number(payments.cash) || 0, credit: Number(payments.credit) || 0,
                        bit: Number(payments.bit) || 0, transfer: Number(payments.transfer) || 0
                    },
                    employeeId: reportEmpId,
                    createdAt: new Date().toISOString()
                };

                try {
                    await timeoutPromise(addDoc(getCollectionRef('groups'), groupData), 4000);
                    let wageAtTime = 0;
                    if(reportEmpId !== 'admin') {
                        const emp = employees?.find(e=>e.id === reportEmpId);
                        if(emp) wageAtTime = emp.wagePerGame || 0;
                    }
                    await timeoutPromise(addDoc(getCollectionRef('shifts'), {
                        employeeId: reportEmpId, date, startTime: time, gamesCount: 1, room, 
                        status: 'pending', wageAtTime, isAutoGroup: true
                    }), 4000);
                    
                    alert('קבוצה ומשמרת נשמרו בהצלחה!');
                    onSave();
                } catch(err) {
                    if (err.message === 'Timeout') { alert('נשמר בענן (איטי)'); onSave(); }
                    else alert(err.message);
                } finally { setSaving(false); }
            };

            return (
                <form onSubmit={handleSubmit} className="flex flex-col lg:flex-row gap-8">
                    {/* צד ימין - הזנת נתונים מסודרת */}
                    <div className="flex-1 space-y-6">
                        
                        {/* 1. מפעיל (ראשון, לפי הבקשה) */}
                        {isAdmin && (
                            <div className="bg-gray-800 p-4 rounded-lg border border-gray-700">
                                <label className="text-sm opacity-70 font-medium flex items-center gap-2"><User size={16}/> מי הפעיל את הקבוצה?</label>
                                <select className="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white mt-2 focus:ring-2 focus:ring-indigo-500 outline-none" value={reportEmpId} onChange={e=>setReportEmpId(e.target.value)}>
                                    <option value="admin">מנהל מערכת</option>
                                    {employees?.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                                </select>
                            </div>
                        )}

                        {/* 2. פרמטרים של הקבוצה */}
                        <div className="grid md:grid-cols-2 gap-4">
                            <Input label="תאריך" type="date" value={date} onChange={e=>setDate(e.target.value)} required />
                            <div className="flex flex-col gap-1">
                                <label className="text-sm opacity-70 font-medium text-dynamic">שעה</label>
                                <select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={time} onChange={e=>setTime(e.target.value)} required>
                                    {generateTimeOptions().map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                            </div>
                            <div className="flex flex-col gap-1">
                                <label className="text-sm opacity-70 font-medium text-dynamic">חדר</label>
                                <select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={room} onChange={e=>setRoom(e.target.value)} required>
                                    {roomList.map(r => <option key={r} value={r}>{r}</option>)}
                                </select>
                            </div>
                            <div className="flex flex-col gap-1">
                                <label className="text-sm opacity-70 font-medium text-dynamic flex items-center gap-1">שם לקוח {loadingCustomers && <Loader className="animate-spin w-3 h-3 text-indigo-400"/>}</label>
                                {!isManualCustomer && fetchedCustomers.length > 0 ? (
                                    <div className="space-y-2">
                                        <select className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={customerName} onChange={e=>setCustomerName(e.target.value)} required>
                                            {fetchedCustomers.map(c => <option key={c} value={c}>{c}</option>)}
                                            <option value="manual_entry">-- לקוח מזדמן / הזנה ידנית --</option>
                                        </select>
                                        {customerName === 'manual_entry' && <input id="manualCustomerNameInput" type="text" placeholder="הקלד שם לקוח" className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" required/>}
                                    </div>
                                ) : (
                                    <input type="text" value={customerName} onChange={e=>setCustomerName(e.target.value)} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" placeholder="הזן שם לקוח" required />
                                )}
                            </div>
                        </div>

                        <div className="grid md:grid-cols-3 gap-4 border-t border-gray-800 pt-4">
                            <Input label="כמות שחקנים כוללת" type="number" min="2" value={totalPlayers} onChange={e=>setTotalPlayers(e.target.value)} required />
                            <div className="flex flex-col gap-1">
                                <label className="text-sm opacity-70 font-medium text-dynamic">הרכב קבוצה</label>
                                <select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={groupType} onChange={e=>setGroupType(e.target.value)}>
                                    {['משפחה','חברים','צוות עבודה','בני זוג','גיבוש קבוצה'].map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                            </div>
                            <div className="flex flex-col gap-1">
                                <label className="text-sm opacity-70 font-medium text-dynamic">מקור הגעה</label>
                                <select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={source} onChange={e=>setSource(e.target.value)}>
                                    {['גוגל','פייסבוק','EAZY','מפה לאוזן','אינסטגרם','טיקטוק'].map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                            </div>
                        </div>

                        {/* 3. הנחות ושוברים */}
                        <div className="bg-blue-900/20 p-4 rounded-lg border border-blue-800/50">
                            <label className="flex items-center gap-2 cursor-pointer font-bold text-blue-300">
                                <input type="checkbox" checked={hasMegaLaan} onChange={e=>{setHasMegaLaan(e.target.checked); if(e.target.checked){setKids(0);setEligible(0);}}} className="w-5 h-5"/>
                                התקבל שובר מגה לאן
                            </label>
                            {hasMegaLaan && (
                                <div className="mt-4 grid md:grid-cols-3 gap-4 fade-in">
                                    <Input label="על כמה שחקנים השובר?" type="number" min="1" max={totalPlayers} value={megaLaanPlayers} onChange={e=>setMegaLaanPlayers(e.target.value)} required/>
                                    <Input label="קוד שובר" value={megaLaanCode} onChange={e=>setMegaLaanCode(e.target.value)} required/>
                                    <label className="flex items-center gap-2 mt-6 cursor-pointer text-sm">
                                        <input type="checkbox" checked={isWeekendMegaLaan} onChange={e=>setIsWeekendMegaLaan(e.target.checked)}/>
                                        תוספת סופ"ש/חג
                                    </label>
                                </div>
                            )}
                        </div>

                        <div className={`grid md:grid-cols-2 gap-4 border-t border-gray-800 pt-4 ${hasMegaLaan ? 'opacity-30 pointer-events-none' : ''}`}>
                            <Input label="ילדים (עד גיל 12)" type="number" min="0" value={kids} onChange={e=>setKids(e.target.value)} disabled={hasMegaLaan} />
                            <Input label="סטודנט/חייל/נכה" type="number" min="0" value={eligible} onChange={e=>setEligible(e.target.value)} disabled={hasMegaLaan} />
                        </div>

                        {/* 4. אמצעי תשלום - מרוכזים פה! */}
                        <div className="bg-gray-800 p-5 rounded-lg border border-gray-700 mt-6">
                            <h4 className="font-bold mb-4 flex items-center gap-2 text-indigo-300"><DollarSign size={18}/> אמצעי תשלום</h4>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                <Input label="מזומן (₪)" type="number" value={payments.cash} onChange={e=>setPayments({...payments, cash: e.target.value})} />
                                <Input label="אשראי (₪)" type="number" value={payments.credit} onChange={e=>setPayments({...payments, credit: e.target.value})} />
                                <Input label="ביט (₪)" type="number" value={payments.bit} onChange={e=>setPayments({...payments, bit: e.target.value})} />
                                <Input label="העברה (₪)" type="number" value={payments.transfer} onChange={e=>setPayments({...payments, transfer: e.target.value})} />
                            </div>
                        </div>

                    </div>

                    {/* 5. צד שמאל - מחשבון וסיכום נקי */}
                    <div className="w-full lg:w-96">
                        <div className="bg-gray-900 p-6 rounded-xl border border-gray-700 shadow-2xl flex flex-col gap-4 sticky top-24">
                            <h3 className="font-bold text-xl border-b border-gray-700 pb-3 mb-2 flex items-center gap-2"><DollarSign size={20} className="text-indigo-400"/> סיכום חישוב</h3>
                            
                            <div className="flex justify-between text-sm opacity-90">
                                <span>מחיר מלא בסיס:</span> 
                                <span className="font-bold">₪{totalOriginalPrice} <span className="opacity-60 text-xs font-normal">({totalPlayers} שחקנים * ₪{basePricePerPlayer})</span></span>
                            </div>
                            
                            {!hasMegaLaan && totalDiscountAmount > 0 && (
                                <div className="flex justify-between text-sm text-red-400">
                                    <span>סך כל ההנחות:</span> 
                                    <span className="font-bold">-₪{totalDiscountAmount}</span>
                                </div>
                            )}
                            
                            {hasMegaLaan && (
                                <div className="flex justify-between text-sm text-blue-400 bg-blue-900/20 p-2 rounded">
                                    <span>מגה לאן צפוי:</span> 
                                    <span className="font-bold">₪{expectedMegaLaanRevenue} <span className="opacity-60 text-xs font-normal">(22% מעוגל מעלה)</span></span>
                                </div>
                            )}
                            
                            {hasMegaLaan && isWeekendMegaLaan && (
                                <div className="flex justify-between text-sm text-yellow-400">
                                    <span>תוספת סופ"ש בקופה:</span> 
                                    <span className="font-bold">₪{weekendMegaLaanFee}</span>
                                </div>
                            )}

                            <div className="flex justify-between text-2xl font-bold bg-gray-800 p-4 rounded-lg border border-gray-700 mt-4 shadow-inner">
                                <span>סה"כ לתשלום:</span> 
                                <span className="text-green-400">₪{finalPriceToPay}</span>
                            </div>

                            {paymentBalance !== 0 && (
                                <div className={`mt-2 text-sm font-bold text-center p-2 rounded border ${paymentBalance > 0 ? 'bg-red-900/30 border-red-800 text-red-400' : 'bg-yellow-900/30 border-yellow-800 text-yellow-400'}`}>
                                    יתרת תשלום להזנה: ₪{paymentBalance}
                                </div>
                            )}
                            
                            {paymentBalance === 0 && finalPriceToPay > 0 && (
                                <div className="mt-2 text-sm font-bold text-center p-2 rounded bg-green-900/30 border border-green-800 text-green-400 flex items-center justify-center gap-2">
                                    <CheckCircle size={16}/> סכום התשלום הוזן במלואו
                                </div>
                            )}

                            <Button type="submit" className="w-full py-4 mt-6 text-lg font-bold shadow-lg" disabled={saving || paymentBalance !== 0}>
                                {saving ? 'שומר נתונים...' : 'שמור דיווח קבוצה'}
                            </Button>
                        </div>
                    </div>
                </form>
            );
        };


        // --- Admin Dashboards ---
        const AdminDashboard = ({ data, settings }) => {
            const [tab, setTab] = useState('groups');
            const pendingReq = data.requests.filter(r => r.status === 'pending');
            const pendingCons = data.constraints.filter(c => c.status === 'pending');
            const pendingShifts = data.shifts.filter(s => s.status === 'pending' || (s.status === undefined && s.approved === false));
            
            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap gap-2 border-b border-dynamic pb-2">
                        {[{id:'groups', l:'הכנסות וקבוצות', i:Coins}, {id:'employees', l:'עובדים', i:Users}, {id:'shifts', l:'דוחות שכר', i:FileText}, {id:'constraints', l:'זמינות', i:Calendar}, {id:'tasks', l:'משימות', i:CheckSquare}, {id:'settings', l:'הגדרות', i:Settings}].map(m => 
                            <button key={m.id} onClick={()=>setTab(m.id)} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg transition-colors ${tab===m.id ? 'bg-indigo-600/10 text-indigo-400 border-b-2 border-indigo-500' : 'opacity-70 hover:opacity-100 text-dynamic'}`}><m.i size={18} className="icon-dynamic"/> {m.l} 
                            {m.id === 'constraints' && pendingCons.length > 0 && <span className="bg-yellow-500 text-black text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingCons.length}</span>}
                            {m.id === 'shifts' && pendingShifts.length > 0 && <span className="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold ml-1">{pendingShifts.length}</span>}
                            </button>
                        )}
                        {pendingReq.length > 0 && <button onClick={()=>setTab('requests')} className={`flex items-center gap-2 px-4 py-2 rounded-t-lg ml-auto transition-colors ${tab==='requests'?'bg-indigo-600/10 border-b-2 border-indigo-500':'text-yellow-400'}`}><Bell size={18} className="animate-bounce"/><span className="font-bold">{pendingReq.length}</span></button>}
                    </div>
                    <div className="fade-in">
                        {tab==='groups' && <AdminGroups groups={data.groups} employees={data.employees} settings={settings}/>}
                        {tab==='employees' && <AdminEmployees employees={data.employees}/>}
                        {tab==='shifts' && <AdminReports employees={data.employees} shifts={data.shifts} settings={settings}/>}
                        {tab==='constraints' && <AdminConstraints employees={data.employees} constraints={data.constraints} settings={settings}/>}
                        {tab==='tasks' && <AdminTasks employees={data.employees} tasks={data.tasks}/>}
                        {tab==='settings' && <AdminSettings settings={settings}/>}
                        {tab==='requests' && <AdminRequests requests={pendingReq} employees={data.employees}/>}
                    </div>
                </div>
            );
        };

        const AdminGroups = ({ groups, employees, settings }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
            const [showManual, setShowManual] = useState(false);
            
            const monthGroups = groups.filter(g => g.date.startsWith(month)).sort((a,b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
            
            const totalCash = monthGroups.reduce((acc, g) => acc + (g.payments?.cash || 0), 0);
            const totalCredit = monthGroups.reduce((acc, g) => acc + (g.payments?.credit || 0), 0);
            const totalBit = monthGroups.reduce((acc, g) => acc + (g.payments?.bit || 0), 0);
            const totalTransfer = monthGroups.reduce((acc, g) => acc + (g.payments?.transfer || 0), 0);
            
            const totalMegaLaanRevenue = monthGroups.reduce((acc, g) => acc + (g.expectedMegaLaanRevenue || 0), 0);
            const totalRevenue = totalCash + totalCredit + totalBit + totalTransfer;

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/>
                            <Button onClick={() => exportToXLSGroups(monthGroups, employees, `Groups_${month}.xls`)} variant="success"><Download size={16}/> ייצא לאקסל</Button>
                        </div>
                        <Button onClick={()=>setShowManual(true)}><Plus size={16}/> דיווח ידני</Button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <Card className="text-center"><div className="opacity-70 text-sm">מזומן</div><div className="text-2xl font-bold">₪{totalCash}</div></Card>
                        <Card className="text-center"><div className="opacity-70 text-sm">אשראי</div><div className="text-2xl font-bold">₪{totalCredit}</div></Card>
                        <Card className="text-center"><div className="opacity-70 text-sm">ביט</div><div className="text-2xl font-bold">₪{totalBit}</div></Card>
                        <Card className="text-center"><div className="opacity-70 text-sm">העברה בנקאית</div><div className="text-2xl font-bold">₪{totalTransfer}</div></Card>
                        <Card className="text-center border-blue-500/50"><div className="text-blue-300 text-sm font-bold">צפי החזר שוברים</div><div className="text-2xl font-bold text-blue-400">₪{totalMegaLaanRevenue}</div></Card>
                    </div>
                    
                    <Card title={`הכנסות החודש מקופות: ₪${totalRevenue}`} className="border-green-500/30">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm whitespace-nowrap">
                                <thead className="opacity-70 border-b border-gray-700">
                                    <tr><th>תאריך ושעה</th><th>מפעיל</th><th>חדר</th><th>לקוח</th><th>שחקנים</th><th>סוג</th><th>סה"כ לקופה</th><th>אמצעים</th><th>מחיקה</th></tr>
                                </thead>
                                <tbody className="divide-y divide-gray-800 text-dynamic opacity-90">
                                    {monthGroups.length === 0 && <tr><td colSpan="9" className="text-center py-4">אין דיווחים החודש</td></tr>}
                                    {monthGroups.map(g => {
                                        const empName = g.employeeId === 'admin' ? 'מנהל' : (employees.find(e => e.id === g.employeeId)?.name || '');
                                        const pays = [];
                                        if(g.payments?.cash) pays.push(`מזומן:${g.payments.cash}`);
                                        if(g.payments?.credit) pays.push(`אשראי:${g.payments.credit}`);
                                        if(g.payments?.bit) pays.push(`ביט:${g.payments.bit}`);
                                        if(g.payments?.transfer) pays.push(`העברה:${g.payments.transfer}`);
                                        if(g.hasMegaLaan) pays.push(`מגה לאן`);
                                        return (
                                            <tr key={g.id} className="hover:bg-white/5">
                                                <td className="py-2">{formatDateIL(g.date)} {g.time}</td>
                                                <td>{empName}</td>
                                                <td>{g.room}</td>
                                                <td>{g.customerName}</td>
                                                <td>{g.totalPlayers}</td>
                                                <td>{g.groupType}</td>
                                                <td className="font-bold text-green-400">₪{g.finalPriceToPay}</td>
                                                <td className="text-xs opacity-70">{pays.join(', ')}</td>
                                                <td><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('groups', g.id))} className="text-red-400"><Trash2 size={14}/></button></td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {showManual && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-900 p-6 rounded-xl w-full max-w-4xl border border-gray-700 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">דיווח קבוצה (מנהל)</h3>
                                    <button onClick={()=>setShowManual(false)} className="text-gray-400 hover:text-white"><XIcon size={20}/></button>
                                </div>
                                <GroupReportForm employeeId="admin" isAdmin={true} employees={employees} settings={settings} onSave={()=>setShowManual(false)}/>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminReports = ({ employees, shifts, settings }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
            
            // Only approved shifts contribute to payroll
            const monthlyShifts = shifts.filter(s => s.date.startsWith(month) && s.status === 'approved');
            const pendingShifts = shifts.filter(s => s.status === 'pending' || (s.status === undefined && s.approved === false));

            const report = employees.map(emp => {
                const empShifts = monthlyShifts.filter(s => s.employeeId === emp.id).sort((a,b) => `${a.date} ${a.startTime}`.localeCompare(`${b.date} ${b.startTime}`));
                const totalWage = empShifts.reduce((acc, s) => acc + (Number(s.gamesCount) * (s.wageAtTime || emp.wagePerGame)), 0);
                return { ...emp, totalWage, empShifts };
            });
            const totalPay = report.reduce((acc, r) => acc + r.totalWage, 0);

            const handleShiftStatus = async (id, newStatus) => {
                await updateDoc(getDocRef('shifts', id), { status: newStatus, approved: newStatus === 'approved' });
            };

            const sendMail = (emp) => {
                const subj = replacePlaceholders(settings.emailTemplate.subject, { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] });
                const body = replacePlaceholders(settings.emailTemplate.body, { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] });
                const link = settings.senderEmail.includes('gmail') 
                    ? `https://mail.google.com/mail/?view=cm&fs=1&to=${emp.email}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`
                    : `mailto:${emp.email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
                window.open(link, '_blank');
            };

            return (
                <div className="space-y-6">
                    {pendingShifts.length > 0 && (
                        <Card title="משמרות ממתינות לאישור" className="border-yellow-500/50">
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-sm">
                                    <thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>תאריך</th><th>שעה</th><th>חדר</th><th>משחקים</th><th>תעריף משומר</th><th>פעולות</th></tr></thead>
                                    <tbody className="divide-y divide-gray-800">
                                        {pendingShifts.map(s => {
                                            const e = employees.find(emp => emp.id === s.employeeId);
                                            const wage = s.wageAtTime || e?.wagePerGame || 0;
                                            return (
                                                <tr key={s.id} className="hover:bg-gray-800/30">
                                                    <td className="py-2 font-bold">{e?.name}</td>
                                                    <td>{formatDateIL(s.date)}</td>
                                                    <td>{s.startTime}</td>
                                                    <td>{s.room}</td>
                                                    <td>{s.gamesCount}</td>
                                                    <td>₪{wage} {s.isAutoGroup && '(מאוטומטי)'}</td>
                                                    <td className="flex gap-2 py-2">
                                                        <Button size="sm" variant="success" onClick={()=>handleShiftStatus(s.id, 'approved')}><Check size={14}/></Button>
                                                        <Button size="sm" variant="danger" onClick={()=>handleShiftStatus(s.id, 'rejected')}><XIcon size={14}/></Button>
                                                        <button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-400 mr-2"><Trash2 size={14}/></button>
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    )}

                    <div className="flex justify-between items-center card-bg p-4 rounded-xl">
                        <div><h2 className="text-xl font-bold text-dynamic">דוחות שכר ({month})</h2><p className="text-dynamic opacity-80">סה"כ לתשלום: <span className="text-green-400 font-bold">₪{totalPay.toLocaleString()}</span></p></div>
                        <div className="flex gap-2">
                            <input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/>
                            <Button onClick={() => exportToXLSSalary(report, `Salary_Report_${month}.xls`)} variant="success"><Download size={16}/> אקסל</Button>
                        </div>
                    </div>
                    <div className="space-y-4">
                        {report.map(r => (
                            <div key={r.id} className="card-bg rounded-xl overflow-hidden">
                                <div className="p-4 flex justify-between items-center">
                                    <div className="flex items-center gap-3"><div className="h-10 w-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-white">{r.name[0]}</div><span className="text-lg font-bold text-dynamic">{r.name}</span></div>
                                    <div className="text-green-400 font-bold text-xl">₪{r.totalWage}</div>
                                    <Button size="sm" variant="outline" onClick={() => sendMail(r)}><Mail size={16}/></Button>
                                </div>
                                {r.empShifts.length > 0 && (
                                    <div className="bg-black/20 p-2 text-sm border-t border-gray-800">
                                        <div className="grid grid-cols-7 text-gray-500 mb-2 px-2 text-xs font-bold"><div>תאריך</div><div>שעה</div><div>חדר</div><div>משחקים</div><div>תעריף</div><div>סה"כ</div><div>מחק</div></div>
                                        {r.empShifts.map(s => {
                                            const w = s.wageAtTime || r.wagePerGame;
                                            return (
                                            <div key={s.id} className="grid grid-cols-7 py-2 px-2 border-b border-gray-800 items-center hover:bg-white/5 text-dynamic opacity-80">
                                                <div>{formatDateIL(s.date)}</div><div>{s.startTime}</div><div>{s.room}</div><div>{s.gamesCount}</div><div>₪{w}</div><div>₪{s.gamesCount * w}</div>
                                                <button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-500"><Trash2 size={14}/></button>
                                            </div>
                                        )})}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminEmployees = ({ employees }) => {
            const [open, setOpen] = useState(false);
            const [edit, setEdit] = useState(null);
            const [saving, setSaving] = useState(false);

            const save = async (e) => {
                e.preventDefault(); setSaving(true);
                const fd = new FormData(e.target);
                const d = {
                    name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), code: fd.get('code'),
                    address: fd.get('address'), birthday: fd.get('birthday'), wagePerGame: Number(fd.get('wagePerGame')),
                    form101: fd.get('form101') === 'on', skills: fd.get('skills').split(',').map(s=>s.trim())
                };
                try {
                    const timeout = new Promise((_, r) => setTimeout(() => r(new Error("Timeout")), 5000));
                    if(edit) await Promise.race([updateDoc(getDocRef('employees', edit.id), d), timeout]);
                    else await Promise.race([addDoc(getCollectionRef('employees'), d), timeout]);
                    setOpen(false);
                } catch(e) { if(e.message === 'Timeout') { alert('נשלח'); setOpen(false); } else alert(e.message); } finally { setSaving(false); }
            };

            const del = async (id) => { if(confirm("למחוק?")) await deleteDoc(getDocRef('employees', id)); };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between"><h2 className="text-2xl font-bold text-dynamic">ניהול עובדים</h2><Button onClick={()=>{setEdit(null); setOpen(true);}}><Plus size={18}/> הוסף עובד</Button></div>
                    <div className="grid md:grid-cols-3 gap-4">
                        {employees.map(e => (
                            <Card key={e.id} className="relative group hover:border-indigo-500">
                                <div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 flex gap-2">
                                    <button onClick={()=>{setEdit(e); setOpen(true);}} className="bg-gray-900 p-1 rounded text-indigo-400">ערוך</button>
                                    <button onClick={()=>del(e.id)} className="bg-gray-900 p-1 rounded text-red-400"><Trash2 size={16}/></button>
                                </div>
                                <h3 className="font-bold text-lg">{e.name}</h3>
                                <p className="text-sm opacity-70">{e.phone}</p>
                                <div className="mt-2 text-sm opacity-60">
                                    <div>קוד: {e.code}</div>
                                    <div>תעריף נוכחי למשחק: ₪{e.wagePerGame}</div>
                                    <div>יום הולדת: {formatDateIL(e.birthday) || '-'}</div>
                                </div>
                            </Card>
                        ))}
                    </div>
                    {open && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-900 p-6 rounded-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">{edit ? 'עריכה' : 'חדש'}</h3>
                                <form onSubmit={save} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <Input label="שם" name="name" required defaultValue={edit?.name}/>
                                        <Input label="טלפון" name="phone" required defaultValue={edit?.phone}/>
                                        <Input label="מייל" name="email" type="email" required defaultValue={edit?.email}/>
                                        <Input label="קוד" name="code" required defaultValue={edit?.code}/>
                                        <Input label="כתובת" name="address" className="col-span-2" defaultValue={edit?.address}/>
                                        <Input label="יום הולדת" name="birthday" type="date" defaultValue={edit?.birthday}/>
                                        <Input label="שכר למשחק (מעודכן מכאן והלאה)" name="wagePerGame" type="number" required defaultValue={edit?.wagePerGame}/>
                                        <Input label="הסמכות (מופרד בפסיק)" name="skills" className="col-span-2" defaultValue={edit?.skills?.join(', ')}/>
                                    </div>
                                    <div className="flex gap-2"><input type="checkbox" name="form101" defaultChecked={edit?.form101}/> <label>טופס 101</label></div>
                                    <div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'שמור בענן'}</Button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminConstraints = ({ employees, constraints, settings }) => {
            const [offset, setOffset] = useState(0);
            const days = useMemo(() => Array.from({length:7}, (_,i) => {
                const d = new Date(); d.setDate(d.getDate() + (offset*7) + i); return d;
            }), [offset]);
            const hours = Array.from({length:17}, (_,i) => i+8);

            const getStatus = (d, h) => {
                const dStr = d.toISOString().slice(0,10);
                const dayName = d.toLocaleDateString('en-US', {weekday:'long'});
                const biz = settings.openingHours[dayName];
                if (!biz) return -1;
                const open = parseInt(biz.start.split(':')[0]);
                const close = parseInt(biz.end.split(':')[0]);
                const effClose = close < open ? close+24 : close;
                const check = h < open && h+24 < effClose ? h+24 : h;
                if (check < open || check >= effClose) return -1;

                let count = 0;
                employees.forEach(emp => {
                    const busy = constraints.some(c => {
                        if (c.employeeId !== emp.id || c.status === 'rejected') return false; 
                        if (c.type === 'range') return dStr >= c.startDate && dStr <= c.endDate;
                        const cs = parseInt(c.startTime.split(':')[0]);
                        const ce = parseInt(c.endTime.split(':')[0]);
                        return c.date === dStr && h >= cs && h < ce;
                    });
                    if (!busy) count++;
                });
                return count;
            };
            
            const handleStatus = async (id, status) => {
                await updateDoc(getDocRef('constraints', id), { status });
            };

            const dayTitle = (d) => d.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'numeric'});

            const sortedConstraints = useMemo(() => {
                return [...constraints].sort((a, b) => {
                    const dateA = a.type === 'range' ? a.startDate : a.date;
                    const dateB = b.type === 'range' ? b.startDate : b.date;
                    return dateB.localeCompare(dateA);
                });
            }, [constraints]);

            return (
                <div className="space-y-6">
                    <Card title="רשימת אילוצים">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>תאריך התחלה</th><th>תאריך סיום</th><th>טווח שעות</th><th>סיבה</th><th>סטטוס</th><th>פעולות</th></tr></thead>
                                <tbody className="text-dynamic opacity-90">
                                    {sortedConstraints.map(c => {
                                        const emp = employees.find(e => e.id === c.employeeId);
                                        return <tr key={c.id} className="border-b border-gray-800 hover:bg-white/5">
                                            <td className="py-2 font-bold">{emp?.name}</td>
                                            <td>{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td>
                                            <td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td>
                                            <td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td>
                                            <td>{c.note}</td>
                                            <td><StatusBadge status={c.status || 'pending'}/></td>
                                            <td className="flex gap-2 py-1">
                                                {c.status === 'pending' && (
                                                    <>
                                                     <Button size="sm" variant="success" onClick={()=>handleStatus(c.id, 'approved')}><Check size={14}/></Button>
                                                     <Button size="sm" variant="danger" onClick={()=>handleStatus(c.id, 'rejected')}><XIcon size={14}/></Button>
                                                    </>
                                                )}
                                                <button onClick={()=>deleteDoc(getDocRef('constraints', c.id))} className="text-red-500 mr-2"><Trash2 size={14}/></button>
                                            </td>
                                        </tr>
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    <Card title="מפת זמינות">
                        <div className="flex justify-between mb-4">
                            <Button onClick={()=>setOffset(p=>p-1)}><ChevronRight size={16}/></Button>
                            <span>{formatDateIL(days[0].toISOString())} - {formatDateIL(days[6].toISOString())}</span>
                            <Button onClick={()=>setOffset(p=>p+1)}><ChevronLeft size={16}/></Button>
                        </div>
                        <div className="overflow-x-auto">
                            <div className="min-w-[800px]">
                                <div className="grid grid-cols-8 gap-1 mb-1 text-center font-bold text-dynamic">
                                    <div className="bg-gray-800 p-2 rounded">שעה</div>
                                    {days.map((d,i) => <div key={i} className="bg-gray-800 p-2 text-sm rounded">{dayTitle(d)}</div>)}
                                </div>
                                {hours.map(h => (
                                    <div key={h} className="grid grid-cols-8 gap-1 mb-1 text-center text-xs">
                                        <div className="bg-gray-800 p-2 rounded text-dynamic">{h.toString().padStart(2,'0')}:00</div>
                                        {days.map((d,i) => {
                                            const stat = getStatus(d, h);
                                            let bg = 'bg-green-900/60';
                                            if (stat === -1) bg = 'bg-gray-800/20 opacity-30';
                                            else if (stat === 0) bg = 'bg-red-900/60';
                                            else if (stat === 1) bg = 'bg-yellow-900/60';
                                            return <div key={i} className={`p-2 rounded ${bg} text-white font-bold`}>{stat > -1 ? stat : ''}</div>
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const AdminTasks = ({ employees, tasks }) => {
            const [desc, setDesc] = useState('');
            const [deadline, setDeadline] = useState('');
            const [empId, setEmpId] = useState('');

            const addTask = async (e) => {
                e.preventDefault();
                await addDoc(getCollectionRef('tasks'), { description: desc, deadline, assigneeId: empId, status: 'pending', createdAt: new Date().toISOString() });
                alert('משימה נוספה'); setDesc(''); setDeadline(''); setEmpId('');
            };

            const delTask = async (id) => { if(confirm("למחוק משימה?")) await deleteDoc(getDocRef('tasks', id)); };

            const pending = tasks.filter(t => t.status === 'pending');
            // Show only last 3 completed tasks
            const completed = tasks.filter(t => t.status === 'completed').sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0, 3);

            return (
                <div className="space-y-6">
                    <Card title="הוספת משימה חדשה">
                        <form onSubmit={addTask} className="space-y-4">
                            <Input label="תיאור המשימה" value={desc} onChange={e=>setDesc(e.target.value)} required />
                            <div className="grid grid-cols-2 gap-4">
                                <Input label="דדליין" type="date" value={deadline} onChange={e=>setDeadline(e.target.value)} required />
                                <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2" required value={empId} onChange={e=>setEmpId(e.target.value)}>
                                    <option value="">בחר עובד אחראי</option>
                                    {employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                                </select>
                            </div>
                            <Button type="submit">הוסף משימה</Button>
                        </form>
                    </Card>
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card title="ממתין לביצוע">
                            {pending.length === 0 && <p className="text-gray-500">אין משימות פתוחות</p>}
                            {pending.map(t => {
                                const emp = employees.find(e => e.id === t.assigneeId);
                                return (
                                    <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold">{t.description}</div>
                                            <div className="text-sm opacity-70">אחראי: {emp?.name} | יעד: {formatDateIL(t.deadline)}</div>
                                        </div>
                                        <button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button>
                                    </div>
                                )
                            })}
                        </Card>
                        <Card title="היסטוריית ביצוע (3 אחרונות)">
                            {completed.length === 0 && <p className="text-gray-500">אין משימות שהושלמו</p>}
                            {completed.map(t => {
                                const emp = employees.find(e => e.id === t.assigneeId);
                                return (
                                    <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-green-400 line-through">{t.description}</div>
                                            <div className="text-sm opacity-70">בוצע ע"י: {emp?.name} ב-{formatDateIL(t.completedAt)}</div>
                                        </div>
                                        <button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button>
                                    </div>
                                )
                            })}
                        </Card>
                    </div>
                </div>
            );
        };

        const AdminRequests = ({ requests, employees }) => {
            const handle = async (req, status) => {
                try {
                    if(status === 'approved') await timeoutPromise(updateDoc(getDocRef('employees', req.employeeId), req.newData), 3000);
                    await timeoutPromise(updateDoc(getDocRef('requests', req.id), { status }), 3000);
                } catch(e) { if(e.message!=='Timeout') alert(e.message); }
            };
            return (
                <div className="space-y-4">
                    <h2 className="text-xl font-bold text-dynamic">בקשות עדכון</h2>
                    {requests.length === 0 && <p className="text-gray-500">אין בקשות חדשות</p>}
                    {requests.map(r => {
                        const emp = employees.find(e => e.id === r.employeeId);
                        return (
                            <Card key={r.id} className="border-r-4 border-yellow-500 flex justify-between items-start">
                                <div>
                                    <h3 className="font-bold text-lg mb-1">{emp?.name}</h3>
                                    <div className="text-sm opacity-70 space-y-1">
                                        <p>טלפון: {r.newData.phone}</p><p>מייל: {r.newData.email}</p><p>כתובת: {r.newData.address}</p><p>יום הולדת: {formatDateIL(r.newData.birthday)}</p>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <Button variant="success" onClick={()=>handle(r, 'approved')}><Check size={16}/></Button>
                                    <Button variant="danger" onClick={()=>handle(r, 'rejected')}><XIcon size={16}/></Button>
                                </div>
                            </Card>
                        )
                    })}
                </div>
            );
        };

        const AdminSettings = ({ settings }) => {
            const update = async (k, v) => await setDoc(getDocRef('app_settings', 'global'), { ...settings, [k]: v }, { merge: true });
            const handleTemplate = async (k, v) => await update('emailTemplate', { ...settings.emailTemplate, [k]: v });
            const handlePricing = async (k, v) => await update('pricing', { ...settings.pricing, [k]: Number(v) });
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const hebrewDays = { Sunday: 'ראשון', Monday: 'שני', Tuesday: 'שלישי', Wednesday: 'רביעי', Thursday: 'חמישי', Friday: 'שישי', Saturday: 'שבת' };

            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="מחירון והנחות">
                        <div className="space-y-4">
                            <h4 className="font-bold text-sm text-indigo-400">בסיס למשתתף (לא משפיע רטרואקטיבית)</h4>
                            <div className="grid grid-cols-2 gap-2">
                                <Input label="2 שחקנים" type="number" value={settings.pricing?.basePrice2} onChange={e => handlePricing('basePrice2', e.target.value)} />
                                <Input label="3 שחקנים" type="number" value={settings.pricing?.basePrice3} onChange={e => handlePricing('basePrice3', e.target.value)} />
                                <Input label="4 שחקנים" type="number" value={settings.pricing?.basePrice4} onChange={e => handlePricing('basePrice4', e.target.value)} />
                                <Input label="5 שחקנים" type="number" value={settings.pricing?.basePrice5} onChange={e => handlePricing('basePrice5', e.target.value)} />
