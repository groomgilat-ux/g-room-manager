                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 fade-in" onClick={onClose}>
                    <div className="bg-gray-900 p-6 rounded-xl w-full max-w-md border border-gray-700 shadow-2xl max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                            <h3 className="text-xl font-bold">עריכת הוצאה</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white"><XIcon size={20}/></button>
                        </div>
                        <form onSubmit={handleSave} className="space-y-4">
                            <Input label="תיאור / שם ההוצאה" value={expName} onChange={e=>setExpName(e.target.value)} required />
                            <div className="flex flex-col gap-1">
                                <label className="text-sm opacity-70">קטגוריה</label>
                                <select className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white" value={expCategory} onChange={e=>setExpCategory(e.target.value)}>
                                    {dynamicCats.map(c => <option key={c} value={c}>{c}</option>)}
                                    <option value="אחר">אחר (הזן קטגוריה חדשה)...</option>
                                </select>
                            </div>
                            {expCategory === 'אחר' && <Input label="קטגוריה חדשה" value={customCategory} onChange={e=>setCustomCategory(e.target.value)} required />}
                            <Input label="מספר חשבונית/קבלה" value={expInvoice} onChange={e=>setExpInvoice(e.target.value)} />
                            <Input label="סכום כולל לתשלום (₪)" type="number" step="any" min="0" value={expAmount} onChange={e=>setExpAmount(e.target.value)} required />
                            <div className="grid grid-cols-2 gap-4"><Input label="מחודש" type="month" value={expFrom} onChange={e=>setExpFrom(e.target.value)} required /><Input label="עד חודש" type="month" value={expTo} onChange={e=>setExpTo(e.target.value)} required /></div>
                            <Button type="submit" disabled={saving} className="w-full mt-4">{saving?'מעדכן...':'שמור שינויים'}</Button>
                        </form>
                    </div>
                </div>
            );
        };

        const AdminReports = ({ employees, shifts, settings }) => {
            const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
            const monthlyShifts = shifts.filter(s => s.date.startsWith(month) && s.status === 'approved');
            const pendingShifts = shifts.filter(s => s.status === 'pending');

            const report = employees.map(emp => {
                const empShifts = monthlyShifts.filter(s => s.employeeId === emp.id).sort((a,b) => `${a.date} ${a.startTime}`.localeCompare(`${b.date} ${b.startTime}`));
                const totalWage = empShifts.reduce((acc, s) => acc + (Number(s.gamesCount) * (s.wageAtTime || emp.wagePerGame || 0)), 0);
                return { ...emp, totalWage, empShifts };
            });
            const totalPay = report.reduce((acc, r) => acc + r.totalWage, 0);
            const handleShiftStatus = async (id, newStatus) => { await updateDoc(getDocRef('shifts', id), { status: newStatus, approved: newStatus === 'approved' }); };

            const getMailLink = (emp) => {
                const template = settings.emailTemplate || INITIAL_SETTINGS_FALLBACK.emailTemplate;
                const subj = replacePlaceholders(template.subject, { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] });
                const body = replacePlaceholders(template.body, { name: emp.name, month: month.split('-')[1], year: month.split('-')[0] });
                return `https://mail.google.com/mail/?view=cm&fs=1&to=${emp.email || ''}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
            };

            return (
                <div className="space-y-6">
                    {pendingShifts.length > 0 && (
                        <Card title="משמרות ממתינות לאישור (דיווחים מקופת העסק)" className="border-yellow-500/50">
                            <div className="overflow-x-auto"><table className="w-full text-right text-sm"><thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>תאריך</th><th>שעה</th><th>חדר</th><th>משחקים</th><th>תעריף</th><th>פעולות</th></tr></thead><tbody className="divide-y divide-gray-800">
                                {pendingShifts.map(s => {
                                    const e = employees.find(emp => emp.id === s.employeeId);
                                    const wage = s.wageAtTime || e?.wagePerGame || 0;
                                    return (
                                        <tr key={s.id} className="hover:bg-gray-800/30">
                                            <td className="py-2 font-bold">{e?.name || 'לא נמצא'}</td><td>{formatDateIL(s.date)}</td><td>{s.startTime}</td><td>{s.room}</td><td>{s.gamesCount}</td><td>₪{wage}</td>
                                            <td className="flex gap-2 py-2"><Button size="sm" variant="success" onClick={()=>handleShiftStatus(s.id, 'approved')}><Check size={14}/></Button><Button size="sm" variant="danger" onClick={()=>handleShiftStatus(s.id, 'rejected')}><XIcon size={14}/></Button><button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-400 mr-2"><Trash2 size={14}/></button></td>
                                        </tr>
                                    )
                                })}
                            </tbody></table></div>
                        </Card>
                    )}
                    <div className="flex justify-between items-center card-bg p-4 rounded-xl">
                        <div><h2 className="text-xl font-bold text-dynamic">דוחות שכר ({month})</h2><p className="opacity-80">סה"כ לתשלום: <span className="text-green-400 font-bold">₪{totalPay.toLocaleString()}</span></p></div>
                        <div className="flex gap-2"><input type="month" value={month} onChange={e => setMonth(e.target.value)} className="bg-gray-800 border border-gray-700 rounded p-2 text-white"/><Button onClick={() => exportToXLSSalary(report, `Salary_Report_${month}.xls`)} variant="success"><Download size={16}/> אקסל</Button></div>
                    </div>
                    <div className="space-y-4">
                        {report.map(r => (
                            <div key={r.id} className="card-bg rounded-xl overflow-hidden">
                                <div className="p-4 flex justify-between items-center">
                                    <div className="flex items-center gap-3"><div className="h-10 w-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-white">{r.name[0]}</div><span className="text-lg font-bold text-dynamic">{r.name}</span></div>
                                    <div className="text-green-400 font-bold text-xl">₪{r.totalWage}</div>
                                    <a href={getMailLink(r)} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-lg font-medium flex items-center justify-center gap-2 shadow-md transition-all border-2 border-indigo-600 text-indigo-400 hover:bg-indigo-900/20"><Mail size={16}/> שליחת תלוש</a>
                                </div>
                                {r.empShifts.length > 0 && (
                                    <div className="bg-black/20 p-2 text-sm border-t border-gray-800"><div className="grid grid-cols-7 text-gray-500 mb-2 px-2 text-xs font-bold"><div>תאריך</div><div>שעה</div><div>חדר</div><div>משחקים</div><div>תעריף</div><div>סה"כ</div><div>מחק</div></div>
                                        {r.empShifts.map(s => {
                                            const w = s.wageAtTime || r.wagePerGame || 0;
                                            return (
                                            <div key={s.id} className="grid grid-cols-7 py-2 px-2 border-b border-gray-800 items-center hover:bg-white/5 text-dynamic opacity-80">
                                                <div>{formatDateIL(s.date)}</div><div>{s.startTime}</div><div>{s.room}</div><div>{s.gamesCount}</div><div>₪{w}</div><div>₪{s.gamesCount * w}</div>
                                                <button onClick={() => confirm("למחוק?") && deleteDoc(getDocRef('shifts', s.id))} className="text-red-500"><Trash2 size={14}/></button>
                                            </div>
                                        )})}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminEmployees = ({ employees }) => {
            const [open, setOpen] = useState(false);
            const [edit, setEdit] = useState(null);
            const [saving, setSaving] = useState(false);
            const save = async (e) => { e.preventDefault(); setSaving(true); const fd = new FormData(e.target); const d = { name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), code: fd.get('code'), address: fd.get('address'), birthday: fd.get('birthday'), wagePerGame: Number(fd.get('wagePerGame')), form101: fd.get('form101') === 'on', skills: fd.get('skills').split(',').map(s=>s.trim()) }; try { if(edit) await updateDoc(getDocRef('employees', edit.id), d); else await addDoc(getCollectionRef('employees'), d); setOpen(false); } catch(e) { alert(e.message); } finally { setSaving(false); } };
            return (
                <div className="space-y-6">
                    <div className="flex justify-between"><h2 className="text-2xl font-bold text-dynamic">ניהול עובדים</h2><Button onClick={()=>{setEdit(null); setOpen(true);}}><Plus size={18}/> הוסף עובד</Button></div>
                    <div className="grid md:grid-cols-3 gap-4">
                        {employees.map(e => (
                            <Card key={e.id} className="relative group hover:border-indigo-500">
                                <div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 flex gap-2"><button onClick={()=>{setEdit(e); setOpen(true);}} className="bg-gray-900 p-1 rounded text-indigo-400">ערוך</button><button onClick={()=>confirm("למחוק?") && deleteDoc(getDocRef('employees', e.id))} className="bg-gray-900 p-1 rounded text-red-400"><Trash2 size={16}/></button></div>
                                <h3 className="font-bold text-lg">{e.name}</h3><p className="text-sm opacity-70">{e.phone}</p><div className="mt-2 text-sm opacity-60"><div>קוד: {e.code}</div><div>תעריף: ₪{e.wagePerGame}</div></div>
                            </Card>
                        ))}
                    </div>
                    {open && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"><div className="bg-gray-900 p-6 rounded-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto"><h3 className="text-xl font-bold mb-4">{edit ? 'עריכה' : 'חדש'}</h3><form onSubmit={save} className="space-y-4"><div className="grid grid-cols-2 gap-4"><Input label="שם" name="name" required defaultValue={edit?.name}/><Input label="טלפון" name="phone" required defaultValue={edit?.phone}/><Input label="מייל" name="email" type="email" required defaultValue={edit?.email}/><Input label="קוד" name="code" required defaultValue={edit?.code}/><Input label="כתובת" name="address" className="col-span-2" defaultValue={edit?.address}/><Input label="יום הולדת" name="birthday" type="date" defaultValue={edit?.birthday}/><Input label="שכר למשחק" name="wagePerGame" type="number" required defaultValue={edit?.wagePerGame}/><Input label="הסמכות (מופרד בפסיק)" name="skills" className="col-span-2" defaultValue={edit?.skills?.join(', ')}/></div><div className="flex gap-2"><input type="checkbox" name="form101" defaultChecked={edit?.form101}/> <label>טופס 101</label></div><div className="flex gap-2 pt-4"><Button type="button" variant="secondary" onClick={()=>setOpen(false)} className="flex-1">ביטול</Button><Button type="submit" disabled={saving} className="flex-1">{saving?'שומר...':'שמור בענן'}</Button></div></form></div></div>}
                </div>
            );
        };

        const AdminConstraints = ({ employees, constraints, settings }) => {
            const [offset, setOffset] = useState(0);
            const [isBlocking, setIsBlocking] = useState(false); 
            const [tor4youSlotsMap, setTor4youSlotsMap] = useState({});
            const [loadingSlots, setLoadingSlots] = useState(false);
            const [actionLog, setActionLog] = useState(null); // סעיף 1: נשמור את התשובה להצגה כהודעה ברורה

            const todayStr = new Date().toISOString().slice(0, 10);
            const currentMonthStr = todayStr.slice(0, 7);

            const activeCons = useMemo(() => {
                return constraints.filter(c => {
                    const cDate = c.type === 'range' ? c.endDate : c.date;
                    return cDate >= todayStr || c.status === 'pending';
                }).sort((a, b) => (a.type==='range'?a.startDate:a.date).localeCompare(b.type==='range'?b.startDate:b.date));
            }, [constraints]);

            const historyCons = useMemo(() => {
                return constraints.filter(c => {
                    const cDate = c.type === 'range' ? c.endDate : c.date;
                    return cDate < todayStr && c.status !== 'pending' && cDate.startsWith(currentMonthStr);
                }).sort((a, b) => (b.type==='range'?b.startDate:b.date).localeCompare(a.type==='range'?a.startDate:a.date));
            }, [constraints]);

            const days = useMemo(() => Array.from({length:7}, (_,i) => {
                const d = new Date(); d.setDate(d.getDate() + (offset*7) + i); return d;
            }), [offset]);

            const dynamicHours = useMemo(() => {
                const times = new Set();
                Object.values(tor4youSlotsMap).forEach(arr => arr.forEach(s => times.add(s.time)));
                if (times.size === 0) return ["10:00", "11:30", "13:00", "14:30", "16:00", "17:30", "19:00", "20:30", "22:00"];
                return Array.from(times).sort();
            }, [tor4youSlotsMap]);

            useEffect(() => {
                const fetchWeekSlots = async () => {
                    setLoadingSlots(true); setActionLog(null);
                    const fromDateStr = days[0].toISOString().slice(0,10).replace(/-/g, '');
                    const toDateStr = days[6].toISOString().slice(0,10).replace(/-/g, '');
                    try {
                        const res = await fetch(`${TOR4YOU_WEEK_URL}?fromDate=${fromDateStr}&toDate=${toDateStr}`);
                        if(res.ok) { const data = await res.json(); if(data.slotsMap) setTor4youSlotsMap(data.slotsMap); }
                    } catch(e) {} finally { setLoadingSlots(false); }
                };
                fetchWeekSlots();
            }, [offset]);

            const getStatus = (d, hStr, customConstraints = constraints) => {
                const dStr = d.toISOString().slice(0,10);
                const daySlots = tor4youSlotsMap[dStr] || [];
                const slot = daySlots.find(s => s.time === hStr);
                if (!slot) return -1; 
                
                const [curH, curM] = hStr.split(':').map(Number);
                const slotStartMin = curH * 60 + curM;
                const slotEndMin = slotStartMin + 90; 

                let count = 0;
                employees.forEach(emp => {
                    const busy = customConstraints.some(c => {
                        if (c.employeeId !== emp.id || c.status === 'rejected') return false; 
                        if (c.type === 'range') return dStr >= c.startDate && dStr <= c.endDate;
                        
                        const [sH, sM] = c.startTime.split(':').map(Number); 
                        const [eH, eM] = c.endTime.split(':').map(Number);
                        const cStartMin = sH * 60 + sM;
                        const cEndMin = eH * 60 + eM;
                        
                        return c.date === dStr && (Math.max(slotStartMin, cStartMin) < Math.min(slotEndMin, cEndMin));
                    });
                    if (!busy) count++;
                });
                return count;
            };
            
            const handleStatus = async (id, status) => { await updateDoc(getDocRef('constraints', id), { status }); };

            const handleSyncAndBlock = async () => {
                const toDelete = [];
                const warnings = [];

                days.forEach(d => {
                    const dStr = d.toISOString().slice(0,10);
                    const daySlots = tor4youSlotsMap[dStr] || [];
                    
                    daySlots.forEach(slot => {
                        if (getStatus(d, slot.time) === 0) {
                            if (slot.participants > 0) {
                                warnings.push(`${formatDateIL(dStr)} בשעה ${slot.time}`);
                            } else {
                                toDelete.push({ slotid: slot.id, vfib: slot.vfib });
                            }
                        }
                    });
                });

                if (warnings.length === 0 && toDelete.length === 0) {
                    return alert('✅ היומן תקין לחלוטין! אין משבצות של 0 עובדים בשבוע המוצג.');
                }

                let message = `סריקת יומן הושלמה:\n\n`;
                if (warnings.length > 0) {
                    message += `🚨 שימו לב: ${warnings.length} תורים כבר הוזמנו בשעות שאין להן עובד!\n(הן לא יימחקו, חובה ליצור קשר עם הלקוח)\n`;
                }
                if (toDelete.length > 0) {
                    message += `\n🗑️ נמצאו ${toDelete.length} משבצות זמן ריקות לחלוטין (ללא עובדים וללא הזמנות).\n\nהאם למחוק ולחסום אותן כעת באתר Tor4You?`;
                } else {
                    return alert(message);
                }

                if (confirm(message)) {
                    setIsBlocking(true);
                    setActionLog(null);
                    try {
                        const res = await fetch(TOR4YOU_DELETE_URL, { 
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slots: toDelete }) 
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            let msg = `✅ נמחקו בהצלחה ${data.deletedCount} תורים פנויים מהאתר.`;
                            if(data.errors && data.errors.length > 0) {
                                msg += `\n⚠️ התרחשה שגיאה בעת ניסיון מחיקת ${data.errors.length} תורים נוספים.`;
                                console.error("Tor4You API Errors:", data.errors);
                            }
                            alert(msg);
                            setOffset(p=>p); // ריענון יומן
                        } else {
                            alert(`❌ שגיאה מהשרת: ${data.error}`);
                            console.error(data.error);
                        }
                    } catch (e) { 
                        alert('שגיאת תקשורת: ' + e.message); 
                    } 
                    finally { setIsBlocking(false); }
                }
            };

            const renderConstraintsTable = (consList, isEmptyMsg) => (
                <div className="overflow-x-auto">
                    <table className="w-full text-right text-sm">
                        <thead className="text-gray-400 border-b border-gray-700"><tr><th>עובד</th><th>התחלה</th><th>סיום</th><th>שעות</th><th>סיבה</th><th>סטטוס</th><th>פעולות</th></tr></thead>
                        <tbody className="text-dynamic opacity-90">
                            {consList.length === 0 && <tr><td colSpan="7" className="text-center py-4">{isEmptyMsg}</td></tr>}
                            {consList.map(c => {
                                const emp = employees.find(e => e.id === c.employeeId);
                                return <tr key={c.id} className="border-b border-gray-800 hover:bg-white/5"><td className="py-2 font-bold">{emp?.name}</td><td>{formatDateIL(c.type==='range' ? c.startDate : c.date)}</td><td>{formatDateIL(c.type==='range' ? c.endDate : c.date)}</td><td>{c.type==='range' ? 'חופש' : `${c.startTime}-${c.endTime}`}</td><td>{c.note}</td><td><StatusBadge status={c.status || 'pending'}/></td><td className="flex gap-2 py-1"><Button size="sm" variant={c.status==='approved'?"secondary":"success"} onClick={()=>handleStatus(c.id, 'approved')}><Check size={14}/></Button><Button size="sm" variant={c.status==='rejected'?"secondary":"danger"} onClick={()=>handleStatus(c.id, 'rejected')}><XIcon size={14}/></Button><button onClick={()=>deleteDoc(getDocRef('constraints', c.id))} className="text-red-500 mr-2"><Trash2 size={14}/></button></td></tr>
                            })}
                        </tbody>
                    </table>
                </div>
            );

            return (
                <div className="space-y-6 relative">
                    {isBlocking && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center rounded-xl backdrop-blur-sm"><div className="bg-gray-900 p-6 rounded-xl border border-indigo-500 shadow-2xl flex flex-col items-center gap-4"><Loader className="animate-spin w-10 h-10 text-indigo-500" /><span className="text-lg font-bold text-white">מעדכן וחוסם תורים ב-Tor4You...</span></div></div>
                    )}
                    <Card title="אילוצים עתידיים וממתינים לאישור">
                        {renderConstraintsTable(activeCons, 'אין אילוצים פעילים להצגה')}
                    </Card>

                    <Card title="מפת זמינות (סלוטים מדויקים של Tor4You / משך תור: 90 דק')">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                            <div className="flex items-center gap-4"><Button onClick={()=>setOffset(p=>p-1)}><ChevronRight size={16}/></Button><span className="flex items-center gap-2 font-bold text-lg">{formatDateIL(days[0].toISOString())} - {formatDateIL(days[6].toISOString())} {loadingSlots && <Loader className="w-4 h-4 animate-spin text-indigo-400"/>}</span><Button onClick={()=>setOffset(p=>p+1)}><ChevronLeft size={16}/></Button></div>
                            <Button onClick={handleSyncAndBlock} variant="outline" className="bg-yellow-500/10 border-yellow-500 text-yellow-500 hover:bg-yellow-500/20"><AlertTriangle size={18}/> סריקת התנגשויות וסנכרון יומן</Button>
                        </div>
                        <div className="overflow-x-auto"><div className="min-w-[800px]"><div className="grid grid-cols-8 gap-1 mb-1 text-center font-bold text-dynamic"><div className="bg-gray-800 p-2 rounded">שעה</div>{days.map((d,i) => <div key={i} className="bg-gray-800 p-2 text-sm rounded">{d.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'numeric'})}</div>)}</div>
                            {dynamicHours.map(h => {
                                const endStr = addTime(h, 90);
                                return (
                                <div key={h} className="grid grid-cols-8 gap-1 mb-1 text-center text-xs">
                                    <div className="bg-gray-800 p-2 rounded text-dynamic flex flex-col justify-center items-center">
                                        <span className="font-bold text-sm">{h}</span>
                                        <span className="opacity-50 text-[10px]">{h}-{endStr}</span>
                                    </div>
                                    {days.map((d,i) => {
                                        const stat = getStatus(d, h);
                                        let bg = 'bg-green-900/60';
                                        if (stat === -1) bg = 'bg-gray-800/10 opacity-20';
                                        else if (stat === 0) bg = 'bg-red-900/60 ring-1 ring-red-500';
                                        else if (stat === 1) bg = 'bg-yellow-900/60';
                                        return <div key={i} className={`p-2 rounded ${bg} text-white font-bold flex items-center justify-center`}>{stat > -1 ? stat : ''}</div>
                                    })}
                                </div>
                            )})}
                        </div></div>
                    </Card>

                    <div className="mt-8 border-t border-gray-800 pt-8">
                        <h3 className="text-xl font-bold flex items-center gap-2 opacity-70 mb-4"><History size={20}/> היסטוריית אילוצים (חודש נוכחי)</h3>
                        <div className="card-bg rounded-xl p-6 opacity-80">
                            {renderConstraintsTable(historyCons, 'אין היסטוריית אילוצים לחודש הנוכחי')}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminTasks = ({ employees, tasks }) => {
            const [desc, setDesc] = useState(''); const [deadline, setDeadline] = useState(''); const [empId, setEmpId] = useState('');
            const addTask = async (e) => { e.preventDefault(); await addDoc(getCollectionRef('tasks'), { description: desc, deadline, assigneeId: empId, status: 'pending', createdAt: new Date().toISOString() }); alert('משימה נוספה'); setDesc(''); setDeadline(''); setEmpId(''); };
            const delTask = async (id) => { if(confirm("למחוק משימה?")) await deleteDoc(getDocRef('tasks', id)); };
            const pending = tasks.filter(t => t.status === 'pending'); const completed = tasks.filter(t => t.status === 'completed').sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0, 3);
            return (
                <div className="space-y-6">
                    <Card title="הוספת משימה חדשה"><form onSubmit={addTask} className="space-y-4"><Input label="תיאור המשימה" value={desc} onChange={e=>setDesc(e.target.value)} required /><div className="grid grid-cols-2 gap-4"><Input label="דדליין" type="date" value={deadline} onChange={e=>setDeadline(e.target.value)} required /><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2" required value={empId} onChange={e=>setEmpId(e.target.value)}><option value="">בחר עובד</option>{employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}</select></div><Button type="submit">הוסף משימה</Button></form></Card>
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card title="ממתין לביצוע">{pending.length === 0 && <p className="text-gray-500">אין משימות</p>}{pending.map(t => { const emp = employees.find(e => e.id === t.assigneeId); return <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center"><div><div className="font-bold">{t.description}</div><div className="text-sm opacity-70">אחראי: {emp?.name} | יעד: {formatDateIL(t.deadline)}</div></div><button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button></div> })}</Card>
                        <Card title="היסטוריה (3 אחרונות)">{completed.length === 0 && <p className="text-gray-500">אין משימות</p>}{completed.map(t => { const emp = employees.find(e => e.id === t.assigneeId); return <div key={t.id} className="border-b border-gray-800 py-2 flex justify-between items-center"><div><div className="font-bold text-green-400 line-through">{t.description}</div><div className="text-sm opacity-70">בוצע ע"י: {emp?.name}</div></div><button onClick={()=>delTask(t.id)} className="text-red-400"><Trash2 size={16}/></button></div> })}</Card>
                    </div>
                </div>
            );
        };

        const AdminRequests = ({ requests, employees }) => {
            const handle = async (req, status) => { try { if(status === 'approved') await updateDoc(getDocRef('employees', req.employeeId), req.newData); await updateDoc(getDocRef('requests', req.id), { status }); } catch(e) { alert(e.message); } };
            return (
                <div className="space-y-4"><h2 className="text-xl font-bold text-dynamic">בקשות עדכון</h2>{requests.length === 0 && <p className="text-gray-500">אין בקשות חדשות</p>}{requests.map(r => { const emp = employees.find(e => e.id === r.employeeId); return <Card key={r.id} className="border-r-4 border-yellow-500 flex justify-between items-start"><div><h3 className="font-bold text-lg mb-1">{emp?.name}</h3><div className="text-sm opacity-70 space-y-1"><p>טלפון: {r.newData.phone}</p><p>מייל: {r.newData.email}</p><p>כתובת: {r.newData.address}</p><p>יום הולדת: {formatDateIL(r.newData.birthday)}</p></div></div><div className="flex gap-2"><Button variant="success" onClick={()=>handle(r, 'approved')}><Check size={16}/></Button><Button variant="danger" onClick={()=>handle(r, 'rejected')}><XIcon size={16}/></Button></div></Card> })}</div>
            );
        };

        const AdminSettings = ({ settings }) => {
            const update = async (k, v) => await setDoc(getDocRef('app_settings', 'global'), { ...settings, [k]: v }, { merge: true });
            const handleTemplate = async (k, v) => await update('emailTemplate', { ...settings.emailTemplate, [k]: v });
            const handlePricing = async (k, v) => await update('pricing', { ...settings.pricing, [k]: Number(v) });
            return (
                <div className="grid md:grid-cols-2 gap-6">
                    <Card title="מחירון והנחות"><div className="space-y-4"><h4 className="font-bold text-sm text-indigo-400">בסיס למשתתף</h4><div className="grid grid-cols-2 gap-2"><Input label="2 שחקנים" type="number" value={settings.pricing?.basePrice2} onChange={e => handlePricing('basePrice2', e.target.value)} /><Input label="3 שחקנים" type="number" value={settings.pricing?.basePrice3} onChange={e => handlePricing('basePrice3', e.target.value)} /><Input label="4 שחקנים" type="number" value={settings.pricing?.basePrice4} onChange={e => handlePricing('basePrice4', e.target.value)} /><Input label="5 שחקנים" type="number" value={settings.pricing?.basePrice5} onChange={e => handlePricing('basePrice5', e.target.value)} /><Input label="6-8 שחקנים" type="number" value={settings.pricing?.basePrice6to8} onChange={e => handlePricing('basePrice6to8', e.target.value)} /><Input label="9-10 שחקנים" type="number" value={settings.pricing?.basePrice9to10} onChange={e => handlePricing('basePrice9to10', e.target.value)} /></div><h4 className="font-bold text-sm text-indigo-400 mt-4">אחוזי הנחה</h4><div className="grid grid-cols-2 gap-2"><Input label="ילדים (%)" type="number" value={settings.pricing?.discountKids} onChange={e => handlePricing('discountKids', e.target.value)} /><Input label="זכאים (%)" type="number" value={settings.pricing?.discountEligible} onChange={e => handlePricing('discountEligible', e.target.value)} /></div></div></Card>
                    <div className="space-y-6"><Card title="כללי"><div className="space-y-4"><Input label="שם העסק" value={settings.businessName} onChange={e => update('businessName', e.target.value)} /><Input label="קוד כניסה למנהל" value={settings.adminCode} onChange={e => update('adminCode', e.target.value)} /><Input label="רשימת חדרים (מופרד בפסיק)" value={settings.roomsList} onChange={e => update('roomsList', e.target.value)} /></div></Card><Card title="עיצוב"><div className="space-y-4"><div className="space-y-1"><label className="text-sm opacity-70">צבע רקע (ראשי)</label><input type="color" value={settings.primaryColor} onChange={e => update('primaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div><div className="space-y-1"><label className="text-sm opacity-70">צבע טקסט (משני)</label><input type="color" value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="w-full h-10 bg-transparent cursor-pointer rounded"/></div><div className="space-y-1"><label className="text-sm opacity-70">לוגו (URL)</label><input className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white" value={settings.logo || ''} onChange={e => update('logo', e.target.value)} /></div></div></Card></div>
                    <Card title="תבנית אימייל לשכר"><div className="space-y-4"><Input label="נושא" value={settings.emailTemplate.subject} onChange={e => handleTemplate('subject', e.target.value)} /><div className="space-y-1"><label className="text-sm opacity-70">תוכן (משתנים: {`{name}, {month}, {year}`})</label><textarea className="w-full bg-gray-800 border border-gray-700 rounded p-2 h-32 text-white" value={settings.emailTemplate.body} onChange={e => handleTemplate('body', e.target.value)} /></div><Input label="מייל העסק" value={settings.senderEmail} onChange={e => update('senderEmail', e.target.value)} /></div></Card>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<GRoomApp />);
    </script>
</body>
</html>
